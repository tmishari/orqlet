# Rules of this team. Add MUST, SHOULD and MAY rules below.
# Each rule has: id, level, text, and optionally scope, enforcement and waiver.
#
# These are the rules Orqlet enforces on itself. Each "deterministic" rule names the command
# that fails when it is broken; "review" rules are checked by a person on the pull request.
schema: orqlet.rules/v1
rules:
  # --- Architecture -------------------------------------------------------------------------
  - id: ORQLET-ARCH-001
    level: MUST
    text: >-
      Crate dependencies point inward only: orqlet-cli -> orqlet-adapters -> orqlet-application
      -> orqlet-domain, and the xtask uses only orqlet-application and orqlet-domain. Each
      crate's direct third-party dependencies (normal, dev and build) are on its own allow-list
      in xtask/src/arch.rs.
    scope: {paths: ["crates/**", "xtask/**", "Cargo.toml"]}
    enforcement: deterministic
    check_ref: cargo run -p xtask -- arch

  - id: ORQLET-ARCH-002
    level: MUST
    text: >-
      The orqlet-domain crate is no_std with alloc. The orqlet-application crate reaches files,
      processes, the network, the environment and the standard streams only through its ports;
      its clippy.toml disallows those standard-library paths.
    scope: {paths: ["crates/orqlet-domain/**", "crates/orqlet-application/**"]}
    enforcement: deterministic
    check_ref: cargo clippy --workspace --all-targets -- -D warnings

  - id: ORQLET-ARCH-003
    level: MUST
    text: >-
      The client adapter modules (Claude Code, Codex, Cursor) never use one another. workflow/ is
      read-only data, embedded only by orqlet-adapters, never through include_str! or
      include_bytes! elsewhere.
    scope: {paths: ["crates/orqlet-adapters/src/clients/**", "workflow/**"]}
    enforcement: review

  # --- Safety and security ------------------------------------------------------------------
  - id: ORQLET-SEC-001
    level: MUST
    text: >-
      Only the process module, a private child of the Git module in orqlet-adapters, creates
      processes. Git runs only through GitRunner: allow-listed subcommands, fixed config
      overrides, a cleared environment plus an allow-list, and arguments checked before any
      process starts. Tests and the xtask may start processes only under a scoped allow with a
      reason.
    scope: {paths: ["crates/**", "xtask/**"]}
    enforcement: review

  - id: ORQLET-SEC-002
    level: MUST
    text: >-
      Files in the repository being managed are untrusted input. Shipped code reads them through
      the FileSystem port, parses YAML, JSON and TOML only through the documents module of
      orqlet-adapters, and never executes, imports or evaluates their content.
    scope: {paths: ["crates/*/src/**"]}
    enforcement: review

  - id: ORQLET-SEC-003
    level: MUST
    text: >-
      Use SHA-256 for every digest and never MD5 or SHA-1. Never commit secrets, tokens or
      credentials, including in tests and fixtures; use obvious placeholders.
    enforcement: review

  - id: ORQLET-SAFE-001
    level: MUST
    text: >-
      Every project write goes through a journalled change plan: a backup is taken first, and the
      lock file is written last so a re-run converges. Project writes stay inside the project
      root. Outside the root Orqlet writes only its data directory (journals, backups, apply locks
      and review packets), which never lies inside the repository; on Unix its files are created
      with mode 0600 and its folders with mode 0700.
    scope: {paths: ["crates/orqlet-application/src/**", "crates/orqlet-adapters/src/**"]}
    enforcement: review

  - id: ORQLET-NOMODEL-001
    level: MUST
    text: >-
      Orqlet never calls a language model, takes a prompt or starts an agent. It prepares context
      for the IDE agent and validates what that agent proposes. Do not add a model SDK dependency.
    enforcement: review

  # --- Determinism --------------------------------------------------------------------------
  - id: ORQLET-DET-001
    level: MUST
    text: >-
      Generated output is deterministic: no timestamps, absolute paths or random values in
      rendered files. Golden fixtures change only in a reviewed commit that says why.
    scope:
      paths:
        - "crates/orqlet-adapters/src/clients/**"
        - "crates/orqlet-adapters/src/render/**"
        - "workflow/**"
    enforcement: review

  - id: ORQLET-DET-002
    level: MUST
    text: >-
      Any change to workflow/ rebuilds its MANIFEST.json and bumps the package version before
      release.
    scope: {paths: ["workflow/**"]}
    enforcement: deterministic
    check_ref: cargo run -p xtask -- manifest --check

  - id: ORQLET-DET-003
    level: MUST
    text: >-
      Committed JSON schemas match the Rust contract types. Regenerate them with
      `cargo run -p xtask -- schemas` when a contract changes.
    scope: {paths: ["crates/orqlet-application/src/contracts/**", "workflow/schemas/**"]}
    enforcement: deterministic
    check_ref: cargo run -p xtask -- schemas --check

  # --- Quality ------------------------------------------------------------------------------
  - id: ORQLET-QA-001
    level: MUST
    text: >-
      Before a pull request is ready, cargo fmt --check, Clippy with -D warnings and cargo test
      pass on macOS, and cargo check and Clippy pass for x86_64-unknown-linux-gnu and
      x86_64-pc-windows-msvc. Linux and Windows are compiled and linted, not run. The project has
      no CI workflow.
    enforcement: review

  - id: ORQLET-STYLE-001
    level: SHOULD
    text: >-
      Keep functions small with one reason to change, name things for what they mean, and write
      comments that explain why, not what.
    scope: {paths: ["crates/**", "xtask/**"]}
    enforcement: guidance

  - id: ORQLET-MODEL-001
    level: MUST
    text: >-
      A model name appears in a generated or packaged file only when the model policy assigned it,
      and never when the policy excludes it.
    scope: {paths: ["crates/**", "workflow/**"]}
    enforcement: review

  - id: ORQLET-MODEL-002
    level: MUST
    text: >-
      A review record for a gated role names the models that ran, or says they are unknown, and
      states the freshness of its context; a class below the role's minimum is NOT_RUN, never a
      pass.
    scope: {paths: ["docs/design/**"]}
    enforcement: review
