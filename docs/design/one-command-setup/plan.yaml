- id: P-4
  objective: >-
    Add `orqlet status [--root DIR] [--json]`: the read-only status use case, the executable locator, the bounded file reader,
    representability rules, the user scope contracts (read side), `RenderClientId`, linked-worktree detection through the Vcs port, and
    a data-directory resolver that never creates a folder. Every test runs under a temporary home.
  depends_on: [P-3]
  implements: [EC-1, EC-3, EC-4]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `location` is one of not-a-repository, repository, initialized-project, linked-worktree or home-is-work-tree, and `next` is one of
      the closed set of ADR-001 decision 3 (install-global, init, upgrade, refuse-newer-global, none and the stop values). A table test
      covers every location with fakes.
    source: BC-11; R-4; ADR-001 decision 3; U-4
    check_ref: pytest
  - id: AC-2
    text: >-
      `global` reports per client missing, configured, outdated or newer from `<data>/user/manifest.json`, read only. A missing data
      folder reports missing for every client and creates nothing; an ORQLET_DATA_DIR outside the home is read too. A newer global
      version gives `next: refuse-newer-global`.
    source: BC-11; K-11; ADR-002 decisions 2 and 8
    check_ref: pytest
  - id: AC-3
    text: >-
      `orqlet_on_path` is same, different or absent; an unsafe PATH element (relative, empty, or a folder writable by others on POSIX)
      before the resolved orqlet is reported as a host step. The locator starts no process.
    source: BC-38; ADR-004 decision 7
    check_ref: pytest
  - id: AC-4
    text: >-
      Hostile input: a version that does not match `major.minor.patch` is reported as null; a path with a control, bidirectional or
      format character, or longer than 200 characters, is null with `path-not-representable` and is never altered; a lock file over
      1 MiB or a link gives no project version; YAML is read with the strict loader.
    source: BC-11; ADR-001 decision 3; ADR-004 decisions 1a and 5; ORQLET-SEC-002
    check_ref: pytest
  - id: AC-5
    text: >-
      `orqlet status` in a temporary tree without a data folder leaves the set of paths, sizes and modes under the temporary home and the
      project identical before and after the run.
    source: BC-11; K-11
    check_ref: pytest
  - id: AC-6
    text: >-
      The exit status is 0, or 5 when a check could not run (a failing fake Vcs); `--json` uses the existing envelope. An unknown option
      exits 2.
    source: BC-40; A-30; A-14
    check_ref: pytest
  - id: AC-7
    text: >-
      `Vcs` gains worktree information from `git rev-parse` (top level, git folder and common git folder) through the allow-listed
      GitRunner; a real linked worktree created in a temporary folder is reported as linked-worktree, a home that is a work tree as
      home-is-work-tree, and a failure as a null top level.
    source: BC-11; ADR-001 decision 3; U-4; A-29; ORQLET-SEC-001
    check_ref: pytest
  - id: AC-8
    text: '`RenderClientId` has the four values claude-code, codex, cursor and copilot; `ClientId` keeps its three values.'
    source: BC-28; EC-3; ADR-003 decision 1
    check_ref: pytest
  - id: AC-9
    text: >-
      An autouse fixture sets HOME, USERPROFILE, CODEX_HOME, COPILOT_HOME and ORQLET_DATA_DIR to folders under the pytest base temporary
      folder for every test; a test asserts that the five variables point there.
    source: BC-23; K-4; Q-24
    check_ref: pytest
  - id: AC-10
    text: >-
      Regression: `data_directory()` still creates the folder for the existing commands (C-3 is not fixed here, K-10); the new resolver
      never creates one.
    source: K-10; K-11; A-27
    check_ref: pytest
  - id: AC-11
    text: The staged change touches only the files of this phase and stays inside the expected changes of EC-1, EC-3 and EC-4.
    source: EC-1; EC-3; EC-4
    check_ref: gate-status-phase
  - id: AC-12
    text: >-
      `IMPLEMENTED_COMMANDS` lists `status`, and the existing equality test between that list and the application's registered commands
      (tests/integration/test_validate_cli.py) passes unchanged.
    source: EC-1; Q-53
    check_ref: pytest
