- id: P-9
  objective: >-
    Add the tool installer port and the tools adapter that runs the fixed command vectors of ADR-006 through ProcessRunner, with
    absolute tool paths, a scrubbed environment plus the network variables, the private tools-work folder, the pins (graphifyy 0.9.112,
    Python 3.12, uv 0.7.19) and redacted, capped, control-free output summaries. Precondition: K-1, as for P-6.
  depends_on: [P-8]
  implements: [EC-6, EC-8]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The adapter runs only these vectors: `[<uv>, "tool", "list"]`; `[<uv>, "tool", "install", "graphifyy==0.9.112", "--python",
      "3.12"]`, unless the list shows graphifyy 0.9.112; `[<pipx>, "install", "uv==0.7.19"]`; and `[<pipx>, "environment", "--value",
      "PIPX_BIN_DIR"]`, where `<uv>` and `<pipx>` are absolute paths. The fake process runner records no other argument vector.
    source: BC-9; BC-10; ADR-006 decision 4; K-3; Q-46
    check_ref: pytest
  - id: AC-2
    text: >-
      The environment holds only the variables the existing scrubbed environment keeps, plus HTTP_PROXY, HTTPS_PROXY, NO_PROXY, ALL_PROXY,
      SSL_CERT_FILE and SSL_CERT_DIR in upper and lower case when set; the working folder is `<data>/user/tools-work`, created with mode
      0700 only on apply.
    source: BC-9; ADR-006 decision 4
    check_ref: pytest
  - id: AC-3
    text: >-
      Tool paths come only from absolute PATH elements; when only relative or empty elements hold the tool, the result is a host step
      and no process starts.
    source: BC-9; ADR-006 decision 4
    check_ref: pytest
  - id: AC-4
    text: A graphify on PATH that uv does not manage is reported and never run.
    source: BC-9
    check_ref: pytest
  - id: AC-5
    text: >-
      A failing vector gives a failed result with the command and its summary, and earlier results are kept; the result maps to exit
      status 1.
    source: BC-9; BC-35
    check_ref: pytest
  - id: AC-6
    text: >-
      The summary reduces a URL to its scheme and host, drops user information, path and query, replaces the value of a passed proxy
      variable with `***`, removes control characters and is capped at 2,000 characters.
    source: BC-9; BC-45; ADR-006 decision 4
    check_ref: pytest
  - id: AC-7
    text: >-
      With pipx but no uv, the adapter runs the pipx install and environment vectors; a PIPX_BIN_DIR that is relative, has a control
      character, spans lines or holds no regular uv gives a host step and no further process; with neither tool the result needs the
      person's input (exit 4).
    source: BC-10; Q-35
    check_ref: pytest
  - id: AC-8
    text: >-
      In a dry run the list vector runs only when tools-work exists; otherwise graphify is `not checked`, and no folder is created.
    source: BC-7; ADR-006 decision 4
    check_ref: pytest
  - id: AC-9
    text: >-
      The preview says the index configuration is not verified, and no user package configuration file (uv.toml, pip.conf, pip.ini) is
      read.
    source: BC-9; ADR-006 decision 4; K-3
    check_ref: pytest
  - id: AC-10
    text: The staged change touches only the files of this phase and stays inside the expected changes of EC-6 and EC-8.
    source: EC-6; EC-8
    check_ref: gate-status-phase
