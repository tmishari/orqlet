      graphify SKILL.md golden files match; every other golden file stays byte-identical. `orqlet init` in a temporary repository writes
      the entry skill for each selected client. MANIFEST.json lists the entry skill and the changed graphify skill with their hashes,
      the manifest check passes, and `workflow_version` stays 0.5.0.
    source: BC-12; BC-13; BC-18; EC-9; ORQLET-DET-001; ORQLET-DET-002; Q-53
