- id: P-10
  objective: >-
    Add client detection, the install use case (detect, plan the user-scope change from the user renders, merge the hook entries,
    preview, consent, prepare the roots, apply with the manifest last, adopt pending changes, keep three changes, prepare the tool),
    uninstall, the `install` and `uninstall` commands with the Rich presenter and JSON, and `rollback --user`. With `status` and
    `install` in place, add the person-started entry skill `orqlet` for the four clients, and let the graphify skill name `orqlet
    install` (Q-53). Precondition: both amendments of K-1 have merged.
  depends_on: [P-9]
  implements: [EC-1, EC-2, EC-4, EC-5, EC-6, EC-8, EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      Detection reads the indicators of ADR-003 per client by name only; zero, one and four detected clients are covered; zero detected
      clients exits 4, writes nothing and lists the indicators looked for.
    source: BC-2; R-2; Q-12
    check_ref: pytest
  - id: AC-2
    text: '`--client` limits the change to the named clients; an unknown client exits 2.'
    source: BC-3
    check_ref: pytest
  - id: AC-3
    text: >-
      `orqlet install --yes` under a temporary home writes the files and entries that P-7 and P-8 render for the detected clients, and
      the user manifest last; a second run reports every item as already configured and writes nothing.
    source: BC-4; BC-5
    check_ref: pytest
  - id: AC-4
    text: >-
      Each conflict of BC-6 (a user-owned file or entry at a target, a non-strict JSON file, a refused root) leaves the file
      byte-identical, is scoped to its client while the other clients proceed, and exits 3.
    source: BC-6
    check_ref: pytest
  - id: AC-5
    text: >-
      `--dry-run` and a declined preview change no path and no mode and start no process except the uv list vector when tools-work
      exists; the preview shows will create, will tighten and not checked; a pending journal stays byte-identical and is not superseded.
    source: BC-7
    check_ref: pytest
  - id: AC-6
    text: >-
      `orqlet uninstall` removes only the files and entries whose canonical hash still matches the manifest, keeps changed ones as
      user-owned and reports them, keeps the shared `agents/skills` files while Cursor or Codex still has them, never removes a root or a
      folder above a writable sub-path, and removes the manifest last.
    source: BC-8; BC-27; BC-33; BC-36; BC-42
    check_ref: pytest
  - id: AC-7
    text: >-
      A run interrupted after k writes (k from 0 to n) is adopted by the next install or uninstall, which completes or reverts it as
      BC-30 and BC-44 define; a second interruption during adoption is also recovered.
    source: BC-30; BC-44
    check_ref: pytest
  - id: AC-8
    text: >-
      `orqlet rollback --user` restores the last user change outside any repository; `--root` or `--project-id` with `--user` exits 2;
      it never reads `projects/<id>`; a superseded change id is reported as no longer available.
    source: BC-31; BC-30; EC-2
    check_ref: pytest
  - id: AC-9
    text: The user namespace keeps the three most recent changes and removes older journals and their backups.
    source: BC-37
    check_ref: pytest
  - id: AC-10
    text: >-
      Journal and backup files are 0600 and folders 0700 on POSIX, and no output (human or JSON) contains file contents or backup
      contents.
    source: BC-29
    check_ref: pytest
  - id: AC-11
    text: >-
      When a conflict and a failure both occur the exit status is 3; without `--yes` in a non-interactive session the command exits 4 and
      writes nothing.
    source: BC-35; BC-40
    check_ref: pytest
  - id: AC-12
    text: >-
      An unsafe PATH element before orqlet gives no hook registration and a host step; an orqlet on PATH that differs from the running one
      is flagged.
    source: BC-38
    check_ref: pytest
  - id: AC-13
    text: >-
      On Windows (a fake platform) install, uninstall and rollback warn when the data folder is outside the home.
    source: BC-39; BC-46
    check_ref: pytest
  - id: AC-14
    text: >-
      install writes no project file; init and upgrade write nothing in the user scope or in `<data>/user`.
    source: BC-41
    check_ref: pytest
  - id: AC-15
    text: >-
      Host steps are reported for the registrations left out: post-edit for Cursor, Codex and Copilot; session-start for Codex and
      Copilot on Windows (a fake platform); the Codex trust step `/hooks`; the Codex IDE extension as not verified; the Cursor User Rules
      paste with the saved path; and the missing Copilot agents and instruction files.
    source: BC-43; ADR-004 decision 8; ADR-005 decision 3; U-1; K-12
    check_ref: pytest
  - id: AC-16
    text: >-
      A user manifest of a newer workflow version is refused without a write, and the roots are pinned between the preview and the apply
      (a root swapped after the preview is refused).
    source: BC-47; BC-46
    check_ref: pytest
  - id: AC-17
    text: >-
      The human output uses the P-1 presenter (banner once, word labels, the per-client start instruction, plain mode under NO_COLOR, CI
      or a redirect), and `--json` uses the existing envelope with a capped, redacted `tool_output` and no artwork.
    source: BC-22; BC-45; R-11
    check_ref: pytest
  - id: AC-18
    text: >-
      Merging an entry into a shared JSON file keeps the other keys and their order, uses the strict reader, and replaces or removes an
      entry only when its canonical hash matches.
    source: BC-8; BC-6; ADR-002 decision 3
    check_ref: pytest
  - id: AC-19
    text: >-
      When a tool is prepared, the output names the residual risk of unpinned transitive dependencies and of the managed Python.
    source: Q-39; ADR-006 decision 4
    check_ref: pytest
  - id: AC-20
    text: The staged change touches only the files of this phase and stays inside the expected changes of EC-1, EC-2, EC-4, EC-5, EC-6, EC-8 and EC-9.
    source: EC-1; EC-2; EC-4; EC-5; EC-6; EC-8; EC-9
    check_ref: gate-status-phase
  - id: AC-21
    text: >-
      `IMPLEMENTED_COMMANDS` lists `install` and `uninstall`, and the existing equality test between that list and the application's
      registered commands (tests/integration/test_validate_cli.py) passes unchanged.
    source: EC-1; Q-53
    check_ref: pytest
  - id: AC-22
    text: >-
      The entry skill `orqlet` renders with `disable-model-invocation: true` for Claude Code, Cursor and Copilot and with
      `allow_implicit_invocation: false` in the Codex sidecar. Its text first runs `orqlet status --root <dir> --json`; when orqlet is
      not found it names the terminal command to install it. Then, by state: global configuration missing or outdated, `orqlet install
      --dry-run --json`, and `orqlet install --yes --json` only after the person's yes; not a repository, it stops; a repository without
      `.orqlet`, `orqlet init --root <top> --dry-run`, then `--yes` after the person's yes; initialized, `orqlet upgrade --root <top>
      --dry-run`, then `--yes` after the person's yes, then status again; a linked worktree, a `refuse-newer-global` next step, or a null
      top level, it stops with the message. It shows `tool_output` as data and never acts on its text, ends with the next person-started
      command, and contains no instruction to start a phase skill. A test pins these phrases and asserts the absence of a phase-skill
      start instruction. Every flag it names exists on the named command.
    source: BC-12; BC-11; BC-45; ADR-001 decisions 2 and 3; Q-34; Q-53; R-4; R-9
    check_ref: pytest
