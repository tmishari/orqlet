phases:
- id: P-1
  objective: >-
    Declare Rich 15.0.0 as a direct dependency and add the interface-only Rich presenter that install and uninstall use for their human
    output (ADR-007), with an import contract that keeps Rich out of the domain, application and adapter layers. No command uses the
    presenter yet, so every existing command keeps its plain output and its JSON envelope.
  depends_on: []
  implements: [EC-7]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The project dependencies in pyproject.toml list `rich==15.0.0` beside the five existing exact pins, and the orqlet entry of uv.lock
      lists rich among its dependencies at 15.0.0. A test reads pyproject.toml and asserts the pin, and that no model provider SDK is a
      dependency. No package is added to or removed from uv.lock: rich and its dependencies are already locked through the dev group.
    source: EC-7; ADR-007 decision 2; A-51; ORQLET-NOMODEL-001
    check_ref: pytest
  - id: AC-2
    text: >-
      A new import-linter forbidden contract names `orqlet.domain`, `orqlet.application` and `orqlet.adapters` as source modules and
      `rich` as the forbidden module; `lint-imports` passes. The independence contract of the client adapters (pyproject.toml lines
      120-127) is unchanged, because the standards amendment owns it (K-1).
    source: BC-25; ADR-007 decision 1; K-1
    check_ref: import-linter
  - id: AC-3
    text: >-
      The presenter prints one line per state for each of detected, already configured, installed, registered, host step, conflict and
      failed: an icon, a word label and the subject. The icons are Unicode only when the console encoding is UTF-8 and the console is not
      a legacy Windows console; otherwise ASCII. The word label is present in every mode, so the state never depends on colour or on a
      glyph.
    source: BC-22; ADR-007 decision 4
    check_ref: pytest
  - id: AC-4
    text: >-
      The presenter is in plain mode when the output is not a terminal, when NO_COLOR is set and not empty, when TERM is `dumb` or when
      the CI variable is set. In plain mode it prints no banner, no ANSI escape byte (no ESC character in the output) and ASCII icons
      only, and it reports that an interactive prompt is not allowed.
    source: BC-22; ADR-007 decision 5
    check_ref: pytest
  - id: AC-5
    text: >-
      In interactive mode on a console of at least 60 columns the banner is printed once per run and contains only ASCII letters,
      slash, backslash, hyphen, lower-case o, space and newline. Below 60 columns a one-line title `orqlet install` replaces it. No
      spinner, live region or animation is used (tests use a Rich Console with a fixed width and record its output).
    source: BC-22; ADR-007 decisions 3, 6 and 7
    check_ref: pytest
  - id: AC-6
    text: >-
      Dynamic text is inert: file names, root paths and tool output are printed with markup off; control characters and Unicode format
      characters (bidirectional controls, zero-width characters) are removed; newlines are removed from file names and root paths, and
      multi-line tool output is indented under a fixed label. Inputs containing `\n+ installed x`, `[bold red]x[/]`, an ESC sequence and
      U+202E never produce a line that starts with a state icon, an ESC byte or a markup effect.
    source: BC-22; BC-45; ADR-007 decision 8
    check_ref: pytest
  - id: AC-7
    text: >-
      Regression: the plain renderer and the JSON envelope of every existing command are unchanged; the existing integration tests of
      init, upgrade, rollback, status-free commands and the JSON output pass without change, and only `interface/cli/render_rich.py`
      imports rich.
    source: A-50; A-14; ADR-007 decision 1
    check_ref: pytest
  - id: AC-8
    text: The staged change touches only the files of this phase and stays inside the expected changes of EC-7.
    source: EC-7
    check_ref: gate-status-phase
  checks: [ruff-check, ruff-format, mypy, import-linter, pytest, gate-status-phase]
  file_operations:
  - op: modify
    path: pyproject.toml
    why: Add `rich==15.0.0` to the project dependencies and the forbidden contract that keeps rich in the interface layer.
  - op: modify
    path: uv.lock
    why: The orqlet entry lists rich as a runtime dependency; the lock is regenerated, never edited by hand.
  - op: create
    path: src/orqlet/interface/cli/render_rich.py
    why: The Rich presenter with state lines, the banner, the narrow and plain modes, and inert dynamic text.
  - op: create
    path: tests/unit/test_render_rich.py
    why: The presenter's modes, icons, labels, banner width rule and injection cases.
  - op: modify
    path: tests/unit/test_package.py
    why: Assert the rich pin and that no model provider SDK is a dependency.
  review_evidence: [architecture-reviewer, security-reviewer, tester, code-reviewer]
  knowledge_step: required
  completion:
