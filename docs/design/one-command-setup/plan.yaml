- id: P-6
  objective: >-
    Add the composite user-scope file system with its root inspection (ADR-002 decisions 1 and 1a), and the user namespace of the
    journal and the backup store with owner sets, JSON entry hashes and private file modes. Precondition: the amended ORQLET-SAFE-001
    has merged (K-1); that merge changes standards_lock_hash, and the impact review re-binds this plan before the phase starts.
  depends_on: [P-5]
  implements: [EC-4, EC-6, EC-8]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The user-scope file system accepts only the prefixes claude, cursor, codex, agents, copilot and data with the writable sub-paths of
      ADR-002 decision 1; any other path and any link is refused.
    source: BC-4; BC-6; ADR-002 decision 1; ORQLET-SAFE-001
    check_ref: pytest
  - id: AC-2
    text: >-
      Root validation refuses, with the variable named: a root that is a link; a root owned by another user on POSIX; a root inside a
      Git work tree, including a home that is a work tree (no process is started for it); CODEX_HOME or COPILOT_HOME outside the home;
      and a missing root whose nearest existing ancestor is a link out of the home.
    source: BC-6; ADR-002 decision 1a
    check_ref: pytest
  - id: AC-3
    text: >-
      The planning view reads missing roots as empty, creates no folder and changes no mode, and reports `will create` and `will
      tighten`.
    source: BC-7; ADR-002 decision 1a
    check_ref: pytest
  - id: AC-4
    text: >-
      Preparation after consent creates missing roots with mode 0700, tightens the user, journal and backup folders to 0700, validates
      again, and refuses with exit 3 when an opened root differs from the pinned path.
    source: BC-29; BC-46; ADR-002 decision 1a
    check_ref: pytest
  - id: AC-5
    text: A data folder that is a link or is owned by another user is refused.
    source: BC-29
    check_ref: pytest
  - id: AC-6
    text: >-
      On Windows (a fake platform) a data folder outside the home is allowed with a warning that names the confidentiality and integrity
      risk, and ownership is not checked.
