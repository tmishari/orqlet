- id: P-5
  objective: >-
    Add `orqlet hook session-start|post-edit --client C`: the strict payload contract, the upward `.orqlet` search inside the home, the
    fixed templates, the duplicate-run filter, the Copilot foundation and the time and size bounds. The hook only reads: it starts no
    process and writes nothing.
  depends_on: [P-4]
  implements: [EC-1, EC-6, EC-8, EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The strict JSON reader accepts only an object at the top level and refuses duplicate keys, NaN and Infinity; a payload over 1 MiB
      is refused before parsing; unknown fields are ignored.
    source: BC-14; BC-6; ADR-002 decision 3; ADR-004 decision 6
    check_ref: pytest
  - id: AC-2
    text: >-
      The working folder comes from `cwd` for claude-code, codex and copilot and from the first `workspace_roots` element for cursor; the
      Cursor duplicate filter reads `cursor_version`; the post-edit path comes from claude-code's `tool_input.file_path`. A missing or
      relative value gives no context.
    source: BC-14; BC-15; ADR-004 decision 5; K-12; Q-45
    check_ref: pytest
  - id: AC-3
    text: >-
      session-start for an initialized project returns a status of at most 1,200 characters from the fixed template with the versions
      and the next step, and no status outside a project. The output object is `{"hookSpecificOutput": {"hookEventName":
      "SessionStart", "additionalContext": ...}}` for claude-code and codex, `{"additional_context": ...}` for cursor and
      `{"additionalContext": ...}` for copilot; with no context it is `{}`.
    source: BC-14; ADR-004 decision 1; K-12
    check_ref: pytest
  - id: AC-4
    text: >-
      Under `--client copilot` the packaged foundation is added when the workspace's AGENTS.md lacks the baseline begin marker, including
      outside a repository, and always when the working folder is outside the home. AGENTS.md is read only inside the home, only as a
      regular file and only up to 256 KiB.
    source: BC-14; ADR-004 decisions 1 and 5; ADR-005 decision 3; Q-43
    check_ref: pytest
  - id: AC-5
    text: >-
      A hostile lock file gives the template with the offending fields left out; a lock over 1 MiB, an unparsable lock or a link gives
      no status.
    source: BC-14; ADR-004 decisions 1a and 5
    check_ref: pytest
  - id: AC-6
    text: >-
      With a working folder outside the home the hook reads no file there (the fake file system records no read) and gives no status.
    source: BC-14; ADR-004 decision 5
    check_ref: pytest
  - id: AC-7
    text: >-
      post-edit returns one line only when the path is inside the project root, is not a link, is listed as Orqlet-owned in
      `.orqlet/generated.lock.yaml` and is representable, in the claude-code PostToolUse shape; for every other client it returns `{}`.
    source: BC-15; ADR-004 decisions 1 and 1a
    check_ref: pytest
  - id: AC-8
    text: >-
      A claude-code registration that receives `cursor_version` in its payload returns `{}` for both events.
    source: BC-16; ADR-004 decision 4; A-35
    check_ref: pytest
  - id: AC-9
    text: >-
      A malformed, oversized or missing payload exits 0 with `{}`; an unknown event or client exits 2.
    source: BC-14; BC-40; ADR-004 decision 2
    check_ref: pytest
  - id: AC-10
    text: >-
      On a temporary tree of 10,000 files and depth 64 each hook ends within 2 seconds; the hook has an internal deadline of 2 seconds,
      and the hook services hold no ProcessRunner or GitRunner.
    source: BC-17; Q-26; ADR-004 decision 6
    check_ref: pytest
  - id: AC-11
    text: No file or folder is created under the temporary home, the project or the data folder by either hook.
    source: BC-15; K-11
    check_ref: pytest
  - id: AC-12
    text: MANIFEST.json lists the two templates with their hashes and the manifest check passes.
    source: ORQLET-DET-002
    check_ref: manifest-check
  - id: AC-13
    text: The staged change touches only the files of this phase and stays inside the expected changes of EC-1, EC-6, EC-8 and EC-9.
    source: EC-1; EC-6; EC-8; EC-9
    check_ref: gate-status-phase
  - id: AC-14
    text: >-
      `IMPLEMENTED_COMMANDS` lists the hook command under the names the application registers for it, and the existing equality test
      between that list and the registered commands (tests/integration/test_validate_cli.py) passes unchanged.
    source: EC-1; Q-53
    check_ref: pytest
