reuse_decisions:
- candidate: LocalFileSystem
  decision: use
  reason: The user-scope file system wraps it per prefix instead of a second atomic writer.
- candidate: apply_plan
  decision: use
  reason: install and uninstall apply their change plans with the existing journaled apply.
- candidate: FsChangeJournal
  decision: use
  reason: The user namespace is a second instance with owners and entry fields, not a new journal.
- candidate: ProcessRunner
  decision: use
  reason: The tools adapter runs its vectors through it, with its timeout and output cap.
- candidate: scrubbed_environment
  decision: use
  reason: The tools adapter extends it with named network variables only.
- candidate: StrictYamlLoader
  decision: use
  reason: status and the hook read the lock and the profile with it.
- candidate: AncestorFinder
  decision: use
  reason: The hook's upward `.orqlet` search follows its pattern, bounded by the home.
- candidate: render-skills-helpers
  decision: use
  reason: User-scope and Copilot skills reuse the helpers with new bases, so the bytes stay equal.
- candidate: PersonalNames
  decision: not-applicable
  reason: No new output names a person.
