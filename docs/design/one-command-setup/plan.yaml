    and four Pythons runs only in CI.
  - >-
    gate-status-phase: `uv run orqlet gate status one-command-setup --phase P-1 --head staged` reports no ORQ-E450, ORQ-E451 or
    ORQ-E453. It is Orqlet's own command, not a project command; a NOT_RUN caused by ORQ-I393 alone is expected offline.
  expected_outputs:
  - rich declared as a runtime dependency, with an unchanged set of locked packages.
  - An interface-only presenter with tests; no existing output changes.
- id: P-2
  objective: >-
    Add the reviewed snapshots of the graphify skill and the six ponytail skills with their provenance and licence files, per-family
    references and the graphify references shared by every client, so that init and upgrade render them for Claude Code, Cursor and
    Codex. The six phase skills are unchanged. The person-started entry skill `orqlet` follows in P-10, once `status` and `install`
    exist (Q-53). The workflow manifest is rebuilt at 0.5.0; the version bump happens once, in P-11.
  depends_on: [P-1]
  implements: [EC-2, EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `load_skills` returns `graphify`, `ponytail`, `ponytail-audit`, `ponytail-debt`, `ponytail-gain`, `ponytail-help` and
      `ponytail-review` beside the six phase skills. Each has one-line `name` and `description` front matter, the name equals the folder
      name and matches the existing name pattern, and none is marked as a skill the agent may start.
    source: BC-19; BC-12; ADR-006 decisions 1 and 3; A-3
    check_ref: pytest
  - id: AC-2
    text: >-
      Each bundled skill has `references/PROVENANCE.md` with the source URL, the pinned revision (Graphify
      340268a70a83588d6b3c6de1fffb05326350ef1d, Ponytail 96608e078b2d5ea607c5c3b8b5a54d1c1fba6846), the licence (Graphify: Apache-2.0
      with the retained MIT terms and the NOTICE text; Ponytail: MIT with its copyright line), one 64-hex SHA-256 per upstream file, and
      the list of adaptations of ADR-006 decision 2. Each has `references/LICENSE.md`; graphify also has `references/LICENSE-MIT.md`. A
      test asserts these fields and files.
    source: BC-19; ADR-006 decisions 1 and 2; A-8; A-9; A-58
    check_ref: pytest
  - id: AC-3
    text: >-
      The upstream SHA-256 values in each PROVENANCE.md equal the hashes of the upstream files at the pinned revisions that the person
      obtained or approved fetching, and each snapshot differs from upstream only by the adaptations listed in its PROVENANCE.md.
    source: BC-19; ADR-006 decision 2
    check_ref: security-reviewer
  - id: AC-4
    text: >-
      No bundled skill file contains a model name, a dependency-install step (`pip install`, `uv pip`, `pipx install`, `--upgrade`), or a
      model backend setting (`gemini`, `GEMINI_API_KEY`, `GOOGLE_API_KEY`, `api_key`). The graphify skill checks that `graphify` is on
      PATH instead of installing it; when it is missing, the skill tells the person to run Orqlet's install step in a terminal without
      naming a command, because `orqlet install` arrives in P-10 (Q-53). `ponytail-help` names the status band, the plugin hooks and the persistent configuration as upstream
      features that this package does not deliver.
    source: BC-19; ADR-006 decision 2; ORQLET-MODEL-001; ORQLET-NOMODEL-001
    check_ref: pytest
  - id: AC-5
    text: >-
      `ClientSkill` gains `family_references`, references keyed by the families `claude`, `agents` and `copilot`. graphify's
      `families/claude.md` renders as `.claude/skills/graphify/references/dispatch.md` for Claude Code, `families/agents.md` as
      `.agents/skills/graphify/references/dispatch.md` for Cursor and Codex with the same bytes, and no family file renders for another
      family. A skill without families renders exactly as before.
    source: BC-19; ADR-006 decision 2; A-4
    check_ref: pytest
  - id: AC-6
    text: >-
      The golden files of the new skills match for the three clients: 30 skill files per client and the 7 Codex `agents/openai.yaml`
      sidecars. Every golden file that existed at the base revision stays byte-identical, including the six phase skills with their STOP
      and Next sections.
    source: BC-13; BC-18; BC-19; A-19; A-21; ORQLET-DET-001
    check_ref: pytest
  - id: AC-8
    text: >-
      `orqlet init` in a temporary repository with the three clients writes the bundled skill files for each client, and
      `orqlet upgrade` of a project initialized at the base revision adds them as Orqlet-owned files. Nothing is written outside the
      project.
    source: EC-2; R-6; A-4
    check_ref: pytest
  - id: AC-9
    text: >-
      MANIFEST.json lists every new workflow file with its hash and the manifest check passes; `workflow_version` stays 0.5.0 in this
      phase.
    source: ORQLET-DET-002; Q-47; A-11
    check_ref: manifest-check
  - id: AC-10
    text: The staged change touches only the files of this phase and stays inside the expected changes of EC-2 and EC-9.
    source: EC-2; EC-9
    check_ref: gate-status-phase
  - id: AC-11
    text: >-
      graphify ships `references/add-watch.md`, `exports.md`, `extraction-spec.md`, `github-and-merge.md`, `query.md`, `transcribe.md`
      and `update.md` once, rendered with the same bytes for every client. Each equals the upstream agents variant at the pinned revision
      except the adaptations its PROVENANCE.md lists: github-and-merge.md has no `--backend` hint and add-watch.md no
      `pip install 'graphifyy[video]'` step. No `references/hooks.md` is rendered, and the skill body has no section that links it or
      tells the agent to run `graphify hook install`, `graphify claude install` or `graphify agents install`; PROVENANCE.md lists that
      removal as an adaptation. Every `references/<name>.md` that the rendered skill body names exists beside it for each client.
    source: BC-19; ADR-006 decision 2; Q-51; Q-52
    check_ref: pytest
