  - Seven bundled skills in the workflow package, rendered for three clients, with golden files.
- id: P-3
  objective: >-
    Add the single foundation text: a precedence sentence, the baseline's "How to work" section, the three points in Orqlet's own
    words and one attribution link, composed from the workflow package so that the project baseline and every global copy share one
    source. The project baseline block is unchanged.
  depends_on: [P-2]
  implements: [EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The composed foundation is, in order: the precedence sentence (a repository's own instructions take precedence over the global
      copy), the "How to work" section with bytes equal to that section of baseline/baseline.md, the three points, and one attribution
      link to https://github.com/multica-ai/andrej-karpathy-skills/tree/2c606141936f1eeef17fa3043a72095b4765b9c2. Composing twice gives
      the same bytes.
    source: BC-20; ADR-005 decisions 1, 2 and 4; R-10
    check_ref: pytest
  - id: AC-2
    text: >-
      The three points are present: name several interpretations instead of choosing one silently; mention unrelated dead code and
      remove only orphans of the person's own change; outside a phase plan, give each step a check. The explicit failure handling line of
      the baseline is kept, no sentence says to skip error handling for impossible scenarios, and none of the upstream sentences that the
      test lists appears verbatim.
    source: BC-20; Q-27; Q-28
    check_ref: pytest
  - id: AC-3
    text: >-
      The foundation is under 6,000 characters, and the Codex managed block that carries it is under 2,500 tokens by the estimate the
      existing Codex chain budget test uses.
    source: BC-21; A-34; A-37
    check_ref: pytest
  - id: AC-4
    text: 'Regression: the project baseline block and its golden files stay byte-identical.'
    source: BC-18; A-44
    check_ref: pytest
  - id: AC-5
    text: MANIFEST.json lists the new workflow file with its hash and the manifest check passes.
    source: ORQLET-DET-002
    check_ref: manifest-check
  - id: AC-6
    text: The staged change touches only the files of this phase and stays inside the expected changes of EC-9.
    source: EC-9
    check_ref: gate-status-phase
  checks: [ruff-check, ruff-format, mypy, import-linter, pytest, manifest-check, gate-status-phase]
