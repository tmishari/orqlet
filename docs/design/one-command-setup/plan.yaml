- id: P-7
  objective: >-
    Add the render scope and the user-scope render request, and make Claude Code, Cursor and Codex render their user-scope files:
    skills, agents, the foundation (the Claude rules file, the Codex AGENTS.md managed block, the Cursor User Rules text) and their hook
    entries as entry objects, only for the registrations that the K-12 citations allow. No file is written yet. Precondition: K-1, as
    for P-6.
  depends_on: [P-6]
  implements: [EC-5]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The user render request carries every packaged skill (the phase and bundled skills here; the entry skill once P-10 adds it), the roles and the foundation as the baseline body,
      and no model settings, conventions, integrations, scoped rules, resources or commands; a profile with a model policy, conventions
      and integrations gives the same user request as one without.
    source: BC-26; ADR-002 decision 7; ORQLET-MODEL-001
    check_ref: pytest
  - id: AC-2
    text: >-
      Claude Code renders `claude/skills/...`, `claude/agents/<role>.md`, `claude/rules/orqlet-foundation.md` and entries in
      `claude/settings.json`; Cursor renders `agents/skills/...` with the sidecars, `cursor/agents/<role>.md`, an entry in
      `cursor/hooks.json` and `data/cursor-user-rules.md`; Codex renders `agents/skills/...` with the sidecars,
      `codex/agents/<role>.toml`, the managed block of `codex/AGENTS.md` and an entry in `codex/hooks.json`. Every user-scope skill and
      agent file has the bytes of the same project file, and no rendered file contains an absolute path.
    source: BC-4; ADR-002 decisions 1 and 2; ORQLET-DET-001
    check_ref: pytest
  - id: AC-3
    text: >-
      The Cursor and Codex user renders of `agents/skills/...` are byte-identical, including the sidecars with
      `allow_implicit_invocation: false`.
    source: BC-27; Q-34; ADR-002 decision 2
    check_ref: pytest
  - id: AC-4
    text: >-
      The hook entries are: claude-code SessionStart and PostToolUse with matcher `Write|Edit`, each `{"type": "command", "command":
      "orqlet", "args": ["hook", "<event>", "--client", "claude-code"], "timeout": 5}`; cursor sessionStart `{"command": "orqlet hook
      session-start --client cursor", "timeout": 5}` in a version 1 file; codex SessionStart with the handler `{"type": "command",
      "command": "orqlet hook session-start --client codex", "timeout": 5}`. Every entry runs the bare `orqlet`, holds no absolute path and
      no payload value, and none is a pre-tool hook, a fail-closed entry or a blocking entry.
    source: BC-14; K-8; K-12; ADR-004 decisions 2, 3 and 7; Q-45
    check_ref: pytest
  - id: AC-5
    text: >-
      The registrations left out are reported as capability limits: Cursor post-edit (no cited edited-path field on an event that can
      return context) and Codex post-edit (the path exists only inside the patch text).
    source: BC-43; K-12; ADR-004 decision 1
    check_ref: pytest
  - id: AC-6
    text: >-
      `claude/rules/orqlet-foundation.md`, the managed block of `codex/AGENTS.md` and `data/cursor-user-rules.md` each hold the composed
      foundation and start with the precedence sentence; the golden files of the user family match.
    source: BC-20; ADR-005 decisions 3 and 4; R-5
    check_ref: pytest
  - id: AC-7
    text: >-
      No user-scope file has a model name, a model or effort field, a convention, an integration or a resource link, even when the project
      request had them.
    source: BC-26
    check_ref: pytest
  - id: AC-8
    text: 'Regression: the project renders of the three adapters stay byte-identical to the existing golden files.'
    source: BC-18; A-25
    check_ref: pytest
  - id: AC-9
    text: The staged change touches only the files of this phase and stays inside the expected changes of EC-5.
    source: EC-5
    check_ref: gate-status-phase
