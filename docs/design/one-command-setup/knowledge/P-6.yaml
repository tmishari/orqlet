no_impact:
  category: already-documented
  reason: >-
    P-6 adds the user-scope port and its composite file system with root inspection, a private mode of the local
    file system, the user namespace of the journal and the backup store with owner sets and JSON entry hashes, and
    registers the orqlet.user-manifest/v1 contract with its exported schema. Nothing calls the user scope yet (the
    plan's expected output for P-6), so no command, option or file that a person uses changes. The behaviour is
    written down in ADR-002 decisions 1, 1a and 4, component.md and the plan's P-6; README.md describes the
    project journal and rollback, which this phase leaves unchanged, and the plan gives the README entries for
    install and the user scope to P-11. After the round-1 reviews the person chose to amend ADR-002 decision 1a
    and container.md in this phase so that they describe the work-tree check as internal to the adapter and
    record the open question about files left in a folder that had group or world access; those design
    documents are the knowledge this phase changes.
