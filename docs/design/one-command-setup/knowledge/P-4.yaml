no_impact:
  category: already-documented
  reason: "P-4 adds the read-only command `orqlet status`, its use case, the PATH locator, the bounded reader with the read-only port protocol ReadOnlyFiles, the representability rules, the read side of the user manifest and Vcs worktree information. The command, its fields and its read-only rule are written down in ADR-001 decision 3 and the plan's P-4. component.md section 3 and design/manifest.yaml EC-1 are out of date on the value names: they give initialized and install and have no home-is-work-tree, and the implemented names are the plan's, recorded in Q-63, until the design amendment that open question Q-78 owns. The person's answers that settle what the design leaves open are answered questions Q-63 to Q-76, Q-79 and Q-80 in questions.yaml: the value names (Q-63), the next order (Q-64), the user manifest contract (Q-65), the host_steps shape (Q-66), the out-of-list test edit (Q-67), the bounded read (Q-68), the wider path rule (Q-69 and Q-70), the phase that registers the manifest contract (Q-71) what a consumer does when a check did not run (Q-72), Git not run through an unsafe PATH (Q-73), an unreadable data directory (Q-74), a file at .orqlet (Q-75), an unidentified running program (Q-76), the PATH folder that holds orqlet (Q-79) and a top folder name that Git output cannot carry (Q-80). Open question Q-77 owns the amendment of the consumer criteria in P-5 and P-10, Q-78 also the JSON field top_level_reason and the global nesting, and Q-81 the P-6 file list for the user manifest contract. The plan gives the README entry for status to P-11 (plan.yaml line 1882), so README.md is not changed here, and its Status list stays without `status` until then."
