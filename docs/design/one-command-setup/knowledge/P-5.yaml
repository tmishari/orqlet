no_impact:
  category: already-documented
  reason: >-
    P-5 adds `orqlet hook session-start|post-edit --client C`, the strict JSON reader, the per-client payload
    contract, the hook use case, its two fixed templates and the read-only hook services, and adds tests for the
    plain-text and orqlet_on_path behaviour of the existing `orqlet status`. The command, its payload rules, its
    bounds, its output shapes and its read-only rule are written down in ADR-004 and component.md section 3 of the
    approved design and in the plan's P-5. The hook is started by a client, not a person, so no command list of
    README.md names it; the plan gives the README entries for install, status and the hooks to P-11 (plan.yaml
    line 1951). The person's answers that settle what the design leaves open for this phase are Q-72 and Q-77 (the
    stop rule), Q-82 (orqlet_on_path absent) and Q-84 (the pinned command list outside the file list) in
    questions.yaml.
