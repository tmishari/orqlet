  category: already-documented
  reason: "The six bundled Ponytail skills, their provenance, licence and adaptations are written down in decisions 1 to 3 of ADR-006 and in EC-2 and EC-9 of the approved design manifest; the narrowed scan and the reworded descriptions are in Q-55 and P-2 AC-12 to AC-14, the test_skills.py change in Q-61 and AC-16, and the removal of the pre-#40 work in Q-62 and AC-17. The one user-facing document that the change made wrong, README.md (the file count of init and 'Each skill stops at a person'), is corrected in this phase's own change (AC-15, Q-57). Against the record's base 8c3421d (main after #43), which still holds the pre-#40 work in progress merged by #41, init and upgrade stop rendering the unreleased graphify skill and its references/dispatch.md, and ClientSkill loses the family_references field; both are removed by Q-60, Q-62 and ADR-006 (Context, decision 4 and Consequences), and against a636b31 neither ever existed. The load_skills docstring now says path order, which is what the code does, and ponytail-help names only the clients that P-2 renders for (Claude Code and Cursor) on its slash-command line, as its PROVENANCE.md adaptation says. The upstream copy under evidence/web/ponytail-upstream/ is a task record for AC-3 and is neither packaged nor rendered. No released command changes its output."
