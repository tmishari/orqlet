considerations:
  security:
    state: affected
    notes: "Three new trust boundaries (TB-1 to TB-3): writes outside the project root under an amended SAFE-001 with root validation (Q-32), network package installation through ProcessRunner, and client hook payloads with repository content reduced to validated template fields. Hooks are advisory and claim no enforcement (Q-26). Residual risk accepted by the person (Q-39): transitive dependencies, the managed Python and pipx install uv are not hash-pinned; install output names it. Tool output shows URLs as scheme and host only and redacts proxy values; uv and pipx are called by absolute paths from absolute PATH elements. Leftover risks accepted by the person: a client launched with a PATH different from the terminal's is not inspected (Q-42); a repository can switch the global foundation off for its own sessions (Q-43); a bare-repository dotfiles home is not detected (Q-44). Orqlet reads no credential and no user package configuration file; shared client files, which may hold credentials, are backed up 0600, never printed, and kept only for the last 3 changes (Q-40); on Windows a data directory outside home is allowed with a warning that names both its confidentiality and integrity risk, repeated by rollback --user (Q-41)."
  compatibility:
    state: affected
    notes: "New public commands, a fourth client id, new packaged skills and a direct rich dependency. Existing profiles, commands and the three adapters' golden output stay unchanged; global copies may shadow project copies, which status and the session-start hook make visible (Q-38)."
  operations:
    state: affected
    notes: "orqlet install is the only command that uses the network. User-scope recovery depends on the data directory journal. Host steps (Codex hook trust, Cursor User Rules) are reported, never bypassed. Nothing is published (Q-25)."
