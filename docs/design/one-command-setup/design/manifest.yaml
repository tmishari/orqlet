expected_changes:
  - id: EC-1
    surface: public-api
    action: add
    identity: "command line: orqlet install, uninstall, status and hook (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "install and uninstall [--client C]... [--yes] [--dry-run] [--json] (install also [--allow-weaker], refusing with exit 3 without it when the user manifest's workflow version is newer) with exit 0, 1, 2, 3, 4 or 70 (uninstall defaults to the recorded owners and never exits 4 for no detected assistant); status [--root DIR] [--json], read-only, exit 0 or 5; hook session-start|post-edit --client C, payload on stdin, always exit 0 except 2 for usage. Output and states as in component.md section 3."
    verification: manual
  - id: EC-2
    surface: public-api
    action: change
    identity: "command line: init, upgrade and rollback (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "init and upgrade also render the graphify and six ponytail skills and, for a profile listing copilot, the copilot adapter's project files; --client accepts copilot; init with no --client now covers four clients, so a new project gets .github/skills; rollback gains --user <change-id>, which reads the user-scope journal from any directory, excludes --root and --project-id (exit 2) and writes user/manifest.json last. Every other behaviour is unchanged."
    verification: manual
  - id: EC-3
    surface: persisted-schema
    action: change
    identity: "RenderClientId, the profile client list and the user manifest owner sets"
    expected_after:
      kind: declaration
      value: "A new RenderClientId (claude-code, codex, cursor, copilot) types the profile client list, --client and user-manifest owner sets; existing profiles stay valid and unchanged. ClientId and the JSON schemas of model-policy v2, role-bindings, review-result and integrations stay three-valued and unchanged."
    verification: manual
  - id: EC-4
    surface: persisted-schema
    action: add
    identity: "user-scope manifest, journal and backups under the Orqlet data directory"
    expected_after:
      kind: declaration
      value: "user/manifest.json (owned file or entry, sha256, workflow version, owner set, the resolved real root of each prefix, and the id of the change that wrote it; the user journal records the same roots and, per entry, its owner set and for a JSON entry its key and canonical hash; files 0600), user/apply.lock, user/journal/<change-id>.json and user/backups/<change-id>/ (the last 3 changes kept, Q-40), user/tools-work/ and user/cursor-user-rules.md; the projects/<id> layout is unchanged."
    verification: manual
  - id: EC-5
    surface: persisted-schema
    action: add
    identity: "files and entries written into user client folders"
    expected_after:
      kind: declaration
      value: "Per client as in component.md section 3: skills (phase skills, orqlet, graphify, six ponytail), agents where a documented location exists, the foundation (Claude Code rules file, Codex AGENTS.md managed block), and hook entries in ~/.claude/settings.json, ~/.cursor/hooks.json, $CODEX_HOME/hooks.json and ~/.copilot/hooks/orqlet.json."
    verification: manual
  - id: EC-6
    surface: security
    action: add
    identity: "user-scope writer, tool preparation and hook payload handling on the security globs"
    expected_after:
      kind: paths
      value: "src/orqlet/adapters/fs/user_scope.py, src/orqlet/adapters/process/tools.py, src/orqlet/application/contracts/hook_payload.py, src/orqlet/application/usecases/install.py, src/orqlet/application/usecases/hook_event.py"
    verification: extractor
  - id: EC-7
    surface: dependency
    action: add
    identity: rich
    expected_after:
      kind: specifier
      value: "==15.0.0"
    verification: extractor
  - id: EC-8
    surface: trust-boundary
    action: add
    identity: "TB-1 user client folders, TB-2 package index and managed Python, TB-3 hook payloads and repository content"
    expected_after:
      kind: declaration
      value: "Controls as in context.md: validated roots under the real home, per-root writable sub-paths, manifest-hash ownership with owner sets, 0600 backups and journal; fixed argument vectors, pinned top-level versions, private working folder, scrubbed environment plus proxy and certificate variables; payload size cap, strict parse, upward .orqlet search, no process, no writes, fixed templates with validated fields, exit 0."
    verification: manual
  - id: EC-9
    surface: persisted-schema
    action: change
    identity: "workflow package contents and MANIFEST.json"
    expected_after:
      kind: declaration
      value: "Adds the orqlet entry skill, graphify and six ponytail snapshots with PROVENANCE.md and licence files, the single foundation text and the hook context templates; manifest rebuilt and package version bumped (ORQLET-DET-002)."
    verification: manual
