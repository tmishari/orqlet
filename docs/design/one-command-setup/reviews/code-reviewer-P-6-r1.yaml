    method: read inspect, planning_fs and prepare for operating-system errors that are not OrqletError
    revision: 75bb752790abf906fb66bb047b5171a7c40d552c
  claim: Operating-system errors other than not-found escape inspect, planning_fs and prepare as non-Orqlet exceptions (a root that disappears before LocalFileSystem
    opens it, a PermissionError from mkdir or chmod, a PermissionError on lstat), so the CLI reports an internal error instead of a refusal with exit 3
    that names the variable.
  suggested_action: Catch OSError from the per-root checks, the creation and tightening, and the open, and raise UserRootRefused naming the variable; add
    a test for a root removed before open and one for an unreadable parent.
  confidence: medium
