  rule_ref: ORQLET-SAFE-001
  evidence:
  - kind: absence
    searched:
    - one-command-setup-P-6-7ceedca3/snapshot/src/orqlet/adapters/fs/user_scope.py lines 306-318 and 353-361
    method: read the data-directory checks for a group or world write check
    revision: 75bb752790abf906fb66bb047b5171a7c40d552c
  claim: On POSIX the data directory is checked for links and ownership but not for group or world write access; only user/, user/journal and user/backups
    are tightened. A data directory outside home that another account can write, with no sticky bit, lets that account swap user/ between the second check
    and the opens.
  suggested_action: Ask the person whether such a data directory is refused or warned about, and record it in ADR-002 decision 1a before P-7 wires the data
    directory.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: security
  evidence:
  - kind: absence
    searched:
    - one-command-setup-P-6-7ceedca3/snapshot/src/orqlet/adapters/fs/user_scope.py lines 250-252 and 365-370
    - one-command-setup-P-6-7ceedca3/snapshot/src/orqlet/adapters/fs/local_fs.py lines 208-213
    method: read the chmod calls for link following
    revision: 75bb752790abf906fb66bb047b5171a7c40d552c
  claim: os.chmod on the tightened and created folders follows links; a folder swapped for a link between the check and the chmod changes the target's mode,
    only ever tighter.
  suggested_action: Accept and record the residual risk, or use O_NOFOLLOW with fchmod where the platform supports it.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: finding
  severity: non-blocking
  category: security
  evidence:
  - kind: absence
    searched:
