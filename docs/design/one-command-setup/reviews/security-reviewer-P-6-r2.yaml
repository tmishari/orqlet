    method: read the for_user constructors for the root checks
    revision: 75bb752790abf906fb66bb047b5171a7c40d552c
  claim: The user journal and backup store open the data directory without the inspector's checks; their protection depends on the caller running prepare
    first, which nothing enforces.
  suggested_action: In the phase that wires install, uninstall and rollback --user, test that they are built only after prepare.
  confidence: high
