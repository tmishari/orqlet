findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: security
  evidence:
  - kind: absence
    searched:
    - one-command-setup-P-4-5f3910c1/snapshot/src/orqlet/domain/representable.py lines 17-39
    - one-command-setup-P-4-5f3910c1/snapshot/tests/unit/domain/test_representable.py
    method: text search for FE0, E01, 3164, 2800 and combining
    revision: 0854c7f2ef326fdb4ca41fd7ff15f70d769fb034
  claim: representable_path refuses only Cc, Cf, Cs, Co, Zl and Zp; variation selectors (U+FE00-FE0F, U+E0100-E01EF), the Hangul fillers (U+115F, U+1160,
    U+3164) and U+2800 are invisible and pass, so a hostile folder name can carry unseen text into the agent's context through top_level.
  suggested_action: The person decides whether to refuse them; if so, add tests and apply the rule to the hook too.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: security
  evidence:
  - kind: absence
    searched:
    - one-command-setup-P-4-5f3910c1/snapshot/src/orqlet/application/usecases/bounded_read.py lines 30-35
    - one-command-setup-P-4-5f3910c1/snapshot/src/orqlet/adapters/fs/local_fs.py lines 89-106
    method: read both
    revision: 0854c7f2ef326fdb4ca41fd7ff15f70d769fb034
  claim: read_bounded reads the whole file before the 1 MiB check, so a huge lock in an untrusted clone is loaded in full by status and later by the hook;
    the output stays correct, the risk is memory and time.
  suggested_action: Bound the read itself and test that an oversized file is not read past the limit.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  claim: unsafe_element_before is false when the match is itself in an unsafe element and whenever orqlet is absent; this follows ADR-004 decision 7 and
    matters for install, which must not register hooks in either case.
  suggested_action: Confirm in the install phase; no change in P-4.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  claim: The home-work-tree guard compares strings exactly; on a case-insensitive file system a HOME spelled with other case could skip refuse-home-is-work-tree.
    Not run.
  suggested_action: Consider normcase or st_dev and st_ino, with a test.
  confidence: low
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: security
  claim: top_level is what git rev-parse --show-toplevel reports, so core.worktree in .git/config can point it elsewhere; a normal clone does not copy .git/config.
  suggested_action: The person decides whether status or the entry skill flags a top level that is not the root or one of its parents.
  confidence: low
