findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  claim: On Windows every absolute PATH element counts as safe and the PATHEXT order may differ from how the launch resolves a bare git, so the Q-73 and
    Q-79 guards there cover only empty and relative elements.
  suggested_action: Record it as a known limit, or mirror the launch's resolution for git on Windows.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  claim: On POSIX a missing, group-writable or foreign-owned absolute element counts as safe; inside the single-user threat model.
  suggested_action: No change for P-4.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  claim: top_level follows the repository's own core.worktree, so a repository delivered with its .git folder chooses the printed path and the folder whose
    lock is read; nothing checks that the root lies at or below it.
  suggested_action: Consider refusing a top_level that does not hold the resolved root, as a check not run.
  confidence: medium
