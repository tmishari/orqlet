findings:
  - schema: orqlet.finding/v1
    id: F-1
    kind: observation
    severity: non-blocking
    category: security
    rule_ref: ORQLET-SEC-002
    claim: "inert keeps lone surrogates (category Cs), which Python produces for file names that are not valid UTF-8 on POSIX; writing one to a strict UTF-8 stdout raises UnicodeEncodeError, so a file name could stop install output part-way. It cannot forge a line, and no command calls the presenter before P-10."
    suggested_action: "In P-10, show a lone surrogate as U+FFFD or a visible escape and test a subject decoded from b'\\xff.md' with surrogateescape."
    confidence: medium
  - schema: orqlet.finding/v1
    id: F-2
    kind: observation
    severity: info
    category: security
    claim: "tool_output prints its label at column 0 after inert and a one-line cut; AC-6 relies on the label being fixed, but the API accepts any string."
    suggested_action: "In P-10 pass only constant labels, or type the parameter as a Literal or an enum."
    confidence: high
  - schema: orqlet.finding/v1
    id: F-3
    kind: observation
    severity: info
    category: security
    claim: "markdown-it-py 4.2.0 and pygments 2.21.0 now install for every user through rich; the lock pins them by sha256 from pypi.org, but no advisory check was possible in this review."
    suggested_action: "Ask the person whether an advisory scan is expected before release."
    confidence: medium
