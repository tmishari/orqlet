- id: Q-53
  key: e99ee47e74b7f9555e8dc7bb27435a5e40490b6faccb134547e9f1e5780271be
  subject: Entry skill before the commands it names
  raised_by: Cursor
  phase: implement
  category: requirement
  text: P-2 adds the entry skill `orqlet`, which names `orqlet status` and `orqlet install`, and the
    graphify skill points to `orqlet install`; those commands arrive in P-4 and P-10. Two existing
    tests fail any skill that names a command missing from IMPLEMENTED_COMMANDS, and the equality
    test between IMPLEMENTED_COMMANDS and the registered commands fails once P-4, P-5 or P-10
    registers a command, yet no phase lists capabilities.py. How does the plan change?
  why: P-2 cannot pass its own pytest check, and P-4, P-5 and P-10 would fail the equality test.
  evidence_refs:
  - src/orqlet/application/usecases/capabilities.py:12-49
  - tests/unit/render/test_skills.py:196-224
  - tests/integration/test_validate_cli.py:208-209
  - docs/design/one-command-setup/plan.yaml:144-690
  options:
  - Move the entry skill and its golden files to P-10; list capabilities.py in P-4, P-5 and P-10;
    graphify names Orqlet's install step without a command in P-2 and `orqlet install` in P-10
  - List `status` and `install` as planned commands in P-2
  blocks:
  - implement
  status: answered
  answer:
    value: Move the entry skill `orqlet` and its golden files to P-10. List capabilities.py in the
      phases that register a command (P-4 status, P-5 hook, P-10 install and uninstall). In P-2
