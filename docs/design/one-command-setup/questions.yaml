    answerer: tmishari
    time: '2026-11-21T12:00:00+00:00'
    scope: task
- id: Q-56
  key: ab7c864d39851768c6e7291eec04bc641b2d98dca1731756d5d6532dcbf12067
  subject: Graphify runs the interpreter named in a repository file
  raised_by: Cursor
  phase: implement
  category: policy
  text: The P-2 security review found that every graphify step runs `$(cat graphify-out/.graphify_python)`,
    and that the skill rewrites that file only when it is missing. The quick path for questions and
    the subcommands skip the step that writes it, so a cloned repository that commits the file gets its
    content run when the person asks /graphify a question there. ADR-006 decision 2 lists no adaptation
    for this. How should it be resolved?
  why: The design treats repository content as untrusted (ORQLET-SEC-002), and P-2 ships the skill into
    every project.
  evidence_refs:
  - src/orqlet/workflow/skills/graphify/skill.md:58
  - src/orqlet/workflow/skills/graphify/skill.md:731-745
  - src/orqlet/workflow/skills/graphify/references/query.md:13-19
  options:
  - Rewrite the file from the graphify on PATH at every invocation, body only
  - The same, plus quoting, an extraction-prompt guard and removal of the Graphify Cloud prompts
  - Leave graphify out of P-2
  blocks:
  - implement
  status: answered
  answer:
    value: Rewrite the file from the graphify on PATH at every invocation, the quick path and every
      subcommand included, before any step reads it, and never trust an existing file; with no graphify
      on PATH, stop and point to Orqlet's install step. Body only, listed in PROVENANCE, with a test.
      The other security observations of the review stay as they are.
    answerer: tmishari
    time: '2026-11-21T16:10:00+00:00'
    scope: task
