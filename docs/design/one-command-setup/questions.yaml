- id: Q-64
  key: f22ea8dc8712871bf4e0e2a72039a708aede4f72a8e54e24ec3068c371040f54
  subject: How orqlet status chooses next
  raised_by: Cursor
  phase: implement
  category: requirement
  text: ADR-001's entry-skill table names the states but no precedence, and does not say what 'global
    setup missing' means when some clients are configured. How is next chosen?
  why: next is the one value the entry skill acts on.
  evidence_refs:
  - docs/design/one-command-setup/design/adr-001-install-command-entry-skill-and-status.md:17-28
  - docs/design/one-command-setup/design/component.md:63-77
  options:
  - 'First match wins: newer, linked worktree, home work tree, every client missing or any outdated, not
    a repository, repository, initialized'
  - The same with any single client missing
  - Stop
  blocks:
  - implement
  status: answered
  answer:
    value: 'First match wins: 1. any client newer: refuse-newer-global; 2. linked worktree: refuse-linked-worktree;
      3. home is a work tree: refuse-home-is-work-tree; 4. every client missing, or any client outdated:
      install-global; 5. not a repository: none; 6. repository: init; 7. initialized: upgrade when the
      project version is missing or below the installed one, otherwise none.'
    answerer: tmishari
    time: '2026-11-22'
    scope: task
- id: Q-65
  key: 6a6e4e701af51b8140572bde78ed4365eb1b5914576102f902a8dbe423f6adae
  subject: Read contract of the user manifest
  raised_by: Cursor
  phase: implement
  category: requirement
  text: ADR-002 decision 2 lists what user/manifest.json holds but no field names; P-4 reads it and P-6
    writes it. What is the contract, and how does a client's state follow from it?
  why: status reads the file in P-4 before any phase writes it.
  evidence_refs:
  - docs/design/one-command-setup/design/adr-002-user-scope-root-journal-and-manifest.md:55-62
  options:
  - orqlet.user-manifest/v1 with change_id, created_at, roots and entries (path, key, sha256, workflow_version,
    owners)
  - Stop and specify first
  blocks:
  - implement
  status: answered
  answer:
    value: 'Schema orqlet.user-manifest/v1: change_id, created_at, roots (prefix to real path), entries
      of path, optional key, sha256, workflow_version and owners (render client ids). A client owning
      no entry is missing; newer if any owned entry is above the installed version, else outdated if any
      is below, else configured. A manifest that does not parse or validate, is a link or is over 1 MiB
      gives missing for every client and a check not run (exit 5).'
    answerer: tmishari
    time: '2026-11-22'
    scope: task
