- id: Q-26
  key: a601cda4211f48c5b6d99a13d35f50d26614617a9d2f9f4eb61b39c0405989fb
  subject: Hook cost and runtime limits
  raised_by: Cursor
  phase: research
  category: requirement
  text: What may a startup or tool-event hook do?
  why: Recorded from the person's request of 2026-11-20.
  blocks:
  - design
  - plan
  - implement
  status: answered
  answer:
    value: Cheap, narrowly scoped deterministic work only; no full test suite, full graph
      rebuild, package download, paid model call, session or background agent; no daemon,
      watcher, generic hook engine or plugin framework; no claim of enforcement a client
      contract does not support.
    answerer: tmishari
    time: '2026-11-20T09:39:00+00:00'
    scope: task
- id: Q-27
  key: cbed8b351a17aabd84f0486320c46b4fd0e2429c0140dc7426566f5e1195e7c0
  subject: Licence handling of the Karpathy-inspired guidance
  raised_by: Cursor
  phase: research
  category: requirement
  text: multica-ai/andrej-karpathy-skills declares MIT in metadata but has no LICENSE
    file and names no copyright holder. How should Orqlet treat its text?
  why: Vendoring needs a resolvable licence and attribution.
  blocks:
  - design
  - plan
  - implement
  status: answered
  answer:
    value: Do not vendor its text; write Orqlet's own wording of any genuinely new points,
      with an attribution link
    answerer: tmishari
    time: '2026-11-20T09:50:50+00:00'
    scope: task
- id: Q-28
  key: 070dad4cd151b7ce905e91082cdb61e98dc8857f23c6c8ccef52448ada3ce047
  subject: Behavioural guidance foundation
  raised_by: Cursor
  phase: research
  category: requirement
  text: How should the Karpathy-inspired principles relate to Orqlet's baseline, standards
    and Ponytail?
  why: Recorded from the person's request of 2026-11-20.
  blocks:
  - design
  - plan
  - implement
  status: answered
  answer:
    value: One coherent behavioural foundation; no three overlapping instruction sets
      in every session, no new mandatory command and no separate workflow for this
      source. Simplicity guidance keeps validation at trust boundaries, meaningful
      error handling, accessibility and required approvals. The integration route
      is a design decision.
    answerer: tmishari
    time: '2026-11-20T09:49:00+00:00'
    scope: task
- id: Q-29
  key: 00627a04411aced9cb0f9250276a9a131610d3045a216744080ef7e5f25e10b8
  subject: Terminal presentation of orqlet install
  raised_by: Cursor
  phase: research
  category: requirement
  text: What terminal experience does orqlet install give?
  why: Recorded from the person's request of 2026-11-20; refines the terminal graphic
    of Q-5.
  blocks:
  - design
  - plan
  - implement
  status: answered
  answer:
    value: A recognisable Orqlet ASCII/ANSI banner, clear icons each with a text label,
      readable feedback that distinguishes detected, already configured, installed or
      registered, host trust or manual step, and conflict or failure with a recovery
      action; wide and narrow terminals; bash, zsh and PowerShell; ASCII fallback;
      NO_COLOR and colour-disabled terminals; plain output when non-interactive, redirected
      or in CI; JSON without artwork, animation or ANSI; no constant banners, repeated
      notifications or artificial delays; quiet hooks; no bitmap images or terminal
      image protocols; reuse installed libraries before adding one.
    answerer: tmishari
    time: '2026-11-20T09:49:00+00:00'
    scope: task
- id: Q-30
  key: 8fbf5f77c253bf5a3c77c5f12db835394ebdf60c720c62fbe5935a058be93899
