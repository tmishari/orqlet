- id: Q-82
  key: 5c5521135906464051c4480711912c2a90698a04beba796356b83f9a2a8161c1
  subject: Hook registration when orqlet is not on PATH
  raised_by: Cursor
  phase: design
  category: requirement
  text: locate('orqlet') reports absent with no unsafe element even when PATH holds one, while a bare
    orqlet started later by a client could resolve only through it (security review of P-4, round 6,
    F-1). ADR-004 decision 7 names no rule for an absent orqlet. Does install register a hook then?
  why: The hook runs the bare orqlet, and an unsafe element could make a client run an orqlet from
    an untrusted folder.
  evidence_refs:
  - docs/design/one-command-setup/reviews/security-reviewer-P-4-r6.yaml
  - src/orqlet/adapters/scan/executables.py
  - docs/design/one-command-setup/design/adr-004-advisory-native-hooks.md
  options:
  - Register no hook when orqlet is absent, and report a host step
  - Report the unsafe element in status when orqlet is absent
  blocks:
  - design
  status: answered
  answer:
    value: 'Register no hook for any client when orqlet_on_path is absent, whatever PATH holds, and
      report a host step. ADR-004 decision 7, section 3 and BC-38 say so; in the plan, P-10 registers
      no hook then, P-5 pins the absent value that P-10 reads, and P-6 accepts a change with no hook
      entry for a client.'
    answerer: tmishari
    time: '2026-11-22T14:58:00+00:00'
    scope: task
- id: Q-83
  key: 29780e719e8f08a4b5aadbca114650c39dea228b1123c516d1776171f099281d
  subject: Hook entries left behind when the CLI is removed
  raised_by: Cursor
  phase: plan
  category: requirement
  text: install checks PATH elements only up to the resolved orqlet. With PATH="~/.local/bin:." the hook
    is registered; if the person then removes the CLI with uv tool uninstall or pipx uninstall instead
    of orqlet uninstall, the hook entries stay and the bare orqlet resolves through ".", so a session in
    a hostile clone runs that clone's orqlet (security review of the design, round 15, S-2). Q-42 covers
    a different launch PATH, not this case. What does install do?
  why: The reason Q-82 gives for an absent orqlet applies here too, and P-10 implements the registration
    rule.
  evidence_refs:
  - docs/design/one-command-setup/reviews/security-reviewer-design-r15.md
  - src/orqlet/adapters/scan/executables.py
  - docs/design/one-command-setup/design/adr-004-advisory-native-hooks.md
  options:
  - install also registers no hook when an unsafe element appears anywhere in PATH, through a design amendment
  - Accept the CLI-removal case as a leftover risk, stated in ADR-004 and the README, which tells the person to run orqlet uninstall first
  blocks:
  - implement
  status: open
