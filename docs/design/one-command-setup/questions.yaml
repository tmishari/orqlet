- id: Q-59
  key: 7d3dcb1355de2983f37491cf527b83e0bd3333d2e9662b9a81e5653e920f9441
  subject: Committed links under graphify-out and graphify on Windows
  raised_by: Cursor
  phase: design
  category: policy
  text: The round 10 design reviews found that the skill and the graphify command also write
    .graphify_root, graph.json, the report and memory/ query files under graphify-out, each through a
    symbolic link that a repository committed, and that the interpreter routine, written for a POSIX
    shell and a text first line, would always stop on Windows. How should the design handle committed
    links under graphify-out, and Windows?
  why: ADR-006 decision 2 claims that no write follows a committed link, and Windows is in CI.
  evidence_refs:
  - docs/design/one-command-setup/design/adr-006-bundled-skills-and-tool-preparation.md:36-43
  - src/orqlet/workflow/skills/graphify/skill.md:100
  options:
  - Stop when graphify-out or any entry under it is a link; graphify is POSIX-only
  - Narrow the claim and accept the rest as a residual risk; find the interpreter from uv's tool folder
  blocks:
  - design
  status: answered
  answer:
    value: The routine stops when graphify-out or anything under it is a symbolic link, in every folder
      a step uses, clones included, and BC-48 covers it. The bundled graphify skill is POSIX-only for now
      and stops on Windows with a message that says so; the Ponytail skills are unaffected.
    answerer: tmishari
    time: '2026-11-21T16:35:00+00:00'
    scope: task
- id: Q-60
  key: 832fe4954c0d86d58c3d97b0416b73c43a8415239a6ba24accaf2d1df0d5c9ff
  subject: Graphify and tool preparation leave this task
  raised_by: Cursor
  phase: design
  category: policy
  text: The round 11 security findings show that upstream graphify, run in a cloned repository, still
    lets that repository run code. Every step runs `$(cat graphify-out/.graphify_python) -c ...` from
    the repository root, and Python puts the working folder first on sys.path for -c, so a committed
    `json.py` or `graphify/__init__.py` is imported and run even when the interpreter file is
    rewritten (confirmed locally). Committed symbolic links above graphify-out also redirect its
    writes. Closing these amounts to a fork of the skill. Should the design harden graphify further,
    or move it out of this task?
  why: The design treats repository content as untrusted (ORQLET-SEC-002), and Q-56 and Q-59 did not
    close these paths.
  evidence_refs:
  - docs/design/one-command-setup/reviews/security-reviewer-design-r10.md
  - docs/design/one-command-setup/reviews/architecture-reviewer-design-r10.md
  options:
  - Move the graphify skill and tool preparation to a separate task
  - Move only the graphify skill
  - Harden graphify in this task
  blocks:
  - design
  status: answered
  answer:
    value: Move the graphify skill and tool preparation to a separate task with a security-first
      design. In this task install prepares no tool and uses no network, P-9 is dropped, and R-6
      and R-7 are narrowed to Ponytail. Q-56, Q-58 and Q-59 are superseded for this task.
    answerer: tmishari
    time: '2026-11-21T17:00:00+00:00'
    scope: task
  supersedes:
  - Q-2
  - Q-39
  - Q-46
  - Q-51
  - Q-52
  - Q-56
  - Q-58
  - Q-59
