- id: Q-68
  key: dd84003d1c03167f98542d90df6226bbd2f6d5d555f6fb4addf216dd6b5c29c7
  subject: Bounded read before the size is known
  raised_by: Cursor
  phase: implement
  category: policy
  text: ADR-004 decision 6 checks the size of a lock before reading it, but the FileSystem port has no
    size query and read_bounded read the whole file first (architecture review of P-4, F-1, blocking).
    The fix touches the port, local_fs.py and the fakes, outside P-4's file list. May P-4 make it?
  why: A hostile repository could make status and the later hook read a file of any size.
  evidence_refs:
  - docs/design/one-command-setup/design/adr-004-advisory-native-hooks.md:71
  - src/orqlet/application/usecases/bounded_read.py
  options:
  - Approve a limited read in the port as a P-4 change
  - Amend the plan first
  blocks:
  - implement
  status: answered
  answer:
    value: Approved as a P-4 change. It is made as a narrow read-only protocol ReadOnlyFiles (kind, read_prefix)
      beside FileSystem, implemented by LocalFileSystem (reads at most the limit from the opened file)
      and the memory and faulty fakes; read_bounded reads at most limit + 1 bytes, and the status use
      case takes ReadOnlyFiles.
    answerer: tmishari
    time: '2026-11-22'
    scope: task
- id: Q-69
  key: 04f96929b1d114e64ffa2edec4f4f569309f9bebd609a7c5481412d88cf0ce99
  subject: Invisible characters in a representable path
  raised_by: Cursor
  phase: implement
  category: requirement
  text: The representability rule refuses control, format, surrogate, private-use and separator characters;
    variation selectors, the Hangul fillers and the Braille blank are invisible yet pass (security review
    of P-4, F-1). Should they be refused?
  why: A hostile folder name could carry text the person cannot see into the agent's context.
  evidence_refs:
  - docs/design/one-command-setup/design/adr-001-install-command-entry-skill-and-status.md:31
  - src/orqlet/domain/representable.py
  options:
