- id: Q-79
  key: 6c5bf72e45c9173683348809c9d1dbebe78cded341965d8cce347d99eecc20ac
  subject: The PATH folder that holds orqlet
  raised_by: Cursor
  phase: implement
  category: requirement
  text: locate reported only unsafe PATH elements before the one holding orqlet, so an orqlet found in
    an empty, dot or relative element, or in a folder writable by others, gave no host step, while the
    git check of Q-73 counts the matching element (security review of P-4, round 4, F-1; architecture
    review, F-2). Should the matching element count?
  why: The hook that ADR-004 decision 7 protects runs the bare orqlet.
  evidence_refs:
  - src/orqlet/adapters/scan/executables.py
  - docs/design/one-command-setup/design/adr-004-advisory-native-hooks.md
  options:
  - Count the matching element too, as for git
  - Keep 'before' as AC-3 words it
  blocks:
  - implement
  status: answered
  answer:
    value: 'Count it: an unsafe element searched before the match or holding it gives unsafe-path-element.
      This widens the literal ''before'' of AC-3 and ADR-004 decision 7. The field is named unsafe_element_searched.'
    answerer: tmishari
    time: '2026-11-22'
    scope: task
- id: Q-80
  key: a7f9163901e50fff06a513a63db287f726e6ec137058a4fb3e6bf815ecd5598b
  subject: A top folder name that Git output cannot carry
  raised_by: Cursor
  phase: implement
  category: requirement
  text: A repository whose top folder name holds a line feed or bytes that are not UTF-8 is reported as
    not-a-repository with a null top_level, no reason and exit 5, while AC-4 reads as its real location
    with path-not-representable (code review of P-4, round 4, F-2). Which holds?
  why: The location is part of the stable status contract.
  evidence_refs:
  - src/orqlet/adapters/git/vcs_git.py
  - docs/design/one-command-setup/plan.yaml
  options:
  - 'Keep it: exit 5 makes the consumers stop (Q-72), a known limit'
  - Make the real location reachable with path-not-representable
  blocks:
  - implement
  status: answered
  answer:
    value: 'Keep it as a known limit: the Git check is a check not run (exit 5), so the consumers stop
      (Q-72). AC-4 is read as satisfied for this case.'
    answerer: tmishari
    time: '2026-11-22'
    scope: task
