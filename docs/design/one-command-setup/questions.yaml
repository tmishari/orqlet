- id: Q-73
  key: fdfca42e0ff6e56e759f97cd67d2b1e129bd944d58e9be8cfa04fa37fa52a6c5
  subject: Git started from an untrusted work tree
  raised_by: Cursor
  phase: implement
  category: requirement
  text: status starts the bare name git with the project as its working folder; an empty, dot or relative
    PATH element, or one writable by others, searched before git could run a git committed in an untrusted
    clone (security review of P-4, round 3, F-1). What does P-4 do?
  why: status is the command the entry skill runs in any folder, including an untrusted clone.
  evidence_refs:
  - src/orqlet/adapters/git/git_runner.py
  - src/orqlet/application/usecases/status.py
  options:
  - status checks PATH before Git and skips Git as a check not run
  - GitRunner resolves git through absolute elements only (out of list)
  - A known limit for a follow-up task
  blocks:
  - implement
  status: answered
  answer:
    value: 'status checks PATH before Git: when an unsafe element is searched before git is found, its
      own element included, or anywhere when git is absent, Git is not run, the location is not-a-repository
      and the check is not run (exit 5). Other commands keep the existing launch. On Windows, whether
      the process launch also searches the current folder is unknown and not covered.'
    answerer: tmishari
    time: '2026-11-22'
    scope: task
