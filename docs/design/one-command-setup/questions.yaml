- id: Q-54
  key: b6d13237cce03a000d3b306d9da4d3c75f0298fd5e4497d49c1253bbad6e5569
  subject: Line ranges shifted by an earlier committed phase
  raised_by: Cursor
  phase: implement
  category: policy
  text: P-1 added one line to pyproject.toml before line 38, so the ranges the plan cites at 38-61,
    62-68 and 69-81 now hold their content one line lower with the cited hash. P-1 also added the
    contract "Rich stays in the interface layer" inside the import-linter range 82-127, which P-1
    lists as its own operation, so that range now hashes differently. Do these count as current? Does a pure line shift from an earlier
    committed phase count as the same source?
  why: The completion entries cite pyproject.toml by line range and hash.
  evidence_refs:
  - docs/design/one-command-setup/plan.yaml:658-682
  - docs/design/one-command-setup/plan.yaml:673-676
  options:
  - Yes, when the content hash is unchanged
  - No, amend every citation
  blocks:
  - implement
  status: answered
  answer:
    value: Yes. A pure line shift from an earlier committed phase, with the cited hash unchanged,
      is the same source. A cited source changed only by an earlier committed phase's own listed
      operation is current; the re-citation names that phase's commit and the new hash.
    answerer: tmishari
    time: '2026-11-21T10:00:00+00:00'
    scope: task
