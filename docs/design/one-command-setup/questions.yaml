  - Keep ADR-001's rule and record a known limit
  blocks:
  - implement
  status: answered
  answer:
    value: 'Refuse them too: U+FE00 to U+FE0F, U+E0100 to U+E01EF, U+115F, U+1160, U+3164 and U+2800.
      Ordinary combining accents stay allowed, because decomposed file names hold them.'
    answerer: tmishari
    time: '2026-11-22'
    scope: task
