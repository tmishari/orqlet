findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: failure-handling
  evidence: []
  claim: front_matter_differences raises TypeError when `parsed` is not a mapping, for example None (a block that parses to nothing) or a list with an unhashable member, because `{*line_view, *parsed}` (src/orqlet/domain/front_matter.py:53) needs an iterable of hashable items. The module docstring (lines 8-9, "Both functions are pure and never raise") and ADR-001 decision 2 ("Neither function raises for any input") say more than AC-4 ("any text or any mapping") and more than the tests cover, which use dict inputs only. Read, not executed.
  suggested_action: 'Narrow the docstring and ADR wording to "any text and any mapping", or have the P-4 caller check that the strict loader returned a mapping and report anything else as a failure. Keep the domain function loud: a test that fails is the safe direction here.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: Messages embed `repr(key)` (front_matter.py:62-70). Line-view keys are limited by the regex to `[A-Za-z0-9_][A-Za-z0-9_.-]*`, but keys of the parsed view are not, and the text has no length bound. A key pasted from the wrong place would be echoed whole. This meets ADR-001 ("names keys, never prints values"). `repr` escapes control characters, U+2028/U+2029 and format characters, so a key cannot forge extra finding lines (the SR-6 concern). It matters only if a later caller feeds project files; P-4 feeds renderer output only.
  suggested_action: No change now. If a caller ever passes untrusted front matter, cap the key length in the message.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: tests/unit/domain/test_front_matter.py:428-429 asserts `_names_key(key, messages)` by substring for keys drawn from `[a-z]+(-[a-z]+)*`. A one-letter key such as "a" is a substring of every message ("parsed", "line"), so the "each key is named" half of test_no_message_shows_a_marked_value_of_either_view cannot detect a missing message for such keys. The disclosure half (`not _shows_any(messages, "SECRET-MARKER-", "OTHER-MARKER-")`) uses long distinctive markers and is sound, so the AC-3 control, no value in any message, is not weakened. The count-based tests (`len(messages) == 1`) cover the missing-message case.
  suggested_action: 'Optional: compare against the exact `repr(key)` token, or require keys of at least 4 characters.'
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: 'The packet snapshot holds the earlier design-phase review notes (snapshot/docs/design/harness2-fit/reviews/security-reviewer-design.md and architecture-reviewer-design.md). This is the known gap of ADR-002: the built `review prepare` exports every tree entry. I opened the security note to learn the design-time concerns (SR-2, SR-5, SR-6, SR-11). I did not open the architecture note. The conclusions above come from the code and tests in this packet, but this reviewer was not fully context-clean.'
  suggested_action: Treat this review's independence as reduced by that exposure until the packet rule of ADR-002 lands.
  confidence: high
