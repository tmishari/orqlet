capability_limits:
- The reviewer's tools are read-only by advice, not by enforcement; its shell was unavailable, so it ran no check and recomputed no digest.
- Quote digests were not computed, so each finding rests on an absence record or is an observation.
- Cursor used the repository's current agent definition, which is the post-change file, while this record binds the definition in the reviewed tree.
- The model that ran the reviewer is not observed.
- The packet snapshot held the earlier design-phase review notes (the known gap that ADR-002 closes), and the reviewer read the design-phase security note, so it was not fully context-clean.
- The packet omitted the proposal, so the reviewer ran the whole-document search of AC-3 on the unbound workspace copy.
applicability:
