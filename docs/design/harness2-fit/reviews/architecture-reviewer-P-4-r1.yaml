findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: tests
  rule_ref: ORQLET-QA-001
  evidence:
  - kind: absence
    searched:
    - docs/design/harness2-fit/tests/P-4.yaml
    - docs/design/harness2-fit/plan.yaml
    method: Read the whole test record. No command entry has the id pytest-matrix. AC-4 (check_ref pytest-matrix) is recorded as not-run, verdict is NOT_RUN and evidence_kind is claimed. The one pytest entry says 'tests/unit and tests/contract only' and does not state the Python version. The plan's completion line requires Python 3.12, 3.13, 3.14 and 3.15.
    revision: 7922ac6e75d98e3afdf3d0cb0f379eb71eb0ce74
  claim: AC-4 (passes on every supported Python) and the phase completion line are not established. The only pytest run was a partial one (unit and contract) on an unstated Python. This review certifies AC-1 to AC-3 by reading only, and the sockets half of AC-4 by construction.
  suggested_action: Run `uv sync --locked --all-groups --python <v>` then `uv run pytest` for 3.12 to 3.15, or let the CI `tests` matrix do it. Record the result before calling P-4 complete. Do not report AC-4 as passed until then.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: standards
  evidence:
  - kind: absence
    searched:
    - docs/design/harness2-fit/plan.yaml
    method: The plan lists one file for P-4. The diff also adds docs/design/harness2-fit/knowledge/P-4.yaml and docs/design/harness2-fit/tests/P-4.yaml. Neither path is in file_operations or in design scope.paths. P-1 to P-3 have the same kind of records in the snapshot, and P-3's file list leaves them out too.
    revision: 7922ac6e75d98e3afdf3d0cb0f379eb71eb0ce74
  claim: Two files outside the phase's literal file list are staged. They are the phase's own evidence records, which the plan requires through knowledge_step and the tester's review evidence, and earlier phases did the same. Taken literally, 'stays inside its file list' is not met.
  suggested_action: No change to this phase. The planner may want phase file lists to name the two record paths, or the validator may want to exempt them, so this stops needing a note.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: tests
  evidence:
  - kind: absence
    searched:
    - tests/unit/render/test_front_matter_views.py
    method: Read the whole file. Selection is by path, and each client and class is only asserted non-empty. No assertion compares the file set with the packaged skills, roles or commands, and none asserts the 32 that the plan mentions. SKILL_NAMES, ROLE_NAMES and COMMAND_NAMES exist in tests/support/render.py.
    revision: 7922ac6e75d98e3afdf3d0cb0f379eb71eb0ce74
  claim: If one skill or agent disappeared from a client's output, this test would still pass. `test_skills.py`, `test_commands.py` and `test_clients_golden.py` use the name tuples, and the goldens pin each file's content, so the gap is covered elsewhere. The plan's '32 files' is descriptive and not an acceptance criterion.
  suggested_action: Optional. Assert the selected paths equal the names from tests/support/render.py, or assert a total of 32.
  confidence: medium
