  id: F-9
  kind: observation
  severity: info
  category: security
  evidence:
  - kind: absence
    searched:
    - snapshot/src/orqlet/adapters/render/emit.py
    method: 'The first character must be an ASCII letter, so only the bool and null resolvers can match for PyYAML or the YAML 1.2 core schema. `value.lower() not in _RESERVED` covers every case variant. There is no colon, `#`, quote, bracket, newline, tab, `<<` or `=` start, and no ASCII-only bypass through `re` flags (no IGNORECASE). The pattern is linear, with no ReDoS risk. Defaults are unchanged: yaml_scalar and yaml_document pass False, and front_matter defaults to False.'
    revision: b9144df865f0ed14ecedcc4c25f70445c07c96d5
  claim: No gap was found in the allow-list (reserved words, case variants, non-ASCII, line separators, YAML 1.1 and 1.2 typing). This is by reading and reasoning, not by running code.
