findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: tests
  rule_ref: ORQLET-TEST-001
  evidence:
  - kind: absence
    searched:
    - snapshot/tests/unit/render/**
    - snapshot/tests/**/test_front_matter_views.py
    method: Searched for StrictYamlLoader, LOADER, safe_load, split_front_matter, simple_front_matter and front_matter_differences. The loader appears only in the round trips of `quote` (test_emit.py:76,153,207) and in reference examples (test_skills.py:244). None of the new P-3 tests parses a value written with plain_when_safe=True; they compare bytes with a regex retyped from the ADR (test_emit.py `_ALLOW_LIST`). The glob finds no test_front_matter_views.py.
    revision: b9144df865f0ed14ecedcc4c25f70445c07c96d5
  claim: The emit.py docstring says the allow-list 'proves that every YAML reader and a line reader see the same text'. No test in this change shows that. The cross-loader test of ADR-001 decision 4 is P-4 and does not exist yet. My reading of emit.py found no counterexample, but that is not a test result.
  suggested_action: Reword the docstring so it does not say 'proves' until P-4 lands. Keep P-4 a dependency of P-6 (it already is), so this repository's own files are not unquoted before the cross-loader test exists.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: '`tools: Read, Grep, Glob`, `readonly`, `disable-model-invocation` and `model: inherit` are now written without quotes. How Claude Code, Cursor and Codex read them is not observed (AS-IS U-9, design considerations ''Residual'', spike S-21 not run). The read-only controls are what a misreading would affect. The plan covers one observation only, P-6 AC-5 for Cursor''s `orqlet-inventory`.'
  suggested_action: Record 'not observed' for the other clients and files, as P-6 AC-5 already requires for Cursor.
  confidence: medium
