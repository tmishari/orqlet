    method: 'Case-insensitive regex for `api key|secret|token|password|credential|AKIA|sk_live|sk_test|ghp_|BEGIN ... KEY/CERT|/Users/|e-mail shape`. The only hits were `pytest.mark.parametrize` lines, caught by the e-mail shape. These are false positives. The records contain only repo-relative paths, SHA-256 digests and commit ids. `knowledge/P-4.yaml` has `entries: []`, `candidate_count: 0`. `.orqlet/knowledge.yaml` has `sources: []`.'
    revision: 7922ac6e75d98e3afdf3d0cb0f379eb71eb0ce74
  claim: No secrets, tokens, credentials or private data were found in code, tests, fixtures or knowledge text.
  suggested_action: None.
