findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: info
  category: tests
  rule_ref: ORQLET-TEST-001
  evidence: []
  claim: 'Plan P-4 AC-1 says "With the packaged workflow this is 32 files", and ADR-001 counts 32 files. The test only asserts that each (client, path class) yields at least one file (`test_a_client_yields_files_of_every_path_class_it_produces`, `assert texts`). It never pins the number 32. A skill, agent or command file that silently stops being rendered, or whose path stops matching `PATH_CLASSES`, would leave this check green. Those files carry the read-only controls (`tools: Read, Grep, Glob`, `readonly: true`, `disable-model-invocation: true`). Mitigation: I confirmed statically that `tests/unit/render/test_skills.py` (lines 279-319, 365-481) pins those controls separately, so the exposure is low.'
  suggested_action: Optionally assert the per-client counts (or the total of 32) in the release test.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: '`test_the_whole_check_goes_red_when_the_quoting_defect_returns` asserts only `any("name" in problem ...)` for each rendered file. The substring match is weak. The check that names `tools` and `model` (AC-2, `QUOTED_BLOCK`) runs on a fixture block, not on rendered files. With the defect injected, the rendered-file test therefore proves only that the `name` key is flagged. The `tools` and `readonly` controls of rendered roles are covered by the all-keys comparison in AC-1, not by this test.'
  suggested_action: Optionally assert that the messages name `model` (and `tools` for Claude Code) for rendered agents.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: docs
  evidence: []
  claim: '`docs/design/harness2-fit/tests/P-4.yaml` has `verdict: NOT_RUN` and `evidence_kind: claimed`. AC-4 (the Python 3.12-3.15 matrix, sockets disabled) is recorded as `not-run`. The packet holds no command output, only `result_digest` values. I could not verify the exit codes, the "1797 passed" count or the digests. The record is consistent with ORQLET baseline ("not run, never passed"). AC-4''s security-relevant half (no network) is enforced by `--disable-socket` in `pyproject.toml` `addopts`, which I read but did not run.'
  suggested_action: Run the matrix before the phase is closed, and keep AC-4 `not-run` until then.
  confidence: high
