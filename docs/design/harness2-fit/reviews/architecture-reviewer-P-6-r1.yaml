    revision: 1ed2087d017f1901c2a727480ccbaf75d447ecc2
  claim: After this change the task's own AS-IS, design and plan are stale for `workflow_version` (their headers say 0.3.0) and for `protected_set_digest` (49ef4cd5…), because the rendered hashes of the protected skills, agents and AGENTS.md block changed in generated.lock.yaml. None of those artifacts is in the diff, so the staleness is not hidden (AC-4). considerations.md (Compatibility) says the plan must state how a person refreshes a stale artifact. The P-6 plan says only that the person decides about re-approving them. The 'completion note' that AC-4 requires is not in the staged tree, and the built code has no refresh step.
  suggested_action: Record ORQ-W390 and its reasons in the completion note. State for the person how the three artifacts are to be re-approved.
