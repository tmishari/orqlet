    revision: 1ed2087d017f1901c2a727480ccbaf75d447ecc2
  claim: '`.orqlet/versions.yaml` still says workflow 0.3.0, digest afeefefe114234f4…, floor 0.3.0. `.orqlet/workflow.lock` now says 0.3.1 and 5d6807e85ea2a256…. This is as planned: the plan never edits versions.yaml, and the change adds the proposal `.orqlet/proposals/.orqlet__versions.yaml.diff`. The proposal''s new digest equals the one in workflow.lock and its hunk header counts are correct. But neither `doctor` nor `sync` will report the gap. ORQ-W166 fires only when both files name the same version (diagnose.py:266-278), and ORQ-E163 only when the installed version is below the floor. The plan''s AC-3 expects ''any finding about versions.yaml'' to be listed, and there is none to list. The proposal file and the plan''s completion line are the only reminders. Applying the proposal also raises the floor to 0.3.1.'
  suggested_action: Have the person apply or decline the proposal with this change and record which in the completion note. Do not rely on doctor to remind them.
  confidence: high
- schema: orqlet.finding/v1
