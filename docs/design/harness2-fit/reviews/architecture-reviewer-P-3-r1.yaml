findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: tests
  rule_ref: ORQLET-QA-001
  evidence: []
  claim: 'The tester''s record ran pytest on tests/unit and tests/contract only (1701 passed) and its verdict is NOT_RUN. tests/integration, tests/e2e and tests/fault are not evidenced for this phase. I searched them statically (the packet''s tests/ tree, excluding tests/unit and tests/golden) for pinned quoted front matter of skills, agents or commands (`name|description|tools|model: "`) and found none. tests/e2e/test_s8_acceptance.py:258-267 and test_s9_acceptance.py:253 only read the generated files. I therefore see no reason to expect a failure, but nothing was run.'
  suggested_action: Treat the project's CI run on the head commit as the gating evidence, and run the full suite before the phase is accepted.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: AC-3's rule side is carried by test_a_cursor_rule_keeps_a_plain_safe_description_and_its_globs_quoted and test_a_claude_rule_keeps_plain_safe_paths_quoted. test_rule_files_with_project_text_are_written_as_today (test_emit.py, end of file) does not discriminate. Every string it uses is outside the allow-list, so it stays quoted even if a rule renderer passed the keyword. The rule goldens do not discriminate either (golden `.claude/rules/orqlet-sample-001.md` has `"src/**"`, whose `*` is off-list).
  suggested_action: No change needed. Optionally add a comment in the test that the discriminating checks are the two tests above it.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: architecture
  rule_ref: ORQLET-STYLE-001
  evidence: []
  claim: With the keyword true, `_scalar` is also applied to strings inside lists and mappings (emit.py `_emit_container`, the two `_scalar(item, ...)` calls). ADR-001 says "a string value", and the test comment in test_emit.py says this case is deliberately unpinned. No caller passes a container with the keyword, so there is no effect today. `_emit_container` also takes two positional booleans (`quote_all`, `plain_when_safe`) that could be swapped without mypy noticing.
  suggested_action: Leave as is. If a container with the keyword is ever needed, decide and pin it in the ADR. Consider keyword-only booleans on the private helper.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: docs
  evidence: []
  claim: The new emit.py module docstring says the allow-list "proves that every YAML reader and a line reader see the same text". The cross-reader test (ADR-001 decision 4, plan P-4 AC-3) is not in this phase. In P-3 the claim rests on the allow-list tables. I checked the strict loader's resolvers (yaml_loader.py:31-50), and a letter-first string can only hit bool or null there, both excluded by the reserved-word check. For PyYAML's default loader I relied on my own knowledge of its YAML 1.1 resolver table (not in the packet), and the line view is front_matter.py:29-40.
  suggested_action: Acceptable because P-4 depends on P-3 and adds the test. Soften "proves" if P-3 is released alone.
  confidence: medium
