findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'Approval of this change is not evidenced in the packet. The plan header says `status: draft`, and so does the design manifest header. The plan''s self_check says the design was approved because "the person confirmed in this session ... this repository has no commit or remote to show it". The packet has no plan approval record. P-2 changes the protected workflow set, which moves `protected_set_digest`. The design and plan both bind 49ef4cd5...; they become stale after P-2, as ADR-001 and plan P-6 AC-4 already say.'
  suggested_action: The person confirms that design and plan approval exist, and where, before P-3 starts. Until then this is unknown, not passed.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: 'test-record.yaml says `verdict: NOT_RUN` and `evidence_kind: claimed`. Its pytest entry covers only "tests/unit and tests/contract". Integration, e2e, fault and the Python version matrix were not run. That includes tests/integration/test_golden_policy.py, which checks that `--update-golden` is refused in CI. AC-1 and AC-3 are `not-run`. I treated none of the claimed passes as evidence. I checked the golden changes by reading the diff.'
  suggested_action: Run the full suite and the check named for AC-3 (`review:golden-diff`) before this phase is called passed.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  rule_ref: ORQLET-DET-002
  evidence: []
  claim: The release gate cannot detect an edit of workflow text at 0.3.x. releases.json holds only 0.1.0 (lines 1-10). In check_release_history (domain/versions.py:56-83), `seen.get("0.3.1")` is None, so no digest comparison happens. `tools/build_manifest.py --check` proves that the manifest matches the files, not that the files are the approved ones. For this phase the real control is review. design/considerations.md:18 acknowledges the gap. It is not introduced by this diff.
  suggested_action: No action in P-2. Record the 0.3.x release in releases.json when the person releases it, as the design says.
  confidence: high
