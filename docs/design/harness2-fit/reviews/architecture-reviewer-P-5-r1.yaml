findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: 'In the edited document the sentence in item 2 is false. The `diff` row now names the exclusion, so "did not name" describes only the text before this edit. It narrates the edit instead of specifying the rule. Cited: item 2 of the new packet rule, "The row for the `diff` member above did not name this exclusion; this rule is where it is stated.", and the `diff` row, "a valid review record is left out of it (the packet rule for review records, below)".'
  suggested_action: Remove the sentence. The `diff` row already points to the rule.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: '"A path that cannot be parsed" is ambiguous in item 3. A path that matches the record pattern always parses, and item 5 says a non-matching path is an ordinary input. So the clause is either empty or it means "any changed path that fails canonical parsing refuses the packet". That second reading is broader than the sentence''s lead-in, and it differs from the built "omit with a note" behaviour. The wording is inherited from ADR-002 decision 3 and plan AC-1, so it is not a deviation from the approved design. The v0.5 implementer will have to guess. Cited: src/orqlet/domain/evidence_artifacts.py:21-34 (the record pattern admits only [a-z0-9-], fixed role names and P-n-rN.yaml) and src/orqlet/application/usecases/review_prepare.py:110-119 (the built code omits an entry whose name fails CanonicalPath.parse and adds an info note; it does not refuse).'
  suggested_action: State which reading is meant. If it is the broad one, say it is fail-closed for any unclassifiable changed path and that it replaces the "omit with a note" behaviour.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: 'Only the Effect cell of FM-B04 changed. The "Detected by" cell still reads `validate`, `ci check` and the Fixtures cell is unchanged, so the row claims a `review prepare` outcome that no cell tests or lists. "A file at an exact review-record path" also over-generalises: a valid record at an exact path is left out, not refused. Cited: the FM-B04 row hunk, "and a file at an exact review-record path also makes `review prepare` return `NOT_RUN` naming the path".'
  suggested_action: Say "an invalid or deleted file at an exact review-record path", add `review prepare` to the command cell, and name the fixture that shows `NOT_RUN`. The existing symlink and role-mismatch fixtures would do.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: 'The reason names ADR-004, but `already_documented_refs` lists only ADR-002 and `manifest.yaml`. The Section 21.7 half of the phase has no reference. I also cannot tell from the packet whether `already-documented` is the intended category for a text-only phase. ADR-002 and ADR-004 are the sources of the edit, and both have status "proposed". The schema accepts the category. `.orqlet/knowledge.yaml` has `sources: []` and the plan''s `knowledge_scope` is `[]`, which matches the record''s `absence_record`. Cited: docs/design/harness2-fit/knowledge/P-5.yaml, "already written down in ADR-002 and ADR-004 and in the approved design manifest"; ADR-004''s sha256 is in the packet manifest but not in the references.'
  suggested_action: Add ADR-004 with its sha256 to the references. Have the approver confirm the category, or use the category that the proposal's Section 17.13 assigns to a docs-only phase.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: non-blocking
  category: docs
  evidence:
  - kind: absence
    searched:
    - snapshot/docs/design/orqlet-architecture-proposal.md
    method: MANIFEST.json `omitted` lists the file as over the packet limits and there is no copy under snapshot/; diff.patch has four hunks with three lines of context each
    revision: ec7de9f090a005354d6111672736e1f81e1d350a
  claim: 'I could not check AC-3, and I could not check the plan''s promise that "summaries, tables and diagrams that mention the packet are reconciled in the same edit". I saw only the three table rows, FM-B04 and the new paragraphs. Other passages that mention the packet members, the `diff` member or design-review notes could contradict the new text. I also could not check: that heading 21.7 follows an existing 21.6; whether a table of contents or index needs an entry; and what `[R]` on the 21.7 heading means (its legend is elsewhere in the document).'
  suggested_action: Re-run with the proposal sections supplied, for example by raising the packet limits or via `--context`. Record the AC-3 search result in the review note, as the plan requires.
  confidence: high
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: tests
  evidence:
  - kind: absence
    searched:
    - docs/design/harness2-fit/tests/**
    - snapshot/**
    method: looked for the `proposal-read-through` acceptance script behind result_digest 0d275ebd… in the test records, diff.patch and the snapshot
    revision: ec7de9f090a005354d6111672736e1f81e1d350a
  claim: 'The test record is honest: `verdict: NOT_RUN`, `evidence_kind: claimed`, every AC `not-run`. The "49 PASS, 0 FAIL, 0 WARN" read-through script is not in the packet, and no AC in `acceptance_coverage` points at it. I cannot judge whether those checks are meaningful or cover AC-1 to AC-4. The record also says a "stand-in Tester" wrote the script, and the packet does not show what that was.'
  suggested_action: Supply the script, or map its checks to AC ids in the next test record. The tool never runs the commands, so the results remain claimed.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: non-blocking
  category: correctness
  evidence: []
  claim: 'The paragraph states facts about an external repository as plain fact. The cited AS-IS facts are subagent reports, are not validated by `orqlet validate as-is`, and were not re-checked individually, which the AS-IS says itself. The rules built on them (4 and 7) are sound without them. Cited: the last paragraph of Section 21.7, "its session ledger leaves out the selector and reflector sessions, and its path and marker guards cover only the improver''s and selector''s context (facts S-12, S-24 and C-18"; AS-IS sections 1 to 8 are unvalidated and S-12 coverage, S-24 and C-18 are not among the claims re-checked with rg.'
  suggested_action: Mark the sentence as reported by AS-IS S-12, S-24 and C-18, or word it as "AS-IS reports".
  confidence: medium
- schema: orqlet.finding/v1
  id: F-8
  kind: observation
  severity: info
  category: architecture
  rule_ref: ORQLET-NOMODEL-001
  evidence: []
  claim: 'Rule 1 of Section 21.7 says the harness is "outside `src/orqlet`". It does not say whether that means outside this repository. NOMODEL-001 has no path scope. Nothing is built, and ADR-004 says the same, so this is not a deviation. M7 planning will have to decide where the harness lives and whether NOMODEL-001 needs a scope clause or a waiver. Cited: .prompts/rules.yaml, ORQLET-NOMODEL-001 has no `scope` and says "Do not add a model SDK dependency".'
  suggested_action: Carry this as a question into the M7 plan. No change to this phase.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-9
  kind: observation
  severity: info
  category: architecture
  evidence: []
  claim: The packet for this review carries both design-review notes (MANIFEST.json lists snapshot/docs/design/harness2-fit/reviews/architecture-reviewer-design.md and security-reviewer-design.md). This is the gap the new rule describes and says is closed only when the v0.5 packet lands (status line of the rule, ADR-002 consequences). The new text states it accurately.
  suggested_action: None for this phase.
  confidence: high
