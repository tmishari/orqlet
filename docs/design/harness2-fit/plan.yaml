      - {id: AC-1, text: "front_matter called without the keyword gives byte-identical output to today for every existing test input, and the rule-file goldens (.mdc and .claude/rules) do not change.", source: "ADR-001 decision 1", check_ref: pytest}
      - {id: AC-2, text: "With plain_when_safe=True a string is written without quotes exactly when it starts with an ASCII letter, has only ASCII letters, digits, space and the characters `, . ; ( ) / _ + = - '` after that, does not end with a space or an apostrophe, and is not a YAML reserved word in any case. Every other string, including non-ASCII text, text starting with a digit or a symbol, text containing `: `, `#`, quotes or brackets, and reserved words, is written exactly as today. Booleans and integers are written as today.", source: "ADR-001 decision 1", check_ref: pytest}
