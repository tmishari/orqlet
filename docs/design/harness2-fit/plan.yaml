    file_operations:
      - {op: create, path: src/orqlet/domain/front_matter.py, why: "The line view and the comparison of ADR-001 decision 2. Standard library only (ORQLET-ARCH-002)."}
      - {op: create, path: tests/unit/domain/test_front_matter.py, why: "Unit tests for both functions and a property test that neither raises (ORQLET-TEST-001)."}
    acceptance_criteria:
      - {id: AC-1, text: "simple_front_matter returns, for every top-level `key: value` line of a block, the key and the text after the colon with surrounding blanks removed and any quote characters kept. Indented lines and lines that are not `key: value` are ignored. CRLF line ends give the same result as LF.", source: "ADR-001 decision 2", check_ref: pytest}
      - {id: AC-2, text: "front_matter_differences returns one message per key whose two values differ, per key present in one view only, and per key whose parsed value is a list, a mapping or another non-scalar. The string form of a parsed scalar is the string itself, `true` or `false` for a boolean, decimal text for an integer and `null` for none, and the boolean case is decided before the integer case.", source: "ADR-001 decision 2", check_ref: pytest}
      - {id: AC-3, text: "No message contains a value of either view: a test seeds distinctive values and asserts that none appears in any message, only keys.", source: "ADR-001 decision 2", check_ref: pytest}
      - {id: AC-4, text: "Neither function raises for any text or any mapping, shown by a property test over arbitrary text and mappings.", source: "ADR-001 decision 2", check_ref: pytest}
      - {id: AC-5, text: "The module imports only the standard library and the layers contract of import-linter passes.", source: "ORQLET-ARCH-002", check_ref: import-linter}
