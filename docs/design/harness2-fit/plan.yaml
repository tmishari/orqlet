  - id: P-4
    objective: "Add the release test over every rendered skill, agent and Claude Code command and the predicate cross-loader test (ADR-001 decisions 3 and 4)."
    depends_on: ["P-1", "P-3"]
    implements: []
    file_operations:
      - {op: create, path: tests/unit/render/test_front_matter_views.py, why: "The release test of ADR-001 decision 3 and the predicate test of decision 4. It imports public names only."}
    acceptance_criteria:
      - {id: AC-1, text: "For every skill (`*/skills/*/SKILL.md`), agent (`*/agents/*.md`) and Claude Code command (`.claude/commands/*.md`) that the renderers produce for the three clients, the test splits the block with the existing split_front_matter, parses it with the strict loader and asserts that front_matter_differences is empty. Files are chosen by path, so a missing block fails the test. With the packaged workflow this is 32 files.", source: "ADR-001 decision 3", check_ref: pytest}
      - {id: AC-2, text: "A fixture block with quoted `name`, `model` and `tools` values is reported as three differences, so the test would catch a return of the quoting defect on the keys that carry the read-only controls.", source: "ADR-001 decision 3", check_ref: pytest}
      - {id: AC-3, text: "For every string that front_matter(..., plain_when_safe=True) writes without quotes, the strict loader, PyYAML's default safe loader and simple_front_matter return the same string. This is tested with the awkward strings of test_emit.py and with a property test over arbitrary text, through the public function only.", source: "ADR-001 decision 4", check_ref: pytest}
      - {id: AC-4, text: "The test runs with sockets disabled, uses no network and passes on every supported Python version.", source: "ORQLET-TEST-001", check_ref: pytest-matrix}
    checks: ["ruff-check", "ruff-format", "mypy", "import-linter", "pytest", "pytest-matrix"]
    review_evidence: [architecture-reviewer, security-reviewer, tester]
    knowledge_step: required
    completion:
      - "All checks pass on Python 3.12, 3.13, 3.14 and 3.15 (`uv sync --locked --all-groups --python <version>` then `uv run pytest`)"
    expected_outputs:
      - "tests/unit/render/test_front_matter_views.py"
  - id: P-5
    objective: "Write the packet rule of ADR-002 into proposal Section 6.14.1 and the evaluation-harness shape of ADR-004 into a new Section 21.7."
    depends_on: []
    implements: []
    file_operations:
      - {op: modify, path: docs/design/orqlet-architecture-proposal.md, why: "Section 6.14.1 gains the packet rule and the clarification of the `diff` member (ADR-002); a new Section 21.7 records the eight rules of the evaluation-harness shape (ADR-004). Summaries, tables and diagrams that mention the packet are reconciled in the same edit."}
    acceptance_criteria:
      - {id: AC-1, text: "Section 6.14.1 states that the `design` component takes the manifest's `artifacts` and `as_is_ref` and never its `reviews` notes; that a valid review record is left out of every list and out of the `diff`; that any other path at a review-record path (invalid, deleted or unparseable) makes the packet NOT_RUN naming the path; that test and knowledge-impact records are not refused; and the limits listed in ADR-002.", source: "ADR-002", check_ref: architecture-reviewer}
      - {id: AC-2, text: "A new Section 21.7 lists the eight rules of ADR-004: boundary, two seams with scripted fakes, reference arm, expected session counts, run naming and SHA-256 completion marks, unscored not zero, workspace separation by construction, and a no-model preflight.", source: "ADR-004", check_ref: architecture-reviewer}
      - {id: AC-3, text: "No other passage of the proposal contradicts the new text: a search for the packet members and for the `diff` member finds only consistent statements, and the result is recorded in the review note.", source: "ADR-002", check_ref: security-reviewer}
      - {id: AC-4, text: "Nothing in the new text is presented as built: the packet rule says it lands with the v0.5 packet plan, and Section 21.7 says it binds nothing until M7 is planned.", source: "ADR-002 and ADR-004", check_ref: review:status-wording}
    checks: ["proposal-read-through"]
    review_evidence: [architecture-reviewer, security-reviewer, tester]
    knowledge_step: required
    completion:
      - "The reviewers read the edited sections and the passages found by the search"
      - "The document's version and status line are not changed by this phase"
    expected_outputs:
