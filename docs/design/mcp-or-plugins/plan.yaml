- id: P-3
  objective: 'Add the one reader of the declaration, the validator and its command, and run the checks from doctor and sync, with the finding
    codes ORQ-E530 to ORQ-E539, ORQ-W530 and ORQ-I530 to ORQ-I533. Codes: E530 declaration unreadable, over 256 KiB or refused by the strict loader;
    E531 declaration fails its contract; E532 a server, mode and client that the closed table does not enable; E533 scan finding in the declaration;
    E534 MCP file cannot be read safely (link, directory, unreadable, not UTF-8, over the caps, wrong shape, duplicate key); E535 declared entry
    differs from rendered_entry; E536 declared entry absent from an existing file; E537 undeclared orqlet-* entry; E538 closed key or the text
    ${ in an entry; E539 scan finding in an MCP file, raw or decoded; W530 declaration absent and an MCP file holds orqlet-; I530 an OAuth entry
    carries the user''s full permissions; I531 counts of undeclared entries; I532 MCP file absent; I533 an MCP file could not be read and nothing
    was checked in it (absent declaration).'
  depends_on:
  - P-2
  implements:
  - EC-1
  - EC-2
  - EC-3
  - EC-4
  - EC-5
  - EC-6
  - EC-11
  - EC-16
  file_operations:
  - op: create
    path: src/orqlet/application/usecases/integrations_source.py
    why: 'integrations_path, parse_integrations and load_integrations (EC-1 to EC-3): absent gives (None, ()), invalid gives (None, findings)
      with an error, valid gives the declaration; strict load, size cap, contract, closed table, scan; messages map to rule ids and closed field
      names (ADR-003 decision 3; ADR-002 decisions 2, 8, 9).'
  - op: create
    path: src/orqlet/application/usecases/validate_integrations.py
    why: 'integration_findings and validate_integrations (EC-4, EC-5) with the private closed key list: the checks of ADR-002 decisions 6 to 10
      on the declaration and on the MCP files that exist, and the absent-declaration branch of decision 11.'
  - op: modify
    path: src/orqlet/application/usecases/capabilities.py
    why: Add validate integrations to IMPLEMENTED_COMMANDS (EC-11).
  - op: modify
    path: src/orqlet/interface/cli/commands/validate.py
    why: The subcommand validate integrations with the default file .orqlet/integrations.yaml (EC-6), like resources_command.
  - op: modify
    path: src/orqlet/application/usecases/diagnose.py
    why: Call integration_findings from _diagnose outside its full branch, so doctor and sync both run it (ADR-003 decision 6).
  - op: create
    path: tests/unit/application/test_integrations_source.py
    why: The three results of the loader, each refusal, and the absence of any value or raw key in every message (ORQLET-TEST-001).
  - op: create
    path: tests/unit/application/test_validate_integrations.py
    why: Every row of the table of ADR-002 decision 6, the decoded scan with escaped shapes assembled at run time, the caps, duplicate keys, wrong
      shapes, unreadable files with and without a declaration, and the counts.
  - op: create
    path: tests/unit/application/test_diagnose_integrations.py
    why: doctor and sync with a declaration, without one, with an orqlet- name in an MCP file, and in an uninitialised repository; the exit effect
      of the warning.
  - op: create
    path: tests/integration/test_validate_integrations_cli.py
    why: 'The command through the real application: pass, exit 5 on an error, exit 5 not run without a declaration, JSON envelope.'
  acceptance_criteria:
  - id: AC-1
    text: load_integrations returns (None, ()) for an absent file, (None, findings) with at least one error for a file that is unreadable, over
      256 KiB, refused by the strict loader, breaks the contract, names a server, mode and client that the table does not enable, or holds a scan
      finding, and (declaration, findings) with information findings only for a valid file.
    source: ADR-003 decision 3; ADR-002 decisions 2, 8 and 9
    check_ref: pytest
  - id: AC-2
    text: 'No message, finding or exit text of the reader or the validator holds a credential-shaped value or a raw key: a test puts a shape,
      assembled at run time, in a key and in a value of each free-form map of the declaration and of an MCP file and requires that no output contains
      it.'
    source: ADR-002 decision 9; ORQLET-SEC-003
    check_ref: pytest
  - id: AC-3
    text: On a JSON MCP file the validator reports an error for a declared entry that differs from rendered_entry (naming fields from the closed
      vocabulary), for a declared entry that is absent from an existing file, for an undeclared orqlet-* entry in any letter case, and for a key
      of the closed list (compared case-insensitively) or the text ${ anywhere in a decoded key or string; another undeclared entry is left alone
      and counted by one information finding with two numbers and no names.
    source: ADR-002 decision 6
    check_ref: pytest
  - id: AC-4
    text: 'The scan runs on the raw text and on a re-serialisation of the whole parsed document: the shapes ghp_, api_key, Authorization and ${
      written with a JSON escape in one letter, an escaped credential in an entry name, and a lone surrogate are each found, and a finding on
      the decoded text carries the rule and the word decoded with no line and no key. The .codex/config.toml file gets the raw scan only.'
    source: ADR-002 decisions 6 and 7
    check_ref: pytest
  - id: AC-5
    text: 'Parsing is strict and bounded: a file above 256 KiB, nesting above 16 levels, more than 64 entries or a string above 2048 characters,
      a duplicate key (rule duplicate-key, no key text), valid JSON of the wrong shape, and, when a declaration exists, a link, a directory, an
      unreadable file, a file that is not UTF-8 and a link in a parent folder each give an error finding for that file, exit 5, and do not stop
      the other checks.'
    source: ADR-002 decision 8
    check_ref: pytest
  - id: AC-6
    text: With no declaration, validate integrations is not run (exit 5) by its own existence check; integration_findings returns no finding,
      or the warning W530 when an MCP file holds orqlet- in any letter case or, for a JSON file that parses, a decoded entry name that starts
      with orqlet-, and one information finding I533 for a file that cannot be read, with no error; doctor and sync print the warning and exit
      1 on it, and print nothing for a project without such a name.
    source: ADR-002 decisions 8 and 11; ADR-003 decision 6
    check_ref: pytest
  - id: AC-7
    text: doctor and sync both run integration_findings, outside the full branch of _diagnose, and an uninitialised repository behaves as for
      their other checks; validate integrations needs no installed profile.
    source: ADR-003 decision 6; ADR-002 decision 11
    check_ref: pytest
  - id: AC-8
    text: For each registered OAuth server validate integrations and doctor print one information finding I530 that says the entry gives the user's
      full permissions; no finding of the validator or the loader claims a read-only limit.
    source: ADR-002 decision 10
    check_ref: pytest
  - id: AC-9
    text: The closed key list is a private constant of validate_integrations.py that holds only the key names that the evidence gives (headersHelper,
      http_headers_helper, env_http_headers, bearer_token_env_var); IMPLEMENTED_COMMANDS and the commands that the CLI registers differ by exactly
      validate integrations; the default file of the command is .orqlet/integrations.yaml; exit codes follow exit_codes.py.
    source: ADR-002 decision 6; ADR-003 decision 6; EC-6; EC-11
    check_ref: pytest
  - id: AC-10
    text: The public API of the package differs from the base, in this phase, only by EC-1 to EC-6 and EC-11, and every other new name of the
      new modules starts with an underscore.
    source: EC-1 to EC-6; EC-11; EC-16
    check_ref: pytest
