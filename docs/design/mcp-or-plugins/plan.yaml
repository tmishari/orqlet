  - op: create
    path: tests/unit/application/test_render_integrations.py
    why: compose and the Claude Code adapter with and without a declaration, the other two adapters unchanged, init composing without a declaration,
      explain unchanged.
  - op: create
    path: tests/integration/test_upgrade_mcp_files.py
    why: 'upgrade on a real tree: no declaration, an invalid declaration, a valid one, an existing equal file, an existing differing file with
      a run-time sentinel (plan, preview, JSON output, journal, backups), a deleted file, a symlinked file; --check and --resume.'
  - op: create
    path: tests/fault/test_mcp_file_apply.py
    why: Stop apply after each step with a declaration present and show that a re-run or a rollback converges to the same state (ORQLET-TEST-002).
  acceptance_criteria:
  - id: AC-1
    text: 'render_mcp_file returns one JSON object text {"mcpServers": {"orqlet-<id>": {"type": "http", "url": <address>}}} per client for the
      servers that registered_for gives, with an indent of two, a trailing newline and no key other than type and url; the same input gives the
      same bytes; the golden file is byte-identical; no timestamp, absolute path or random value.'
    source: ADR-003 decision 4; ADR-002 decision 5; ORQLET-DET-001
    check_ref: pytest
  - id: AC-2
    text: render_mcp_file scans the text it builds and raises when anything is found, which exits 70 with nothing written; the test forces a finding
      with a substituted scan.
    source: ADR-002 decision 7; ADR-003 decision 4
    check_ref: pytest
  - id: AC-3
    text: The Claude Code adapter writes .mcp.json (owner seeded, no file class) only when RenderRequest.integrations has a server registered
      for claude-code and writes nothing otherwise; the Codex and Cursor adapters produce the same bytes with and without a declaration; the file
      sets of the three adapters for a request without a declaration are unchanged.
    source: ADR-003 decision 4; ORQLET-ARCH-003
    check_ref: pytest
  - id: AC-4
    text: compose takes the keyword parameter integrations (default None) between resources_bytes and orqlet_owned and sets the request field
      with dataclasses.replace; render_request.py and build_render_request are unchanged.
    source: ADR-003 decision 4; EC-9; EC-10
    check_ref: pytest
  - id: AC-5
    text: upgrade with no declaration writes no MCP file; with an invalid declaration it refuses with exit 3 and writes nothing, including the
      other generated files; with a valid declaration it creates .mcp.json with the rendered text and records it in the lock with owner seeded.
    source: ADR-003 decision 3; ORQLET-SAFE-001
    check_ref: pytest
  - id: AC-6
    text: init composes without a declaration, so no MCP file is written by init even when a declaration exists, and explain is not changed.
    source: ADR-003 decision 3
    check_ref: pytest
  - id: AC-7
    text: An existing .mcp.json that equals the render is up to date and nothing is written; one that differs gets a proposal item with the wanted
      text only and one information finding ORQ-I534 for each such item; a sentinel placed at run time in the existing file is absent from every
      planned write, the preview, the JSON output, the journal and the backups; a file that the team deleted is not restored.
    source: ADR-003 decision 5; ORQLET-SAFE-001; ORQLET-SEC-003
    check_ref: pytest
  - id: AC-8
    text: A re-run, --resume and --check converge, an interrupted run (file written, lock not yet) classifies the file as up to date, and the
      fault test stops apply after each step and shows that a re-run or a rollback gives the same state.
    source: ADR-003 decision 5; ORQLET-TEST-002
    check_ref: pytest
  - id: AC-9
    text: With a declaration that registers Claude Code, a symlinked or non-regular .mcp.json makes plan_changes refuse with ORQ-E114 and upgrade
      exit 3 before anything is written.
    source: ADR-002 decision 8
    check_ref: pytest
  - id: AC-10
    text: The public API of the package differs from the base, in this phase, only by EC-7, EC-9 and EC-10; every other new name starts with an
      underscore.
    source: EC-7; EC-9; EC-10; EC-16
    check_ref: pytest
