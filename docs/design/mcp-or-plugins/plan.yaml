  - tests/unit/application/test_validate_integrations.py
- id: P-4
  objective: 'Add the guard that makes a proposal for an MCP file hold no bytes of the existing file: _Builder._propose in the change-plan builder
    passes no existing bytes when the path is the MCP file of one of the three clients, whichever branch calls it.'
  depends_on:
  - P-3
  implements:
  - EC-14
  - EC-16
  file_operations:
  - op: modify
    path: src/orqlet/domain/changeplan.py
    why: In _Builder._propose, pass no existing bytes for the paths that mcp_file_path gives for claude-code, codex and cursor, compared on CanonicalPath.key;
      a private constant of client ids; no public name (ADR-003 decision 5; EC-14).
  - op: create
    path: tests/unit/domain/test_changeplan_mcp_guard.py
    why: 'build_plan-level tests: a sentinel in an existing file is absent from the proposal and from every planned write; each branch that calls
      _propose; a case variant of each path; paths of other files unchanged; the client-id constant against the clients for which mcp_file_path
      succeeds (ORQLET-TEST-001).'
  acceptance_criteria:
  - id: AC-1
    text: 'For each of .mcp.json, .cursor/mcp.json and .codex/config.toml, a seeded file that exists and differs from the render gets a proposal
      that is a diff against nothing: a sentinel placed at run time in the existing file is absent from the proposal text and from the content
      of every planned write.'
    source: ADR-003 decision 5; ORQLET-SEC-003
    check_ref: pytest
  - id: AC-2
    text: The guard covers every branch that calls _propose (seeded proposal, stop, shared block) for a path of an MCP file, and a case variant
      of each path (.MCP.json) is covered because paths are compared on the case-folded key.
    source: ADR-003 decision 5
    check_ref: pytest
  - id: AC-3
    text: 'Proposals for every other path are byte-identical to the base and classify.py is unchanged: the existing tests of tests/unit/domain/test_changeplan.py
      and test_classify.py pass without edit.'
    source: ADR-003 decision 5
    check_ref: pytest
  - id: AC-4
    text: A test fails when the client ids of the guard differ from the clients for which mcp_file_path returns a path (the three ids succeed
      and an unknown id raises).
    source: ADR-003 decision 5
    check_ref: pytest
  - id: AC-5
    text: 'The public API of the package does not differ from the base in this phase: the guard and its constant are private.'
    source: EC-14
    check_ref: pytest
  checks:
