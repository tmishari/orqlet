    in upgrade, with the golden file of the rendered .mcp.json, the finding ORQ-I534 (a proposal for an MCP file shows only the wanted text) and
    the upgrade-level test that no byte of an existing MCP file reaches a plan, a preview, an output, the journal or a backup.
  depends_on:
  - P-2
  - P-3
  - P-4
  implements:
  - EC-7
  - EC-9
  - EC-10
  - EC-13
  - EC-15
  - EC-16
  file_operations:
