phases:
- id: P-2
  objective: Tighten orqlet.integrations/v1 in place with underscore-named validators that call the domain module, add Integrations.registered_for,
    update the valid fixture, and bring the tests of the delivered module in line with the current ADRs. The committed JSON Schema does not change.
    Phase P-1 of the replaced plan is the module mcp_credentials, delivered in commit e607fe5 with its records under knowledge/, tests/ and reviews/;
    this plan starts at P-2 so that no record path is reused.
  depends_on: []
  implements:
  - EC-8
  - EC-12
  - EC-16
  file_operations:
  - op: modify
    path: src/orqlet/application/contracts/integrations.py
    why: Validators (private names) that call name_problems and enforce the rules of EC-12, and the public method Integrations.registered_for
      (ADR-002 decisions 1, 3, 4, 5, 10). No field pattern and no new enumeration, so the committed schema is unchanged.
  - op: modify
    path: tests/fixtures/contracts/valid/orqlet.integrations.v1.yaml
    why: The fixture (https://docs.example.com/mcp, backend_identity Example, registration name docs, enforced_by server) fails the new rules
      and must stay a valid declaration for tests/contract/test_contracts.py (ADR-002 consequences).
  - op: create
    path: tests/unit/application/test_integrations_contract.py
    why: A failing and a passing case for every rule of EC-12, for registered_for and for the text of each rule (ORQLET-TEST-001).
  - op: modify
    path: tests/unit/domain/test_mcp_credentials.py
    why: Its comments cite decisions of the replaced ADRs (ADR-003 decisions 2 and 6, ADR-002 decision 12); point them at the current ones and
      say that the AC labels belong to phase P-1 of the replaced plan. Add the test that pins the closed table over a fixed grid of addresses
      and clients (ADR-004 decision 2).
  acceptance_criteria:
  - id: AC-1
    text: A declaration is refused when a server id is repeated, when registration.name is not orqlet- followed by the id, when env_refs holds
      more than one name or a name that name_problems rejects, when env_refs is not empty for client-native-oauth, when the mode is none for a
      registered server, when backend_identity is not user-oauth with client-native-oauth or user-token with env-ref, when a variable name belongs
      to two servers, when verification is verified, and when identity.url, command or package break the rules of ADR-002 decision 4.
    source: ADR-002 decisions 1, 3 and 4; Q-9
    check_ref: pytest
  - id: AC-2
    text: A declaration is refused when enforced_by is server in registration or in any per_client entry, when a server with capability_tier other
      than read has enforced_by none in registration or in any per_client entry, when clients omits a client with register true, and when a stdio
      server has register true for any client.
    source: ADR-002 decisions 5 and 10
    check_ref: pytest
  - id: AC-3
    text: For a stdio server the validator passes an empty address to name_problems and drops the rule name address-literal-https from the result;
      a stdio server that is not registered is valid.
    source: ADR-002 decision 5
    check_ref: pytest
  - id: AC-4
    text: 'A well-formed declaration for an https address that is not on the closed table is valid for the contract: the table is a check of the
      loader (phase P-3), not a contract rule.'
    source: ADR-002 decision 2
    check_ref: pytest
  - id: AC-5
    text: Integrations.registered_for(client) returns the servers whose per_client entry for that client has register true, in declaration order,
      and an empty tuple when there is none.
    source: ADR-002 decision 5
    check_ref: pytest
  - id: AC-6
    text: 'The text of every validator error names a rule and holds no input value: a test places a credential-shaped string, assembled at run
      time, in an id, an address, a variable name and a registration name and requires that no error text contains it.'
    source: ADR-002 decision 9; ORQLET-SEC-003
    check_ref: pytest
  - id: AC-7
    text: tools/export_schemas.py --check passes and src/orqlet/workflow/schemas/orqlet.integrations.v1.json is byte-identical to the base. The
      only new public name of the contract module is Integrations.registered_for; every other new name starts with an underscore. The valid fixture
      still loads and round-trips in tests/contract/test_contracts.py.
    source: ORQLET-DET-003; EC-8; EC-12
    check_ref: schemas
  - id: AC-8
    text: tests/unit/domain/test_mcp_credentials.py cites the current ADRs (ADR-002 decision 2 for the table, ADR-003 decision 4 for the output
      shape, ADR-003 decision 5 for the seeded paths), and a grid test over the addresses of the AS-IS and look-alike addresses crossed with claude-code,
      codex, cursor and one unknown client shows that exactly one pair, the Atlassian address with claude-code, returns the mode client-native-oauth.
    source: ADR-003 consequences; ADR-004 decision 2
    check_ref: pytest
