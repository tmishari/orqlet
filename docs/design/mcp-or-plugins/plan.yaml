phases:
  - id: P-1
    objective: "Add the pure domain module mcp_credentials: one class and seven functions of ADR-002, with unit, property and worst-case tests. Nothing else imports it yet."
    depends_on: []
    implements: ["EC-1", "EC-2", "EC-3", "EC-7", "EC-8", "EC-10", "EC-11", "EC-16", "EC-17"]
    file_operations:
      - {op: create, path: src/orqlet/domain/mcp_credentials.py, why: "CredentialFinding, find_literal_credentials, rendered_entry, entry_differences, allowed_auth_modes, referenced_variables, name_problems and mcp_file_path (ADR-002 decisions 2 to 9). Standard library only (ORQLET-ARCH-002); the closed table, the patterns and the key sets are private names."}
      - {op: create, path: tests/unit/domain/test_mcp_credentials.py, why: "Unit tests with a failing and a passing case for every rule, credential-shaped text assembled from parts, look-alikes that must pass, the trailing newline, U+212A and the line at offset 4097 (ORQLET-TEST-001, ADR-002 decision 7)."}
      - {op: create, path: tests/unit/domain/test_mcp_credentials_properties.py, why: "Property tests that no finding and no message contains the matched text, key or value, that no function raises on arbitrary text, and a worst-case-time test (ADR-002 decisions 7 and 9)."}
    acceptance_criteria:
      - {id: AC-1, text: "name_problems(server_id, url, variable) returns the names of the rules that the three values break and an empty tuple when none. An id must fullmatch ^[a-z][a-z0-9-]{0,31}$. A variable, when given, must fullmatch ^ORQLET_MCP_[A-Z][A-Z0-9]*(_[A-Z][A-Z0-9]*)*$ and be at most 48 characters. An address must be a literal https address without user information, query, fragment, `${`, backslash or percent-encoding. Every pattern is applied with fullmatch and re.ASCII and without IGNORECASE; tests cover a trailing newline and the character U+212A. No returned text contains an input value.", source: "ADR-002 decisions 3 and 4", check_ref: pytest}
      - {id: AC-2, text: "allowed_auth_modes(url, client) returns ('client-native-oauth',) for exactly the address https://mcp.atlassian.com/v2/mcp with the client claude-code and () for every other address (a trailing slash, another letter case, a query, the GitHub address, the empty string) and for every other client.", source: "ADR-002 decision 2", check_ref: pytest}
      - {id: AC-3, text: "rendered_entry returns, for the Atlassian address, no variable and claude-code, the mapping with the keys type and url in that order (type http); it refuses any other combination, a variable and any value for which name_problems reports a rule, and the refusal text holds no input value. mcp_file_path returns .mcp.json for claude-code, .cursor/mcp.json for cursor and .codex/config.toml for codex.", source: "ADR-002 decision 5; ADR-003 decision 6", check_ref: pytest}
      - {id: AC-4, text: "find_literal_credentials reports, with a line number and a rule name and never a value or a raw key: token-shaped strings with the prefixes of ADR-002 decision 7, a JWT-shaped string, user information in a URL, a credential-named URL query parameter after percent-decoding, an Authorization, Bearer or Basic value that is not the anchored template, and a credential-named key with a literal value. A bearer_token_env_var whose value matches the variable pattern is exempt. A line or a decoded value longer than 4096 characters is itself a finding named oversize, and a credential-shaped string at offset 4097 of one line is found by the oversize finding.", source: "ADR-002 decision 7; Q-6", check_ref: pytest}
      - {id: AC-5, text: "entry_differences(pinned, found) returns the fields in which the found entry differs from the pinned one, from the closed vocabulary type, url, headers, bearer_token_env_var, entry and unknown-key, and never an unknown key, a value or an undeclared name; two equal entries give (). referenced_variables(entry) returns the variable names of every `${NAME}` or `${env:NAME}` reference and of bearer_token_env_var in an entry and () for an entry without any.", source: "ADR-002 decisions 6 and 9", check_ref: pytest}
      - {id: AC-6, text: "A property test builds text from distinctive parts and shows that no CredentialFinding field and no message of any function contains a part; another shows that no function raises for arbitrary text; a worst-case test runs repeated eyJ and long runs of one character through the scan within a time limit that the phase record states after a first measurement.", source: "ADR-002 decisions 7 and 9", check_ref: pytest}
      - {id: AC-7, text: "The module imports only re, collections.abc, typing and dataclasses, uses no clock, random number or environment, and the layers contract of import-linter passes.", source: "ORQLET-ARCH-002", check_ref: import-linter}
    checks: ["ruff-check", "ruff-format", "mypy", "import-linter", "pytest"]
    review_evidence: [architecture-reviewer, security-reviewer, tester]
    knowledge_step: required
    completion:
      - "All checks pass on Python 3.12"
      - "The public API of the package differs from the base only by EC-1, EC-2, EC-3, EC-7, EC-8, EC-10, EC-11 and EC-17"
      - "The only paths on the security globs that this phase touches are the ones EC-16 lists"
    expected_outputs:
      - "src/orqlet/domain/mcp_credentials.py"
      - "tests/unit/domain/test_mcp_credentials.py"
      - "tests/unit/domain/test_mcp_credentials_properties.py"
  - id: P-2
    objective: "Tighten orqlet.integrations/v1 in place with validators that call the domain module, add Integrations.registered_for and update the existing valid fixture. The committed JSON Schema does not change."
    depends_on: ["P-1"]
    implements: ["EC-13", "EC-16", "EC-18"]
    file_operations:
      - {op: modify, path: src/orqlet/application/contracts/integrations.py, why: "Underscore-named validators that call name_problems and the other rules of EC-13, and the public method Integrations.registered_for (ADR-002 decisions 1, 3 to 5). No field pattern and no new enumeration, so the schema is unchanged."}
      - {op: modify, path: tests/fixtures/contracts/valid/orqlet.integrations.v1.yaml, why: "The fixture (https://docs.example.com/mcp, backend_identity Example, registration name docs) fails the new rules and must stay a valid declaration for tests/contract/test_contracts.py (ADR-002 consequences)."}
      - {op: create, path: tests/unit/application/test_integrations_contract.py, why: "A failing and a passing case for every rule of EC-13, for registered_for and for the message text of each rule (ORQLET-TEST-001)."}
    acceptance_criteria:
      - {id: AC-1, text: "A declaration is refused when a server id is repeated, when registration.name is not orqlet- followed by the id, when env_refs holds more than one name or a name that name_problems rejects, when env_refs is not empty for client-native-oauth, when the mode is none, when backend_identity is not user-oauth with client-native-oauth or user-token with env-ref, when a variable name belongs to two servers, when verification is verified, and when identity.url, command or package break the rules of ADR-002 decision 4.", source: "ADR-002 decisions 1, 3 and 4; Q-9", check_ref: pytest}
      - {id: AC-2, text: "A declaration is refused when a server with capability_tier other than read has enforced_by none in registration or in any per_client entry, when clients omits a client with register true, and when a stdio server has register true for any client.", source: "ADR-002 decision 5", check_ref: pytest}
      - {id: AC-3, text: "A well-formed declaration for an https address that is not on the closed table is valid for the contract: the table is a separate check, not a contract rule.", source: "ADR-002 decision 2", check_ref: pytest}
      - {id: AC-4, text: "Integrations.registered_for(client) returns the servers whose per_client entry for that client has register true, in declaration order, and an empty tuple when there is none.", source: "ADR-002 decision 5", check_ref: pytest}
      - {id: AC-5, text: "The text of every validator error names a rule and holds no input value: a test places a credential-shaped string in an id, an address, a variable name and a registration name and requires that no error text contains it.", source: "ADR-002 decision 9", check_ref: pytest}
      - {id: AC-6, text: "tools/export_schemas.py --check passes and src/orqlet/workflow/schemas/orqlet.integrations.v1.json is byte-identical to the base. Every new name in the module except Integrations.registered_for starts with an underscore.", source: "ORQLET-DET-003; EC-13; EC-18", check_ref: schemas}
    checks: ["ruff-check", "ruff-format", "mypy", "import-linter", "schemas", "pytest"]
    review_evidence: [architecture-reviewer, security-reviewer, tester]
    knowledge_step: required
    completion:
      - "All checks pass on Python 3.12"
      - "The public API of the package differs from the base, in this phase, only by EC-18"
      - "The committed schema file is unchanged"
    expected_outputs:
      - "src/orqlet/application/contracts/integrations.py"
      - "tests/fixtures/contracts/valid/orqlet.integrations.v1.yaml"
      - "tests/unit/application/test_integrations_contract.py"
  - id: P-3
    objective: "Reword the workflow rule text so that .mcp.json is no longer described as generated by Orqlet, rebuild the workflow manifest, bump the workflow version to 0.3.2 and regenerate the affected golden files (ADR-003 decision 8, ORQLET-DET-002)."
    depends_on: []
    implements: []
    file_operations:
      - {op: modify, path: src/orqlet/workflow/rules/orqlet-workflow.md, why: "The text stops calling .mcp.json generated. It says that the MCP files (.mcp.json, .cursor/mcp.json, .codex/config.toml) were seeded by Orqlet and belong to the team afterwards, that changes arrive as proposals under .orqlet/proposals, and that a file may name variables but never hold a credential value (ADR-003 decision 8; AS-IS C-4)."}
      - {op: modify, path: src/orqlet/workflow/rules/orqlet-workflow.meta.yaml, why: "The description line says that MCP files are seeded and team-owned; the path list keeps .mcp.json so that the rule is shown when an agent edits that file."}
      - {op: modify, path: src/orqlet/workflow/MANIFEST.json, why: "Rebuilt with tools/build_manifest.py and never by hand (ORQLET-DET-002)."}
      - {op: modify, path: src/orqlet/workflow/identity.json, why: "workflow_version from 0.3.1 to 0.3.2: patch level under design Section 20.8 (wording that changes no gate or contract). The version number is a proposal for the plan review (ADR-003 decision 8 leaves the choice to the person)."}
      - {op: modify, path: tests/golden/claude-code/docs-2026-10/.claude/rules/orqlet-workflow.md, why: "Regenerated locally with --update-golden: the rule text changes."}
      - {op: modify, path: tests/golden/cursor/docs-2026-10/.cursor/rules/orqlet-workflow.mdc, why: "Regenerated locally with --update-golden: the rule text and description change."}
      - {op: modify, path: tests/golden/claude-code/docs-2026-10/AGENTS.md, why: "Regenerated locally with --update-golden: the workflow marker carries version 0.3.2."}
      - {op: modify, path: tests/golden/codex/docs-2026-10/AGENTS.md, why: "Regenerated locally with --update-golden: the workflow marker carries version 0.3.2."}
      - {op: modify, path: tests/golden/cursor/docs-2026-10/AGENTS.md, why: "Regenerated locally with --update-golden: the workflow marker carries version 0.3.2."}
      - {op: modify, path: tests/golden/common/pr_template/existing-reconciled.md, why: "Regenerated locally with --update-golden: the workflow marker carries version 0.3.2."}
      - {op: modify, path: tests/golden/common/pr_template/new-with-team.md, why: "Regenerated locally with --update-golden: the workflow marker carries version 0.3.2."}
      - {op: modify, path: tests/golden/common/pr_template/new-workflow-only.md, why: "Regenerated locally with --update-golden: the workflow marker carries version 0.3.2."}
    acceptance_criteria:
      - {id: AC-1, text: "The rule text names the files under .orqlet/, the client configuration folders and the managed block of AGENTS.md as generated and says not to edit them by hand, and no longer names .mcp.json among them. It says that the MCP files are seeded: they belong to the team once written, changes arrive as proposals, and a file may name variables but must never hold a credential value.", source: "ADR-003 decision 8", check_ref: architecture-reviewer}
      - {id: AC-2, text: "tools/build_manifest.py --check and tools/export_schemas.py --check pass, identity.json says 0.3.2, and the schema file src/orqlet/workflow/schemas/orqlet.integrations.v1.json is unchanged.", source: "ORQLET-DET-002; ORQLET-DET-003", check_ref: manifest}
      - {id: AC-3, text: "The golden files differ from before only in the two rule files and in the workflow version of the marker (six files); no other golden file changes.", source: "ORQLET-DET-001", check_ref: review:golden-diff}
      - {id: AC-4, text: "The release-gate test passes: 0.3.2 is not in the release history, so no digest change is reported as a release defect. releases.json is not edited; recording the release is the person's decision at release time.", source: "ORQLET-DET-002; ADR-003 decision 8", check_ref: pytest}
    checks: ["manifest", "schemas", "pytest"]
    review_evidence: [architecture-reviewer, security-reviewer, tester]
    knowledge_step: required
    completion:
      - "All checks pass on Python 3.12"
      - "Golden files were regenerated locally with --update-golden and never in CI"
      - "The completion note names the version 0.3.2 for the person to confirm or replace"
    expected_outputs:
      - "src/orqlet/workflow/rules/orqlet-workflow.md"
      - "src/orqlet/workflow/MANIFEST.json"
      - "src/orqlet/workflow/identity.json"
  - id: P-4
    objective: "Add load_integrations and validate integrations, wire the command, and make doctor and sync run the same checks (ADR-003 decisions 5 and 7)."
    depends_on: ["P-1", "P-2"]
    implements: ["EC-4", "EC-5", "EC-9", "EC-16", "EC-19", "EC-20"]
    file_operations:
      - {op: create, path: src/orqlet/application/usecases/integrations_source.py, why: "DECLARATION_PATH and load_integrations(project, loader, path): the one owner of the contract check, the closed-table check and the scan of the declaration, with findings in closed vocabulary (ADR-003 decision 5; ADR-002 decision 9)."}
      - {op: create, path: src/orqlet/application/usecases/validate_integrations.py, why: "validate_integrations(services, raw_path): the declaration through load_integrations, then each client's MCP file that exists through strict, bounded parsing, the rule table and the scan (ADR-002 decisions 6 to 8)."}
      - {op: modify, path: src/orqlet/application/usecases/capabilities.py, why: "IMPLEMENTED_COMMANDS gains validate integrations; tests/integration/test_validate_cli.py compares the set with the registered commands."}
      - {op: modify, path: src/orqlet/interface/cli/commands/validate.py, why: "integrations_command, wired like the other validate commands and returning exit 0 on PASS and 5 otherwise."}
      - {op: modify, path: src/orqlet/application/usecases/diagnose.py, why: "_diagnose builds a ValidateServices from the project, vcs, loader and workflow of its Services and runs validate_integrations when a declaration exists; reports a check that did not run when the lock records an MCP file but no declaration exists; adds the CODEOWNERS information finding (ADR-003 decision 7)."}
      - {op: create, path: tests/unit/application/test_integrations_source.py, why: "Absent, invalid and valid declarations; messages without values or raw keys, including a duplicate YAML key and an unknown field (ORQLET-TEST-001)."}
      - {op: create, path: tests/unit/application/test_validate_integrations.py, why: "The rule table for declared, undeclared orqlet-* and other undeclared entries, the caps, the parse failures, unreadable files and the information finding about the read-only labels."}
      - {op: create, path: tests/unit/application/test_diagnose_integrations.py, why: "doctor and sync with and without a declaration, with a lock entry and no declaration, with a failing Vcs call, and the CODEOWNERS mention finding."}
      - {op: create, path: tests/integration/test_validate_integrations_cli.py, why: "The command end to end: exit codes, the JSON envelope, the file argument that must equal the declaration path, and NOT_RUN without a declaration."}
    acceptance_criteria:
      - {id: AC-1, text: "load_integrations(project, loader, path) returns (None, ()) for an absent file, (None, findings with at least one error) for an invalid one and the declaration for a valid one. It runs the contract validation, allowed_auth_modes for every registered client and the scan of the declaration. Its findings carry a rule id and a closed field name, print <key> for a key of a free-form map and unknown-key for an unknown field, and never the text of DocumentError.", source: "ADR-002 decision 9; ADR-003 decision 5", check_ref: pytest}
      - {id: AC-2, text: "No output of load_integrations, validate_integrations or doctor contains a credential-shaped string that a test places in a key, a value, a duplicate key, an unknown field or a tag of the declaration or of an MCP file.", source: "ADR-002 decision 9; Q-6", check_ref: pytest}
      - {id: AC-3, text: "validate integrations with a file argument other than .orqlet/integrations.yaml fails; with no declaration it returns not run and exits 5; with a valid declaration and no MCP file it passes and prints an information finding that the file is absent.", source: "ADR-002 decision 11; ADR-003 decision 5", check_ref: pytest}
      - {id: AC-4, text: "For an MCP file that exists, a declared entry that differs from rendered_entry is an error, a declared entry that is missing is an error, an orqlet-* entry in any letter case that is not declared is an error, an undeclared entry with a key of the closed credential list, a `${` or a scan finding is an error, and an undeclared entry that starts a process or reaches a server without a reference is left alone, as the table of ADR-002 decision 6 says.", source: "ADR-002 decision 6", check_ref: pytest}
      - {id: AC-5, text: "A file above 256 KiB, nesting above 16 levels, more than 64 entries or a string above 2048 characters is refused; a duplicate JSON key is the finding duplicate-key with no key text; a link, a directory or an unreadable file is the finding unreadable and the other checks still run; valid input of the wrong shape is a finding and not an exception.", source: "ADR-002 decision 8", check_ref: pytest}
      - {id: AC-6, text: "validate integrations and doctor print an information finding for each declared server whose read-only and deny labels the entry does not enforce.", source: "ADR-002 decision 5", check_ref: pytest}
      - {id: AC-7, text: "doctor and sync run validate_integrations whenever a declaration exists, report a check that did not run when Vcs.tracked_files or Vcs.read_committed fails or when the lock records an MCP file and no declaration exists, exit 5 on an error, and print the CODEOWNERS finding when no CODEOWNERS file mentions the declaration, the MCP files, .github/workflows/**, .orqlet/versions.yaml, .claude/settings.json and CODEOWNERS.", source: "ADR-002 decision 11; ADR-003 decision 7", check_ref: pytest}
      - {id: AC-8, text: "The list of implemented commands matches the commands that the application registers, and the layers contract of import-linter passes.", source: "ORQLET-ARCH-001", check_ref: import-linter}
    checks: ["ruff-check", "ruff-format", "mypy", "import-linter", "pytest"]
    review_evidence: [architecture-reviewer, security-reviewer, tester]
    knowledge_step: required
    completion:
      - "All checks pass on Python 3.12"
      - "The public API of the package differs from the previous phases only by EC-4, EC-5 and EC-9; EC-19 and EC-20 are compared by hand"
      - "The new ORQ codes are unused elsewhere in the repository and are recorded in the phase record"
      - "The committed-assignment check of ADR-002 decision 10 is not built here; it comes with the release that enables env-ref"
    expected_outputs:
      - "src/orqlet/application/usecases/integrations_source.py"
      - "src/orqlet/application/usecases/validate_integrations.py"
      - "tests/integration/test_validate_integrations_cli.py"
  - id: P-5
    objective: "Add the renderer, the optional RenderRequest.integrations field, the Claude Code adapter step, the compose step and the plan_changes check of planned proposals, so that .mcp.json is written once as a seeded file (ADR-003 decisions 2 to 6)."
    depends_on: ["P-3", "P-4"]
    implements: ["EC-6", "EC-12", "EC-14", "EC-15", "EC-16"]
    file_operations:
      - {op: create, path: src/orqlet/adapters/render/mcp.py, why: "render_mcp_file(servers, client): the text of one client's file, built from rendered_entry, json.dumps with an indent of two, keys in insertion order and a trailing newline (ADR-003 decision 6; ORQLET-DET-001)."}
      - {op: modify, path: src/orqlet/application/ports/instruction_adapter.py, why: "RenderRequest gains the optional field integrations, typed Integrations | None with the default None; InstructionAdapter is unchanged (EC-12)."}
      - {op: modify, path: src/orqlet/adapters/clients/claude_code.py, why: "Adds .mcp.json, owner seeded and no file class, to the files of the adapter when the request carries a declaration, using Integrations.registered_for and render_mcp_file."}
      - {op: modify, path: src/orqlet/application/usecases/render_all.py, why: "compose calls load_integrations and attaches the declaration with dataclasses.replace; an invalid declaration raises InitRefused; plan_changes checks each planned proposal of an MCP path for tracking and scans its text before the plan is returned. plan_changes keeps its signature (ADR-003 decisions 3 and 5)."}
      - {op: create, path: tests/unit/render/test_mcp_render.py, why: "render_mcp_file against its golden file, determinism, and the refusals of rendered_entry (ORQLET-DET-001, ORQLET-TEST-001)."}
      - {op: create, path: tests/golden/claude-code/docs-2026-10/with-integrations/.mcp.json, why: "Golden file of the one generated entry, created locally with --update-golden and reviewed."}
      - {op: create, path: tests/unit/application/test_render_integrations.py, why: "compose with no declaration, a valid one, an invalid one and a profile that does not enable Claude Code; the other two adapters ignore the field."}
      - {op: create, path: tests/integration/test_upgrade_mcp_files.py, why: "init and upgrade end to end: the file is written once, is never refused when Orqlet wrote it, an untracked or flagged existing file refuses the run with exit 3 and nothing written, a tracked clean file gets a whole-file proposal, a deleted file is not restored."}
      - {op: create, path: tests/fault/test_mcp_file_apply.py, why: "Stops the run that writes .mcp.json after each step and proves that a re-run converges, including an untracked file that Orqlet wrote (ORQLET-TEST-002, ORQLET-SAFE-001)."}
    acceptance_criteria:
      - {id: AC-1, text: "render_mcp_file returns for the Atlassian server the text of the golden file: an object with mcpServers holding orqlet-<id> with the keys type and url, written with json.dumps, an indent of two and a trailing newline, and two calls give identical bytes.", source: "ADR-003 decision 6; ORQLET-DET-001", check_ref: pytest}
      - {id: AC-2, text: "Without .orqlet/integrations.yaml, init, upgrade and explain produce the same files as before, byte for byte, and the existing golden files and tests pass unchanged; the Codex and Cursor adapters ignore the new field.", source: "ADR-003 decision 4", check_ref: pytest}
      - {id: AC-3, text: "With a valid declaration and Claude Code enabled in the profile, upgrade writes .mcp.json once as a seeded file with a lock entry; a second upgrade, an upgrade with --check and a resume after an interrupted run all converge without a proposal even when the file is not yet committed.", source: "ADR-003 decisions 2 and 3; ORQLET-SAFE-001", check_ref: pytest}
      - {id: AC-4, text: "When a planned proposal for an MCP path comes from an untracked file, or its text is flagged by the scan, init and upgrade refuse with exit 3, print only rule names and line numbers, and write and preview nothing; a tracked clean file gets a whole-file proposal; a deleted recorded file is not restored.", source: "ADR-003 decision 3; Q-6", check_ref: pytest}
      - {id: AC-5, text: "An invalid declaration makes init, upgrade and explain refuse with exit 3 naming the rule; for init and upgrade no file at all is written. A profile that does not enable Claude Code gets no .mcp.json.", source: "ADR-003 decision 5", check_ref: pytest}
      - {id: AC-6, text: "The fault test stops the apply after each step of the run that writes .mcp.json and a re-run, or a rollback, reaches the same state.", source: "ORQLET-TEST-002", check_ref: pytest}
      - {id: AC-7, text: "The adapters layer imports no use case, the three client adapters import none of one another, the committed schema is unchanged and the layers contract of import-linter passes.", source: "ORQLET-ARCH-001; ORQLET-ARCH-003", check_ref: import-linter}
      - {id: AC-8, text: "The trust boundaries B-1 to B-3 of the context view each have the control that the design names and the review record says so (EC-15 is compared by hand).", source: "EC-15; Q-9", check_ref: security-reviewer}
    checks: ["ruff-check", "ruff-format", "mypy", "import-linter", "schemas", "pytest"]
    review_evidence: [architecture-reviewer, security-reviewer, tester]
    knowledge_step: required
    completion:
      - "All checks pass on Python 3.12"
      - "The public API of the package differs from the previous phases only by EC-6; EC-12 and EC-14 are compared by hand"
      - "The new golden file was created locally with --update-golden and never in CI"
    expected_outputs:
      - "src/orqlet/adapters/render/mcp.py"
      - "src/orqlet/adapters/clients/claude_code.py"
      - "src/orqlet/application/usecases/render_all.py"
      - "tests/fault/test_mcp_file_apply.py"
  - id: P-6
