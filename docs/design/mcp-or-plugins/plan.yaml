self_check:
  schema: orqlet.self-check/v1
  checked_against: {role: planner, phase: plan}
  checks:
    - {what: design approved, how: "the person wrote 'merged to main' on 2026-10-26; gh pr view 2 reports state MERGED at 2026-10-26T10:56:46Z with merge commit ab7adb0e2862; the design manifest is on origin/main", result: pass}
    - {what: standards read, how: "orqlet standards for --phase plan --role planner (15 rules)", result: pass}
    - {what: design manifest hashed, how: "orqlet evidence hash docs/design/mcp-or-plugins/design/manifest.yaml", result: pass}
    - {what: module catalogue consulted, how: ".orqlet/knowledge.yaml has no sources and no module cards exist, so there is nothing to reuse and reuse_decisions is empty", result: pass}
    - {what: paths projected, how: "orqlet validate plan docs/design/mcp-or-plugins/plan.yaml against base revision ab7adb0e2862", result: pass}
    - {what: open questions that block the plan, how: "Q-12 and Q-13 were answered on 2026-10-26 (questions.yaml); Q-14 is answered", result: pass}
    - {what: plan approved by the person, how: "the person wrote \"plan is approved, implement\" and chose to have the approval recorded here (answer record_here) in conversation on 2026-10-26 when /orqlet-implement was started; this is not a merge on the protected baseline, so a gate run still has no approval evidence", result: pass}
    - {what: design reference refreshed, how: "the person chose to re-accept the AS-IS with the two evidence additions; as-is.md was re-pointed to base revision ab7adb0e2862, so as_is_ref in the design manifest and design_ref in this plan name the new hashes; no other line of the design changed", result: pass}
    - {what: EC-20 corrected, how: "orqlet gate status --phase P-1 reported ORQ-E450 because a signature cannot be read for the constant DECLARATION_PATH; EC-20 in the design manifest is now manual and design_ref names the new hash; the gate says a renewed design approval is needed and the person has not given it", result: fail}
  unverified:
    - "The design does not say how the pure functions rendered_entry and mcp_file_path refuse an input; the plan's criteria say only that the refusal text holds no input value, and the implementer picks the exception type."
    - "The workflow version 0.3.2 is a proposal: ADR-003 decision 8 leaves the number to the person."
    - "The owner @tmishari in CODEOWNERS is an assumption taken from the only collaborator of the repository; no document names the code owners that Q-11 mentions."
    - "The time limit of the worst-case scan test is set after a first measurement, as ADR-002 decision 7 says; the plan gives no number."
    - "The AS-IS binding was refreshed on the person's decision; its scope includes src/orqlet/** and tests/**, so it becomes stale again as soon as an implementation phase is committed."
    - "Approval of the design and of the plan is evidence on the protected baseline; an offline run has none, and this plan is a draft until its pull request merges."
