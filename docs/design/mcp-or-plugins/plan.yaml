  - op: modify
    path: src/orqlet/application/usecases/render_all.py
    why: compose gains the keyword parameter integrations (EC-9) and sets RenderRequest.integrations with dataclasses.replace after build_render_request.
  - op: modify
    path: src/orqlet/application/usecases/upgrade.py
    why: A helper after _registry that reads the declaration with load_integrations, refuses with exit 3 and writes nothing when it is invalid,
      passes it to compose, and adds ORQ-I534 for every seeded proposal item on an MCP path (ADR-003 decisions 3 and 5).
  - op: modify
    path: tests/unit/application/test_resources_composition.py
    why: test_compose_takes_the_registry_and_its_bytes_next_to_the_profile_and_its_bytes pins the parameter list of compose; it gains integrations
      between resources_bytes and orqlet_owned (EC-9).
  - op: create
    path: tests/unit/render/test_mcp_render.py
    why: 'render_mcp_file: bytes, determinism, the golden file, the refusal on a scan finding, one file per client, none for an empty selection
      (ORQLET-DET-001, ORQLET-TEST-001).'
  - op: create
    path: tests/golden/claude-code/integrations-2026-10/.mcp.json
