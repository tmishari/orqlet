findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: '[minor] The new rule text says that the check covers only orqlet-* entries; the validator checks the whole
    MCP file and a team entry with a variable reference is an error, so the text understates the control.'
  suggested_action: Reword the bullet to say that the check reads the whole file; the wording is also in ADR-003
    decision 7, so it needs the person's approval.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The declaration is scanned as raw text only and only after the contract passes, so a YAML escape
    hides a credential from the scan (carried from P-3).'
  suggested_action: Scan a re-serialisation or state the limit in the P-8 README and ADR-002 decision 7.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: failure-handling
  evidence: []
  claim: When the declaration fails to load, doctor, sync and validate return only its errors and read no MCP file
    until it is fixed.
  suggested_action: Confirm that it is intended; the run still exits non-zero.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: failure-handling
  evidence: []
  claim: Every size cap is applied after the whole file is read; doctor and sync read the declaration and three
    MCP files on every run.
  suggested_action: A bounded read in the port is a repository-wide choice for the person.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: '[minor] The test record is claimed evidence, marks AC-3 pass before its review ran, records the other
    Python versions as one sentence and has no mypy or import-linter entry.'
  suggested_action: Record AC-3 as not run until a review exists and each Python version as a command.
  confidence: high
- schema: orqlet.finding/v1
  id: F-6
