  severity: info
  category: docs
  evidence: []
  claim: The first paragraph says everything under .orqlet/ is generated; the new bullet names the team-written
    declaration there.
  suggested_action: Clarify in a later text change or in the README.
  confidence: low
- schema: orqlet.finding/v1
