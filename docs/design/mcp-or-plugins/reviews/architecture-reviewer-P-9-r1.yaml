    revision: f76d775595a1f41ff1a0b97c499739e7c348b58e
  claim: 'The README section Checks with a client states three conclusions that the records do not support, while
    plan AC-3 says the README claims nothing about prompts, precedence or storage beyond what a record shows: the
    prompt is no control (the V-1 record limits this to the path observed and lists the interactive dialog as not
    run), a personal entry replaces the team''s entry (the V-4 record shows that a user-scope entry did not win,
    only a local-scope entry did), and the entry that wins is used whole (a vendor statement that the record says
    was not observed).'
  suggested_action: 'Reword the three sentences to what the records show: in the path observed an approval by name
    did not ask again, a local-scope entry replaces the project entry and a user-scope entry does not, and the vendor
    says the winning entry is used whole while a merge of fields was not observed.'
  confidence: high
