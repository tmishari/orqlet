  evidence: []
  claim: 'Two sentences are more absolute than ADR-002 decision 12: never copies a byte (review prepare copies staged
    MCP files), and every developer gets the same entry (the sameness is only detectable on demand).'
  suggested_action: Scope the first to upgrade and word the second as the intended result that is checked on demand.
  confidence: medium
