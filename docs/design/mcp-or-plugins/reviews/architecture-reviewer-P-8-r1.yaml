findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: README step 3 says the proposal comes back on every run until the file holds that text; the code ends it
    only when the whole file equals the render byte for byte, so a team file with other servers keeps the proposal
    and ORQ-I534 after the entry is merged by hand. The ORQ-I534 row says the proposal was written, but the finding
    is printed on runs that write nothing.
  suggested_action: Say that the proposal ends only at byte equality, that a file with other servers keeps it until
    the team takes the file over, and that the finding is shown, not written.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: README says only validate integrations checks the rules, but doctor and sync run the same reader and upgrade
    refuses an invalid declaration with exit 3.
  suggested_action: Reword to say it is the command meant for a CI job; the phrase is pinned by a test, so a person
    decides.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: 'The limit that an undeclared non-orqlet entry is counted and not examined understates the check: a closed
    key, the text ${ or a credential shape is an error in any entry, and the README contradicts itself about ${
    and the strictness for an adopter''s existing entry.'
  suggested_action: State the strictness and the adopter consequence of ADR-002 decision 6; the limit phrase stays.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
