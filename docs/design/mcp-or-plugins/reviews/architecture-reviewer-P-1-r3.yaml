findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: standards
  evidence: []
  claim: 'The plan completion line ''All checks pass on Python 3.12'' is not met in full: the full suite ran only
    on 3.14.9, while ORQLET-QA-001 asks for it on every supported version. The record reports this honestly, and
    the change only adds files that nothing imports.'
  suggested_action: Run the full suite on 3.12 before the phase is accepted, or leave that completion line unchecked
    until the CI 3.12 job is green.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: 'The scan departs from ADR-002 decision 7 in three ways that no design document records: repetition bounds
    of 4096 where the ADR says no repetition above 2048, a narrowed Bearer and Basic rule (a digit, `=`, `+` or
    `/` is needed), and normalised key and query names. The knowledge record says the behaviour is already written
    down in ADR-002.'
  suggested_action: List the three deviations in the completion note or in `unverified` and qualify the no-impact
    reason; whether to amend ADR-002 is the person's call and would make the design hash stale.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: correctness
  evidence: []
  claim: 'The anchored Authorization template copies the variable pattern and lacks the 48-character limit that
    the rest of the module applies, so `Authorization: Bearer ${ORQLET_MCP_<49 or more characters>}` passes as the
    anchored template while a bearer_token_env_var of 49 characters is flagged. The pattern text also exists twice.
    Read, not executed.'
  suggested_action: Build _ANCHORED from _VARIABLE.pattern, apply the same length rule and add a test.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'The credential-named-key rule has blind spots that nothing pins: a one-line JSON pair whose string value
    is 2049 to 4096 characters, YAML sequence items such as `- token: x` and flow maps, and the `+` or `-` prefixed
    lines of a unified diff. ADR-003 says a proposal is a unified diff of the whole file and that its text must
    pass the scan.'
  suggested_action: Pin these limits in tests or widen the patterns, and decide in P-5 whether the scan receives
    file text or diff text.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: The tests leave the rule names, the field names of CredentialFinding and the line-number base unpinned.
    The code is one-based with fixed names, so a later switch to zero-based or renamed rules would pass all P-1
    tests while changing what P-2 and P-4 print.
  suggested_action: Pin one-based numbering and the rule-name set here or in P-4, where they become output.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: AC-6 says the phase record states the time limit; the test record does not. The 0.25 s limit and the 0.63
    ms measurement sit only in a test comment, and two test headers are out of date about the rework rounds.
  suggested_action: Add the limit to the pytest summary or the completion note and correct the two header comments.
  confidence: high
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: architecture
  evidence: []
  claim: 'Three caller duties that P-1 cannot enforce must carry into P-4: entry is in the closed vocabulary but
    entry_differences never returns it; referenced_variables silently stops at depth 32 while the parse cap is 16;
    and it returns names as written, so a caller must never print them.'
  suggested_action: P-4's plan and tests cover all three.
  confidence: high
- schema: orqlet.finding/v1
  id: F-8
  kind: observation
  severity: info
  category: standards
  evidence: []
  claim: AC-7 lists four allowed imports; the module also imports __future__ and does not use typing. The test whitelists
    __future__ and calls it a question for the person. All other domain modules do the same.
  suggested_action: The person confirms; no code change.
  confidence: high
- schema: orqlet.finding/v1
  id: F-9
  kind: observation
  severity: info
  category: architecture
  evidence: []
  claim: The refusals of rendered_entry and mcp_file_path raise a bare ValueError and no test pins the type. Other
    domain modules use OrqletError subclasses, but some also use ValueError. A public exception class would add
    a name outside the EC list.
  suggested_action: Keep ValueError and document in P-4 and P-5 that a refusal there is a defect.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-10
  kind: observation
  severity: info
  category: architecture
  evidence: []
  claim: The design manifest header says draft and its self-check records a fail for EC-20 and a design re-review
    not run; the plan records the same. P-1 implements none of EC-20, so the code is unaffected. The round 1 and
    round 2 records of P-1 are not in the packet, so the reviewer could not check that earlier findings were resolved.
  suggested_action: The person decides on the design re-approval.
  confidence: high
