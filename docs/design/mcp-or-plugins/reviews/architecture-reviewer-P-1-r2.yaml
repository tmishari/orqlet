- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'The Bearer and Basic rule is narrower than ADR-002 decision 7 and AC-4: it flags a value only when the
    token holds a digit, `=`, `+` or `/`; an all-letter value outside a key named authorization is not found. The
    narrowing came from review round 1 and is not recorded in the ADR or the phase record.'
  suggested_action: Record the narrowing as a stated limit, or tighten the rule.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: Pattern runs are capped at 2048 characters but oversize starts only above 4096, so between 2049 and 4096
    a credential-named query parameter, URL user information or a JWT segment can follow a long run without a finding;
    no test covers that window.
  suggested_action: Set the line cap to 2048 or state the window as a limit; add tests at offsets 2049 to 4096.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: 'The completion item ''All checks pass on Python 3.12'' is not met as written: the full suite ran only
    on 3.14.9 and the record is claimed. The 0.25 s limit of AC-6 appears only in a test comment.'
  suggested_action: Run the full suite on 3.12 or let the CI matrix report it; state the limit in the completion
    note.
  confidence: high
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: 'The 48-character bound of the bearer_token_env_var exemption is untested: the 49-character case exists
    only for name_problems.'
  suggested_action: Add a 49-character name under bearer_token_env_var, which must be flagged.
  confidence: high
