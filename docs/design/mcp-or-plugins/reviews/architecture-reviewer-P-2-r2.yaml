findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: '[minor] The refusal tests only check that some ValidationError is raised; the one text check accepts any
    name of the closed set, so a declaration refused for another rule would still pass.'
  suggested_action: Let each refusal case pass the expected rule name and assert it.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: '[minor] The rule that auth mode none is refused for a registered server has only a failing case; no test
    shows that an unregistered none server loads.'
  suggested_action: Add a passing test once the person has decided what label such a server carries.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: A server with auth.mode none that is not registered has no backend_identity rule, so a shared-account label
    can be declared for it; ADR-002 decision 1 does not say what a none server carries.
  suggested_action: The person decides whether such a server may carry a free-text label.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: For a stdio server identity.url is not examined by the contract, as plan AC-3 and ADR-002 decision 5 say;
    a stdio server cannot be registered, so the value never reaches a file; only the scan of the declaration in
    P-3 guards it.
  suggested_action: Carry into P-3 a test that a credential-shaped url on a stdio server is refused by the loader's
    scan.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: architecture
  evidence: []
  claim: The validators raise one error per server whose message lists rule names, so the loader of P-3 can read
    the rules only from the text; no test pins that format.
  suggested_action: Decide in P-3 how the loader reads the rules and pin the format there.
  confidence: low
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: standards
  evidence: []
  claim: The staged round-1 records cover an older code_tests digest, so a round 2 of the security reviewer is needed.
  suggested_action: Done in this round.
  confidence: high
- schema: orqlet.finding/v1
  id: F-7
