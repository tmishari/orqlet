findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: The 256 KiB cap is applied after the whole file is read, and doctor and sync now read the three MCP files
    in every project; ADR-002 decision 8 accepts this.
  suggested_action: A bounded read on the port in a later change.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: failure-handling
  evidence: []
  claim: _compare returns no finding when rendered_entry raises, so it fails open; this is unreachable today because
    the loader refuses every combination that rendered_entry refuses.
  suggested_action: Return an error finding for that branch or pin the invariant with a test.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The guarantee that no byte of an MCP file reaches a backup has one exception, a pull-request template target
    that names an MCP path; the README states it and the code does not guard it.
  suggested_action: None now; a later change could refuse such a target.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: This change adds no tenant host, account name or private address; earlier committed files outside it still
    name a real tenant host and a handle.
  suggested_action: The person decides whether to redact them.
  confidence: high
- schema: orqlet.finding/v1
