findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'referenced_variables returns raw input text, which contradicts the module''s own invariant: a credential
    pasted into bearer_token_env_var or written as `${<token>}` comes back verbatim as a variable name, and a later
    phase that prints these names would leak it.'
  suggested_action: Reword the docstring; in P-4 use the result only for comparison; add a test with a token-shaped
    string in bearer_token_env_var.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '_is_literal treats any value that contains `${` as a reference, so a credential-named key whose value
    mixes a literal with a reference, such as `"password": "<literal>${X}"`, produces no finding. The planned-proposal
    scan of P-5 runs only this function.'
  suggested_action: Exempt a value only when the whole value is a single reference; add a failing test for the mixed
    case.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'Two shapes with a literal credential pass the key rule: hyphenated key names such as `x-api-key`, `api-key`
    and `private-key`, and inline maps (a one-line TOML inline table or a YAML flow map).'
  suggested_action: Normalise `-` to `_` before the word test; handle inline maps or rely on P-4's structured check
    and say so.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: The default-form branch of _REFERENCE is bounded but not possessive, so text such as `${a:-` repeated costs
    up to about 4000 steps per start, and referenced_variables has no input cap of its own; this is reasoning, not
    a measurement.
  suggested_action: Make the optional group atomic, add the string to the timing tests, and apply P-4's caps first.
  confidence: low
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: failure-handling
  evidence: []
  claim: _collect_references stops silently at depth 32. P-4 refuses nesting above 16, so it is unreachable in the
    planned flow, but no test covers the limit.
  suggested_action: Add a test for the depth limit.
  confidence: high
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: correctness
  evidence: []
  claim: Ordinary prose such as 'Basic configuration' or 'Bearer authentication' matches the Basic or Bearer rule,
    which could make a prose field in the declaration fail init, upgrade or sync.
  suggested_action: Add a test that records the intended behaviour, whichever way it goes.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: 'Two things need tests in the phase that wires them in: a JSON key with `\uXXXX` escapes defeats the pair
    rule (decoded values are scanned at the call sites), and the tenant name cisco-cxe.atlassian.net is now in one
    more committed file.'
  suggested_action: P-4 and P-5 scan decoded text, with tests; consider whether the tenant name belongs in committed
    text.
  confidence: medium
