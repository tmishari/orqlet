findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] For a stdio server identity.url is not validated at all: the code passes the real url and then
    drops the address rule, so any value, including user information or a variable reference, is accepted.'
  suggested_action: Pass an empty address for stdio, or refuse a url on a stdio server, and test a credential-shaped
    address on a stdio server.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The guarantee that messages hold no value covers the validator text and the hidden input, not
    the location of an error, which can hold a raw key of a free-form map; the module docstring says every message.'
  suggested_action: Narrow the docstring and keep the loader criterion of P-3 (a credential-shaped key must not
    appear in any output).
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: A server with auth.mode none that is not registered has no backend_identity rule, so a shared-account label
    can be declared for it.
  suggested_action: The person decides whether an unregistered none server may carry a free-text label.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The contract accepts any literal https host, including an internal name; the closed table of the loader
    of P-3 restricts it.
  suggested_action: None in P-2; keep the table check before anything is rendered.
  confidence: high
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: The test record is claimed evidence; the reviewer could run nothing.
  suggested_action: Re-run the checks in CI before merge.
  confidence: high
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: One test constant is a URL with a literal user and password pair; it is an obvious placeholder.
  suggested_action: Optionally assemble it at run time.
  confidence: medium
