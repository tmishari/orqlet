findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'A quoted literal under a credential-named key is not reported when its first character is `{` or `[`:
    _is_literal strips quotes and then treats a leading bracket as a nested structure, although a JSON pair value
    is always a quoted string. Traced by hand, not run.'
  suggested_action: Decide literal versus nested from whether the value was quoted and add cases for the JSON, TOML
    and YAML styles.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: 'Some scan rules are narrower than the module''s own normalisation: query names have no `-` to `_` mapping,
    the Bearer and Basic words are case-sensitive and need a digit, `=`, `+` or `/`, and the token lookbehind skips
    a token that follows a letter, digit or underscore.'
  suggested_action: Normalise hyphens for query names and consider case-insensitive scheme words; state the limits
    in the README.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: find_literal_credentials scans raw text line by line, so JSON escapes, a value on the next line, a TOML
    multi-line string split by a backslash and inline tables are not matched on the raw text; decoded values are
    a duty of the call sites, and no test combines escapes with the scan.
  suggested_action: Add acceptance criteria and tests in P-4 and P-5 for decoded string values, one JSON-escaped
    token and one inline table.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: referenced_variables returns text as written, including a token pasted into bearer_token_env_var (documented
    and tested), and its reference pattern can cost up to about 2048 steps per start; it relies on the caller's
    caps.
  suggested_action: P-4 applies the caps before calling and tests that no output contains a token placed in bearer_token_env_var.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: standards
  evidence: []
  claim: 'One regex exceeds the bound of ADR-002 decision 7 (no repetition above 2048): _LINE_KEY uses a leading
    blank run of 4096 and an unbounded tail; it is harmless because the line is cut to 4096 and the pattern is fully
    matched.'
  suggested_action: Align the pattern with the ADR or note the exception.
  confidence: high
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The added plan.yaml names the tenant cisco-cxe.atlassian.net and the handle @tmishari. They are not credentials;
    the tenant name is already in ADR-002 at base.
  suggested_action: The person confirms that the name may stay in a committed plan; use a placeholder if the repository
    becomes public.
  confidence: high
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The staged change edits the approved design manifest (EC-20 manual, as_is_ref re-pointed) and the plan's
    own self-check records that a renewed design approval is needed and not given, while the plan header says approved.
  suggested_action: The person decides on re-approval; this is for the person and the architecture reviewer.
