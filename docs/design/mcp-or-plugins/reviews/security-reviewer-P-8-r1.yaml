findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: After P-8 the architecture document still describes base MCP entries as read-only, and its 24.4 example
    registers Claude Code while its own comment says such a server is not registered, labels the unenforced entry
    client-enforced-editable (Cursor's label was flipped from none without a reason) and keeps a backend_identity
    placeholder that invites a service identity.
  suggested_action: Qualify T1 and section 15.1 for the first release, use none for an entry that restricts nothing,
    and fix the placeholder.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: The proposal and ORQ-I534 end only when the whole .mcp.json equals the render; the README says merging
    ends it, and the finding is printed on runs that write nothing.
  suggested_action: State that the proposal persists while the file differs and give the way out.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: 'Read literally, only validate integrations checks the rules is false: doctor, sync and upgrade run the
