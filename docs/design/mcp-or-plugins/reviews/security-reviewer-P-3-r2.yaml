  evidence: []
  claim: '[minor] The declaration is scanned as raw text, so a YAML escape or an escaped line break hides a credential;
    the MCP-file path scans a re-serialisation, so the two paths are asymmetric.'
  suggested_action: Scan a re-serialisation of the loaded data or state the YAML limit in the ADR and the README.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] ORQ-E535 and ORQ-E536 print the declared server id, against the docstring that a finding never
    repeats a value; the id is at most 32 characters of a-z, 0-9 and hyphen and is the public suffix of the entry
    name, and no test declares an id that reads like a secret.'
  suggested_action: Name the server by position, or amend the docstring and ADR-002 decision 9.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: failure-handling
  evidence: []
  claim: The size cap is applied after the whole file is read, now on the default path of doctor and sync.
  suggested_action: A bounded read in the port is a repository-wide choice for the person.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The closed key list is a deny-list of four names, nothing is checked without a declaration beyond the warning,
    and the Codex file gets the raw scan only; ADR-002 decisions 6, 7, 11 and 12 say so.
  suggested_action: Check that the P-8 README repeats these limits.
  confidence: high
