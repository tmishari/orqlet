- The reviewer's tools are read-only by advice, not by enforcement; it had no shell, so it ran no check and recomputed
  no digest.
- Quote digests were not computed, so each finding rests on reading and is an observation that never blocks.
- The model that ran the reviewer is not observed.
- The packet snapshot held the design-phase review notes of this task, so the reviewer was not fully context-clean
  (the known gap of the harness2-fit ADR-002).
- The reviewer ran in the same client as the Coder, so independence is I1, not I2.
- 'Round 2 followed a rework of the loader, the validator and tests; the reviewers read the staged snapshot and
