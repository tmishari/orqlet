findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: The authorization-literal and credential-key-literal rules can be evaded by more than 64 blanks between
    a key and its colon or by a newline between key and value; the bound is in _AUTHORIZATION, _LINE_KEY and _PAIR
    and no test pins it. Read, not executed.
  suggested_action: Accept as the floor, not a guarantee, of ADR-002 decision 7 and say so in the README; optionally
    pin the limit or flag a long run of blanks before a colon.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The raw-text scan cannot see credential keys or separators written with JSON escapes, for example `Authoriz\u0061tion`
    or `\u0026` for `&` in a query; the decoded call in P-4 closes this for values, and the ADR says values, not
    keys.
  suggested_action: In P-4 scan decoded keys as well, for example by re-serialising the parsed mapping, and add
    tests with an escaped key and an escaped ampersand.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: The credential-key rule looks only at the first key on a line and at JSON-style quoted pairs; TOML inline
    tables and YAML flow mappings with a credential-named key are not examined, for example `env = { API_KEY = "..."
    }`.
  suggested_action: P-4 scans .codex/config.toml too, so add unit cases for inline tables and flow mappings or state
    the limit in the README.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: referenced_variables can return a pasted secret verbatim (documented and tested), and its reference pattern
    costs roughly the string length times 2048; only 2048 characters are timed, so P-4 must cap strings first.
  suggested_action: In P-4 cap strings at 2048 before calling it, never print its result and add a test for both.
  confidence: high
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: docs
  evidence: []
  claim: 'The code deviates from the ADR text it implements: ADR-002 decision 7 says no repetition above 2048 and
    three patterns use up to 4096. The module comment documents the choice; the ADR was not updated.'
  suggested_action: Update ADR-002 decision 7 in a later phase or in this one.
  confidence: high
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: 'The scan''s coverage lists are closed and short and match the ADR, so this is not a defect: the token
    prefixes omit AIza, sk_live_, glpat- and PEM private-key headers; the query names omit auth and client_secret;
    the key words omit credential, bearer, pwd and cookie; and an all-letter Basic value is accepted.'
  suggested_action: State these limits in the README.
  confidence: high
