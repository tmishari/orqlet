findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: Step 3 of the README states an absolute never about copying a byte of an existing .mcp.json into a backup,
    and about 70 lines later the same section describes a profile configuration in which a backup does copy it.
  suggested_action: Qualify step 3 in place and point to the case below.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'In the code .codex/config.toml gets only the raw-text credential scan: no closed key, no ${ and no orqlet-
    name check. The README wording about closed keys in any entry of an MCP file can lead a Codex team to think
    those checks cover its file.'
  suggested_action: Add a limit that says the Codex file gets the scan of its raw text only.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: The test record marks the review-based criteria AC-1, AC-2 and AC-4 as pass before any reviewer returned,
    and the plan completion line names Python 3.12 while the record shows the full suite on 3.14 only.
  suggested_action: Record the review-based criteria as not run until the review records exist and state per interpreter
    which files ran.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The record scan matches only a dotted at-sign domain and .atlassian.net hosts, skips a dangling link without
    failing, and may treat a linked folder differently across Python versions; P-9 relies on it plus a reviewer.
  suggested_action: Optionally widen the address rule and fail on any link under the records folder.
  confidence: medium
