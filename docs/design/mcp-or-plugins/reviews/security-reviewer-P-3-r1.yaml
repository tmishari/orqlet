findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The 256 KiB cap is applied after the whole file is read, and doctor and sync now read three MCP
    files on every run.'
  suggested_action: A bounded read in the port is a repository-wide choice for the person; the registry loader has
    the same pattern.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] A PermissionError raised while looking up an MCP file path is not turned into a finding, so doctor
    and sync end with an internal error and exit 70 for a directory that cannot be searched.'
  suggested_action: Catch OSError next to FileSystemError and add a test.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The declaration (YAML) gets only a raw-text scan; a credential written with a YAML escape is not
    found, and no test covers it.'
  suggested_action: State the limit in the README or scan a re-serialisation.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: No test shows that a scan finding in the url of a stdio server is an error.
  suggested_action: Add the case.
  confidence: high
- schema: orqlet.finding/v1
