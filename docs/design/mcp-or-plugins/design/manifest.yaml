- id: EC-11
  surface: public-api
  action: change
  identity: orqlet.application.usecases.capabilities.IMPLEMENTED_COMMANDS
  expected_after:
    kind: declaration
    value: The set of implemented commands gains validate integrations. The extractor reads an assignment by name only, so
      it cannot see the new entry.
  verification: manual
- id: EC-12
  surface: persisted-schema
  action: change
  identity: orqlet.integrations/v1
  expected_after:
    kind: declaration
    value: 'The contract is tightened in place and keeps its identifier (the person decided this on 2026-10-26, Q-13). The
      rules are validators that call name_problems in the domain, not field patterns and not new enumerations, so the committed
      JSON Schema does not change: a server id matches ^[a-z][a-z0-9-]{0,31}$, is unique, and registration.name equals orqlet-<id>;
      env_refs holds exactly one name for env-ref and none for client-native-oauth, a name matches ^ORQLET_MCP_[A-Z][A-Z0-9]*(_[A-Z][A-Z0-9]*)*$
      with at most 48 characters and belongs to one server; identity.url is a literal https address without user information,
      query, fragment or ${; command and package contain no ${; backend_identity is user-oauth with client-native-oauth and
      user-token with env-ref; auth mode none is refused for a registered server; enforced_by server is refused in registration
      and in every per_client entry; a capability_tier other than read cannot have enforced_by none; clients includes every
      client with register true; a stdio server cannot be registered; verification verified is refused. Whether the closed
      table enables the mode for the address and client is a check of the loader, not a contract rule. The existing valid
      fixture is updated. The file orqlet.integrations.v1.json is unchanged.'
  verification: manual
- id: EC-13
  surface: persisted-schema
  action: add
  identity: generated MCP file .mcp.json
  expected_after:
    kind: declaration
    value: '.mcp.json, owner seeded and no file class, written by the Claude Code adapter only when .orqlet/integrations.yaml
      exists, a server is registered for Claude Code and the profile enables it. It holds one orqlet-<id> entry per registered
      server with the closed key set type and url; in this change only an Atlassian client-native-oauth entry, with no credential
      field. A file that already exists and differs gets a proposal that holds the wanted text only: the bytes of the existing
      file are never copied (see EC-14). The file is recorded in the lock when Orqlet wrote it. .cursor/mcp.json and .codex/config.toml
      are specified and built by the release that enables them.'
  verification: manual
- id: EC-14
  surface: persisted-schema
  action: change
  identity: proposal files under .orqlet/proposals for the MCP file paths
  expected_after:
    kind: declaration
    value: 'A proposal for .mcp.json, .cursor/mcp.json or .codex/config.toml is a unified diff against nothing: it holds the
      text that Orqlet wants and none of the bytes of the existing file. The one place that builds a proposal, _Builder._propose
      in orqlet.domain.changeplan, passes no existing bytes when the path is the MCP file of one of the three clients, whichever
      branch calls it. Proposals for other paths are unchanged. The guard is private and has no public name.'
  verification: manual
- id: EC-15
  surface: trust-boundary
  action: add
  identity: the three boundaries B-1 to B-3 of the context view
  expected_after:
    kind: declaration
    value: 'B-1 to B-3: addresses and, in a later release, variable names in committed files; the user''s own credential from
      a variable or a sign-in; the Atlassian remote server reached with the user''s own credential. No shared identity; the
      address is a literal on a closed table in the tool; Miro gets no entry from Orqlet; an unattended surface uses the account
      of the one user who started or owns it (the person''s answer to Q-12), which V-10 verifies.'
  verification: manual
- id: EC-16
  surface: security
  action: add
  identity: credential-handling files on the security globs
  expected_after:
    kind: paths
    value: src/orqlet/adapters/clients/claude_code.py, src/orqlet/adapters/render/mcp.py, src/orqlet/application/contracts/integrations.py,
      src/orqlet/application/usecases/diagnose.py, src/orqlet/application/usecases/integrations_source.py, src/orqlet/application/usecases/render_all.py,
      src/orqlet/application/usecases/upgrade.py, src/orqlet/application/usecases/validate_integrations.py, src/orqlet/domain/changeplan.py
  verification: extractor
