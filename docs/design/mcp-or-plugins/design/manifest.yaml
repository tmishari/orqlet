- id: EC-12
  surface: public-api
  action: change
  identity: orqlet.application.ports.instruction_adapter.RenderRequest
  expected_after:
    kind: declaration
    value: The frozen dataclass gains one optional field, integrations, typed Integrations | None with the default None. The
      class line, which is all that the extractor reads, does not change, so the extractor cannot see this edit.
  verification: manual
- id: EC-13
  surface: persisted-schema
  action: change
  identity: orqlet.integrations/v1
  expected_after:
    kind: declaration
    value: 'The contract is tightened in place and keeps its identifier (the person decided this on 2026-10-26, Q-13). The
      rules are validators that call name_problems in the domain, not field patterns and not new enumerations, so the committed
      JSON Schema does not change: a server id matches ^[a-z][a-z0-9-]{0,31}$, is unique, and registration.name equals orqlet-<id>;
      env_refs holds exactly one name for env-ref and none for client-native-oauth, a name matches ^ORQLET_MCP_[A-Z][A-Z0-9]*(_[A-Z][A-Z0-9]*)*$
      with at most 48 characters and belongs to one server; identity.url is a literal https address without user information,
      query, fragment or ${; command and package contain no ${; backend_identity is user-oauth with client-native-oauth and
      user-token with env-ref; capability_tier other than read cannot have enforced_by none in registration or in any per_client
      entry; clients includes every client with register true; a stdio server cannot be registered; verification verified
      is refused in this release. Whether the mode is enabled for the address and client is a separate check against the table
      in the domain, not a contract rule. The existing valid fixture is updated. The schema file orqlet.integrations.v1.json
      is unchanged.'
  verification: manual
- id: EC-14
  surface: persisted-schema
  action: add
  identity: generated MCP files
  expected_after:
    kind: declaration
    value: .mcp.json, owner seeded, written only when .orqlet/integrations.yaml exists and the profile enables Claude Code,
      holding one orqlet-<id> entry per declared server with a closed key set; in this change only an Atlassian client-native-oauth
      entry, with no credential field. Existing MCP files are refused when untracked or flagged by the scan, before any proposal;
      lock entry; later changes arrive as proposals under .orqlet/proposals. .cursor/mcp.json and .codex/config.toml are specified
      and built by the release that enables them.
  verification: manual
- id: EC-15
  surface: trust-boundary
  action: add
  identity: the three boundaries B-1 to B-3 of the context view
  expected_after:
    kind: declaration
    value: 'B-1 to B-3: addresses and variable names in committed files; the user''s own credential from a variable or sign-in;
      GitHub and Atlassian remote servers reached with the user''s own credential. No shared identity; the address is a literal
      on a closed table in the tool; Miro gets no entry from Orqlet; an unattended surface uses the account of the one user
      who started or owns it (the person''s answer to Q-12), which V-12 verifies.'
  verification: manual
- id: EC-16
  surface: security
  action: add
  identity: credential-handling files on the security globs
  expected_after:
    kind: paths
    value: src/orqlet/domain/mcp_credentials.py, src/orqlet/adapters/render/mcp.py, src/orqlet/application/contracts/integrations.py,
