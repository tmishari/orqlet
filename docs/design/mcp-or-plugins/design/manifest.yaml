  schema: orqlet.self-check/v1
  checked_against:
    role: architect
    phase: design
  checks:
  - what: AS-IS accepted by the person
    how: the person chose 'Yes, I accept it' in conversation on 2026-10-26 and answered Q-7 to Q-11; Q-12 to Q-14 were answered
      the same day; recorded in the ledger and in the AS-IS self_check. On 2026-10-28 the person chose to write the design
      again from scratch (conversation, not a merge); the AS-IS file was not changed (its hash is the one in as_is_ref)
    result: pass
  - what: standards read
    how: 'orqlet standards for --phase design --role architect (15 rules, applicable_rules_hash as bound) and for the path
      families of the scope: src/orqlet/application/usecases/integrations_source.py (10 rules), src/orqlet/adapters/render/mcp.py
      (9), src/orqlet/domain/mcp_credentials.py (9), README.md (3)'
    result: pass
  - what: cited code re-read at the base revision
    how: every code line that the design cites was read in e607fe5; the facts that differ from the AS-IS binding are listed
      in considerations.md, section 'What changed on main since the AS-IS was written'
    result: pass
  - what: no library or tool outside the AS-IS file decides anything
    how: orqlet resources list says no link is registered; the design adds no dependency, uses no TOML reader and needs no
      web lookup, so no evidence/web file was added
    result: pass
  - what: every file the manifest names is hashed
    how: sha256 of each file, the same hash that orqlet evidence hash prints, written by the script that builds this manifest
    result: pass
  - what: considerations.md is hashed (it has no artifact kind)
    how: sha256 9ab2dd66d433c76e4419a51423966491a54407bf7e1efe3ff9bed2e05b7247f2; recorded here because the design-set contract
      has no artifact kind for it
    result: pass
  - what: expected changes written from the extractor's own signatures
    how: the signatures of EC-1 to EC-9 were produced by orqlet.domain.python_api.extract_module_api on the proposed definitions;
      EC-10 to EC-15 are manual because the extractor cannot see them; EC-16 is read by the extractor from the security globs
    result: pass
  - what: design validated
    how: orqlet validate design docs/design/mcp-or-plugins/design/manifest.yaml
    result: pass
  - what: design reviewed by both typed reviewers
    how: three rounds of both typed reviewers; every verdict was PASS with no blocking finding (architecture 4, 3 and 0 major;
      security 2, 2 and 0 major); notes docs/design/mcp-or-plugins/reviews/architecture-reviewer-design.md and security-reviewer-design.md;
      the minor text fixes that followed round 3 were not seen by a reviewer
    result: pass
  unverified:
  - 'No reviewer had a working shell: none ran orqlet standards, orqlet validate design, a hash check, the import-linter or
    a test; the author did, and the hashes in this manifest are the ones that orqlet evidence hash prints.'
  - The text fixes that followed round 3 (EC-13 wording, three diagram edges, the test placement in the build order, the guard's
    path comparison, the decoded scan of entry names, the absent-branch information finding, the scope of the rule text, check
    counts and clients) were not seen by a reviewer.
