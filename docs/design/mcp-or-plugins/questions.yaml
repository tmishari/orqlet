  raised_by: researcher
  phase: research
  category: requirement
  text: The request says it may be better to use plugins and not MCP servers. Does that mean Orqlet's
    generated setup (skills, agents, rules, MCP entries) packaged as native client plugins instead of
    committed files, the integrations (GitHub, Jira, Confluence, Miro) delivered as plugins or connectors
    instead of MCP servers, or both?
  why: Research records facts for the chosen reading; the others are not examined.
  options:
  - Orqlet's generated setup packaged as native client plugins instead of committed files
  - the integrations delivered as plugins or connectors instead of MCP servers
  - both
  blocks:
  - research
  status: answered
