findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: security
  rule_ref: ORQLET-SEC-003; ADR-002 decision 3
  evidence:
  - kind: quote
    path: src/orqlet/workflow/skills/orqlet-plan/references/phase-contract.md
    lines: '26'
    revision: 9b978bd87f50619107c002d8608b495cb6027a6f
    quote_sha256: 78600f5337c0e6d48fb509e319c39023eab98771cb033b86a37427f1841d2597
  - kind: quote
    path: docs/design/phase-skill-contracts/design/adr-002-project-context-read-at-execution-time.md
    lines: '28'
    revision: 9b978bd87f50619107c002d8608b495cb6027a6f
    quote_sha256: e6f176f057d6171ac8c0117ecf73593b95416193b8e7eb0dcc92aa1315056347
  - kind: absence
    searched:
    - src/orqlet/workflow/skills/orqlet-onboard/skill.md
    method: Searched the staged onboard text for "connection string" and "token" - 0 matches. Staged line 19 says
      "Never open a file that holds secrets (`.env` files, private keys, `.npmrc`, `.pypirc`, `.netrc`, cloud
      credentials), and never copy a credential." and staged line 30 says "A credential and every expression the CI
      system or the shell expands ... become named placeholders; say so." SECRET_PHRASES in
      tests/unit/test_workflow_skill_contracts.py pins "never copy a credential" only.
    revision: caa5a04191c734a49f588a3b5b17643f5a1c3ff8
  claim: Onboard's credential rule is narrower than ADR-002 decision 3 and phase-contract.md, which also name a token and
    a connection string with a password. Onboard carries no phase-contract.md, so its own text is the only rule it has.
    A literal connection string with a service-container password is common in CI test steps; a reader could treat it
    as test configuration rather than a credential and copy it into AGENTS.md, which every later session loads and
    sends to the model vendor. Not blocking - "credential" arguably covers it, the person sees the exact AGENTS.md
    change before each entry is written, and the value was already in the repository.
  suggested_action: In onboard's Boundaries, write "never copy a credential, a token or a connection string with a
    password", and add that phrase to SECRET_PHRASES.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  evidence:
  - kind: quote
    path: src/orqlet/domain/blocks.py
    lines: 26-27
    revision: 9b978bd87f50619107c002d8608b495cb6027a6f
    quote_sha256: 4bd89931a1dd78010f3a1115eeb1cf6fc5f3a2376a361b31735833e1786449b8
  - kind: quote
    path: src/orqlet/domain/blocks.py
    lines: 70-73
    revision: 9b978bd87f50619107c002d8608b495cb6027a6f
    quote_sha256: 46b59ed34c8e7f1dcc792ee3559159ca1bfe2d52826e5493ae7f9157abc15767
  claim: Onboard writes the source path and lines into AGENTS.md outside the code fence (staged line 30, "... alone in a
    fenced block whose fence is longer than any backtick run in it, and its source path and lines; copy nothing
    else."). No character rule applies to them - the argument rule of BC-40 covers values placed in commands, and the
    warning list covers the command only - and file names are controlled by contributors. Marker injection is
    unlikely, because the parser matches a marker only as a whole line outside a fence, and an unclosed fence makes
    upgrade refuse the file. This follows ADR-002 decision 6 as written, so it is not a deviation from the design.
  suggested_action: Optional, in a later design revision - hold the source path to the character set of BC-40, or warn
    when it falls outside it.
  confidence: low
