- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: correctness
  evidence:
  - kind: absence
    searched:
    - src/orqlet/workflow/skills/orqlet-research/references/phase-contract.md
    method: Read lines 37, 41 and 49 of the packet snapshot - line 37 "Such a value with anything but letters, digits,
      ... stops the skill - ask.", line 41 "Resolve a composed revision with `git rev-parse --verify` and single-quote
      it.", line 49 "changed the approved files (`git diff --quiet` from its first parent exits 1)". No sentence says
      whether the character rule applies to a value as taken or as composed.
    revision: e405b34df4a3f99e8e6abec15a50d5b07fc9c634
  claim: Rework round 3 widened the character stop from "a path or glob" to every value from the person, an artifact
    or a cited file. This closes security finding F-1 of round 2. The Approved check still asks for a composed
    revision (the merge's first parent, written like '<merge>^1' or '<merge>~1'). That form contains a character the
    rule does not allow. An agent that applies line 37 to the composed form stops at the Approved check of plan and
    implement with "ask", and no answer from the person can change the character. The failure is closed, not open. A
    workaround exists - line 49 already has the agent show the merge's parents, which git prints as hex ids. But the
    text does not say whether the rule applies to the value as received or as composed. ADR-003 decision 4 has both
    sentences, so this is a tension that the round-3 rework exposed, not a departure from the design.
  suggested_action: Ask the person whether to say, within the word budget (see F-3), that the character rule applies
    to the value as taken and that a parent is used as the hex id git prints. Otherwise add it to the open
    design-review findings for the later design revision. Keep the pinned BC-14 phrase `git rev-parse --verify`.
  confidence: low
