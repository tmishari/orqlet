    revision: 43c21cfc8f4683b9586e7960a3d61cf6182f8050
    quote_sha256: 9fb09074a18573be5cfc2a9cf5e489555f45b0ada0ba6a74f30037c923ec6b24
  - kind: quote
    path: src/orqlet/workflow/skills/orqlet-implement/references/phase-contract.md
    lines: '37'
    revision: 43c21cfc8f4683b9586e7960a3d61cf6182f8050
    quote_sha256: a4b146f648d2e758ae59f0b5009c5420969cc35361d4f2c972755305ef77b24c
  - kind: absence
    searched:
    - src/orqlet/workflow/roles/orqlet-tester.md
    - tests/unit/test_workflow_role_prompts.py
    - src/orqlet/workflow/skills/orqlet-implement/skill.md
    method: >-
      Read the staged tester.md in full and searched it for single-quoted, quote, "$NAME", test -n, environment,
      placeholder, secret and credential; none appears. test_workflow_role_prompts.py line 230 states that "the tester
      carries no references/phase-contract.md". Implement skill line 31 starts the tester at step 3, before the
      Coder's checks at step 6 (line 34).
    revision: 5d65989e37840d6d0c4242c8586e4e7d24f23d8b
  claim: >-
    From this phase on, the tester is the one role that runs a command found in a CI file. It builds `orqlet evidence
    cite` and `git diff --quiet HEAD -- <cited files>` from the plan's completion entries (tester.md line 14). Its
    prompt copies the warning list of phase-contract.md line 33 but none of the rules next to it in that file - an
    artifact value goes into a command single-quoted and a path with an unexpected character stops the work (line
    37); a placeholder is filled only from the person's environment, a secret goes in as "$NAME" and is checked only
    with `test -n`, no environment value is printed and no secret is asked for (line 26); output is summarised
    without credentials (line 31). Line 16, which this phase did not change, still asks the tester to report "what
    they printed". The tester starts at implement step 3, before the Coder's own checks, so it cannot rely on the
    Coder having applied those rules. The warning list already catches the most dangerous parts of a built command
    (`$(`, a backtick, `;`, `&&`, `||`, a redirection), and the person approves the plan. What remains is a tester
    that asks for a secret, prints an environment value, or puts raw output holding a credential into its report.
    ADR-002 line 42 says the tester "applies the same checks"; BC-26 names only the re-cite, the working-tree check
    and the warning list, and the phase meets BC-26.
  suggested_action: >-
    Same choice as F-1. Either add to the tester prompt "Put every value from the plan into a command as one
    single-quoted argument, and stop on a path with any character other than letters, digits, `.`, `_`, `-`, `/`,
    `*` or `?`. Pass a secret only as "$NAME" and check it only with `test -n "$NAME"`. Never print an environment
    value or ask for a secret. Report output as a summary without credentials.", pin it in
    test_workflow_role_prompts.py and change line 16 to "a summary of what they printed"; or record it together with
    SEC5-3 for the design revision.
  confidence: medium
