- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: security
  rule_ref: ORQLET-SEC-003; ADR-002 decision 3
  evidence:
  - kind: quote
    path: src/orqlet/workflow/skills/orqlet-implement/references/phase-contract.md
    lines: '26'
    revision: 43c21cfc8f4683b9586e7960a3d61cf6182f8050
    quote_sha256: 78600f5337c0e6d48fb509e319c39023eab98771cb033b86a37427f1841d2597
  - kind: quote
    path: src/orqlet/workflow/skills/orqlet-implement/references/phase-contract.md
    lines: '27'
    revision: 43c21cfc8f4683b9586e7960a3d61cf6182f8050
    quote_sha256: 520709b63435603216d3e6e3b91730a09d64c891d0f4a00997f2087d400a8494
  - kind: absence
    searched:
    - src/orqlet/workflow/roles/orqlet-inventory.md
    - src/orqlet/workflow/roles/orqlet-tracer.md
    - src/orqlet/workflow/skills/orqlet-research/references/as-is-format.md
    - src/orqlet/workflow/skills/orqlet-research/skill.md
    - src/orqlet/application/usecases/validate_as_is.py
    - src/orqlet/application/usecases/evidence_cite.py
    method: >-
      Read both staged roles and the research skill in full. Searched as-is-format.md for credential, secret, token,
      password, .env, placeholder, private, key, .npmrc and .netrc; the only hits are the web-evidence lines about
      "Data class" (81, 87). validate_as_is.py checks a fact statement only for word count and advice-like words
      (lines 154, 167). evidence_cite.py scans for credentials only under docs/design/<task>/evidence/web/ (lines 27,
      89-111).
    revision: 5d65989e37840d6d0c4242c8586e4e7d24f23d8b
  claim: >-
    Line 8 of both staged researcher roles (inventory.md and tracer.md) now asks the role to report "the commands that
    CI and build files define" and the instruction files as facts. These subagents receive only the area's paths, the
    request and the AS-IS format (line 6 of each role; research skill line 30). Neither role, and not as-is-format.md,
    carries the rules that phase-contract.md lines 26-27 give the main agent - copy no credential, turn every expanded
    expression into a named placeholder, and never open .env files, private keys, .npmrc, .pypirc, .netrc or cloud
    credential files. A CI line with a literal token, or a tracked .npmrc in the area, can therefore be quoted word
    for word into a fragment's statement. That text reaches the main conversation, and a fragment the agent keeps is
    committed under docs/design/<task>/ (research skill line 20). No code check scans fact statements or fragments.
    Three things lower the risk - the main agent has the rule when it writes as-is.md, a fact from an untracked file
    cannot be cited, and the baseline's "Never put secrets in code, logs or messages" applies where the client loads
    AGENTS.md into a subagent, which is not observed (U-11). BC-26 does not ask for these rules, so the phase meets
    its criteria; the gap is in the design.
  suggested_action: >-
    Ask the person to choose. (a) A plan amendment against BC-26 - add one sentence to both researcher prompts, such
    as "Copy no credential: write an expression that the CI system or the shell expands, or a secret value, as a
    named placeholder, and open no file that holds secrets (.env files, private keys, .npmrc, .pypirc, .netrc, cloud
    credential files)"; pin it in tests/unit/test_workflow_role_prompts.py, rewrite the six goldens and rebuild
    MANIFEST.json. (b) Record it for the design revision that takes up the open round-5 findings. With either option,
    the research skill could also say that the main agent applies the credential rule of phase-contract.md to a
    fragment before it keeps it.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: security
  rule_ref: ORQLET-SEC-003; ADR-002 decision 3
  evidence:
  - kind: quote
    path: src/orqlet/workflow/skills/orqlet-implement/references/phase-contract.md
    lines: '26'
    revision: 43c21cfc8f4683b9586e7960a3d61cf6182f8050
    quote_sha256: 78600f5337c0e6d48fb509e319c39023eab98771cb033b86a37427f1841d2597
  - kind: quote
