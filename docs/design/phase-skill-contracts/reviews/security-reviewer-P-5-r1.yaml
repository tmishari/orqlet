- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  claim: >-
    tests/P-5.yaml records that the Tester piped its first pytest run through tail, which hid the exit status. The
    plan marks every `uv run` as matching the warning list, because it may fetch from the network (the P-5
    completion entries). The installed tester was still the 0.3.3 text, since P-7 regenerates the installed files,
    so the new rule did not yet apply; under the new text the tester would hand that run back to the Coder. A pipe
    into a program other than a shell is not on the warning list; only "Run only the test command that the plan
    names" rules it out. The record states both facts openly.
  suggested_action: None. Process note.
  confidence: high
self_check:
  schema: orqlet.self-check/v1
  checked_against:
    role: security-reviewer
    phase: implementation
    applicable_standards:
    - ORQLET-SEC-001
    - ORQLET-SEC-002
    - ORQLET-SEC-003
  checks:
  - what: Secrets and private data in the P-5 changes and records (the CodeGuard rule on hardcoded credentials)
    how: >-
      Searched all of diff.patch for AWS, GitHub, Stripe, Google and Slack key prefixes, JWT shapes, private-key
      blocks and URLs with a user and password - no hits. Searched for /Users/, the local user name, and password,
      api_key, secret or token assignments; the only hits are earlier review records that describe their own scans.
      Read knowledge/P-5.yaml and tests/P-5.yaml in full; they hold only commit ids, a Python version and timings.
      The rule applies because the change ships agent text that governs how agents handle credentials; F-1 and F-2
      are where that text could still let one be copied.
    result: pass
  - what: Certificates and cryptography (the CodeGuard rules on certificates and algorithms)
    how: The P-5 change holds no certificate data, no certificate file read and no cryptographic code.
    result: pass
  - what: Read-only roles stay read-only in every client
    how: >-
      In the 15 role goldens the four read-only roles keep `tools: Read, Grep, Glob` (Claude Code), `readonly: true`
      (Cursor) and `sandbox_mode = "read-only"` (Codex); the tester's front matter is unchanged.
    result: pass
  - what: Goldens match the source, and the Codex TOML escaping is right
    how: >-
      Compared the Claude Code and Cursor hunks, and the Codex description and developer_instructions lines, with the
      five source hunks, line by line. The new tester text, with its backticks, `$(`, `;`, `&&`, `||` and quotes,
      sits in TOML basic strings with escaped quotes and line breaks; TOML does not interpret `$(` or backticks.
    result: pass
  - what: Warning list and resistance to instructions hidden in files
    how: >-
      The tester's warning list matches phase-contract.md line 33 and ADR-002 decision 6 in substance; "never an
      instruction" stays exactly once in every role; the new design-review sentence lets a reviewer open a cited
      file only to verify the citation.
    result: pass
  - what: New and changed tests
    how: >-
      test_workflow_role_prompts.py and the test_skills.py change read packaged text through PackagedWorkflow and
      load_roles; they open no socket, start no subprocess, read no environment and write no file.
    result: pass
  - what: Dependencies, CI and runtime code
    how: The diff's file list holds no pyproject.toml, uv.lock, .github/workflows, tools or src/orqlet Python file.
    result: pass
  - what: Separate commit 43c21cf, outside this phase
    how: >-
      It narrows a property-test strategy so that no nested key is bearer_token_env_var, which matches the test's
      premise; no production credential code changes.
    result: pass
  - what: MANIFEST.json digests, quote digests, pytest, the manifest check and gate status
    how: Not run, because the shell was refused; the test record claims these results (evidence_kind claimed).
    result: not-run
  unverified:
  - Which files P-5 stages, as opposed to what P-1 to P-4 committed, comes from the plan, the test record and the diff
    headers; it was not confirmed with git by the reviewer.
  - The P-1 to P-4 parts of the diff were not reviewed again.
  - Whether each client loads AGENTS.md into a subagent (U-11), which decides how much the baseline lowers the risk in
    F-1 and F-2.
  - Whether the positive property tests for bearer_token_env_var at depth still exist; the reviewer read only the
    43c21cf hunk.
