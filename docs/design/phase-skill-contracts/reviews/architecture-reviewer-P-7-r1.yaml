  instead.
- The packet's diff runs from the merge base to the staged tree, so it also holds P-1 to P-6 and the ledger commits;
  the reviewer judged scope by assigning each path to a phase and did not isolate the staged change with git.
- It did not run upgrade, doctor, the gate or pytest; AC-2, AC-3 and the gate results rest on the test record's claims,
