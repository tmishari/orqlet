  which this phase writes. Against 0.3.3 it changes only the description and adds a paragraph for design reviews; the
  text for an implementation review is the same. Cursor listed the 0.4.0 description when the reviewer was started;
  whether it also loaded the 0.4.0 body in this running session is not observed.
