    revision: e0bdc67692312c9b72664b882f14453eb0e56d80
  claim: >-
    The test record marks AC-7 as pass. The staged index that the gate ran on also holds questions.yaml (Q-18), which
    is outside P-8's file operations, and the record says so itself (tests/P-8.yaml lines 26-29). The gate does not
