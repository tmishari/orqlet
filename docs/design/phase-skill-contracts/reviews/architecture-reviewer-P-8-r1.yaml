findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: architecture
  evidence:
  - kind: absence
    searched:
    - docs/design/phase-skill-contracts/plan.yaml
    - docs/design/phase-skill-contracts/questions.yaml
    - diff.patch
    method: >-
      Read P-8's entry (plan.yaml lines 1262-1343), the answer to Q-11 (questions.yaml line 244), Q-18 (lines
      393-418) and the three staged records. Looked for a plan amendment, or a change to P-8's objective, that names
      the agent as the one who runs the checks or writes the records. None exists; only Q-18 records the change.
    revision: e0bdc67692312c9b72664b882f14453eb0e56d80
  claim: >-
    P-8's objective (plan.yaml lines 1264-1265) and the answer to Q-11 (questions.yaml line 244) say that the person
    runs the session checks and writes one record per check. The staged records were written by the agent, which also
    attempted the checks itself, headless in print mode (V-1.md lines 7 and 23-24). The person's decision is a new
    ledger question, Q-18, not a plan amendment, and each record says "Plan amendment: none requested". Because Q-18 is
    a new question, the ledger rule (phase-contract.md line 51) does not stop on it, although in substance it changes
    what Q-11 answered. ADR-005 decision 5 (line 40) describes V-1 to V-3 as checks "a person runs in a client"; a
    headless print-mode run would not have been that check, even if it had started. The outcome is not affected:
    nothing ran, and Q-11 itself allows "reported as not run".
  suggested_action: >-
    List this as a deviation in the P-8 report and in the pull request description: who wrote the records, that the
    agent attempted the checks headless under Q-18, and that Q-11's "the person runs them" is still unmet. Leave the
    records as they are. If V-1 to V-3 are run later, either a person runs them in an interactive client session, or
    the person decides and records whether a headless run counts as the ADR-005 check.
  confidence: high
