findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: info
  category: security
  rule_ref: plan P-8 AC-2, AC-3; ORQLET-SEC-001 (spirit); AGENTS.md baseline "Handle failures explicitly"
  evidence: []
  claim: >-
    No session ran, so nothing was exposed. But the records also serve as the procedure for any later re-run, and the
    safety measures they describe are weaker than their wording. (a) V-1 step 4 starts Cursor with `--trust --force
    --sandbox enabled` and says itself that the client documentation for these options "was not checked", so what they
    allow is unknown. (b) V-1 step 3 runs Claude Code with `--permission-mode dontAsk` and allows `uv run orqlet`; the
    record notes that this includes commands that write. (c) "Its push address was disabled ... so nothing could reach
    this repository from it" says more than the measure delivers: a disabled push address stops only a plain `git push`
    to that remote, and an agent with a shell can still push to an explicit address or change the remote. (d) Step 6
    detects writes with `git status --short`, which does not list ignored files or anything written outside the copy,
    such as orqlet's journal in the user's data folder. V-3 plans a session with file edits allowed on purpose, so this
    gap would matter there.
  suggested_action: >-
    Nothing to change for this phase. If V-1 to V-3 are run again, read the client documentation for the permission
    options and record what they allow; run without a remote in the copy, or say that only the default push target is
    blocked; detect writes with `git status --short --ignored` and say that writes outside the copy are not detected.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  rule_ref: plan P-8 AC-5; ORQLET-SEC-003
  evidence: []
  claim: >-
    The records keep raw client output and client-side detail out of the repository, as AC-5 requires. V-1 says the raw
    output "stays outside both repositories", but neither V-1 nor Q-18 says where that output is kept, or whether it and
    the throwaway clone at /tmp/orqlet-v-checks were deleted. What AC-5 keeps out of the records (client session
    metadata, sign-in errors) may still be on local disk. This is outside the staged change and was not examined.
  suggested_action: >-
    When P-8 closes, the person deletes the captured client output and /tmp/orqlet-v-checks, or the phase report says
    where they are kept.
  confidence: low
