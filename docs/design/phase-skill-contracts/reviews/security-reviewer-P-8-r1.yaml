      The diff touches six files: three records, the knowledge and test records, and questions.yaml (Q-18 only, which
      the test record says is staged for the snapshot and gets its own ledger commit). No code, test, skill, role,
      installed file, CI file, dependency or lock file changes.
    result: pass
  - what: Code-level risks (authentication, injection, parsing, file system, process, dependencies, logging)
