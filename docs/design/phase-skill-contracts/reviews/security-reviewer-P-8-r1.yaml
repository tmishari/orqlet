      Searched the three staged records, case-insensitively, for /Users/, /home/, ~/, Windows user paths, e-mail
      shapes, AWS, GitHub and Stripe key prefixes, JWT shapes, private-key blocks, Bearer, cookie, session id, provider
      API-key variable names, `export NAME=` and `$NAME` references, password, secret, token and api key. Searched all
      of diff.patch (which also covers Q-18, knowledge/P-8.yaml and tests/P-8.yaml) for /Users/, /home/, the local user
      name, e-mail shapes, key prefixes, JWT, private keys, Bearer, provider names, request, org and uuid ids. Hits were
      only the records' own checklist lines and the phrase "zero input and output tokens", a usage count. The only path
      is /tmp/orqlet-v-checks, with no user name in it. The one quoted client line holds no secret; the 403 is given as
      a summary. No account or provider name appears.
