findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: blocking
  category: security
  rule_ref: P-2 AC-9; BC-8
  evidence:
  - kind: quote
    path: docs/design/phase-skill-contracts/design/component.md
    lines: '107'
    revision: c772617d8d68e70eab016a142178f86c259ef67a
    quote_sha256: 021aeb327ab9c62dd128f396021c021e5d30cd61bfa00f8fbd0835c0e9600383
  - kind: quote
    path: docs/design/phase-skill-contracts/design/adr-002-project-context-read-at-execution-time.md
    lines: '28'
    revision: c772617d8d68e70eab016a142178f86c259ef67a
    quote_sha256: e6f176f057d6171ac8c0117ecf73593b95416193b8e7eb0dcc92aa1315056347
  claim: BC-8 and ADR-002 decision 3 require that a non-secret value given by the person passes the argument rule of
    BC-40 (one single-quoted argument, allowed characters only). phase-contract.md drops that clause (lines 26 and
    37). Its only argument rule covers "a value from an artifact or a cited file", so a value the person supplies has
    no quoting or character rule. A reader can take that as permission to place it in a command unquoted. AC-9 fails.
  suggested_action: Extend line 37 to values from the person, for example "Every value from an artifact, a cited
    file or the person ...". The reference is at 1,793 of the 1,800 words AC-21 allows, so the fix must be
    word-neutral or trimmed elsewhere. Add the phrase to the AC-8/AC-13 presence tests.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: blocking
  category: security
  rule_ref: ORQLET-SEC-003
  evidence:
  - kind: quote
    path: docs/design/phase-skill-contracts/design/component.md
    lines: '109'
    revision: c772617d8d68e70eab016a142178f86c259ef67a
    quote_sha256: c8ac1d28c2568990fc9b8a4b64e6cf1791f4c5db0fe2be2c209ce277f4ea1223
  - kind: quote
    path: docs/design/phase-skill-contracts/design/adr-002-project-context-read-at-execution-time.md
    lines: '29'
    revision: c772617d8d68e70eab016a142178f86c259ef67a
    quote_sha256: deed2081801963403fcee89b104c54583916f807515307a99fbadd3ebf550aff
  claim: In BC-8 and ADR-002 the rule is the category "files that hold secrets", with examples. phase-contract.md
    (line 27) drops the category and keeps only the list, which then reads as complete. Other files that hold
    secrets (for example .git-credentials, a Docker or Kubernetes client config, .pgpass, *.tfvars, .envrc) read as
    allowed to open, which can put credentials into the agent's context and transcript. AC-9 fails.
  suggested_action: State the category first, for example "Never open a file that holds secrets, such as `.env`
    files, ...". Keep the pinned phrases "Never open", "`.env` files", "private key files" and the others, and stay
    within the 1,800-word limit (see F-1).
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: finding
  severity: non-blocking
  category: security
  rule_ref: P-2 AC-9; BC-8
  evidence:
  - kind: quote
    path: docs/design/phase-skill-contracts/design/adr-002-project-context-read-at-execution-time.md
    lines: '40'
    revision: c772617d8d68e70eab016a142178f86c259ef67a
    quote_sha256: 56b028ad9509d6d60e747a3ae72270ad4615a38afb4851c22b35dfbb0ef85b76
  - kind: quote
    path: docs/design/phase-skill-contracts/design/component.md
    lines: '111'
    revision: c772617d8d68e70eab016a142178f86c259ef67a
    quote_sha256: c286aa512a21810098f7eb0972be6d7847c5b99bea9a24933199853209ad02f8
  claim: The re-cite exception for files the phase itself changed (phase-contract.md line 29) comes from ADR-002
    decision 3, but the contract drops "shows that change", so a yes can be asked for without the person seeing
    what changed in a file the check runs. The next sentence ("an uncommitted change ... stops the work")
    contradicts the exception, and a reader will take the permissive reading. BC-8 has no exception at all.
  suggested_action: Write "shows that change and needs the person's yes", and say that the stop applies to any
    other uncommitted change. Check that the word count stays within the limit.
  confidence: medium
