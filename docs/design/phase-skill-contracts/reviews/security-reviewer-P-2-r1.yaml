  - kind: quote
    path: src/orqlet/application/usecases/gate_status.py
    lines: '116'
    revision: c772617d8d68e70eab016a142178f86c259ef67a
    quote_sha256: 003fa84efab365bccc26f47bc645376d5a39d19b3b8d01b774df07facbb14d3e
  - kind: absence
    searched:
    - src/orqlet/workflow/skills/**
    - src/orqlet/application/usecases/review_prepare.py
    method: Searched the packet snapshot for 'gate status', '--phase', 'E451', 'expected' and
      'evaluate_expected_changes'. gate_status.py is the only producer of ORQ-E450 and ORQ-E451, and only when a phase
      is given; no skill step other than the implement NOT_RUN sentence and no review prepare step runs it.
    revision: 2e98721eef0b02256204e9b6e6078aceb8608c9b
  claim: The old implement step 1 ran `orqlet gate status <task> --phase <phase>` and stopped on anything stale (AS-IS
    A-8). That command is the only source of ORQ-E450, ORQ-E451 and ORQ-E453, which report undeclared changes to
    watched security surfaces and require a renewed design approval. The new text runs only `gate status <task>` (no
    --phase) in the input check (phase-contract.md line 43). It names the --phase form only in a NOT_RUN sentence
    that ends "the input check decides everything else" (implement skill.md line 28). The design's own sequence view
    (D-5) still shows the run.
  suggested_action: Either restore an explicit step in implement ("run `orqlet gate status <task> --phase <phase>`;
    ORQ-E450, ORQ-E451 or ORQ-E453 stops the skill for a renewed design approval"), which matches D-5 and A-8, or
    record a ledger question for the person, because ADR-003, ADR-004 and the sequence view disagree.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: security
  claim: The placeholder rule (phase-contract.md line 26) names only "the CI system or the shell" and describes
    dollar-sign syntax, but a Makefile target is a listed source (line 25). Make's $(VAR), GitLab's $[[ ]],
    CircleCI's << >> and Windows %VAR% fall outside the description. This follows BC-8 and ADR-002 word for word, so
    it is a design-level gap, not a deviation of this phase. The literal-credential rule still applies.
  suggested_action: For a later design revision, consider "every expression a tool expands" with examples beyond the
    dollar sign.
  confidence: low
