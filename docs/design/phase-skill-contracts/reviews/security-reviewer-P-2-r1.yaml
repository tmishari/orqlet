    result: pass
  - what: Skill bodies do not loosen the shared rules
    how: Read all four bodies and the implement diff; the gap is F-4.
    result: fail
  - what: Phase P-1 files carried in the diff
    how: Pattern scans only; the three P-1 security rounds were PASS.
    result: not-run
  - what: Test suite and orqlet commands
    how: Not run by the reviewer; the tester's record is evidence_kind claimed.
