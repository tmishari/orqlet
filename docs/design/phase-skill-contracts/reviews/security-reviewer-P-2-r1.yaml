    result: pass
  - what: The goldens equal the source plus the generated header
    how: diff of one golden copy; all 12 golden copies have the same hash.
    result: pass
  - what: AC-9, each BC-8 clause compared with phase-contract.md and ADR-002 decision 3
    how: Read side by side, clause by clause; F-1 and F-2 block, F-3 does not.
    result: fail
  - what: The other BC-8 clauses
    how: Citing lines, invoked files and configuration lines; no credential copied; named placeholders without literal
      double braces; secrets as "$NAME" checked only with test -n; no environment value printed; never asking for a
      secret; research, design, plan and onboard never run a found command; commits shown before the first check;
      re-cite with git diff --quiet HEAD and the untracked check; the warning list applied by implementation; any
      other command only after a yes; commands marked planned or agreed, in placeholder form; never on a file's word;
      output summarised.
    result: pass
  - what: Option injection through revisions
    how: GitOid in the validator's contracts is hex only and the validator runs before any git command; merge commits
      must be full hex ids; paths go after --; allowed characters exclude shell metacharacters.
    result: pass
  - what: Secrets, credentials and certificates in the change
    how: Pattern scan of every added line for AWS, GitHub, Stripe and Google key prefixes, JWTs, private-key blocks,
      URLs with a password, password=, token= and secret=; none found; no certificate data present.
    result: pass
  - what: Banned cryptography
    how: All digests are SHA-256; no other algorithm appears in the change.
    result: pass
  - what: Private data in knowledge drafts, the ledger and review records
    how: Scanned added lines for local paths, user names and email addresses; read knowledge/P-2.yaml and Q-12.
    result: pass
  - what: Tests and fakes, file, process and network access
    how: Searched imports and calls; the tests only read package files; SkillChange rejects an unknown path.
    result: pass
  - what: Dependency and watched-surface changes
    how: File list of the diff; no pyproject.toml, uv.lock, .github/, tools/, .prompts/, client config or
