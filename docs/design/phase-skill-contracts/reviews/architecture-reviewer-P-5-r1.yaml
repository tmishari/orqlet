    method: >-
      Searched the packet snapshot for "43c21cf", "test_mcp_credentials" and "amendment". The only mention of 43c21cf
      is in the staged test record (tests/P-5.yaml). plan.yaml is not in the diff since c59a03a, and the
      questions.yaml hunk adds only Q-12.
    revision: 5d65989e37840d6d0c4242c8586e4e7d24f23d8b
  claim: >-
    Commit 43c21cf changes tests/unit/domain/test_mcp_credentials_properties.py, which is in the file_operations of no
    phase. The plan says "A golden or test outside a phase's list that changes needs a plan amendment", and no plan
    amendment or ledger entry records the change; the only record of the person's choice is a claim in the staged P-5
    test record. The fix itself is correct - `_collect_references` reads `bearer_token_env_var` at every depth, so
    the nested keys of the strategy must leave it out too. The file is not in P-5's staged diff, so P-5 AC-6 holds,
    but the implementation pull request will carry a test change that no approved phase lists, and `gate status
    --phase` cannot see a committed change made between phases.
  suggested_action: >-
    Before the implementation pull request, record the person's decision as a ledger question answered by the person,
    or as a plan amendment, naming commit 43c21cf, the file and the reason (a property-test strategy that could
    generate the reference holder at a nested level). No code change is needed.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: correctness
  evidence:
  - kind: quote
    path: docs/design/phase-skill-contracts/design/adr-004-what-each-phase-produces.md
    lines: '51'
    revision: 43c21cfc8f4683b9586e7960a3d61cf6182f8050
