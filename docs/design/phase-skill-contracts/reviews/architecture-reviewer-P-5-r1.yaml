  - kind: quote
    path: src/orqlet/workflow/skills/orqlet-implement/references/phase-contract.md
    lines: '29'
    revision: 43c21cfc8f4683b9586e7960a3d61cf6182f8050
    quote_sha256: 4e01ea537bccd14541c1a4cb8472fd2ac4ae2df8bd11c7ce16c8a4298b93ff90
  claim: >-
    The staged tester prompt (orqlet-tester.md line 14) says the tester runs the test command "after the same checks
    the Coder makes" and stops "when a hash differs from the plan's or a cited file has such a change". The Coder's
    rule lets a change made by the phase's own operations go on after the person's yes. So when a phase's own file
    operations change a cited file, the tester stops where the Coder may go on. This is what ADR-004 decision 7 says,
    and it fails safe, so it is not a deviation.
  suggested_action: >-
    None for P-5. If it causes needless stops, a later design revision can say that the tester hands this case back to
    the Coder.
  confidence: high
