    quote_sha256: e87c242cac031e2dc059a3962aec75e0a51f84cd1d05f8298546a198d17e9a3b
  claim: >-
    The `## If an input is missing or outdated` section of onboard (staged line 47) says "`orqlet doctor` reports an
    error: show it and stop; never repair the profile by hand." The design gives no content for this section in a
    skill without phase-contract.md (ADR-001 decision 3: "Onboard and review do not carry it"), so the rule was chosen
    in implementation. Doctor's errors include ORQ-E150, ORQ-E153, ORQ-E161, ORQ-E163, ORQ-E170 and ORQ-E505, while
    the profile's own findings ORQ-W180 and ORQ-W181 are warnings, so onboard also stops on errors that do not concern
    the profile, such as ORQ-E505 (a stored copy differs). Stopping is the conservative choice, and nothing in BC-12
    or in P-3's criteria conflicts with it.
  suggested_action: None for P-3. Recorded so the person knows the rule comes from the implementation, not the design.
  confidence: high
