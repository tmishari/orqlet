findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: info
  category: correctness
  evidence:
  - kind: quote
    path: src/orqlet/application/usecases/validate_records.py
    lines: 195-196
    revision: 9b978bd87f50619107c002d8608b495cb6027a6f
    quote_sha256: 07bff2e2e8fbe643b32dbe4732c8034475b51c237056eb7f8ea5ce74d4fe6195
  - kind: quote
    path: docs/design/phase-skill-contracts/design/adr-004-what-each-phase-produces.md
    lines: '48'
    revision: 9b978bd87f50619107c002d8608b495cb6027a6f
    quote_sha256: d727003bdc70f135bc7fd6f1e0d9b707308c5d79e80ea396c97f5e37490a2451
  claim: >-
    The `## Next` of the review skill (staged line 52) has two branches, "With a blocking finding, the person runs
    `/orqlet-implement` with the same phase id for a rework round. Otherwise the person accepts the review and commits
    the phase." The second branch also covers a review that step 4 (staged line 28) reports as NOT_RUN, a stale
    record, and a review whose independence class is below what the change class needs; `orqlet validate review`
    reports independence_claimed and independence_derived as data, with no error for a class that is too low. This
    follows BC-3 and ADR-004 decision 6 as written ("its next step is a rework round in implement or the person's
    commit"), and `## Output` gives the person each verdict with its independence class, so it is not a deviation
    from the design.
  suggested_action: >-
    None for P-3. A later design revision could make the commit branch depend on every record passing validation at
    the independence class the change class needs.
  confidence: medium
