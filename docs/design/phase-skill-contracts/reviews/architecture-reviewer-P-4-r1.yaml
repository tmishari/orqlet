  claim: >-
    Item 5 of the research brief (staged as-is-format.md line 59, "5. Open questions: what is still unknown or
    contradictory, each with its `question_ref`.") says that every open item, unknown or contradictory, carries a
    `question_ref`. The contracts disagree. A Contradiction has no `question_ref` field, the ledger keeps conflicts in
    a separate `conflicts` list, and `Unknown.question_ref` is optional and defaults to None. A researcher who follows
    the text would look for, or make up, a `question_ref` for every contradiction and every unknown. ADR-004 decision 1
    names the section "Open questions" only, and the research skill's Output and the Handoff table of
    phase-contract.md read it more narrowly, as the unknowns with their `question_ref` and the brief's open questions.
  suggested_action: >-
    Reword item 5 to fit the contracts, for example "Open questions: what is still unknown or contradictory; an unknown
    with its `question_ref` where it has one, a contradiction with its sources." The opening words "Open questions:"
    stay, so the P-4 tests still pass. Then rebuild MANIFEST.json and the three as-is-format.md goldens.
  confidence: high
