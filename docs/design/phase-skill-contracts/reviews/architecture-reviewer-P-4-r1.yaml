self_check:
  schema: orqlet.self-check/v1
  checked_against:
    role: architecture-reviewer
    phase: implementation
    acceptance_criteria:
    - P-4 AC-1 through AC-7
  checks:
  - what: AC-1 (BC-20), the research brief
    how: >-
      Read staged as-is-format.md lines 1-68 against ADR-004 decision 1. The six sections are in order, statements
      name their fact ids, and an inference has an I-n id, its facts and what would confirm it. The brief recommends
      nothing. ORQ-W338 is the body lint at validate_as_is.py lines 174-181, and test_workflow_format_references.py
      pins each element (see F-1).
    result: pass
  - what: AC-2 (BC-21), the design brief
    how: >-
      Read design-format.md lines 21-37 against ADR-004 decision 2. The nine parts are in order, behaviour is listed by
      interface kind with the sentence for projects without a graphical interface, ADRs compare alternatives, and there
      is no phase order. ORQ-E367 is confirmed at validate_design.py lines 257-258 (see F-5).
    result: pass
  - what: AC-3 (BC-22), the test plan
    how: >-
      Read plan-format.md lines 5-17 and the example (lines 36-61) against ADR-004 decision 3 and ADR-002 decision 3.
      Criteria and checks come before file_operations, and sources are BC-n, R-n, Q-n or A-n, never code. Each check
      has a completion entry with a placeholder and its cited sources. The warning mark is in the entry and the
      self-check, and the warning list exists at line 33 of the plan skill's phase-contract.md (see F-2).
    result: pass
  - what: AC-4 (BC-23), review item review:plan-format
    how: >-
      plan-format.md line 13 holds the rule, and `unverified` is a SelfCheck field (self_check.py line 42). The test
      record lists this item as not run; the reviewer judges it met (see F-3).
    result: pass
  - what: AC-5, examples and command mentions
    how: >-
      test_skills.py lines 257-279 load all four format examples with the strict loader against their contracts and
      assert that four are found; lines 194-201 check every backticked orqlet command in the references. The three
      references name validate as-is, validate design, evidence cite, validate plan and gate status. review-format.md
      has no diff entry, and its MANIFEST hash equals the snapshot's. The test results are the tester's claims.
    result: pass
  - what: AC-6, manifest and goldens
    how: >-
      The MANIFEST.json hashes of the three references equal the packet manifest's snapshot hashes. Three golden hunks
      (Codex as-is-format, Cursor design-format, Claude Code plan-format) were compared to the source; only the
      generated header differs. The other six goldens were checked only for the new phrases.
    result: pass
  - what: AC-7 and BC-33, watched surfaces
    how: >-
      The cumulative diff touches no Python module under src/orqlet, nothing under tools/, .github/workflows/ or
      .prompts/, and neither pyproject.toml nor uv.lock. The reviewer did not run gate status.
    result: not-run
  - what: Tests are meaningful
    how: >-
      The tests pin each criterion's phrases, section order and item counts, and check the parsed example - criterion
      sources, a regression next to new behaviour, one completion entry per check, and the warning mark
      cross-referenced to the self-check. The inference example is tied to the real advice lint, and Q-12 is covered.
      Test-first is claimed (49 of 53 cases failed before the change). Importing helpers from other test modules has
      precedent (tests/unit/domain/test_conventions.py line 39).
    result: pass
  - what: Knowledge record
    how: >-
      The three already_documented_refs hashes equal the design manifest's D-3, D-9 and D-7. README.md and AGENTS.md
      hold none of the searched terms, and every other match is in a task folder.
    result: pass
  - what: Standards ORQLET-DET-001, ORQLET-DET-002, ORQLET-TEST-001, ORQLET-SEC-003, ORQLET-STYLE-001 and the CodeGuard rules
    how: >-
      The manifest is rebuilt; the goldens were rewritten (by claim); the tests are text tests with no network access;
      the example uses obvious placeholders; the change holds no credential, certificate or cryptographic algorithm,
      and its digests are SHA-256.
    result: pass
  - what: ruff, mypy, import-linter, schemas, manifest check, pytest
    how: Not run by the reviewer, whose shell was refused; the results are the tester record's claims.
    result: not-run
