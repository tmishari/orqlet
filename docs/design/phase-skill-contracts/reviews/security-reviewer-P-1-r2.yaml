findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: info
  category: security
  rule_ref: ORQLET-SEC-003
  evidence: []
  claim: tests/unit/render/test_rendered_formats.py:61 sets ENABLED_ADDRESS to the real public vendor address
    https://mcp.atlassian.com/v2/mcp where AC-8 asks for obvious placeholders. It is not a credential; it is the only
    address the closed table enables (src/orqlet/domain/mcp_credentials.py:21-25), so a placeholder would render no
    .mcp.json. The auth mode is client-native OAuth with no secret, the rendered entry holds only type and url, no
    request reaches the address (rendering builds strings; the suite runs with --disable-socket, pyproject.toml:71),
    and twelve other test and golden files hold the same address.
  suggested_action: Nothing is required. If AC-8's "obvious placeholder" is meant to cover addresses too, record in
    the phase report that the closed-table address is the stated exception.
  confidence: high
