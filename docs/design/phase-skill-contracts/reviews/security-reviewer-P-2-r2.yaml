    quote_sha256: 61071ca668122a1f2bff2690d3d9eb66062c6a0d77ffa77ab9c3710a44a7d890
  claim: BC-8 says a secret is never asked for. phase-contract.md (line 26) follows ADR-002's narrower wording, "Never
    ask the person to type a secret". An agent reading it literally could ask the person to paste a token or to share
    the file that holds it. Pasting is the case the design-stage review named. The no-print and secret-file rules still
    limit what reaches the transcript.
  suggested_action: Write "Never ask the person for a secret" (one word shorter) and update the pinned phrase in
    COMMAND_RULES in a rework round.
  confidence: low
