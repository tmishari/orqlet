  - kind: absence
    searched:
    - src/orqlet/workflow/skills/orqlet-research/references/phase-contract.md
    - src/orqlet/workflow/skills/orqlet-design/references/phase-contract.md
    - src/orqlet/workflow/skills/orqlet-plan/references/phase-contract.md
    - src/orqlet/workflow/skills/orqlet-implement/references/phase-contract.md
    - src/orqlet/workflow/skills/orqlet-research/skill.md
    - src/orqlet/workflow/skills/orqlet-design/skill.md
    - src/orqlet/workflow/skills/orqlet-plan/skill.md
    - src/orqlet/workflow/skills/orqlet-implement/skill.md
    method: rg -i for 'character', 'single quote', 'single-quot', 'starts with' and 'leading' in the packet snapshot,
      and a read of phase-contract.md lines 23-50. The only character rule is line 37, and it names "a path or glob".
    revision: 60522134c620fe3de978790f7230085a0518ad76
  claim: The round-1 fix put the person's values under the single-quote rule but not under the character rule. In
    phase-contract.md the character stop applies only to "a path or glob" (line 37). So three kinds of value need
    only single quotes - a non-secret value that fills a placeholder (line 26), taken from the person or from cited CI
    lines that any contributor can change; the remote-tracking ref the person names (line 48); and any other non-path
    value from an artifact. ADR-002 decision 3 requires such a value to pass the character rule (line 28). ADR-003
    decision 4 requires a stop on any other character for every artifact value (line 41). The design-stage security
    review closed SEC3-3 on exactly that ADR-002 sentence. BC-8 refers to "the argument rule of BC-40"; the BC-40 text
    limits the character rule to paths and globs, while both ADRs do not, so the design disagrees with itself here.
    Single quotes fail when a value holds a single quote, and on Windows cmd.exe they do not quote at all. A ref that
    starts with `--` is read as an option; the local git 2.56.0 manual lists `git log --output=<file>`, so the
    candidate-listing command could write a file. Mitigations - cited lines are bound by hash and approved in the plan
    pull request, and the person supplies the ref. A reader can still take line 37 as permission to pass such values
    with quoting only, so AC-9 fails.
  suggested_action: 'Widen the stop in line 37 to every value: "A value with anything but letters, digits, `.`, `_`,
    `-`, `/`, `*` or `?` stops the skill: ask." It is shorter, and it also stops `--output=...`, because `=` is not an
    allowed character. Add the phrase to ARGUMENT_RULES in tests/unit/test_workflow_phase_contract_text.py. If the
    person holds that BC-40 limits the rule to paths and globs, record a ledger question instead, because BC-40
    disagrees with ADR-002 and ADR-003.'
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  rule_ref: P-2 AC-9; BC-8
  claim: The source rule (phase-contract.md line 25) requires citing "the configuration lines it reads". .npmrc,
    .pypirc and .netrc are configuration files that package tools read, and the secret-file rule (line 27) forbids
    opening them. The text does not say which rule wins when a planned check reads one of them. The absolute "Never"
    makes the safe reading the likely one. BC-8 and ADR-002 have the same structure, so this is a design-level
    ambiguity, not a deviation of this phase.
  suggested_action: In a later revision, say in line 25 that a file that holds secrets is cited by path only and never
    opened.
  confidence: low
