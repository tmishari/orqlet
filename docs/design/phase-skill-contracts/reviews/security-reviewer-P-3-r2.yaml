- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: info
  category: security
  rule_ref: ORQLET-SEC-003; ADR-002 decision 3
  evidence:
  - kind: quote
    path: docs/design/phase-skill-contracts/design/adr-002-project-context-read-at-execution-time.md
    lines: '28'
    revision: 9b978bd87f50619107c002d8608b495cb6027a6f
    quote_sha256: e6f176f057d6171ac8c0117ecf73593b95416193b8e7eb0dcc92aa1315056347
  - kind: quote
    path: src/orqlet/workflow/skills/orqlet-plan/references/phase-contract.md
    lines: '26'
    revision: 9b978bd87f50619107c002d8608b495cb6027a6f
    quote_sha256: 78600f5337c0e6d48fb509e319c39023eab98771cb033b86a37427f1841d2597
  - kind: absence
    searched:
    - src/orqlet/workflow/skills/orqlet-onboard/skill.md
    method: >-
      Read the staged file in full and searched for "secret", "ask ... for a secret" and "type a secret". The only hit
      is line 19, the secret-file and credential bullet, which says nothing about asking. Onboard asks the person
      questions in steps 3 and 5.
    revision: 71d08a47ea9dccec00895c799c87427a292d632d
  claim: >-
    ADR-002 decision 3 says "The agent never asks the person to type a secret into the conversation.", and the four
    phase skills get "Never ask the person for a secret." from phase-contract.md, which onboard does not carry
    (ADR-001 decision 3). Onboard's Boundaries now repeat the secret-file and copy rules but not this one. BC-8 puts
    the sentence in phase-contract.md only and BC-12 does not name it, so P-3 AC-6 is met as written. The risk is
    small, because onboard writes placeholders and never fills or runs them, so it has no use for a secret's value;
    the baseline's "Never ask for, read, copy, save or print a password, cookie, token, session value or
    storage-state file." stands in its section on looking things up. Onboard is still the skill that asks the person
    a batch of questions about the project, and it alone lacks the general rule.
  suggested_action: >-
    Optional. Add "and never ask the person for a secret" to onboard's credential bullet and to SECRET_PHRASES. The
    body is close to BC-35's 900-word limit, so this may need shorter text elsewhere or a later revision of BC-12.
  confidence: medium
