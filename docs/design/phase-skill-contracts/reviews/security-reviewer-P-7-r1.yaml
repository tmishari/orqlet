capability_limits:
- The reviewer ran as the typed orqlet-security-reviewer subagent of Cursor, in a fresh context, with the path of packet
  phase-skill-contracts-P-7-0b3dc1c3 only. Its two read-only shell calls (listing the packet and reading MANIFEST.json)
  were refused in its read-only mode, so it ran no command and read files only.
- The definition_sha256 above is that of the installed `.cursor/agents/orqlet-security-reviewer.md` of workflow 0.4.0,
  which this phase writes. Against 0.3.3 it changes only the description and adds a paragraph for design reviews; the
  text for an implementation review is the same. Cursor listed the 0.4.0 description when the reviewer was started;
  whether it also loaded the 0.4.0 body in this running session is not observed. The reviewer checked that file
  against its package source and golden blob rather than relying on it.
- It computed no quote digests and gave absence records only. The main agent added the committed lines of
  diagnose.py and rollback.py that F-1 rests on, hashed with `orqlet evidence cite` at
  682d86a612ce508e7c02a1005fdb723668ddf0b6 after checking that no file under src/ is changed in the staged tree; the
  values of versions.yaml and workflow.lock that F-1 compares are in its claim. The reviewer named the merge base in
  its absence records; because it searched staged files, the main agent recorded the packet's staged tree
  8bad0d1b146d752ac529f2438e4b106f9da2f406 instead.
- The upgrade journal lies in the user's data directory, outside the packet; its result comes from the test record.
- The model that ran the reviewer is not observed.
- The reviewer ran in the same client as the Coder, so this review is I1; this D3 task needs I2, which a review in
  another client must supply.
- This review is an additional check, not a guarantee.
