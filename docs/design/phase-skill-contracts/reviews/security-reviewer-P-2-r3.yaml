findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: tests
  rule_ref: ORQLET-TEST-001; P-2 AC-8; ADR-002 decision 6
  evidence:
  - kind: absence
    searched:
    - tests/**/*.py
    method: rg in the packet snapshot for '&&', '||', '`$(`', 'redirection', 'backtick' and '`-c`'; read COMMAND_RULES
      (test_workflow_phase_contract_text.py lines 235-267). The only hits are unrelated resource and profile tests.
    revision: e405b34df4a3f99e8e6abec15a50d5b07fc9c634
  claim: The warning list (phase-contract.md line 33) holds the items that catch command chaining and substitution -
    `$(`, a backtick, a shell or interpreter with -c or -e, `;`, `&&`, `||` and a redirection to a file. COMMAND_RULES
    pins only "pipes into a shell", "fetches from the network", "elevated rights", "several lines", "`eval`" and
    "`orqlet:begin`". The file is at 1,799 of the 1,800 words AC-21 allows. A later trim could therefore drop one of
    the unpinned items with every test still passing. Today the text matches ADR-002 decision 6 in full, and AC-8 does
    not require these phrases, so the phase does not fail.
  suggested_action: Add "`$(`", "a backtick", "`-c` or `-e`", "`;`, `&&`, `||`" and "a redirection to a file" to
    COMMAND_RULES. This is a test-only change, for a rework round or the next phase that touches the file.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  rule_ref: BC-40; ADR-002 decision 3
  claim: The argument rule (phase-contract.md line 37) names three sources - the person, an artifact and a cited file -
    but not a command's output. The stale-input step (line 58) reads file names, author names and subjects from git
    log, and any contributor controls all three through a commit. A reader could take the rule as not applying when
    such a file name goes into a later command, for example to show that file's change. The reviewer believes git
    prints names that hold `$`, `;`, `(` or a backtick unquoted, but did not verify this by running git. BC-40 and
    ADR-002 have the same scope, so this is a design-level gap, not a deviation of this phase.
  suggested_action: Raise a ledger question for a later revision. One option is to write "Every value from the person,
    an artifact, a cited file or a command's output ...". The 1,800-word ceiling means the words have to be trimmed
    elsewhere.
  confidence: low
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  rule_ref: BC-15; ADR-003 decision 6
  evidence:
  - kind: quote
    path: src/orqlet/application/usecases/render_all.py
    lines: '64'
    revision: c772617d8d68e70eab016a142178f86c259ef67a
    quote_sha256: c4702f5faf0902c4cd459fec538d7759711b9973dabbc83cb32d5d95760eed74
  - kind: quote
    path: src/orqlet/application/usecases/gate_status.py
    lines: '91'
    revision: c772617d8d68e70eab016a142178f86c259ef67a
    quote_sha256: 3d69d42e1acce070482ac8f01ed09c66cbf5eb9528630c74e48f1e8c7392ed4e
  claim: The upgrade row (phase-contract.md line 61) has a version comparison as its only condition. Gate status reads
    the installed version from .orqlet/workflow.lock, which is committed in the repository. The planned-work row says
    the commit "changes only" certain files; the upgrade row sets no such limit. So a commit that raises the lock
    version and also edits other files in scope could be matched to a row that keeps the approval valid. Three things
    limit this - every commit's files are listed, the "Other commits in scope" row still applies, and the person must
    confirm. ADR-003 decision 6 has the same shape, so this is design-level.
  suggested_action: In a later design revision, limit the row to commits that change only files listed in
    .orqlet/generated.lock.yaml and the workflow lock. Send any other file in such a commit to the "Other commits in
    scope" row.
  confidence: low
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  rule_ref: BC-8; ADR-002 decision 3
  claim: The secret-file rule (phase-contract.md line 27) says "Never open". A repository-wide text search reads the
    same files and prints matching lines into the agent's context, and a reader may not count a search as opening. A
    committed .npmrc or .env file that git does not ignore could reach the transcript that way. "Never copy a
    credential" still keeps it out of artifacts. BC-8 and ADR-002 use the same word, so this is design-level.
  suggested_action: In a later revision, write "never open or search", or "exclude them from searches".
  confidence: low
