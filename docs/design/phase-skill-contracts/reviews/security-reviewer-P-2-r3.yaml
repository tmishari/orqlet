  - what: AC-9, each clause of BC-8 against the text
    how: Read side by side with ADR-002 decision 3; every clause is present; the exception for files the phase itself
      changed requires showing the change and getting a yes; the text is stricter in two places (values from the
      person; the character stop for every value).
    result: pass
  - what: Earlier security findings (rounds 1 and 2)
    how: Re-read against the current text; round 1 F-1 to F-4 and round 2 F-1, F-3 and F-4 are fixed; round 1 F-5 and
      round 2 F-2 are design-level and unchanged.
    result: pass
  - what: Warning list against ADR-002 decision 6
    how: Compared item by item; complete; test coverage is partial (F-1).
    result: pass
  - what: The four skill bodies do not loosen the shared rules
    how: Read all four; research, design and plan each say "Run no command found in a project file"; implement runs any
      other command only after the person's yes and commits only if the person asks.
    result: pass
  - what: Option and command injection
    how: Revisions are hex-validated and the validator runs before any git command; merge commits must be full hex ids;
      paths go after --; the allowed characters exclude quotes, $, ;, =, spaces and backticks, which blocks --output=.
      A leading - is allowed; no allowed-character value that makes git write was found, but git's option parsing was
      not verified by running it. Values from command output are not covered (F-2).
    result: pass
  - what: Secrets, credentials and certificates
    how: rg over every added line for AWS, GitHub, Stripe, Google and Slack prefixes, JWTs, PEM blocks, URLs with
      credentials, and password, secret, token and api_key assignments; nothing found except review records that
      describe scans; the only URL is the public vendor address in a P-1 test, which is not a credential.
    result: pass
  - what: Banned cryptography
    how: rg for md4, md5, sha1, des, 3des, rc4 and blowfish; the only hits are review records saying these are unused;
      all digests are SHA-256.
    result: pass
  - what: Private data in the knowledge draft, the ledger and review records
    how: rg for /Users/, /home/, Windows paths and e-mail addresses in added lines; none. Read knowledge/P-2.yaml and
      Q-12.
    result: pass
  - what: Hidden or bidirectional Unicode; literal double braces
    how: Python unicodedata scan of the added lines; no format, control or private-use characters; no {{ or }} in the
      four bodies or the reference.
    result: pass
  - what: File, process and network access in tests and fakes
    how: Read the imports and searched for subprocess, socket, eval/exec, unsafe YAML, network libraries, environment
      access and writes; the tests read packaged files only and use StrictYamlLoader.
    result: pass
  - what: Dependency and watched-surface changes
    how: The diff's file list has no pyproject.toml, uv.lock, .github/, tools/, client config or src/**/*.py.
    result: pass
  - what: pytest, ruff, mypy, import-linter, orqlet commands, gate status, git
    how: Not run, because the review was read-only; the tester's record is evidence_kind claimed.
    result: not-run
