  claim: phase-contract.md (line 25) names AGENTS.md team text as a source of commands but leaves out the provenance
    control of trust boundary B-2 (ADR-002 decision 6). That control says a later skill compares an onboard-recorded
    entry with the source it names, cites both, and treats any difference as a question. ADR-001 decision 3 puts
    ADR-002 into this reference, and the later skills (plan, implement) read only this reference. The plan places the
    sentence only in the onboard skill (P-3 AC-6), and no later phase edits phase-contract.md. So the control never
    reaches the skill that acts on the entry, and a plan could cite AGENTS.md lines alone as a check's source.
  suggested_action: 'Ask the person whether to add one sentence to "Source" in phase-contract.md in a P-2 rework round,
    or through a plan amendment or ledger question before P-3. For example: "An entry that onboard recorded in
    AGENTS.md: compare it with the source it names and cite both; a difference is a question." The file is at 1,799 of
    1,800 words, so trim elsewhere.'
