unknowns:
- id: U-1
  what: The request asks injection to preserve local edits, but installed SKILL.md files are PROTECTED
    and an edited one is restored on upgrade with warning ORQ-W096. It is not stated whether local edits
    to skill files are meant to survive, or only edits outside the managed files.
  material: true
- id: U-2
  what: Which receiving-project facts the skills should carry is not stated (for example project name,
    target branch, prompts_dir, enabled clients or stack). Today RenderRequest and ClientSkill pass no
    profile data into skill text.
  material: true
- id: U-3
  what: How a later phase should detect an artifact from another project is not stated. ArtifactHeader
    has no project identifier, and nothing establishes whether workflow_version, protected_set_digest
    or base_revision is enough to tell projects apart.
  material: true
- id: U-4
  what: How an unapproved prerequisite should be detected is not stated. AS-IS acceptance has no recorded
    form in the repository, and design or plan approval is host evidence that offline gate status never
    has (always NOT_RUN).
  material: true
- id: U-5
  what: No threshold for 'materially outdated' is defined. Gate status treats any mismatch in five header
    components as stale, and a base_revision move only when files in scope changed. Whether a skill-only
    release, which changes protected_set_digest and workflow_version, should count as material is not
    decided.
  material: true
- id: U-6
  what: No test was found that runs upgrade over a locally edited SKILL.md. The restore test uses `.claude/rules/orqlet-workflow.md`,
    and the SKILL.md test covers only doctor and release.
  material: false
- id: U-7
  what: Bound.upstream is declared in the artifact header, but a search found no use case that reads it.
    Its intended role in handoff detection is not documented in the files read.
  material: false
- id: U-8
  what: 'Not traced: the doctor drift computation, the `next_release()` test helper, and the validators
    for the question ledger and knowledge impact.'
  material: false
contradictions:
- id: C-1
  sources:
  - src/orqlet/workflow/skills/orqlet-plan/skill.md:17-17
  - src/orqlet/application/usecases/gate_status.py:110-123
  note: The plan skill tells the agent to run `orqlet gate status <task>` and says a NOT_RUN result is
    not a pass, but gate status with a task always returns NOT_RUN offline. The implement skill (skill.md:11)
    explains this and asks the person instead; the plan skill does not.
- id: C-2
  sources:
  - src/orqlet/workflow/skills/orqlet-research/skill.md:13-13
  - src/orqlet/application/contracts/artifact_header.py:45-52
  note: The research skill says to copy gate status's `bound` values into the header. Gate status prints
    workflow_version and protected_set_digest inside `bound` (gate_status.py:59-67), but the header keeps
    those two at its top level, outside `header.bound`.
