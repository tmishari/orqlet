- id: A-3
  kind: structure
  statement: '`PackagedWorkflow` reads the installed `orqlet.workflow` package data. `read_text` accepts
    only paths listed in `MANIFEST.json` and does not compare the file hash. The comparison of files against
    the manifest is a separate `problems()` call, and a unit test asserts that it returns no problems.'
  evidence:
