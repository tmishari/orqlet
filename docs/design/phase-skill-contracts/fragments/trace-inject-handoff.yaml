- id: A-5
  kind: flow
  statement: 'The `<!-- requires: X -->` and `<!-- unless: X -->` markers are filtered by `render_steps`.
    It drops a numbered step and its indented continuation when the condition fails, strips the marker
    and renumbers the list. `load_skills` applies it to the skill body only; reference files are read
    verbatim, without filtering.'
