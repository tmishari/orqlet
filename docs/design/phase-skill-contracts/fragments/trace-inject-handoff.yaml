- id: A-42
  kind: flow
  statement: Evidence records must sit at `docs/design/<task>/reviews/<role>-<P-n>-r<n>.yaml`, `tests/<P-n>.yaml`
    or `knowledge/<P-n>.yaml`. The record validators report `ORQ-E400` for another path and `ORQ-E401`
    when the record's task or phase differs from its path. They recompute the binding; a stale component
    gives `ORQ-W410` and NOT_RUN. The design component hashes the manifest, its artifacts and the AS-IS
    file named in `as_is_ref`.
