- id: A-4
  kind: structure
  statement: '`load_skills` takes one skill per `skills/<name>/skill.md`. The front matter must have `name`
    and `description`, and `name` must equal the directory name. A malformed source raises `SourceError`.
    Each `skills/<name>/references/*.md` file is attached as a reference.'
  evidence:
