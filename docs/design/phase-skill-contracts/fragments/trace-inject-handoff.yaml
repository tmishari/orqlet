- id: A-1
  kind: flow
  statement: The commands `orqlet init` and `orqlet upgrade` are registered on the Typer app. `init_command`
    builds the lifecycle services with `build_init_services` and calls `init_project`. `upgrade_command`
    builds the same services and calls `upgrade`.
