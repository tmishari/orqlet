- id: A-5
  kind: flow
  statement: 'Research inputs: it asks for the task name, runs `git status` and reads `docs/design/<task>/`
    (questions.yaml and any earlier as-is.md) to resume. It asks one batch of questions, records them
    in questions.yaml and runs `orqlet validate ledger`. It then runs `orqlet gate status` without a task
    and copies the `bound` values into the header.'
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-research/skill.md
    lines: 11-13
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 4375ed378a3eda11246e48cb2f8742eced382132eea4be279118b2e0138f2a84
- id: A-6
  kind: flow
  statement: 'Research work: when the client has subagents it starts orqlet-inventory (one per area, in
    parallel) and orqlet-tracer; otherwise it sets `research_mode: sequential` with a `limitation`. Before
    it writes facts it runs `orqlet resources list --uncovered --json` and writes web lookups to `docs/design/<task>/evidence/web/<slug>.md`.'
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-research/skill.md
    lines: 14-15
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 68fb6960f6a17df9abe9264bc7d80d800dfd0dcf6e8aa2897b70d69239a26607
- id: A-7
  kind: flow
  statement: 'Research output and completion: it writes `docs/design/<task>/as-is.md` with evidence from
    `orqlet evidence cite`, keeps every unknown and contradiction, states facts only and runs `orqlet
    validate as-is`, where NOT_RUN is not a pass. Step 10 shows a summary that opens with the counts of
    unknowns and contradictions, then ''STOP. The person accepts the AS-IS file. You cannot.'' No step
    names the next skill, and no step runs `orqlet standards for`.'
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-research/skill.md
    lines: 16-20
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: e19c4e26e73d3d3446f36541e31a9b56d6eda721d664505bdb8677c5a0a6f112
- id: A-8
  kind: flow
  statement: Design reads `docs/design/<task>/as-is.md` and stops if the person has not accepted it. It
    runs `orqlet standards for --phase design --role architect` with no `--path`. It classifies the change
    as D1, D2 or D3, and the declared class cannot be lower than the trigger.
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-design/skill.md
    lines: 7-13
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: ec3d5981b3f72ecf72d751c59be88314f40b18605aea3e1fdc2a91541b6496ad
- id: A-9
  kind: flow
  statement: 'Design output: it writes `docs/design/<task>/design/manifest.yaml` and the artifacts its
    class requires, declares `expected_changes` and hashes files with `orqlet evidence hash`. At D2 and
    above it starts both reviewers on the design and saves their notes as `reviews/<role>-design.md`,
    then runs `orqlet validate design`. Step 10: ''STOP. Tell the person to commit the design and open
    a design pull request''; approval is the merge of that pull request. No step names the plan skill.'
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-design/skill.md
    lines: 15-20
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 7e56b2eacef0ce887334dc7780470c45e4a7affd500159e9ce27c035a0a41131
- id: A-10
  kind: flow
  statement: Plan reads the approved design and asks the person to confirm that the design pull request
    merged on the protected branch. For D1 the plan may be drafted from the validated draft and approved
    in the same pull request; it stops if neither holds. It runs `orqlet standards for --phase plan --role
    planner` with no `--path`.
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-plan/skill.md
    lines: 7-12
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: dd78700218396048a44aaa2fd9f687186c9de1bd2b9c79fb0e1b8ead9b7f02b3
- id: A-11
  kind: flow
  statement: 'Plan output: `docs/design/<task>/plan.yaml` with phases, exact file operations, acceptance
    criteria with sources, and checks. A rename is a create with `moved_from` plus a delete; the design
    manifest hash comes from `orqlet evidence hash`. It runs `orqlet gate status <task>` and `orqlet validate
    plan`, where stale or NOT_RUN is not a pass. A file outside the plan needs a plan amendment. Step
    9: ''STOP. Tell the person to commit the plan and open a plan pull request.'' No step names the implement
    skill.'
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-plan/skill.md
    lines: 13-19
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: e361a82c269c0dce890d98e0de1659ced2a84eb2f787304b26a6db3600f3af18
- id: A-12
  kind: flow
  statement: Implement step 1 runs `orqlet gate status <task> --phase <phase>`, asks the person to confirm
    that the design and plan pull requests merged (an offline run reports approval as NOT_RUN), and stops
    if they did not or if anything is stale. Step 2 then asks which phase to implement and checks `git
    status`. Step 3 starts orqlet-tester first; without subagents the agent writes the tests itself.
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-implement/skill.md
    lines: 7-13
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: c3eb5d1a5788d88fd6f7b2855da375bcbbb197f2f32a9cf87606c791fa27b068
- id: A-13
  kind: flow
  statement: 'Implement work: a lookup writes to evidence/web/, which is the one exception to the file
    list, and a finding that changes the design or plan stops the work. Code stays inside the phase file
    list; a file outside it is a plan amendment. It runs ''the phase''s checks''; a run that collected
    no tests or skipped checks is NOT_RUN, and ''the project''s own CI job is the evidence''.'
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-implement/skill.md
    lines: 14-16
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 89dd170bfb780f6daea38fbbf946f8155ee15b5b7b51970f61cebf2769a1c882
- id: A-14
  kind: flow
  statement: 'Implement completion: it runs `orqlet knowledge impact` and `orqlet validate knowledge`,
    saves the tester record `docs/design/<task>/tests/<phase>.yaml` and runs `orqlet validate test`, then
    runs `/orqlet-review` (at most three rework rounds, no waiving). Step 10 stops for the person, prepares
    a commit message with `Orqlet-Task` and `Orqlet-Phase` trailers and no AI attribution, and commits
    only if asked.'
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-implement/skill.md
    lines: 17-20
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 0f365890aa8d11981cc9c34ef93ecb27d93e8e1d067024cf200e25e82ef2e6de
- id: A-15
  kind: flow
  statement: Review checks that the change and both records are staged, then runs `orqlet review prepare
    <task> <phase>`, which exports a packet outside the repository. It starts orqlet-arch-reviewer and
    orqlet-security-reviewer in clean contexts and gives each only the packet path. Without subagents
    it reports NOT_RUN and stops; an agent playing a reviewer is I0.
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-review/skill.md
    lines: 7-14
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: e74f6f63db9c2132aca898849a5ba565d174b8ada7e8ca6500f1aa1865acd7bf
- id: A-16
  kind: flow
  statement: 'Review output: one record per reviewer at `docs/design/<task>/reviews/<role>-<phase>-r<round>.yaml`,
    with `review_input` from `review prepare` and the agent hash from `orqlet evidence hash`. It runs
    `orqlet validate review`, where NOT_RUN or stale is not a pass, and stops after three rounds with
    one consolidated report. Step 9: ''STOP. You cannot accept the review.'''
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-review/skill.md
    lines: 15-19
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 229e5a502055a569bd774f15279814111964d0197575d58986ebcaa40eeb13c7
- id: A-17
  kind: flow
  statement: 'Onboard runs `orqlet doctor` (ORQ-W180, ORQ-W181) and reads manifests, CI files, tests and
    guidance, citing path and lines. It asks one batch of questions and previews then applies answers
    with `orqlet profile answer ... --dry-run` / `--yes`. It registers resources (ORQ-I502, ORQ-I500,
    `orqlet resources add` and `attach`) and forbids creating an end-to-end framework. Step 8: STOP, and
    the person runs `orqlet profile approve --reviewer`.'
  evidence:
  - path: src/orqlet/workflow/skills/orqlet-onboard/skill.md
    lines: 7-18
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
