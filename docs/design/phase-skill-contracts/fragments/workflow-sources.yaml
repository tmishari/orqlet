- id: A-2
  kind: interface
  statement: A skill source allows exactly the front-matter fields `name` and `description`. `name` must
    equal the directory name, and an unknown or duplicate field is a SourceError. A role source requires
    `name`, `description` and `mode`, and `mode` must be `read-only` or `writes`.
