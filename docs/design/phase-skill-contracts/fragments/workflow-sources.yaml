facts:
- id: A-1
  kind: structure
  statement: The package ships six skills (orqlet-design, orqlet-implement, orqlet-onboard, orqlet-plan,
    orqlet-research, orqlet-review) and five roles. Only design, plan, research and review have a references/
    file (design-format.md, plan-format.md, as-is-format.md, review-format.md); orqlet-implement and orqlet-onboard
    have none.
  evidence:
  - path: tests/support/render.py
    lines: 32-53
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 256dc6a42d516a8d4af58d327f3ee4cfbfe48bac93130641e7120dd891416e2c
