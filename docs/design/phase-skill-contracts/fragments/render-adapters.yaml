- id: A-1
  kind: structure
  statement: 'The Claude Code adapter renders, in this order: the AGENTS.md baseline block, the optional
    conventions block, the bridge .claude/CLAUDE.md, the scoped rules, the commands, the skill files under
    .claude/skills, the roles, and an optional seeded .mcp.json. It reports the limits ORQ-L001 and ORQ-L006.'
  evidence:
