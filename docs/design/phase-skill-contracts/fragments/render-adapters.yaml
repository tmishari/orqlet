unknowns:
- id: U-1
  what: Whether Claude Code, Codex and Cursor actually load the emitted files and honour their invocation
    fields. Every adapter labels its behaviour as following published documentation of 2026-10, not observed
    with a real client (ORQ-L001).
  material: true
- id: U-2
  what: Whether Codex honours policy.allow_implicit_invocation false in agents/openai.yaml, and how it
    treats the field disable-model-invocation, which it does not document. ORQ-L005 says this is documented
    but not observed.
  material: true
- id: U-3
  what: Whether Cursor lists a skill twice when both .claude/skills and .agents/skills exist (ORQ-L004
    says documented, not observed), and which copy it would start.
  material: true
- id: U-4
  what: No test in tests/ parses the rendered .codex/agents/*.toml files or the agents/openai.yaml sidecars
    with a TOML or YAML parser. Whether some check outside this area (tools/, CI workflows) validates
    them was not established.
  material: true
- id: U-5
  what: No check was found that scans the rendered files for unresolved placeholders. The skill texts
    hold angle-bracket tokens such as <task> that the agent is meant to fill. The repository does not
    say whether the requirement 'no unresolved placeholders' covers such tokens.
  material: true
- id: U-6
  what: How a change to a skill text is tied to MANIFEST.json and the workflow package version (ORQLET-DET-002),
    and therefore to the version recorded in the inputs and in the AGENTS.md marker. tools/build_manifest.py
    and the release process were outside this area.
  material: true
- id: U-7
  what: What spike S-21 found and who would supply client_version or min_versions in a later release.
    The spike document was not read.
  material: false
- id: U-8
  what: Whether the Cursor rule 'globs' format is accepted. The Cursor ORQ-L001 message says it is unverified.
  material: false
contradictions:
- id: C-1
  sources:
  - docs/design/orqlet-implementation/adr-005-deterministic-renderers-and-golden-tests.md:11-11
  - src/orqlet/application/ports/instruction_adapter.py:112-117
  note: 'ADR-005 describes a renderer as render(definition, client, client_version). The adapter port
    is render(request: RenderRequest), with client_version as a field of the request that compose never
    sets (render_all.py 121-127).'
- id: C-2
  sources:
  - src/orqlet/adapters/render/emit.py:7-11
  - tests/unit/render/test_front_matter_views.py:45-61
  note: The emit docstring says the release tests check every generated file. The front-matter view test
    covers only the skill, agent and Claude command path classes, not the rule files (which are written
    fully quoted), the Codex TOML roles or the sidecars.
- id: C-3
  sources:
  - src/orqlet/application/ports/instruction_adapter.py:60-66
  - src/orqlet/application/usecases/resources_view.py:142-169
  note: ClientSkill is documented as 'A workflow skill' named 'orqlet-<phase>'. The same type also carries
    the resource skills orqlet-tool-<id> and orqlet-resources (agent_may_start true), and the shipped
    set includes orqlet-onboard and orqlet-review.
