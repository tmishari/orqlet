- id: A-19
  kind: flow
  statement: For shared blocks, build_plan parses the existing file. On any BlockError (bad markers, conflict
    markers, open fence, non-UTF-8), every block of that file becomes STOP and nothing is written. Otherwise
    each block is classified by comparing the hash of the current block text with the recorded hash and
    the new hash, and only the CREATE, UPDATE or RESTORE blocks are applied.
  evidence:
  - path: src/orqlet/domain/changeplan.py
    lines: 226-282
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
