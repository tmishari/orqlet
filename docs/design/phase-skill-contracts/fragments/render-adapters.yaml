- id: A-2
  kind: structure
  statement: The Cursor adapter renders the AGENTS.md baseline block, the optional conventions block,
    the Cursor rules, the Cursor commands, the skill files under .agents/skills and the Cursor roles.
    It reports ORQ-L001, adds ORQ-L004 when there are skills, and reports ORQ-L006. ORQ-L004 says that
    Cursor also reads .claude/skills, so a skill may be listed twice. This is documented and not observed.
  evidence:
  - path: src/orqlet/adapters/clients/cursor.py
    lines: 42-57
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 65ad1e75319b5e53ebf6080af3c8c1e9025e4ef1023831ae161183572d4fa30d
