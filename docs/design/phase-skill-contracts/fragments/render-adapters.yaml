- id: A-10
  kind: interface
  statement: Scoped rules are written to .claude/rules/orqlet-<name>.md (front matter 'paths' list) and
    .cursor/rules/orqlet-<name>.mdc (description, globs, alwaysApply false). Both are written without
    plain_when_safe, so every string is quoted. A rule name that is not a slug, or a rule with no paths,
    is refused. The file class comes from the rule. The inputs are the rule's inputs, or (name, '1', sha256
    of the file) when it has none.
