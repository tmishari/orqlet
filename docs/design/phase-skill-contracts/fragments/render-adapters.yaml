- id: A-20
  kind: flow
  statement: classify reports local edits. A protected file or block whose current hash differs from both
    the recorded and the new hash is TAMPERED, and the action is RESTORE. A non-protected edit with an
    unchanged render is USER_EDIT_ONLY (NOOP). An edit together with a changed render is CONFLICT (STOP
    plus a proposal). An unrecorded existing file with different bytes is NAME_COLLISION. Hashes read
    CRLF as LF.
  evidence:
