- id: A-3
  kind: structure
  statement: The Codex adapter renders the AGENTS.md baseline block, the optional conventions block, the
    skill files under .agents/skills, one agents/openai.yaml sidecar for each skill whose agent_may_start
    is false, and the .codex/agents roles. It writes no rule files and no commands. It reports ORQ-L001
    and ORQ-L006, adds ORQ-L002 when there are scoped rules and ORQ-L003 when there are commands, and
    adds ORQ-L005 when there are skills.
  evidence:
