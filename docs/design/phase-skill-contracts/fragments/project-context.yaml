facts:
- id: A-1
  kind: structure
  statement: The orqlet.project-profile/v1 contract has the fields project, stack, profile, facts, repository,
    structure, dependencies, auth_procedures, standards_sources, clients, orqlet, optional_components,
    data_class, commands, technologies and capabilities. None of these fields names a location for task
    documents or phase outputs.
  evidence:
  - path: src/orqlet/application/contracts/profile.py
    lines: 155-172
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: c4391248f015f13beb54a3eca54af4d37bcd9bbd8be948c8f40332923ee22440
- id: A-2
  kind: interface
  statement: '`commands` is a dict from an id to a CommandSpec of `argv` (tuple of strings), `cwd` (default
    ''.'') and `source` (string). `structure` is a dict from a key to a FactValue.'
  evidence:
  - path: src/orqlet/application/contracts/profile.py
    lines: 149-152
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
