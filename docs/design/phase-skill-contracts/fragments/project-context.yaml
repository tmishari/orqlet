unknowns:
- id: U-1
  what: This read-only session could not run git, so it could not confirm that the working tree equals
    base revision 058de9e58e42e6b4b30c7826e7aa57e88ae5a973. Line ranges were read from the working tree.
  material: true
- id: U-2
  what: 'Which applicable_rules_hash a phase artifact header must record is not stated in the files read:
    the all-rules value in standards.lock.yaml that gate status compares against, or the query-filtered
    value that `orqlet standards for` prints. The skill reference formats were outside this area.'
  material: true
- id: U-3
  what: No code, answer key or command writes profile.commands. Whether it is meant to be filled by hand,
    by a scanner or by a future command is not stated in the files read.
  material: true
- id: U-4
  what: It is not verified whether hand-editing team-owned (seeded) .orqlet/project-profile.yaml, for
    example to add commands or structure, is reported by doctor, sync or upgrade, given that its hash
    is recorded in generated.lock.yaml.
  material: true
- id: U-5
  what: No code was found that reads exempt.yaml's workflow-artifact entry, beyond registering the contract.
    It is also unknown how a phase-output location chosen by the project relates to the statement that
    the list is fixed by the release and cannot be changed by a project.
  material: true
- id: U-6
  what: Which command re-renders the AGENTS.md conventions block after `orqlet profile answer` was not
    confirmed. profile answer writes only the profile and the lock.
  material: false
- id: U-7
  what: Where this repository declares its actual build, lint, type-check and test commands (pyproject.toml,
    CI workflow or Makefile) is outside this area and was not read.
  material: false
- id: U-8
  what: Whether two receiving projects can share one project.uuid, for example through a copied profile,
    and so share journals and backups in the data directory is not tested in this area.
  material: false
contradictions:
- id: C-1
  sources:
  - src/orqlet/interface/cli/commands/standards.py:84-88
  - src/orqlet/application/usecases/gate_status.py:80-93
  note: Both values are called applicable_rules_hash. `standards for` returns rules_hash over the query-selected
    rules. gate status binds against the standards lock's value, which render_all computes over all resolved
    rules (render_all.py:247-260).
- id: C-2
  sources:
  - src/orqlet/application/usecases/standards_for.py:134-155
  - src/orqlet/application/usecases/render_all.py:81-98
  note: '`standards for` builds the stack from a fresh scan at execution time. Render and explain build
    it from the technologies, frameworks and kind stored in the profile.'
- id: C-3
  sources:
  - src/orqlet/application/usecases/standards_for.py:200-215
  - src/orqlet/application/usecases/review_prepare.py:48-53
  note: standards_for and resolve_for read the prompts folder from the profile's prompts-dir standards
    source. review prepare packs the fixed paths .prompts/rules.yaml and .prompts/foundations.md, and
    explain passes prompts_dir '.prompts' (explain.py:53).
- id: C-4
  sources:
  - src/orqlet/application/contracts/plan.py:28-32
  - src/orqlet/application/usecases/validate_plan.py:136-148
  note: The plan contract comment calls check_ref 'a profile command id', as does test_record.py:18. The
    validator never resolves it against profile.commands, and no code fills profile.commands (.orqlet/project-profile.yaml:151
    is {}).
