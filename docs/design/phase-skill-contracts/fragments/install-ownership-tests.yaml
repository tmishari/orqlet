- id: A-20
  kind: flow
  statement: A recorded whole file that is no longer rendered is deleted if untouched, or kept and still
    recorded if edited. A recorded block that is no longer rendered is removed from its shared file if
    untouched, and a file left with only whitespace is deleted. For stray blocks in a file that cannot
    be parsed, the old records are kept.
  evidence:
