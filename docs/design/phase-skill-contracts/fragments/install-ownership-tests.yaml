- id: A-9
  kind: interface
  statement: Schema `orqlet.generated-lock/v1` records `generator.orqlet`, an optional `standards_lock`
    hash and `files`. Each file has a path, an owner, a class (aliased `class`), inputs (each with id,
    version and sha256), and either `rendered_sha256` or `seeded_sha256`, plus block begin and end markers
    or an entry. A validator requires `seeded_sha256` for seeded files, `rendered_sha256` for all others,
    block markers for shared-block, an entry for shared-entry and a class for orqlet-owned files.
  evidence:
  - path: src/orqlet/application/contracts/generated_lock.py
    lines: 13-58
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
