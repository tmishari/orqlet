- id: A-16
  kind: flow
  statement: '`set_blocks` replaces existing blocks in place, working from the end of the file, and inserts
    the missing ones together. Everything outside the replaced spans is kept, along with the file''s newline
    style and BOM. `remove_block` cuts out only the block span. With `insert_after_heading=False`, new
    blocks are appended at the end of the file.'
  evidence:
  - path: src/orqlet/domain/blocks.py
    lines: 118-160
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
