- id: A-19
  kind: flow
  statement: When a shared file cannot be parsed (`BlockError`), every desired block of that file becomes
    a conflict with action stop and the error as its reason. No write and no proposal is planned, and
    `recorded_after` gets no entry for those blocks.
  evidence:
