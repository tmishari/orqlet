- id: A-23
  kind: flow
  statement: '`apply_plan` holds the apply lock and orders the writes so that the manifest comes last.
    It verifies that every file still has its preview hash (`PlanStale` otherwise) and backs up every
    file that exists before the change. It then marks earlier open journals superseded, starts a journal,
    writes each file atomically or deletes it, marks each entry done and finishes the journal.'
  evidence:
  - path: src/orqlet/application/usecases/apply_plan.py
    lines: 38-79
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
