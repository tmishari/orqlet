- id: A-18
  kind: flow
  statement: For a shared file, each block is classified on the hash of its own span from the begin marker
    to the end marker, markers included. Text outside the blocks therefore does not affect the decision.
    The file is written once, with all applied blocks, only when the resulting bytes differ.
  evidence:
