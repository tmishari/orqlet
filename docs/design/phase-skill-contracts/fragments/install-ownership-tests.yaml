- id: A-22
  kind: flow
  statement: '`upgrade` refuses before planning when a journal is still open without `--resume` or `--check`
    (ORQ-E131), on a downgrade or a release below the floor (ORQ-E120, or ORQ-W095 with `--allow-weaker`),
    and when recorded packs are not supplied (ORQ-E121). A downgrade is a lower workflow version or a
    lower `controls_level`. The workflow lock records version, digest and controls level.'
