- id: A-24
  kind: flow
  statement: After deleting a file, `apply_plan` removes the parent folders the deletion left empty, nearest
    first, and stops at the first folder that still holds something. The docstring says this exists so
    that a removed skill does not leave an empty folder behind.
  evidence:
