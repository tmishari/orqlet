- id: A-11
  kind: flow
  statement: '`plan_changes` reads the current bytes of every desired path, of their proposal paths, of
    every recorded path and of `.orqlet/generated.lock.yaml`. A path that is not a regular file stops
    it with ORQ-E114. It then builds the plan, renders a new lock from `recorded_after`, and adds that
    lock as the last write only if its bytes differ. A plan with no writes is empty, and `upgrade` then
    returns `up-to-date` without applying anything.'
