facts:
- id: A-1
  kind: structure
  statement: '`OwnerMode` has five values (orqlet, shared-block, shared-entry, seeded, user) and `FileClass`
    has three (protected, generated, optional).'
  evidence:
  - path: src/orqlet/domain/ownership.py
    lines: 6-17
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 326642e1474dca6f66703a27a714be18bebe058e3d0dc4fceeb87dc3fbc6486b
- id: A-2
  kind: flow
  statement: '`classify` decides from three SHA-256 values: what is on disk now, what the lock recorded
    and what the new render produces. A user-owned entry is always seeded-keep. If the disk equals the
    render the file is up-to-date, and if the disk equals the record it is a safe-update. Otherwise a
    protected file is tampered, and a generated one is user-edit-only when the render did not change or
    conflict when it did.'
  evidence:
  - path: src/orqlet/domain/classify.py
    lines: 14-50
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 796f2e1848c6cce18eeae845f2afd457e56716dcb5cca1d1e9c2509143ea15db
- id: A-3
  kind: flow
  statement: Without a record, a missing file is new, an equal file is up-to-date and a different file
    is a name-collision. A recorded file that is no longer rendered is orphan-remove when untouched and
    orphan-report when edited. A seeded file deleted by the team stays seeded-keep and is never brought
    back. It becomes up-to-date when the disk already equals the render, and seeded-proposal only when
    the render differs from the record.
  evidence:
  - path: src/orqlet/domain/classify.py
    lines: 53-78
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 7bac32ba0e9c646c4ec13529519b349fd6936548bba5ad15d5146f850ac60df4
- id: A-4
  kind: flow
  statement: 'The plan maps states to actions: up-to-date, user-edit-only, orphan-report and seeded-keep
    are noop; new is create; safe-update is update; tampered is restore; conflict and name-collision are
    stop; orphan-remove is delete; seeded-proposal is propose.'
  evidence:
  - path: src/orqlet/domain/changeplan.py
    lines: 45-52
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: f64e606a3aa0e15d431ea9391a8252811a7c6f23cff49199167bc9965bff81dc
  - path: src/orqlet/domain/changeplan.py
    lines: 420-432
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 873ac016c122c22a28ac8ca6f0028a13eca849933e8deb1e6d98508e76812468
- id: A-5
  kind: flow
  statement: For a whole file, create, update and restore write the rendered bytes, while propose and
    stop only write a proposal and leave the live file unchanged. Every item is then passed to `_record`.
  evidence:
  - path: src/orqlet/domain/changeplan.py
    lines: 204-223
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 3d5be8e6f15dd82cc199827bb2c8d8199a4f9b8490b03eaa0f56da9c0a99dccf
- id: A-6
  kind: flow
  statement: '`_record` keeps the previous lock entry (or none) for user-edit-only, conflict, name-collision,
    seeded-keep and seeded-proposal. For every other state it records the normalised hash of the render,
    the begin and end marker lines of a block, and the render''s inputs.'
  evidence:
  - path: src/orqlet/domain/changeplan.py
    lines: 393-417
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: 4098fb391c3ab622ad0e176f10b25437d068d31216c0e2de715ae3d8e1fe50fa
- id: A-7
  kind: flow
  statement: A proposal is a unified diff written to `.orqlet/proposals/<path with / replaced by __>[.<block>].diff`;
    names over 150 bytes are truncated and get a hash suffix. It is flagged `is_proposal` and written
    only when it differs from the proposal already on disk. For the MCP file paths of the three clients
    the diff is taken against nothing.
  evidence:
  - path: src/orqlet/domain/changeplan.py
    lines: 31-38
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
