  kind: flow
  statement: '`rollback` reverses only journal entries marked done, and only when the current hash equals
    the entry''s after hash. Otherwise it refuses and names the files (ORQ-E133). Created files are deleted
    and other files are restored from backup, with ORQ-E134 when a backup is missing and ORQ-E132 when
    there is no journal. The undo goes through `apply_plan`, and the original change is then marked rolled-back.'
