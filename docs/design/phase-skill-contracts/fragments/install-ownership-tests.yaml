- id: A-15
  kind: flow
  statement: '`parse_blocks` recognises line-anchored `<!-- orqlet:begin <name> <info> -->` and `<!--
    orqlet:end <name> -->` markers outside code fences. It raises `BlockError` on merge-conflict markers,
    a block nested in another, a name that appears twice, an end with no matching begin, an unclosed code
    fence or a block that is never closed. Non-UTF-8 content is also a `BlockError`.'
  evidence:
  - path: src/orqlet/domain/blocks.py
    lines: 9-14
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
    sha256: b09fd8f485e67b8257da9e58db7804fa7084390b05f56a42cf5503a71b39b63d
