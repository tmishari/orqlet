unknowns:
- id: U-1
  what: No test was found that installs into two project roots with different project context (profile,
    registry or conventions) and compares the results. Searches of tests/ for 'two projects', 'second
    project', 'project_id' and 'projects/' found none. The fault tests use several roots copied from one
    fixture, each with its own data dir, and SequentialIds gives each project the same first id.
  material: true
- id: U-2
  what: No test was found that runs `upgrade` on an AGENTS.md holding team text outside the baseline block.
    Team text is covered for init (test_init_project.py 461-469), for rollback (test_lifecycle.py 456-467)
    and, for upgrade, only on the PR template (test_m1_acceptance.py 77-114).
  material: true
- id: U-3
  what: What happens during upgrade when a file whose blocks are already in the lock has broken or duplicate
    markers. The BlockError branch (changeplan.py 226-247) keeps no record for those blocks, so the rewritten
    lock may drop the AGENTS.md entry. This was not run, and the only test (test_changeplan.py 217-224)
    starts with no records.
  material: true
- id: U-4
  what: Whether any command removes a proposal file under .orqlet/proposals/ after the change was merged
    by hand. No delete path for proposals was found in changeplan.py, apply_plan.py or upgrade.py, and
    this repository still holds the versions proposal whose content is already in .orqlet/versions.yaml.
  material: true
- id: U-5
  what: Why .orqlet/proposals/.orqlet__role-bindings.yaml.diff has no non-empty line (a Grep for any character
    found no match), and whether an empty proposal is expected output.
  material: false
- id: U-6
  what: No test was found that checks generated or installed files for unresolved template placeholders.
    The only check is that each shipped template has exactly one `{{lines}}` slot (test_resources_golden.py
    364-377).
  material: true
- id: U-7
  what: Whether an upgrade with an unchanged workflow but a different CLI version writes only the lock.
    The lock records `generator.orqlet` (init_files.py 97-102) and is written whenever its bytes differ
    (changeplan.py 133-147), and no test isolates this case.
  material: true
- id: U-8
  what: Whether any test compares the files that init or upgrade actually write (after compose, plan and
    apply) with the golden files. The golden tests compare only `adapter.render` output (test_clients_golden.py
    37-44).
  material: true
- id: U-9
  what: Which four phase skills the request means. The package ships six skills (orqlet-design, orqlet-implement,
    orqlet-onboard, orqlet-plan, orqlet-research, orqlet-review; tests/support/render.py 32-39), and the
    request does not name them.
  material: true
- id: U-10
  what: Whether the checks in pyproject.toml and ci.yml pass at the base revision. None were run during
    this read-only research.
  material: false
contradictions:
- id: C-1
  sources:
  - src/orqlet/application/ports/change_journal.py:33-33
  - src/orqlet/application/usecases/release.py:97-97
  note: The journal port says the command is 'init', 'upgrade' or 'rollback', but release applies its
    plan with command 'release'.
- id: C-2
  sources:
  - src/orqlet/domain/changeplan.py:232-247
  - src/orqlet/domain/changeplan.py:333-334
  note: A BlockError on a file with desired blocks keeps no record for those blocks, while a BlockError
    on a file with only stray recorded blocks keeps the old records. The two branches handle recorded
    entries differently.
- id: C-3
  sources:
  - .orqlet/proposals/.orqlet__versions.yaml.diff:7-19
  - .orqlet/versions.yaml:1-14
  note: The proposal still shows pin 0.1.0 to 0.2.0 and workflow 0.3.1 to 0.3.3 as pending, yet the live
    versions file already holds the proposed values.
