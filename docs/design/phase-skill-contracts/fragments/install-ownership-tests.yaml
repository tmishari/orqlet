- id: A-10
  kind: flow
  statement: '`lock_from_recorded` writes the entries sorted by (path, block name). It stores the hash
    as `seeded_sha256` for seeded owners and `rendered_sha256` otherwise, and sets `generator.orqlet`
    to the given CLI version. `recorded_from_lock` does the reverse and takes the block name from the
    stored begin marker.'
  evidence:
