- id: A-17
  kind: flow
  statement: '`to_desired` always sets `insert_after_heading=False` and carries the render''s inputs.
    `merge_rendered` turns identical files from several clients into one and raises `MergeError` when
    two clients render the same path or block with different bytes.'
  evidence:
  - path: src/orqlet/application/usecases/init_files.py
    lines: 48-74
    revision: e6fe500eb3ed03d043e27975d5fb24b08113cda0
