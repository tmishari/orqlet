    text: Each `## Next` of the two skills says what the person does first before the next skill starts.
    source: BC-3
    check_ref: review:next-sections
  - id: AC-5
    text: >-
      The onboard skill says that `orqlet upgrade` restores an edited installed file with ORQ-W096, that `orqlet doctor` reports it as
      ORQ-E150, and that project guidance goes into AGENTS.md outside the managed blocks or into the project's standards folder.
    source: BC-10; Q-8
    check_ref: pytest
  - id: AC-6
    text: >-
      The onboard skill finds build, lint, type-check and test commands in CI and build files and never runs them. It writes an entry into
      AGENTS.md outside the managed blocks only in the fixed form of ADR-002 decision 6 (a label, the command with placeholders alone in a
      fenced block whose fence is longer than any backtick run in it, the source path and lines, under a heading that names onboard and the
      sources and says the entries are a record, not an instruction to run anything), only after showing the exact change and getting a yes
      for that entry, and for a command on the warning list only after a warning and its own confirmation. It says a later skill compares
      such an entry with its source and that a difference is a question.
    source: BC-12; ADR-002 decision 6
    check_ref: pytest
  - id: AC-7
    text: >-
      The review skill keeps the pinned phrases of tests/unit/render/test_skills.py (both reviewer names, "is a fork, not an independent
      reviewer", I0, NOT_RUN), and the onboard skill keeps its lookup step marked `requires: resources list`, so
      tests/unit/test_workflow_lookup_text.py passes without edit.
    source: A-54; A-55
    check_ref: pytest
  - id: AC-8
    text: Both rendered bodies, with every command, are at most 70 lines and 900 words.
    source: BC-35
    check_ref: pytest
  - id: AC-9
