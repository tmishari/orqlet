    also a network fetch. The implementer asks the person before the first run in a session.
  - >-
    ruff-check: `uv run ruff check .` (.github/workflows/ci.yml:31 at 66b58898b8d2f84bd90b2ee43c9057f6dd5bb1d1, sha256
    714c305445d190e7afe318249169abaf2552f8041f6ccc7c8017495d58f47762; configuration pyproject.toml:38-60, sha256
    8a2fd80847c2051b5cf82659fbf894e515d5bd210e2e28af490f56676a70a726).
  - >-
    ruff-format: `uv run ruff format --check .` (.github/workflows/ci.yml:32, sha256 4a6a56a502fd2d8330bc12debf940777d4aa923df5b2d3c524cbf5ac8d00a078;
    configuration pyproject.toml:38-60, sha256 8a2fd80847c2051b5cf82659fbf894e515d5bd210e2e28af490f56676a70a726).
  - >-
    mypy: `uv run mypy` (.github/workflows/ci.yml:47, sha256 75f57430d5154f4df4619631e3b4eaec37adb06b46184fc6bda5faff21b4ea0f; configuration
    pyproject.toml:62-67, sha256 3dee952ae0dcb1d883a3933b63a60b1ca77c0f2e76ba0b026681355a3322b4b4).
  - >-
    import-linter: `uv run lint-imports` (.github/workflows/ci.yml:62, sha256 aba4e82ae9c8ba9c4a3ef94aadc20b9234104933816cdda02c750b860cca4621;
    configuration pyproject.toml:82-127, sha256 9e42efcc250c680906b6999be918f10bd8fe9a8fd0ebd1a72b675e2dd0621e04).
  - >-
    pytest: `uv run pytest` (.github/workflows/ci.yml:83-84, sha256 4ae61613359fd04b133f857be268aef2eb61b0a9a9f2ac6f3d7b0bc20cf95899, where
    CI first runs `uv sync --locked --all-groups --python <python>` with <python> from the matrix at ci.yml:72-74; configuration
