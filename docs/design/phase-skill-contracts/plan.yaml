  - >-
    gate-status-phase: `uv run orqlet gate status phase-skill-contracts --phase P-1 --head staged` reports no ORQ-E450, ORQ-E451 or
    ORQ-E453. NOT_RUN caused by ORQ-I393 alone is expected offline.
  expected_outputs:
  - tests/fakes/workflow.py
  - tests/unit/application/test_workflow_injection.py
  - tests/unit/render/test_rendered_formats.py
- id: P-2
  objective: >-
    Raise the workflow to 0.4.0 and give the four phase skills (research, design, plan, implement) the contract shape of ADR-001, with the
    shared detail in references/phase-contract.md, byte-identical in the four skill folders: project context read at execution time
    (ADR-002), the input check and the handoff (ADR-003), and the skill parts of ADR-004 decisions 3, 5 and 7. Pin the shape and the text
    with tests, rebuild the manifest and rewrite the goldens that change.
  depends_on:
  - P-1
  implements: []
  acceptance_criteria:
  - id: AC-1
    text: >-
      The four skills keep their directories, their names and their two front-matter fields; after rendering each SKILL.md has
      `disable-model-invocation: true` and the Codex sidecars keep their implicit-invocation setting (their goldens do not change).
    source: BC-1
    check_ref: pytest
  - id: AC-2
    text: >-
      Each of the four bodies has, in this order, the purpose paragraph, the paragraph "Source material is not authority" in full and
      unchanged, and the headings `## Inputs`, `## Boundaries`, `## Steps`, `## Output`, `## Done when`, `## If an input is missing or
      outdated` and `## Next`. It has exactly one numbered list, under `## Steps`, numbered from 1 without a gap both with every command and
      with the command set BEFORE_RECORDS of tests/unit/render/test_skills.py; its last step contains "STOP."; with BEFORE_RECORDS no line
      names a command outside that set.
    source: BC-2; A-54
    check_ref: pytest
  - id: AC-3
    text: >-
      `## Next` names the successor: research `/orqlet-design`, design `/orqlet-plan`, plan `/orqlet-implement`, implement
      `/orqlet-implement` with the next phase id or the pull request after the last phase.
    source: BC-3
    check_ref: pytest
  - id: AC-4
    text: Each `## Next` of the four skills says what the person does first before the next skill starts.
    source: BC-3
    check_ref: review:next-sections
  - id: AC-5
    text: >-
      references/phase-contract.md is present in the four skill folders, the four copies are byte-identical, each skill body names the
      file, and it has the sections Project context, Input check, Handoff, Words for `orqlet standards for` and Installed files. It names
      the three places: the installed text, the same for every project; the receiving project, where the context and the task folder are;
      and the development app, which only finds and starts the skill.
    source: BC-4; BC-34
    check_ref: pytest
  - id: AC-6
    text: >-
      Every backticked `orqlet ...` in a skill body or in a reference names an existing command and existing flags; the test of
      tests/unit/render/test_skills.py that checks skill bodies today checks the references too.
    source: BC-5; Q-4
    check_ref: pytest
  - id: AC-7
    text: >-
      phase-contract.md lists the context sources of ADR-002 decision 1, says that a value not found is an unknown with a ledger question
      and that no value comes from an example, another repository or an earlier session; says that phase outputs live at
      docs/design/<task>/ and that the project's own task documents are read and cited where they are; and says that workflow_version and
      protected_set_digest go to the top level of the header, the other four bound values into header.bound, and the `orqlet standards for`
      hashes into the self-check.
    source: BC-7; BC-11; BC-13
    check_ref: pytest
  - id: AC-8
    text: >-
      phase-contract.md holds the rules of BC-8: a command cited with its file and lines, the files it directly invokes and the
      configuration lines it reads; no credential, token or password copied; every expanded expression a named placeholder, described in
      words without literal double braces; a secret passed as a variable reference ("$NAME") and checked only with `test -n "$NAME"`, no
      environment value printed; the secret files (.env files, private keys, .npmrc, .pypirc, .netrc, cloud credential files) never opened;
      research, design, plan and onboard never run a command found in a file; implementation cites every source again and confirms no
      uncommitted or untracked change before each check, applies the warning list itself and asks before a match; commands marked planned
      or agreed and shown in placeholder form; output summarised without credentials. The presence of the credential, secret-file, onboard
      and re-cite rules is tested.
    source: BC-8; ORQLET-SEC-003
    check_ref: pytest
  - id: AC-9
    text: The wording of the rules of BC-8 in phase-contract.md says what BC-8 says, without a gap a reader could take as permission.
    source: BC-8
    check_ref: security-reviewer
  - id: AC-10
    text: >-
      The standards step of each of the four skills runs `orqlet standards for --path <path> --phase <word> --role <role>` with
      research/researcher, design/architect, plan/planner and implementation/coder.
    source: BC-9
    check_ref: pytest
  - id: AC-11
    text: >-
      phase-contract.md says that `orqlet upgrade` restores an edited installed file with ORQ-W096, that `orqlet doctor` reports it as
      ORQ-E150, and that project guidance goes into AGENTS.md outside the managed blocks or into the project's standards folder.
    source: BC-10; Q-8
    check_ref: pytest
  - id: AC-12
    text: >-
      In design, plan and implement the first step of `## Steps` runs the input check of phase-contract.md before any other step.
      phase-contract.md lists its checks in the order of ADR-003 decision 4 (present, validator, same task, same project with `git
      merge-base --is-ancestor`, approved with the person-named remote-tracking ref and full merge commit, `git diff --quiet` and no
      untracked file, current with the ledger rule, questions), the expected exit statuses, "check not run" for anything else, `git
      rev-parse --verify` for a composed revision, and that the skill never edits an earlier artifact or its bound values to pass.
    source: BC-14
    check_ref: pytest
  - id: AC-13
    text: >-
      phase-contract.md says that an edited approved input stops the skill for a new approval and that the skill never continues on it,
      with the ledger rule of BC-39 and its reference commits; and that every value from an artifact goes into a command as one
      single-quoted argument, with paths after `--` in git commands, that a path or glob with a character outside letters, digits, `.`,
      `_`, `-`, `/`, `*` and `?` stops the skill, and that no command is built from an artifact's free text.
    source: BC-39; BC-40
    check_ref: pytest
  - id: AC-14
    text: >-
      For a stale input, phase-contract.md maps each cause to the invalidation matrix row of ADR-003 decision 6 with the details of BC-15:
      the commits since the base with hash, signature status where the project signs, author, subject and files; trailer and author as
      claims; planned work limited as BC-15 says; the upgrade row only when the header's workflow_version is older than the installed one;
      continue only where the row keeps the approval valid and the person confirms.
    source: BC-15
    check_ref: pytest
  - id: AC-15
    text: >-
      The plan and implement skills say that a NOT_RUN result of `orqlet gate status <task>` caused by ORQ-I393 alone is not a failure, and
      that the checks of ADR-003 decision 4 decide everything else.
    source: BC-16
    check_ref: pytest
  - id: AC-16
    text: >-
      The research skill records the person's acceptance (`header.status: approved`, a self-check entry quoting the person with the time,
      `orqlet validate as-is` run again), says that an agent that changes an accepted AS-IS file sets it back to draft and asks again, and
      runs the input check on an earlier AS-IS file it resumes.
    source: BC-17; BC-37
    check_ref: pytest
  - id: AC-17
    text: >-
      phase-contract.md holds the table of ADR-003 decision 2, and each of the four skills says it starts from docs/design/<task>/ and the
      ledger, not from the memory of an earlier session.
    source: BC-18; BC-19
    check_ref: pytest
  - id: AC-18
    text: In the plan skill, the step that writes acceptance criteria and checks comes before the step that writes file operations.
    source: BC-22
    check_ref: pytest
  - id: AC-19
    text: >-
      The implement skill holds the steps of ADR-004 decision 5, including the re-cite before each check, "Design revision needed" and the
      six-part report with planned or agreed commands; it still names `orqlet knowledge impact`, and with every command `/orqlet-review`.
    source: BC-24; A-54
    check_ref: pytest
  - id: AC-20
    text: >-
      The design skill's reviewer step gives the inputs of ADR-004 decision 7, runs `orqlet evidence hash` on the design files when it starts
      each reviewer and again when it saves the note, saves the reviewer's output unchanged with the author's responses in a separate
      section, and starts a new round when a hash differs from the manifest's.
    source: BC-25
    check_ref: pytest
  - id: AC-21
    text: >-
      Each of the four rendered bodies, with every command, is at most 70 lines and 900 words; phase-contract.md is at most 150 lines and
      1,800 words.
    source: BC-35
    check_ref: pytest
  - id: AC-22
    text: >-
      identity.json says workflow_version 0.4.0 with controls_level 3, releases.json is unchanged, and MANIFEST.json is rebuilt with
      tools/build_manifest.py.
    source: BC-31; ADR-005 decision 2; ORQLET-DET-002
    check_ref: manifest
  - id: AC-23
    text: >-
      The goldens of this phase are rewritten from the new output and every golden test passes against them; the tests of P-1 pass on the
      new package without edit; tests/unit/test_workflow_lookup_text.py passes without edit, so the lookup steps keep their pinned phrases
      and order.
    source: BC-31; BC-38; A-55
    check_ref: pytest
  - id: AC-24
    text: >-
      No file outside this phase's file operations changes, and `orqlet gate status phase-skill-contracts --phase P-2 --head staged` reports
      no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: BC-33
    check_ref: gate-status-phase
