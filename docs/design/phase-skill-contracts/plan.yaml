knowledge_scope: []
phases:
- id: P-1
  objective: >-
    Prove the existing injection mechanisms with tests, before any workflow text changes (ADR-005 decision 1): two projects get the same
    workflow files and nothing of each other, a repeated upgrade writes nothing, AGENTS.md team text survives, edited skills and references
    are reported and restored, every rendered file parses and holds no unresolved template text, and what init writes equals the goldens.
    No file of the workflow package changes in this phase.
  depends_on: []
  implements: []
  acceptance_criteria:
  - id: AC-1
    text: >-
      Two projects initialised from two fixture repositories whose profiles differ in name, kind and technologies (for example uv_fastapi
      and rust_cli), with the same three clients, no resource registry and distinct project uuids (SequentialIds with a different start for
      each), receive byte-identical workflow SKILL.md, reference and role files. No such file written into one project contains the other
      project's name, its uuid or a technology that only the other declares.
    source: BC-6; A-59
    check_ref: pytest
  - id: AC-2
    text: >-
      After a workflow change that changes a skill body and a reference (not only the baseline), a first `orqlet upgrade` writes the changed
      SKILL.md and reference, and a second `orqlet upgrade` right after it plans nothing and writes nothing.
    source: BC-27; A-59
    check_ref: pytest
  - id: AC-3
    text: >-
      An upgrade over an AGENTS.md that holds team text before, between and after the managed blocks keeps that text byte-identical and
      leaves exactly one copy of each managed block.
    source: BC-28
    check_ref: pytest
  - id: AC-4
    text: >-
      With an installed SKILL.md and an installed reference edited by hand, `orqlet doctor` reports ORQ-E150 for each; the following
      `orqlet upgrade` restores both files to the rendered bytes and reports ORQ-W096 for each.
    source: BC-29
    check_ref: pytest
  - id: AC-5
    text: >-
      For the packaged request, the resources request and a request with one integration, every file that each client adapter renders parses
      in its format: the front matter of a Markdown file with the strict YAML loader, a `.toml` file with tomllib, a `.yaml` or `.yml` file
      with the strict YAML loader, a `.json` file with json. No rendered file contains `{{`, `}}`, `<!-- requires:` or `<!-- unless:`.
    source: BC-30; U-12
    check_ref: pytest
  - id: AC-6
    text: >-
      On a project with no registered resources and no integration, the files that `orqlet init` writes for the three clients at the workflow
      skill, reference and role paths equal the committed goldens byte for byte. The rule files, which the goldens take from SAMPLE_RULES,
      are not compared.
    source: BC-38
    check_ref: pytest
  - id: AC-7
    text: >-
      ChangedWorkflow keeps its current behaviour when no skill or reference change is asked for, so every existing test that uses it passes
      without edit; the new option changes the named skill body and reference only.
    source: A-59; ORQLET-TEST-001
    check_ref: pytest
  - id: AC-8
    text: >-
      The new tests use the fakes of tests/fakes and the support of tests/support, open no socket, and hold no credential; any command or
      value in a fixture is an obvious placeholder.
    source: ORQLET-TEST-001; ORQLET-SEC-003
    check_ref: security-reviewer
  - id: AC-9
    text: >-
      No file outside this phase's file operations changes, in particular no file under src/orqlet/, and `orqlet gate status
      phase-skill-contracts --phase P-1 --head staged` reports no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: BC-33; ADR-005 decision 1
    check_ref: gate-status-phase
  checks:
  - ruff-check
  - ruff-format
  - mypy
  - import-linter
  - pytest
  - gate-status-phase
  file_operations:
  - op: modify
    path: tests/fakes/workflow.py
    why: >-
      ChangedWorkflow gains an optional change of one skill body and one reference, so the upgrade tests change a skill and a reference and
      not only the baseline and the PR template (A-59; component.md, Constraints for the plan). The default stays as it is.
  - op: create
    path: tests/unit/application/test_workflow_injection.py
    why: >-
      The injection tests of ADR-005 decision 1: two projects (BC-6), two upgrades in a row (BC-27), AGENTS.md team text (BC-28), edited
      SKILL.md and reference (BC-29), and what init writes against the goldens (BC-38), on the fakes of tests/fakes (ORQLET-TEST-001).
  - op: create
    path: tests/unit/render/test_rendered_formats.py
    why: >-
      Every file each adapter renders parses in its format and holds no template braces or unrendered step markers (BC-30), for the
      packaged request, the resources request and a request with one integration.
  review_evidence:
  - architecture-reviewer
  - security-reviewer
  - tester
  knowledge_step: required
  completion:
  - >-
    Environment: every `uv run` command below may sync the environment from uv.lock and fetch packages when it is not in sync (warning list
    of ADR-002 decision 6: fetches from the network). CI prepares it with `uv sync --locked --all-groups --python 3.12`
