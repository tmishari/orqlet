- id: Q-2
  key: 136220fa49cf6975d7ed27cdfa0d8bbcef8ff537208c5cd2e16439dbf547ec52
  subject: How the phases and approvals proceed for this request
  raised_by: researcher
  phase: research
  category: policy
  text: The request ends with "implement, then report", while the baseline requires research, design, plan and implementation with a person approving the design and the plan. How should the work proceed?
  why: The phase skills define approval as the merge of the design and plan pull requests, so the answer decides what this session may produce.
  options:
  - Follow the gated workflow; this session produces the AS-IS only
  evidence_refs:
  - AGENTS.md
  - src/orqlet/workflow/skills/orqlet-design/skill.md
  - src/orqlet/workflow/skills/orqlet-plan/skill.md
  blocks:
  - research
  - design
  - plan
  - implement
  status: answered
  answer:
    value: Follow the gated workflow. This session produces the AS-IS only; the design and the plan each go through their pull request before implementation.
    answerer: user
    time: '2026-11-02T09:40:00+02:00'
    scope: task
- id: Q-3
  key: e054d966b79f7b390a6c35070c06905dcd47209ac6d02b308b1372f602d3a560
  subject: Kinds of change in scope
  raised_by: researcher
  phase: research
  category: requirement
  text: Which kinds of change are in scope - skill texts and references, artifact contracts with their schemas and validators, rendering and installation code?
  why: The AS-IS contract has no field for inferences and the plan contract has no separate test-plan section, so some requested outputs would need a contract change unless they live in text only.
  options:
  - Skill texts and their reference files (src/orqlet/workflow/skills/**)
  - Artifact contracts, JSON schemas and validators where a phase output needs a new field
  - Rendering and installation code, if project context must reach installed skills in a new way
  - Leave the boundary to the Design phase
  evidence_refs:
  - src/orqlet/workflow/skills/orqlet-research/references/as-is-format.md
  - src/orqlet/workflow/skills/orqlet-plan/references/plan-format.md
  blocks:
  - research
  - design
  status: answered
  answer:
    value: Skill texts and their reference files only.
    answerer: user
    time: '2026-11-02T09:40:00+02:00'
    scope: task
- id: Q-4
  key: a0d1fc7a8f49e524ec6be7a7d2285744d0d9173bf3a36bf0bb118c76fd169e78
  subject: Whether the design may add CLI commands or options
  raised_by: researcher
  phase: research
  category: requirement
  text: May the design add a CLI subcommand or option to bring project context to the skills, or must it use only existing commands and files?
  why: Project context reaches agents today through the AGENTS.md managed block, `orqlet standards for` and the project profile; skill bodies carry no project values.
  options:
  - Existing commands and files only
  - An additive subcommand or option if a concrete gap needs it
  - Undecided; let Design propose with alternatives
  evidence_refs:
  - src/orqlet/application/usecases/render_request.py
  - src/orqlet/application/contracts/profile.py
  blocks:
  - design
  status: answered
  answer:
    value: Existing commands and files only.
    answerer: user
    time: '2026-11-02T09:40:00+02:00'
    scope: task
- id: Q-5
  key: 65b5092e6e626c8318d5a887fd217c8d360fc92caf2992a0b84f32b636b5561f
  subject: Whether a receiving project can choose the location of phase outputs
  raised_by: researcher
  phase: research
  category: requirement
  text: Phase outputs live at docs/design/<task>/. Should a receiving project be able to choose another location?
  why: The request asks the skills to use the receiving project's existing locations for task documentation and phase outputs.
  options:
  - No; keep docs/design/<task>/ and state it in the skills
  - Yes; make it configurable per receiving project
  - Undecided; let Design decide
  evidence_refs:
  - src/orqlet/application/usecases/validation.py
  blocks:
  - design
  status: superseded
- id: Q-6
  key: a4599b4db97a895dfe0d930a719e823dbe4ba04f3a164bd74c98be59743190c6
  subject: Workflow sources in scope besides the four phase skills
  raised_by: researcher
  phase: research
  category: requirement
  text: Besides the four phase skills and their references, which workflow sources are in scope - the role prompts they start, the orqlet-review skill, the orqlet-onboard skill?
  why: The four skills start the roles and the implement skill runs the review skill, so a contract change can reach them.
  options:
  - Only the four skills and their reference files
  - Also the role prompts they start, where the contract requires it
  - Also the orqlet-review skill, where the handoff requires it
  - Also the orqlet-onboard skill
  evidence_refs:
  - src/orqlet/workflow/skills/orqlet-implement/skill.md
  - src/orqlet/workflow/skills/orqlet-research/skill.md
  blocks:
  - research
  - design
  status: answered
  answer:
    value: The four skills with their references, and also the role prompts they start, the orqlet-review skill and the orqlet-onboard skill.
    answerer: user
    time: '2026-11-02T09:40:00+02:00'
    scope: task
- id: Q-7
  key: 4d534dcff10755d5c19ce5a65327f16b3f96f75cac2dc3c12fd58a3b6292d0d1
  subject: Whether this repository's own installed files are regenerated
  raised_by: researcher
  phase: research
  category: requirement
  text: Should this task also regenerate this repository's own installed files with `orqlet upgrade`?
  why: An earlier task regenerated the repository's own Orqlet files in its last phase.
  options:
  - Yes, as the last plan phase
  - No, only the CLI source, package and tests
  blocks:
  - plan
  status: answered
  answer:
    value: Yes, as the last plan phase.
    answerer: user
    time: '2026-11-02T09:40:00+02:00'
    scope: task
- id: Q-8
  key: 60cd280c6ffb88409cc46c5cb7665e7beab983b0d8e1733899dec2ba0e9d0c95
  subject: How an installed skill file that a person edited locally is handled on upgrade
  raised_by: researcher
  phase: research
  category: requirement
  text: Installed SKILL.md and reference files are protected. `orqlet upgrade` restores an edited one and warns with ORQ-W096, and `orqlet doctor` reports it as ORQ-E150. Does this behaviour satisfy "local edits are detected and handled explicitly", or should a local edit to an installed skill survive an upgrade?
  why: Q-3 limits the change to skill texts and references, so a different handling of edited skill files would need a ruling against Q-3 or another route.
  options:
  - Keep the current behaviour (restore with ORQ-W096, report with ORQ-E150) and state it in the skills
  - A local edit to an installed skill must survive an upgrade
  - Undecided; let Design propose with alternatives
  evidence_refs:
  - src/orqlet/domain/classify.py
  - src/orqlet/application/usecases/upgrade.py
  - src/orqlet/application/usecases/diagnose.py
  blocks:
  - design
  status: answered
  answer:
    value: Keep the current behaviour (restore with ORQ-W096, report with ORQ-E150) and state it in the skills.
    answerer: user
    time: '2026-11-02T10:25:00+02:00'
    scope: task
- id: Q-9
  key: 6562c9a72d21c3c969f1601834409f53a59ede6cb449248fb8af89e85a5656cf
  subject: Where phase outputs live after the ruling on conflict C-1
  raised_by: architect
  phase: design
  category: requirement
  text: The answer to Q-5 (a location chosen per receiving project) conflicts with Q-3, Q-4 and the validators that fix docs/design/<task>/ (C-1). Where do phase outputs live, and how do the skills treat the project's own task documentation?
  why: The design cannot make the location configurable without changing contracts, validators and commands, which Q-3 and Q-4 exclude.
  options:
  - Keep phase outputs at docs/design/<task>/; the skills read the project's existing task documentation wherever it already lives
  - Same, and make the location configurable in a separate follow-up task
  - Make it configurable now, widening Q-3 and Q-4
  evidence_refs:
  - docs/design/phase-skill-contracts/as-is.md#U-7
  - docs/design/phase-skill-contracts/as-is.md#C-1
  blocks:
  - design
  status: answered
  answer:
    value: Keep phase outputs at docs/design/<task>/. The skills read the project's existing task documentation wherever it already lives.
    answerer: user
    time: '2026-11-02T10:25:00+02:00'
    scope: task
  supersedes:
  - Q-5
- id: Q-10
  key: 05c33555941ebf71b85307f42f2487ed4a26c7db9ca3f72094f920af0ce0aa28
  subject: How the plan treats the open minor findings of the design review
  raised_by: planner
  phase: plan
  category: policy
  text: The design reviews left eleven minor findings open (F5-1 to F5-7 of the architecture reviewer, SEC5-1 to SEC5-4 of the security reviewer). Does the plan apply them, or plan the design as it merged?
  why: Applying a finding in the plan would change what the approved design says without a new design approval.
  options:
  - Plan the design as merged and list the findings as open in the plan's self-check
  - Revise the design first and approve it again
  evidence_refs:
  - docs/design/phase-skill-contracts/reviews/architecture-reviewer-design.md
  - docs/design/phase-skill-contracts/reviews/security-reviewer-design.md
  blocks:
  - plan
  status: answered
  answer:
    value: Plan the design as merged. The plan lists the eleven findings in its self-check as open and not applied, and a later design revision takes them up.
    answerer: user
    time: '2026-11-02T12:45:00+02:00'
    scope: task
- id: Q-11
  key: 4ea21e769842b8cf03ad6e15e0d2beecb51b57408d65e64da0488096053fc1ac
  subject: Whether the plan includes the session checks V-1 to V-3
  raised_by: planner
  phase: plan
  category: test-expectation
  text: ADR-005 decision 5 leaves the session checks V-1 to V-3 unverified until a person runs them in a client. Does the plan add a phase in which the person runs them, or list them under self_check.unverified?
  why: Whether the clients load the new reference and follow the sections is documented, not observed (U-11); only a person in a client can observe it.
  options:
  - Add a last phase in which the person runs them and writes one record per check
  - List them under self_check.unverified
  evidence_refs:
  - docs/design/phase-skill-contracts/design/adr-005-injection-unchanged-tests-and-version.md
  blocks:
  - plan
  status: answered
  answer:
    value: Add a last phase in which the person runs them after the regeneration and writes one record per check under evidence/checks/. A check the person does not run is reported as not run.
    answerer: user
    time: '2026-11-02T12:45:00+02:00'
    scope: task
- id: Q-12
  key: e9f7913a62047880b92ff5ac84c33014f5a62065af0eb238e66588aa21e02b2e
  subject: How BC-6 treats a technology named as a generic example in a shipped skill, reference or role text
  raised_by: architecture-reviewer
  phase: implement
  category: requirement
  text: The P-1 test of BC-6 counts a whole word, in its declared case, of a technology that only the other project declares as a leak, even in text the package ships the same to every project. ADR-002 decision 3 gives the example "a Python version", which P-2 would carry into phase-contract.md, and P-2 to P-5 may not edit the tests of P-1. Do the texts of P-2 to P-5 avoid those words, or does BC-6 tell a shared example from an injected project value?
  why: Without an answer, a later phase that writes the example of ADR-002 fails the P-1 test and stops for a plan amendment.
  options:
  - Write generic examples, such as "a language version"; no skill, reference or role text names Python, Flask, pip, Rust, clap, SQLx, Tokio or Kafka as a word
  - Change the P-1 test to count a technology word as a leak only when the packaged render of the same path does not already contain it
  evidence_refs:
  - docs/design/phase-skill-contracts/design/adr-002-project-context-read-at-execution-time.md
  - tests/unit/application/test_workflow_injection.py
  - docs/design/phase-skill-contracts/reviews/architecture-reviewer-P-1-r1.yaml
  - docs/design/phase-skill-contracts/reviews/architecture-reviewer-P-1-r2.yaml
  - docs/design/phase-skill-contracts/reviews/architecture-reviewer-P-1-r3.yaml
  blocks:
  - implement
  status: answered
  answer:
    value: Write generic examples, such as "a language version". No skill, reference or role text of P-2 to P-5 names Python, Flask, pip, Rust, clap, SQLx, Tokio or Kafka as a word, and the P-1 test stays as it is. The person gave this answer in the P-1 session on 2026-11-02 (the minute was not recorded); the time below is when it was written here, at the start of P-2.
    answerer: user
    time: '2026-11-03T06:20:00+02:00'
    scope: task
- id: Q-13
  key: f446b651661a05dcf41cfcddb58230fa80080fb08575609932c5174eab4597f9
  subject: A property test outside every phase file list that fails in the full pytest run of a phase
  raised_by: coder
  phase: implement
  category: test-expectation
  text: The first full pytest run of P-5 failed test_generated_entries_without_a_reference_give_an_empty_tuple in tests/unit/domain/test_mcp_credentials_properties.py, a property test of the mcp-or-plugins task that no phase of this plan lists. Its strategy removed bearer_token_env_var from the top-level keys only, while referenced_variables reads that key at every depth, and Hypothesis generated a nested entry that holds it. The plan says that a test outside a phase's list that changes needs a plan amendment. Is the strategy fixed on this branch, and how?
  why: The failing example is saved in the local Hypothesis database, so every later local pytest run of this task replays it and fails, and P-5 cannot pass its pytest check.
  options:
  - Fix the strategy in its own test-only commit on this branch, separate from P-5, then run pytest again and continue P-5
  - Record pytest as FAIL for P-5 and fix the test in a separate pull request
  - Stop P-5
  evidence_refs:
  - tests/unit/domain/test_mcp_credentials_properties.py
  - src/orqlet/domain/mcp_credentials.py
  - docs/design/phase-skill-contracts/plan.yaml
  blocks:
  - implement
  status: answered
  answer:
    value: Fix the strategy in its own test-only commit on this branch, separate from P-5, then run pytest again and continue P-5. The fix is commit 43c21cf, which applies the same key filter to the nested dictionaries; the full pytest run after it passed. The person gave this answer in the P-5 session on 2026-11-03 (the minute was not recorded); the time below is when it was written here, after the P-5 architecture review asked for the record (finding F-1 of round 1).
    answerer: user
    time: '2026-11-03T19:45:00+02:00'
    scope: task
- id: Q-14
  key: f35d50084c87338800f4e7174bd12dbfe4c68bade50e47c6d7f825d1ef198348
  subject: How a phase treats a non-blocking security finding whose fix goes beyond the phase acceptance criteria but stays inside its file list
  raised_by: security-reviewer
  phase: implement
  category: policy
  text: Security review round 1 of P-5 found that the inventory and tracer roles lacked the credential and secret-file rules of the implement skill's phase-contract.md (lines 26 and 27), and that the tester lacked its quoting, placeholder, secret and output-summary rules (lines 26, 31 and 37). BC-26 does not ask for these rules, so P-5 met its criteria, but the three role files are in P-5's file list. Does P-5 add the rules in a rework round, or are they recorded for the design revision?
  why: The rules widen the role texts beyond the acceptance criteria that the person approved, although ADR-002 decision 3 already states them and the files are inside the file list.
  options:
  - Add the rules to the three roles in P-5's own files as rework round 2, tests first, then redo the records and reviews
  - Record the gaps for the design revision that takes up the open design findings
  evidence_refs:
  - docs/design/phase-skill-contracts/reviews/security-reviewer-P-5-r1.yaml
  - docs/design/phase-skill-contracts/reviews/architecture-reviewer-P-5-r2.yaml
  - docs/design/phase-skill-contracts/design/adr-002-project-context-read-at-execution-time.md
  - src/orqlet/workflow/skills/orqlet-implement/references/phase-contract.md
  blocks:
  - implement
  status: answered
  answer:
    value: Add the rules to the three roles in P-5's own files as rework round 2, tests first, then redo the records and reviews. The rules are in commit 08e8a16; both round 2 reviews passed. The person gave this answer in the P-5 session on 2026-11-03 (the minute was not recorded); the time below is when it was written here, after the P-5 architecture review asked for the record (finding F-1 of round 2).
    answerer: user
    time: '2026-11-04T09:29:00+02:00'
    scope: task
- id: Q-15
  key: 721634dcc57c6f008d352e047affcd1982b70c495caace151392197f826028cd
  subject: How P-5 treats the two non-blocking security gaps left after its review round 2
  raised_by: security-reviewer
  phase: implement
  category: policy
  text: After rework round 2 of P-5 two non-blocking gaps remain. The tester, the one role with full tools, carries no rule against opening files that hold secrets (phase-contract.md line 27). Neither reviewer prompt says how to report a credential that it finds without reproducing it, while the design skill saves each design-review note unchanged and commits it. Neither BC-25 nor BC-26 asks for these rules. Does P-5 add them in a last rework round, or are they recorded for the design revision?
  why: A third rework round is the last that the implement skill allows, and the rules would again widen the role texts beyond the acceptance criteria.
  options:
  - Accept P-5 as it is and record both gaps for the design revision, together with SEC5-3
  - Add the secret-file rule to the tester and the no-reproduce rule to both reviewers in rework round 3
  evidence_refs:
  - docs/design/phase-skill-contracts/reviews/security-reviewer-P-5-r2.yaml
  - docs/design/phase-skill-contracts/reviews/security-reviewer-design.md
  - docs/design/phase-skill-contracts/plan.yaml
  blocks:
  - implement
  status: answered
  answer:
    value: Accept P-5 as it is and record both gaps for the design revision, together with SEC5-3; P-5 is commit 08e8a16. The person gave this answer in the P-5 session (the minute was not recorded); the time below is when it was written here.
    answerer: user
    time: '2026-11-04T09:29:00+02:00'
    scope: task
- id: Q-16
  key: feac9881459e7cd705eec3b0a90559f14241e7fa034144ac9233ea1be3946282
  subject: Regression tests that tie README statements to what the package ships
  raised_by: tester
  phase: implement
  category: test-expectation
  text: P-6 checks the README by review only, and its tester found no criterion that needs a test the plan does not list. It named three optional regression tests that no test covers today - the count of files that init writes for the three clients (README.md line 132), the workflow version of the block marker example against identity.json (README.md line 205), and that every backticked orqlet command in the README names an existing command and its existing options, as BC-5 checks for skill bodies. Without them each statement can go stale at the next release with no failing test. Does this task add them by a plan amendment, or does a later task take them up?
  why: Each test changes a file that no phase of this plan lists, so adding it here is a plan amendment.
  options:
  - Record them for a later task; this plan stays as approved
  - Amend the plan and add them in this task
  - Drop them
  evidence_refs:
  - docs/design/phase-skill-contracts/plan.yaml
  - docs/design/phase-skill-contracts/tests/P-6.yaml
  - README.md
  blocks:
  - implement
  status: answered
  answer:
    value: Record them for a later task; this plan stays as approved. P-6 is commit 0180a84, checked by review as the plan says.
    answerer: user
    time: '2026-11-04T10:01:00+02:00'
    scope: task
