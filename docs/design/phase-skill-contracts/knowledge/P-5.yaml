  reason: The phase changes the five shipped role prompts. Both reviewers gain the design-review sentence and
    descriptions that name both uses, the inventory researcher and the tracer report the project context of their area
    as facts and run no command they find, and the tester runs only the plan's test command after the same checks the
    Coder makes and never a marked command or one on the warning list. In rework round 2 the researchers also carry
    the credential and secret-file rules, and the tester the quoting, placeholder, secret and output-summary rules,
    that the implement skill's phase-contract.md already holds. What the roles now say is the approved design of this
    task (component.md BC-25 and BC-26, ADR-004 decision 7 and ADR-002 decisions 3 and 6), referenced below by hash.
    No knowledge document exists that the phase could change, because no knowledge sources are configured and the
    plan's knowledge_scope is empty. README.md lines 323-326 name the five subagents and say the tester writes the test
    files named in the plan, which stays true; phase P-6 rewrites that paragraph.
