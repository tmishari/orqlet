considerations:
  security: {state: affected, notes: "The 0.5.2 process, Git, strict reader, path, file-system, journal and hook controls are reimplemented with their full rule sets (ADR-007, EC-6); process creation becomes private to the Git module; some rules become stricter (option prefixes, oversized numbers, bounded reads, private modes, a data directory inside the repository refused per Q-16, UUID-only project ids, silent panics, no Git error output in messages); Cargo.toml, already read in 0.5.2, now also sets the project kind under fixed input rules; no new trust boundary."}
  compatibility: {state: affected, notes: "New major version 1.0.0; command line, codes, exit statuses, envelope and hash algorithms kept; rendered bytes, schema text, help and message wording change; 0.x journals are read only for their format and status and never rewritten (ADR-004)."}
  operations: {state: affected, notes: "Distribution changes from a Python package to a cargo-built binary; no CI; Linux and Windows are compiled and linted but not run (Q-15)."}
