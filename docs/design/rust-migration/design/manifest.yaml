expected_changes:
  - id: EC-1
    surface: public-api
    action: change
    identity: "command line: every orqlet command and group (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "The nine commands and ten groups of 0.5.2 keep their names, arguments and options. --json prints the orqlet.cli-result/v1 envelope with the same fields, sorted keys, two-space indent and raw UTF-8. Exit statuses 0, 1, 2, 3, 4, 5 and 70 and the ORQ codes keep their meaning; usage errors exit 2. --version prints 'orqlet 1.0.0'. Help text and library-sourced message wording may change. A Python-API surface is reported as NOT_RUN with a finding, never PASS."
    verification: manual
  - id: EC-2
    surface: persisted-schema
    action: change
    identity: "orqlet.project-profile/v1"
    expected_after:
      kind: declaration
      value: "project.kind accepts rust-cli besides python-cli, python-service and unknown. facts.python becomes optional; facts.rust (value and evidence) is added and optional; package_manager may be cargo. A rust-cli profile requires facts.rust and a Python kind requires facts.python. Every profile valid under 0.5.2 stays valid. The schema id does not change."
    verification: manual
  - id: EC-3
    surface: persisted-schema
    action: change
    identity: "workflow/schemas/*.json (the 35 shipped schemas) and workflow/MANIFEST.json"
    expected_after:
      kind: declaration
      value: "The schema files move from src/orqlet/workflow/schemas/ to workflow/schemas/ and are generated by schemars from the Rust contract types; their text changes once. The schema ids and the closed-object rule (additionalProperties false) stay. MANIFEST.json moves to workflow/ and keeps its fields and its per-file SHA-256 with CRLF read as LF; workflow_version is 1.0.0."
    verification: manual
  - id: EC-4
    surface: persisted-schema
    action: change
    identity: "rendered files and .orqlet/generated.lock.yaml of a managed project"
    expected_after:
      kind: declaration
      value: "orqlet.generated-lock/v1 keeps its fields. digest_of, the line-range hash and the file hash (SHA-256 with CRLF read as LF) give the same values as 0.5.2. Rendered YAML, JSON and Markdown bytes may differ. 1.0.0 reads a 0.5.x lock; upgrade re-renders files whose hash equals the recorded hash and treats others as edited. Journals and backups of 0.x are not replayed or rewritten; every journal reader (upgrade, the journalled applies, doctor, sync, rollback) reads only the format and status of a 0.x record."
    verification: manual
  - id: EC-5
    surface: dependency
    action: change
    identity: "build manifests and removed Python paths: pyproject.toml, uv.lock, src/orqlet/ and tools/ removed; Cargo.toml and Cargo.lock added"
    expected_after:
      kind: declaration
      value: "Runtime crates: clap, serde, serde_json, serde-saphyr, schemars, toml, sha2, unicode-normalization, a no_std Unicode general-category crate, similar, regex, include_dir, dirs, uuid (feature v4 only) and libc (Unix only), each with an exact = requirement in [workspace.dependencies] and locked in Cargo.lock. Exact per-crate allow-lists of direct dependencies (normal, dev, build) in xtask/src/arch.rs: orqlet-domain sha2, unicode-normalization and the category crate without default features; orqlet-application serde, serde_json, schemars, similar, regex; orqlet-adapters serde, serde_json, serde-saphyr, toml, include_dir, dirs, uuid, libc; orqlet-cli clap, serde, serde_json; xtask serde, serde_json, schemars. No dev-dependency outside these lists. Toolchain pinned to 1.100.0 in rust-toolchain.toml with the Linux and Windows targets. No language-model SDK. The Python runtime and dev dependencies of pyproject.toml are removed, together with src/orqlet/ (after its workflow data moved to workflow/), tools/, .venv and the Python caches (BC-14)."
    verification: manual
  - id: EC-6
    surface: security
    action: change
    identity: "process creation, Git invocation, strict YAML, JSON and TOML, paths, file-system confinement, journal and hook"
    expected_after:
      kind: declaration
      value: "The controls of ADR-007, each citing 0.5.2 source lines. std::process::Command appears in shipped code only in the process module, a private child of the Git module; tests and the xtask use it only under a scoped allow. GitRunner keeps the rules of git_runner.py, refuses prefixes of forbidden options (new), uses env_clear plus the allow-list of environment.py, checks revisions, refs, exclusions and batch paths as objects.py and ports/vcs.py do, and reports a failure without Git's error output (new, Q-20). YAML goes through a generic tree that keeps every rule of yaml_loader.py and the 0.5.2 scalar resolver; YAML and JSON refuse integers outside 64 bits and floats outside f64 (new). Size limits bound the read (new). Only the documents module parses YAML, JSON and TOML; no message quotes an input value or a key name (new where 0.5.2 quoted them); repository values are shown only through the filters of representable.py and conventions.py, the latter now for every finding, not-run entry and refusal (new, Q-21). Project writes stay in the root, refuse links and reparse points, use O_NOFOLLOW on Unix, are atomic and keep the target's mode. A data directory inside the project root, the Git work tree or the main work tree is refused by writing commands (ORQ-E105, or ORQ-E106 when Git fails) and reported by doctor, sync and explain; the hook prints {} when it lies inside the project root the hook finds (new, Q-16, Q-18, Q-19). Its files are 0600 and folders 0700 on Unix (new). Every project id must be a lowercase UUID (new). Journals stay in projects/<uuid>/upgrade/ with a format field on 1.0.0 records; a 0.x record is read only for format and status and never rewritten; an open 0.x record refuses every journalled change and an open 1.0.0 record an upgrade (ORQ-E131); an unreadable or unknown record gives ORQ-E136. CanonicalPath keeps every refusal of paths.py. No command prints a panic payload; the hook prints {} on any error or panic. The workspace forbids unsafe code."
    verification: manual
