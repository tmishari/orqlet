    answerer: tmishari
    time: '2026-11-25T17:35:07+00:00'
    scope: task
- id: Q-20
  key: 4e67b54fa81139a81704da68cdec01835cc53a053c2e65823a7b3a046184478a
  subject: Git error output in messages
  raised_by: Cursor
  phase: design
  category: requirement
  text: Git's error output can repeat repository-controlled text. Should the ORQ-E106 message keep
    its first line?
  why: The round-5 security review found that 0.5.2 quotes the first line of Git's error output
    (src/orqlet/adapters/git/git_runner.py lines 132-136), against the rule that messages never
    echo input.
  options:
  - Keep it, with control characters replaced and the text cut to 200 characters
  - Drop it and give a fixed message (new behaviour)
  blocks:
  - design
  status: answered
  answer:
    value: Drop it and give a fixed message (new behaviour)
    answerer: tmishari
    time: '2026-11-25T17:35:07+00:00'
    scope: task
- id: Q-21
  key: bca7e4adf74befdb88699652edb8f3e71f2402d11ef675e5a35c9be6ac7a44e6
  subject: Scope of the escaping filter
  raised_by: Cursor
  phase: design
  category: requirement
  text: Which repository values should pass through the escaping filter printable()?
  why: The round-7 reviews found that ADR-007 decision 15 states the scope two ways. 0.5.2 escapes
    only some values (src/orqlet/domain/conventions.py lines 100-124 and its callers) and shows
    others raw or in Python repr form, for example validate_design.py lines 127 and 130 and
    paths.py lines 32-47.
  options:
  - Every repository value in a finding, not-run entry or refusal is escaped (limit 200) or left
    out, never shown raw (new behaviour)
  - Only the sites 0.5.2 escapes, plus the change id; other values stay as in 0.5.2
  blocks:
  - design
  status: answered
  answer:
    value: Every repository value in a finding, not-run entry or refusal is escaped (limit 200) or
      left out, never shown raw (new behaviour)
    answerer: tmishari
    time: '2026-11-25T18:54:31+00:00'
    scope: task
