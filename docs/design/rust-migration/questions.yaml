    answerer: tmishari
    time: '2026-11-25T16:42:34+00:00'
    scope: task
- id: Q-18
  key: b8008185076ddaa20cf52aab58f9e0ab3690e3af6175f916d745d8d56855a22b
  subject: Read-only commands with a data directory inside the repository
  raised_by: Cursor
  phase: design
  category: requirement
  text: When the data directory lies inside the repository, what should doctor, sync and explain
    do? In 0.5.2 they are wired with the services that create the data directory.
  why: The round-5 architecture review found that the applied design refused them, while the
    approved round-4 response said they report a finding (src/orqlet/interface/cli/commands/lifecycle.py
    lines 188, 203 and 243).
  options:
  - Refuse with ORQ-E105, exit 3, as the other writing commands do
  - Report a finding, treat the data as missing and go on
  blocks:
  - design
  status: answered
