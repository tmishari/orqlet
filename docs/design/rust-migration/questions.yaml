- id: Q-16
  key: 0e95550a2d86ef49d8984a760fecd7660f13f855174cffd51c6f0086fbec80f0
  subject: Data directory inside the managed repository
  raised_by: Cursor
  phase: design
  category: requirement
  text: 0.5.2 accepts an ORQLET_DATA_DIR that points inside the managed repository. Should 1.0.0
    refuse it?
  why: The security review of the design noted that journals, backups and review packets would then
    live in the untrusted repository; 0.5.2 does not check it (src/orqlet/interface/cli/wiring.py
    lines 83-93).
  options:
  - Keep the 0.5.2 behaviour
  - Refuse a data directory inside the repository (new behaviour)
  blocks:
  - design
  status: answered
  answer:
    value: Refuse a data directory inside the repository (new behaviour)
    answerer: tmishari
    time: '2026-11-25T16:13:05+00:00'
    scope: task
