  key: 89becb73fa5e400092eea1ef51cf4f824d47084925086d15db38319d9cf53e16
  subject: Dependency for project and change ids
  raised_by: Cursor
  phase: design
  category: policy
  text: May the uuid crate, with only its v4 feature, join the allow-list of orqlet-adapters to make
    project and change ids?
  why: The round-4 architecture review found that no allowed crate makes random ids; 0.5.2 uses
    uuid.uuid4 (src/orqlet/adapters/system.py lines 14-16).
  options:
  - Yes, add uuid (v4 only) to adapters
  - 'No: use the standard library only, and the design must explain how ids stay unique'
  blocks:
  - design
  status: answered
  answer:
