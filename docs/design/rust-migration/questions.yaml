    value: Report a finding, treat the data as missing and go on
    answerer: tmishari
    time: '2026-11-25T17:35:07+00:00'
    scope: task
- id: Q-19
  key: 4a61ba13ec04594818c56e9cba9a9627ecc3b97948288bb650708241ba189a1f
  subject: Hook with a data directory inside the project
  raised_by: Cursor
  phase: design
  category: requirement
  text: The hook starts no Git, so it cannot find the repository top level. What should it do about
    a data directory inside the repository?
  why: The round-5 architecture review found that the applied design skipped the check, while the
    approved round-4 response said the hook prints {} (src/orqlet/interface/cli/wiring.py lines
    119-140).
  options:
  - 'Skip the check: the hook only reads'
  - Print {} whenever the data directory lies inside the project root it can see
  blocks:
  - design
  status: answered
  answer:
