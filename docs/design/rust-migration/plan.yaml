  acceptance_criteria:
  - id: AC-1
    text: >-
      At the pinned versions, sha2, unicode-normalization and the category crate build without std or default features for
      the three targets, the category crate covers Cc, Cf, Cs, Co, Cn, Zl and Zp, and toolchain 1.100.0 has a stable File::try_lock,
      each confirmed from its documentation and stated in the pull request; on a mismatch the phase stops and asks.
    source: BC-8
    check_ref: review:library-confirmation
  - id: AC-2
    text: 'The domain is #![no_std] with alloc and the workspace sets unsafe_code = forbid, inherited by every crate.'
    source: BC-16
    check_ref: cargo-clippy
  - id: AC-3
    text: >-
      digest_of and the line-range, file and block-marker hashes give the values of vectors copied from hash_vectors.json.
    source: BC-3
    check_ref: cargo-test
  - id: AC-4
    text: CanonicalPath refuses every case of ADR-007 decision 14 and compares by NFC plus to_lowercase.
    source: BC-20
    check_ref: cargo-test
  - id: AC-5
    text: >-
      The all-or-nothing filter shows only ASCII major.minor.patch versions and paths of 1 to 200 scalar values without a
      hidden character; a version part over 4,300 digits is an invalid version; the escaped filter writes the three escape
      forms, doubles backslashes and cuts at the limit, then '...'.
    source: BC-24
    check_ref: cargo-test
  - id: AC-6
    text: versions.rs is reviewed as security-relevant, with paths.rs, representable.rs and conventions.rs.
    source: BC-24
    check_ref: security-reviewer
  - id: AC-7
    text: >-
      Timestamps match isoformat with microseconds and +00:00, drop zero microseconds, and cover a leap day and a year end;
      globs match as fnmatchcase.
    source: R-1
    check_ref: cargo-test
