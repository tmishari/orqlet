    subject: Output compatibility between the Python release and a Go version
    raised_by: researcher
    phase: research
    category: requirement
    text: >-
      Must the Go version produce byte-identical output to the Python release (generated files,
      hashes in .orqlet/generated.lock.yaml, JSON and YAML envelopes, golden tests)?
    why: Byte-identical output makes every serializer, hash input and golden file a fact that the AS-IS file has to cover.
    options:
      - Yes, byte-identical; existing projects must not see any diff after switching
      - Same meaning, but a one-time diff is acceptable (new workflow version)
      - No compatibility requirement; a clean break is fine
      - I do not know; record it as an unknown
    blocks:
