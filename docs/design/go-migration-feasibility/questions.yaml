  - id: Q-6
    key: 26446cea635e4ea0de53c1dbe73059f1971c36a2f3d509e126066bab256b4189
    subject: Git baseline for evidence of uncommitted source files
    raised_by: researcher
    phase: research
    category: requirement
    text: >-
      At revision 0bfc2faf5f8950330643176423389ca667afe90a git tracks 8 of the 170 Python source
      files under src/. Evidence resolves against a git blob at the base revision, so how should the
      AS-IS file be anchored?
    why: >-
      Facts about the untracked source files cannot pass `orqlet validate as-is` until they exist at
      a revision. Committing is a change to the repository and belongs to the person.
    options:
      - I commit the working tree myself, then tell the researcher to continue
      - The researcher may commit the whole working tree on main as a baseline
      - Do not commit; narrow the AS-IS to the tracked source files and record the rest as unknowns
    evidence_refs:
      - git ls-tree -r HEAD --name-only
    blocks:
      - research
    status: answered
    answer:
      value: I commit the working tree myself, then tell the researcher to continue
      answerer: user
      time: "2026-10-24T09:58:57+03:00"
      scope: task
  - id: Q-7
    key: dcf9a9806760d9623a86d74a4ab6511c96ae9feae671c134b49735541487200f
    subject: Target platforms versus the CI matrix
    raised_by: researcher
    phase: research
    category: evidence-conflict
    text: >-
      The answer to Q-3 names macOS arm64 only. .github/workflows/ci.yml runs the tests on
      ubuntu-latest, macos-latest and windows-latest, and the ledger of the harness2-fit task records
      the answer "no, we use only macos or windows". Which platforms must the compiled binary support?
    why: >-
      The Windows and Linux code paths (local_fs.py replace-retry, junction handling, fsync, the
      Windows tests) are in the scope of the rewrite only if those platforms are required.
    options:
      - macOS arm64 only
      - macOS arm64 and Windows amd64
      - macOS, Windows and Linux
    evidence_refs:
      - .github/workflows/ci.yml
      - docs/design/harness2-fit/questions.yaml#Q-3
    blocks:
      - design
    status: open
  - id: Q-8
    key: 2af8e945d36cc270820246776b37763aeaa8d74551e1b355ecc263ed6d4f81d9
    subject: Reach of byte-identical output to help, usage and error message text
    raised_by: researcher
    phase: research
    category: requirement
    text: >-
      Does "byte-identical" (Q-4) also cover the text of --help and usage errors, the human
      (non --json) output, and the validation messages whose wording comes from Pydantic and PyYAML
      (for example "questions.1.options.1: Input should be a valid string")?
    why: >-
      The JSON envelope, the generated files and the hashes are produced by repository code. Help text
      comes from the CLI framework and the validation messages come from two libraries, and no test or
      stored file pins them.
    options:
      - Only generated files, hashes and the JSON envelope
      - Also the human output
      - Also help, usage errors and the library-worded validation messages
    evidence_refs:
      - src/orqlet/application/contracts/loading.py
      - src/orqlet/adapters/fs/yaml_loader.py
    blocks:
      - design
    status: open
