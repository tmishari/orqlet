  - src/orqlet/domain/classify.py
- id: P-2
  objective: Add the orqlet.resources/v1 contract and the additive fields of the project profile, their committed JSON Schemas, a rebuilt workflow
    manifest, a valid fixture, and the single reader of the registry (resources_path, parse_resources, load_resources).
  depends_on:
  - P-1
  implements:
  - EC-17
  - EC-18
  - EC-19
  - EC-20
  - EC-21
  - EC-22
  - EC-23
  - EC-24
  - EC-59
  - EC-60
  - EC-67
  file_operations:
  - op: create
    path: src/orqlet/application/contracts/resources.py
    why: 'Resources (with covered_tools), Resource, AppliesTo and StoredCopy (ADR-002 decision 1): a closed contract, at most 100 entries in order
      of id, validators that call the domain rules and raise fixed-text errors (they do not reuse the Glob and RepoPath types, whose errors repeat
      the value), the cross-field rules (a login entry is internal and only a summary may be stored for it; a public entry has no internal-looking
      last label; tool only for tool-docs; the copy path is derived from the id). Names the helpers with a leading underscore (EC-17 to EC-21).'
  - op: modify
    path: src/orqlet/application/contracts/profile.py
    why: Repository gains branch_model, release_flow and branch_patterns; PullRequests gains shape and required_checks. All five are FactValue
      with a default that is an unknown with its question. merge_strategy and reviewers keep their type (ADR-003 decision 1; EC-60).
  - op: modify
    path: src/orqlet/application/contracts/__init__.py
    why: Register orqlet.resources/v1 in CONTRACTS so that the schema export and the fixture tests cover it (ORQLET-DET-003).
  - op: create
    path: src/orqlet/workflow/schemas/orqlet.resources.v1.json
    why: Written by tools/export_schemas.py, never by hand (ORQLET-DET-003; EC-59).
  - op: modify
    path: src/orqlet/workflow/schemas/orqlet.project-profile.v1.json
    why: Regenerated with tools/export_schemas.py for the additive fields (EC-60).
  - op: modify
    path: src/orqlet/workflow/MANIFEST.json
    why: Rebuilt with tools/build_manifest.py, because a schema is a file of the workflow package and CI checks the manifest on every pull request
      (ORQLET-DET-002; ADR-005 decision 1).
  - op: create
    path: tests/fixtures/contracts/valid/orqlet.resources.v1.yaml
    why: A valid registry with a public tool-docs entry that has applies_to paths and a stored copy, and a login team-docs entry whose copy is
      a summary; the parametrised contract tests load it, round-trip it and compare the committed schema.
  - op: create
    path: src/orqlet/application/usecases/resources_source.py
    why: resources_path, parse_resources and load_resources (ADR-002 decisions 6 and 10). A missing file is an empty registry; a file that cannot
      be read safely, is above 256 KiB or fails its contract returns no registry and findings that name the field and the rule and never the value;
      read through the FileSystem port and the strict loader (EC-22 to EC-24).
  - op: create
    path: tests/unit/application/test_resources_contract.py
    why: 'A failing and a passing case for every rule of the contract (EC-17 to EC-21), the ordering by id, the 100-entry cap, the cross-field
      rules, the default of every optional field, and that no error text holds the input: credential-shaped strings are placed in the address,
      the note, a glob and the copy fields and must not appear in any message.'
  - op: create
    path: tests/unit/application/test_resources_source.py
    why: 'parse_resources and load_resources: a missing file gives an empty registry and no finding, a bad file gives no registry and a finding
      with a code, a file of 256 KiB plus one byte is refused after reading, a file with anchors or duplicate keys is refused by the strict loader
      (EC-22 to EC-24).'
  - op: create
    path: tests/unit/application/test_profile_conventions_contract.py
    why: An existing profile without the new fields still loads and the new facts default to an unknown with their question; each new field accepts
      an answered FactValue; an unknown extra field is refused (ADR-003 decision 1; EC-60).
  acceptance_criteria:
  - id: AC-1
    text: 'A registry loads when every rule holds and is refused with a fixed-text error that names the rule for: a repeated id, an id that fails
      resource_id_problems, an address that fails url_problems, a note or title that fails text_problems, more than 8 globs or a glob that fails
      glob_problems, a tool on an entry whose kind is not tool-docs, a login entry whose copy form is copy, a stored_copy without ttl_days between
      1 and 365, a retrieved_at without a zone, more than 100 entries.'
    source: ADR-002 decisions 1 and 9
    check_ref: pytest
  - id: AC-2
    text: 'No message of the contract, the loader or the findings contains a part of any input value: a test places credential-shaped text in
      the address, the note, a glob and the copy fields and asserts that nothing appears in a finding, an exception message, standard output or
      standard error.'
    source: ORQLET-SEC-003; ADR-002 decision 10
    check_ref: pytest
  - id: AC-3
    text: load_resources returns an empty Resources and no finding for a missing file, and no registry and a finding for an unreadable, oversized
      (more than 256 KiB, checked after the read and before parsing) or invalid file.
    source: ADR-002 decisions 6 and 10
    check_ref: pytest
  - id: AC-4
    text: An existing profile fixture loads unchanged and its new facts are unknowns with questions; the profile JSON Schema and orqlet.resources.v1.json
      are the committed output of tools/export_schemas.py.
    source: ADR-003 decision 1; ORQLET-DET-003
    check_ref: schemas
  - id: AC-5
    text: 'tools/build_manifest.py --check passes: MANIFEST.json lists the new schema file and the changed one, and identity.json and releases.json
      are not edited in this phase.'
    source: ORQLET-DET-002; ADR-005 decision 1
    check_ref: manifest
  - id: AC-6
    text: The new modules define no public name that is not a function or a class, import only domain, contracts and ports, and the layers contract
      of import-linter passes; the public API of the package differs from the base only by EC-17 to EC-24.
    source: ORQLET-ARCH-001; component rule 6
    check_ref: import-linter
  checks:
  - ruff-check
  - ruff-format
  - mypy
  - import-linter
  - pytest
  - schemas
  - manifest
  review_evidence:
  - architecture-reviewer
  - security-reviewer
  - tester
  knowledge_step: required
  completion:
  - All checks pass on Python 3.12
  - tools/export_schemas.py --check and tools/build_manifest.py --check pass
  - The public API of the package differs from the base, in this phase, only by EC-17 to EC-24
  expected_outputs:
  - src/orqlet/application/contracts/resources.py
  - src/orqlet/application/contracts/profile.py
  - src/orqlet/application/usecases/resources_source.py
  - src/orqlet/workflow/schemas/orqlet.resources.v1.json
- id: P-3
  objective: 'The registry reaches composition and nothing is rendered from it yet: compose and data_files take and seed it, init, upgrade and
    explain load it and refuse an invalid or recorded-but-missing registry before any plan, the pure builders and validate resources exist, doctor
    reports stored copies, and a removed tool skill folder no longer makes doctor fail.'
  depends_on:
  - P-2
  implements:
  - EC-25
  - EC-28
  - EC-29
  - EC-40
  - EC-49
  - EC-50
  - EC-51
  - EC-56
  - EC-61
  - EC-64
  - EC-67
  file_operations:
  - op: create
    path: src/orqlet/application/usecases/resources_edit.py
    why: 'ResourceSpec, resources_with and resources_without: pure builders that return a new Resources or findings, shared by init and the commands
      of the next phase (ADR-002 decisions 6 and 7; EC-25, EC-28, EC-29). No I/O here; the commands are added in P-4.'
  - op: create
    path: src/orqlet/application/usecases/validate_resources.py
    why: 'validate_resources (EC-40): the contract, every stored copy (missing, hash of the LF-normalised text differs from the record, header
      lines, hidden text, credential scan, size), a login entry whose copy is not a summary, and a recursive walk of docs/resources to depth three
      that fails on anything that is not a regular <id>.md named by an entry. Offline; odd names printed through printable.'
  - op: modify
    path: src/orqlet/application/usecases/render_all.py
    why: compose gains resources and resources_bytes (EC-50) and acknowledges resources with del until P-6; data_files gains resources_bytes and
      seeds .orqlet/resources.yaml as a seeded file (EC-51, EC-61); the code-owners notice ORQ-I030 also names .orqlet/**, docs/resources/**,
      the generated rule and skill paths and .github/workflows/** (ADR-002 decision 11).
  - op: modify
    path: src/orqlet/application/usecases/init_project.py
    why: init builds the registry in memory (empty for now), passes it and its bytes to compose, and on a re-run after an interruption loads the
      registry that is on disk, refusing an invalid one with the stable finding (ADR-002 decision 6).
  - op: modify
    path: src/orqlet/application/usecases/upgrade.py
    why: upgrade loads the registry through load_resources, returns the status refused with the finding for an invalid registry or one that is
      missing while the lock records it, and otherwise passes the parsed registry and the current bytes (an absent file is written empty) (ADR-002
      decision 6).
  - op: modify
    path: src/orqlet/application/usecases/explain.py
    why: explain loads the registry, previews without the resource files and prints the finding when it is invalid; it builds no plan and does
      not refuse (ADR-002 decision 6).
  - op: modify
    path: src/orqlet/application/usecases/diagnose.py
    why: doctor warns when a stored copy is past retrieved_at plus ttl_days, reports a copy whose hash differs from the record, reports an invalid
      registry, names a copy whose entry is gone, says that freshness is advisory, and ignores a reserved-prefix folder that holds no file (ADR-002
      decisions 7 and 9; considerations S-17).
  - op: modify
    path: src/orqlet/application/usecases/capabilities.py
    why: IMPLEMENTED_COMMANDS gains validate resources (EC-56).
  - op: modify
    path: src/orqlet/interface/cli/commands/validate.py
    why: 'resources_command: the file argument defaults to .orqlet/resources.yaml, PASS exits 0 and FAIL and NOT_RUN exit 5 through output_of
      (EC-49).'
  - op: create
    path: tests/unit/application/test_resources_builders.py
    why: resources_with adds, refuses a repeated id, updates with replace and keeps the fields that the spec leaves unset, refuses to change an
      id, and resources_without removes and refuses an unknown id; the output stays in order of id (ADR-002 decision 7).
  - op: create
    path: tests/unit/application/test_validate_resources.py
    why: Every failure of validate_resources with its code, a PASS for the fixture registry with its copies, the recursive walk (a subfolder,
      a symbolic link, an unnamed file, a name that does not canonicalise), and that odd names are printed through printable.
  - op: create
    path: tests/unit/application/test_resources_composition.py
    why: init seeds an empty .orqlet/resources.yaml; upgrade writes it when absent and records it; an invalid registry makes init (re-run) and
      upgrade return refused with ORQ-E503 and delete nothing; a registry that is missing while the lock records it is refused; explain previews
      and prints the finding; a hand edit and a merged lock line make no proposal (ADR-002 decisions 5 and 6).
  - op: create
    path: tests/unit/application/test_resources_diagnose.py
    why: 'doctor: a copy past its time-to-live (ORQ-W500), a copy that differs from its hash (ORQ-E505), an invalid registry, a copy whose entry
      is gone (ORQ-I501), and no ORQ-E153 for an empty orqlet-tool-<id> folder after a removal.'
  - op: create
    path: tests/integration/test_resources_validate_cli.py
    why: 'orqlet validate resources through the command line: exit 0 for a valid registry, exit 5 for FAIL and for a missing registry (NOT_RUN),
      the JSON envelope, and that the equality test between IMPLEMENTED_COMMANDS and the registered commands holds.'
  - op: modify
    path: tests/unit/application/test_init_project.py
    why: The set of files that init writes now includes .orqlet/resources.yaml.
  acceptance_criteria:
  - id: AC-1
    text: 'The finding codes of this change are fixed here: ORQ-E500 the registry cannot be read safely, ORQ-E501 it fails its contract, ORQ-E502
      it is above 256 KiB, ORQ-E503 init or upgrade refuses an invalid or recorded-but-missing registry, ORQ-E504 a stored copy is missing, ORQ-E505
      a copy differs from its hash, ORQ-E506 a copy fails its header, hidden-text or credential check, ORQ-E507 a copy of a login entry is not
      a summary, ORQ-E508 an entry under docs/resources is not named by the registry, ORQ-E509 an edit command is refused, ORQ-E510 attach needs
      a terminal, ORQ-E511 evidence cite refuses a file; ORQ-W500 a copy is past its time-to-live; ORQ-I500 the notice for a login entry, ORQ-I501
      a copy whose entry is gone, ORQ-I502 unknown conventions, ORQ-I503 conventions that only the host enforces, ORQ-I520 the branch check was
      skipped; ORQ-E520 a branch name is not allowed, ORQ-E521 a commit subject has the wrong shape. Each is used with exactly that meaning.'
    source: ADR-005 decision 5
    check_ref: review:finding-codes
  - id: AC-2
    text: init writes an empty .orqlet/resources.yaml recorded as seeded, upgrade writes it when absent, and an edit made through the commands
      or by hand (current equal to the file, record older) causes no proposal.
    source: ADR-002 decisions 1, 5 and 6
    check_ref: pytest
  - id: AC-3
    text: An invalid registry stops init (re-run) and upgrade with the status refused and ORQ-E503 before any plan is built and no file is deleted;
      a registry that is missing while the lock records it is refused the same way and the finding names the way out; explain previews without
      resource files and prints the finding.
    source: ADR-002 decision 6
    check_ref: pytest
  - id: AC-4
    text: validate resources returns PASS for the fixture and FAIL with the right code for a missing copy, a hash that differs, a copy without
      the two header lines, a copy with a hidden code point or a credential shape, a login copy that is not a summary, and an unnamed or odd file
      under docs/resources.
    source: ADR-002 decision 9
    check_ref: pytest
  - id: AC-5
    text: doctor reports ORQ-W500 for a copy past its time-to-live and says freshness is advisory, reports ORQ-E505 and the invalid registry,
      and does not report ORQ-E153 for a reserved-prefix folder that holds no file.
    source: ADR-002 decisions 7 and 9
    check_ref: pytest
  - id: AC-6
    text: The pure builders keep order of id, refuse a repeated id and an id change, and carry no I/O; init and the commands of P-4 will use them.
    source: ADR-002 decision 7
    check_ref: pytest
  - id: AC-7
    text: The resources parameter of compose is acknowledged with del and unused until P-6, the lint rule for unused arguments passes, the equality
      test between IMPLEMENTED_COMMANDS and the application's commands holds, and the public API differs from the base only by EC-25, EC-28, EC-29,
      EC-40, EC-49, EC-50 and EC-51.
    source: ADR-005 decision 1
    check_ref: ruff-check
  - id: AC-8
    text: The code-owners notice ORQ-I030 names the registry, the stored copies, the generated paths and the workflow files when no CODEOWNERS
      entry mentions them.
    source: ADR-002 decision 11
    check_ref: pytest
