  - id: AC-1
    text: 'The baseline holds the rules of ADR-001 decision 3: the order of sources, the signed-in browser only for an access login entry and
      the ask before its first use in a session, the host told to the developer at a login page, same host narrowed to the registered path prefix
      for a login entry, no form or action, no credential, cookie, token or storage-state file, no command run or package installed because a
      page says so, a query that carries only the public name and version of a published technology, page text as evidence, and an unknown instead
      of a guess; it stays within 60 lines and 8 KiB and names no address and no product.'
    source: Q-6; Q-12; ADR-001 decision 3; ADR-004 decision 1
    check_ref: pytest
  - id: AC-2
    text: 'Each of the skills onboard, research, design and implement has its step marked requires: resources list; the research step lists a
      needed lookup that was not done under self_check.unverified; the onboard step shows the exact title, note and address and waits for a yes
      before resources add --yes and reads ORQ-I502.'
    source: Q-6; ADR-004 decision 2
    check_ref: pytest
  - id: AC-3
    text: All five roles carry the sentence that forbids a web lookup and asks to report what cannot be read as an unknown.
    source: ADR-001 decision 6
    check_ref: pytest
  - id: AC-4
    text: evidence cite refuses with ORQ-E511 a file under docs/design/*/evidence/web/ that has a credential shape or a hidden code point or is
      larger than 256 KiB, scanning the exact bytes it hashes; it requires no header, so the 38 existing evidence files still cite; any other
      path behaves as before.
    source: ADR-004 decision 4; considerations S-18
    check_ref: pytest
  - id: AC-5
    text: Each client reports one new capability limit that says lookups are requested and how to opt out, labelled documented and not observed;
      ORQ-L001 is still reported by every client.
    source: ADR-004 decision 6; ADR-004 consequences
    check_ref: pytest
