phases:
- id: P-1
  objective: Add the two pure domain modules of ADR-002 and ADR-003 and the one added branch of classify, with unit, property and hostile-input
    tests. Nothing else imports the new modules yet.
  depends_on: []
  implements:
  - EC-1
  - EC-2
  - EC-3
  - EC-4
  - EC-5
  - EC-6
  - EC-7
  - EC-8
  - EC-9
  - EC-10
  - EC-11
  - EC-12
  - EC-13
  - EC-14
  - EC-15
  - EC-16
  - EC-55
  - EC-67
  file_operations:
  - op: create
    path: src/orqlet/domain/resources.py
    why: 'url_problems, text_problems, resource_id_problems, glob_problems, copy_path, copy_problems, hidden_text_problems, credential_problems,
      is_stale, uncovered_names and host_of (ADR-002 decisions 1, 8, 9; EC-1 to EC-11). Pure: standard library only, no unicodedata (the code
      point table is numeric), no clock, no public assignment (component rule 6): constants are private. host_of and url_problems share one private
      splitter. Every problem is a fixed rule name and holds no input value (ORQLET-SEC-003).'
  - op: create
    path: src/orqlet/domain/conventions.py
    why: pattern_problems, branch_problems, commit_subject_problems, is_checkable_convention and printable (ADR-003 decisions 2 and 4; EC-12 to
      EC-16). Pure; branch patterns use the existing glob_match from domain/globs.py with the caps of pattern_problems; no public assignment.
  - op: modify
    path: src/orqlet/domain/classify.py
    why: _seeded returns UP_TO_DATE when the current text equals the new text and differs from the record, after the check for a deleted file;
      the case current, recorded and new all equal keeps SEEDED_KEEP (ADR-002 decision 5; EC-55).
  - op: create
    path: tests/unit/domain/test_resources.py
    why: 'A failing and a passing case for every rule of ADR-002 decisions 1, 8 and 9, with the named negative vectors: 127.1, 0xa9.0xfe.0xa9.0xfe,
      LOCALHOST, a.b.nip.io, a backslash and a percent sign before the at sign, userinfo, a port, a fragment, X-Amz-Signature and private_token
      query keys, a double-encoded open-redirect value, a 32-character opaque value in a path, a query value and a host label, home.arpa, metadata.google.internal
      for access public; the ASCII-only rule with U+202E, U+200B, U+E0041, U+2028, U+FE0F and U+2800; angle brackets; the id grammar with a trailing
      hyphen, a doubled hyphen and every device name; the glob grammar with a match-all pattern; the copy header lines; one test per numeric range
      of hidden_text_problems; every rule name of credential_problems including the storage-state shape (EC-1 to EC-11).'
  - op: create
    path: tests/unit/domain/test_resources_properties.py
    why: Property tests that no problem string contains any part of the input, that no function raises for arbitrary text, and timed hostile-input
      tests (long runs of eyJ, of equals signs and of spaces; hosts of many labels; a line of 4096 and one of 4097 characters) with a time limit
      set after a first measurement (ADR-002 decision 9; ORQLET-TEST-001).
  - op: create
    path: tests/unit/domain/test_conventions.py
    why: Cases for pattern_problems (more than one **, more than 8 segments, more than 60 characters), branch_problems (255 and 256 characters,
      32 and 33 segments, a name that matches and one that does not), commit_subject_problems (type, scope, bang, colon and space, the Merge exemption,
      Revert quoted subjects failing, an empty description), is_checkable_convention (Conventional Commits with spaces, case and underscores)
      and printable (only U+0020 to U+007E pass; ESC, CR, BEL, NUL, DEL, a leading double colon, U+202E; the cut at 100 characters) (EC-12 to
      EC-16).
  - op: create
    path: tests/unit/domain/test_conventions_properties.py
    why: A timed test of branch_problems with the worst pattern that pattern_problems accepts against a 255-character, 32-segment name, and property
      tests that printable output is ASCII only and never longer than the limit plus the escape marker (ADR-003 decision 4; ORQLET-TEST-001).
  - op: modify
    path: tests/unit/domain/test_classify.py
    why: 'A new row: current equal to new and different from recorded gives UP_TO_DATE for a seeded file. The existing rows keep their results
      (EC-55).'
  acceptance_criteria:
  - id: AC-1
    text: url_problems returns the names of the rules that an address breaks and an empty tuple when none; it never contains the input. It refuses
      every named vector of the test file and accepts https://docs.example.com/guides/api and a Confluence-style address with a pageId query.
    source: ADR-002 decision 8
    check_ref: pytest
  - id: AC-2
    text: text_problems accepts only printable ASCII on one line within the limit and refuses ://, ](, <!--, -->, a backtick, < and >, and every
      code point above U+007E; resource_id_problems accepts [a-z][a-z0-9]*(-[a-z0-9]+)* up to 32 characters and refuses a trailing or doubled
      hyphen and the device names; glob_problems refuses a match-all glob, .., a leading slash or backslash, !, braces and more than 120 characters.
    source: ADR-002 decisions 1 and 8
    check_ref: pytest
  - id: AC-3
    text: copy_path(id) is docs/resources/<id>.md; host_of returns the host that url_problems checked; uncovered_names compares after trimming
      and case folding without the version; is_stale raises no error for two timezone-aware datetimes and compares ttl_days.
    source: ADR-002 decisions 1, 7 and 9
    check_ref: pytest
  - id: AC-4
    text: 'hidden_text_problems refuses every code point range of ADR-002 decision 9 (one test per range) and HTML comments and allows tab and
      line feed; copy_problems refuses a text whose first two lines are not Source: <address> and the fixed reference line; credential_problems
      reports a rule name and a line number for each rule of decision 9 including the storage-state shape, never the text.'
    source: ADR-002 decision 9
    check_ref: pytest
  - id: AC-5
    text: 'The scans run in linear time: the timed hostile-input tests finish under the recorded limit, and a line of more than 4096 characters
      is itself a finding.'
    source: ADR-002 decision 9; considerations S-5, S-7
    check_ref: pytest
  - id: AC-6
    text: branch_problems matches branch names with at most one ** per pattern; pattern_problems refuses more; a name over 255 characters or 32
      segments is a finding before matching; commit_subject_problems accepts type, optional scope of letters, digits and ._/-, optional !, a colon,
      one space and a description, and exempts subjects that start with Merge; printable escapes everything outside U+0020 to U+007E and cuts
      at the limit.
    source: ADR-003 decisions 2 and 4
    check_ref: pytest
  - id: AC-7
    text: classify returns UP_TO_DATE for a seeded file with current equal to new and different from recorded and keeps every other result of
      the existing tests.
    source: ADR-002 decision 5
    check_ref: pytest
  - id: AC-8
    text: Both modules import only the standard library and domain modules, use no clock, random number or environment, define no public name
      that is not a function or a class, and the layers contract of import-linter passes.
    source: ORQLET-ARCH-002; component rule 6
    check_ref: import-linter
