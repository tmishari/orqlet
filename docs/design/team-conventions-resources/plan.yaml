    text: tools/build_manifest.py --check and tools/export_schemas.py --check pass, identity.json carries the proposed version, and the release-gate
      test passes because the version is not yet in the release history.
    source: ORQLET-DET-002; ORQLET-DET-003
    check_ref: manifest
