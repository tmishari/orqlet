- id: P-4
  objective: 'The edit commands: resources add, update, remove, attach and list, the link prompt of init, and their fault tests. They write the
    registry and the lock through apply_plan; generated files follow by upgrade.'
  depends_on:
  - P-3
  implements:
  - EC-26
  - EC-27
  - EC-30
  - EC-31
  - EC-32
  - EC-33
  - EC-38
  - EC-39
  - EC-47
  - EC-56
  - EC-64
  - EC-67
  file_operations:
  - op: modify
    path: src/orqlet/application/usecases/resources_edit.py
    why: 'CopySpec, ResourcesEditResult, add_resource, update_resource, remove_resource and attach_copy: each builds a ChangePlan of the registry
      and the lock and calls apply_plan, with dry_run, assume_yes and the confirmation as profile answer does; attach checks the copy, records
      the SHA-256 of the LF-normalised text and retrieved_at from the clock, and for a login entry asks at a terminal even with --yes (ORQ-E510
