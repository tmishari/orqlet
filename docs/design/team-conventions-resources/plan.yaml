      holds no credential value, no account name, no raw client log and no page text of an internal site.
    source: ADR-005 decision 2; Q-14
    check_ref: review:check-records
  - id: AC-2
    text: V-7 ran against a test SAML site and recorded, per client, whether the client asks before it first uses the signed-in route and whether
      the hostile-page case moved text to another host; the test session was signed out afterwards.
    source: ADR-005 decision 2; Q-12; Q-15
    check_ref: security-reviewer
  - id: AC-3
    text: The repository test finds no credential shape and no hidden code point in any committed check record, and no statement in a skill, a
      limit or the README claims that a client honours a rule on the strength of a record that does not exist.
