- id: EC-57
  surface: public-api
  action: change
  identity: orqlet.application.usecases.init_questions.ANSWER_KEYS
  expected_after:
    kind: declaration
    value: The set gains repository.branch_model, repository.branch_patterns, repository.release_flow, repository.pull_requests.shape,
      repository.pull_requests.merge_strategy, repository.pull_requests.reviewers and repository.pull_requests.required_checks.
      The extractor reads an assignment by name only, so it cannot see the new entries.
  verification: manual
- id: EC-58
  surface: public-api
  action: change
  identity: orqlet.application.usecases.evidence_cite.cite
  expected_after:
    kind: declaration
    value: The signature does not change. For a path under docs/design/*/evidence/web/ (matched on the canonical, case-folded
      path) the function first reads the exact bytes it hashes, with a cap of 256 KiB, and runs credential_problems and hidden_text_problems
      over them, and refuses a file that fails a scan or exceeds the cap. No header is required, so the evidence files of
      earlier tasks stay valid. Any other path behaves as before.
  verification: manual
- id: EC-59
  surface: persisted-schema
  action: add
  identity: orqlet.resources/v1
  expected_after:
    kind: declaration
    value: 'A new closed contract, committed as a JSON Schema: schema; resources, at most 100 in order of id, each with id
      ([a-z][a-z0-9]*(-[a-z0-9]+)*, up to 32, unique, not a device name), title (one line, ASCII, at most 80), kind (api-guidelines,
      tool-docs, team-docs or other), url (the grammar of url_problems; an access public entry cannot use an internal-looking
      last label), note (one line, ASCII, at most 200, required), access (public or login), optional applies_to.paths (at
      most 8 globs that pass glob_problems), optional tool (only for tool-docs, [A-Za-z0-9][A-Za-z0-9._+-]{0,39}), optional
      version (the same characters, at most 40), and optional stored_copy with form (copy or summary; a login entry only summary),
      sha256, retrieved_at (with a zone) and ttl_days (1 to 365); the path of a copy is derived from the id. The file is refused
      above 256 KiB. Text rules are validators that call the domain, not field patterns.'
  verification: manual
- id: EC-60
  surface: persisted-schema
  action: change
  identity: orqlet.project-profile/v1
  expected_after:
    kind: declaration
    value: 'The closed contract gains optional fields with defaults, so an existing profile still loads and an older Orqlet
      refuses a new one: repository.branch_model, repository.release_flow and repository.branch_patterns, and repository.pull_requests.shape
      and repository.pull_requests.required_checks, all as facts whose default is an unknown with its question; the lists
      are comma-separated text inside the fact. merge_strategy and reviewers keep their type. The version stays v1 (an additive,
      minor change under Section 20.2) and the committed schema is regenerated.'
  verification: manual
- id: EC-61
  surface: persisted-schema
  action: add
  identity: .orqlet/resources.yaml
  expected_after:
    kind: declaration
    value: A seeded file, owner seeded and no file class, written empty by init and by upgrade when absent, recorded in the
      lock; composition receives its current bytes and an invalid file stops init (on a re-run), upgrade and explain before
      any plan.
  verification: manual
- id: EC-62
  surface: persisted-schema
  action: add
  identity: generated resource files
  expected_after:
    kind: declaration
    value: 'Per registry entry: .claude/rules/orqlet-resource-<id>.md and .cursor/rules/orqlet-resource-<id>.mdc when applies_to.paths
      is set; .claude/skills/orqlet-tool-<id>/SKILL.md and .agents/skills/orqlet-tool-<id>/SKILL.md when tool is set; once,
      .claude/skills/orqlet-resources/SKILL.md and .agents/skills/orqlet-resources/SKILL.md when the registry is not empty;
      and, when a convention is answered or the registry is not empty, a second shared block named conventions in AGENTS.md.
      Owner orqlet, class protected, content a fixed template over validated fields, no clock, no page content.'
  verification: manual
- id: EC-63
  surface: persisted-schema
  action: add
  identity: workflow templates
