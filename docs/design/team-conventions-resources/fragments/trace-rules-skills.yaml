facts:
- id: A-1
  kind: flow
  statement: '`read_text` raises `KeyError` for a path that is not an entry of the workflow manifest,
    and `paths` returns only the manifest entries.'
  evidence:
  - path: src/orqlet/adapters/workflow_package.py
    lines: 42-48
    revision: eef865714e40067b96313cadfa1cd2d551babd3d
    sha256: 58e3c67ddd7bfea1bd576b4896e9d06a6846c21b1ceaa2b571436124521a1a6b
- id: A-2
  kind: flow
  statement: 'The workflow rule is scoped by a meta file with `schema`, `name`, `description` and a `paths`
    list of seven globs: `.orqlet/**`, `.claude/**`, `.cursor/**`, `.agents/**`, `.codex/**`, `.mcp.json`
    and `AGENTS.md`.'
  evidence:
  - path: src/orqlet/workflow/rules/orqlet-workflow.meta.yaml
    lines: 1-11
    revision: eef865714e40067b96313cadfa1cd2d551babd3d
    sha256: 4daa1516e41e7d9af633994f91b45e5f1d5984fcd5a4ff3cde1832cc9d37ef65
- id: A-3
  kind: flow
  statement: The render request builder reads the workflow rule meta and text through `read_text` and
    puts a first `ScopedRule` with `FileClass.PROTECTED` into the list; its `paths` and `description`
    come from the meta.
  evidence:
  - path: src/orqlet/application/usecases/render_request.py
    lines: 54-71
    revision: eef865714e40067b96313cadfa1cd2d551babd3d
    sha256: 2715451ed61e2c5917937b55f8f5ffe412530ac6492c5f28ffa1a29b53ff756c
- id: A-4
