    the text, optional `Roles:` and `Phases:` lines and a `Source:` line. The `description` is the id
    and the text, the `paths` are the sorted scope paths and the class is `FileClass.GENERATED`.'
  evidence:
  - path: src/orqlet/application/usecases/render_request.py
    lines: 133-148
    revision: eef865714e40067b96313cadfa1cd2d551babd3d
