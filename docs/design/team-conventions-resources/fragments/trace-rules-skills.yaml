    is not empty; any other rule meets `continue`. The file name is the `rule_slug` of the id, a name
    used twice raises `RenderRequestError`, and the docstring says an agent reads the other rules with
    `orqlet standards for`.
  evidence:
  - path: src/orqlet/application/usecases/render_request.py
    lines: 49-80
    revision: eef865714e40067b96313cadfa1cd2d551babd3d
    sha256: 2e0018e6f432c4f0077aa8b4c54a78538dafc9c6112179cb9d49332c9b828cc0
