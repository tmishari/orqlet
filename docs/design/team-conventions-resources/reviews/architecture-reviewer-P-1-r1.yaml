  severity: non-blocking
  category: standards
  evidence: []
  claim: '[major] The completion line ''All checks pass on Python 3.12'' is not evidenced: the record is claimed
    and the full suite ran on 3.14.9 only.'
  suggested_action: Run the new tests, mypy and import-linter on 3.12 and say so in the record; CI runs the matrix.
  confidence: high
