- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: failure-handling
  evidence: []
  claim: '[major] is_stale raises OverflowError when retrieved_at lies within ttl_days of datetime.max; the value
    comes from the committed registry, which is untrusted, and AC-3 says the function raises no error for two aware
    datetimes.'
  suggested_action: Treat an overflowing deadline as not stale and add a test; bound retrieved_at in the P-2 contract.
  confidence: high
- schema: orqlet.finding/v1
