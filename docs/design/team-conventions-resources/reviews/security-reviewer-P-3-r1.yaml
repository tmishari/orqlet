findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The raw file argument of validate resources is echoed unescaped as the subject of the first output
    line and in loader messages; CanonicalPath refuses only categories Cc, Cf and Cs, so a path with U+2028 or a
    private-use character is printed raw. It is typed by the person who runs the command.'
  suggested_action: Pass printable(file, 200) as the subject and build loader messages from the constant name; add
    a test with U+2028.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The size caps apply after the whole file is read and directory listings are unbounded; doctor
    reads a copy without a cap. ADR-002 decision 10 accepts the read for files only.'
  suggested_action: Add a bounded read to the file system port later, or record in ADR-002 that listings and doctor
    are covered.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: '[minor] The limits of the walk (100 listed items, depth three, 1000 folders for doctor, a folder that
    is a file or a link) have no test.'
  suggested_action: Add tests on the in-memory file system in a later change.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: failure-handling
  evidence: []
  claim: An OSError from os.scandir or a read of a real file that is not wrapped by the local adapter ends as an
    internal error with a stable exit code and no value.
  suggested_action: Map OSError to FileSystemError in the adapter.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: If the registry file and its lock line are both gone, upgrade writes an empty registry; nothing is rendered
    from the registry in P-3.
  suggested_action: In P-6 also refuse when the lock records a generated resource file and the registry is absent.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: standards
  evidence: []
  claim: ORQ-E507 is never emitted; the contract refuses the case as ORQ-E501.
  suggested_action: State it in the P-8 table.
  confidence: high
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The code-owners notice counts a path as covered when its name appears anywhere in any CODEOWNERS text,
    a comment included; the notice is advisory.
  suggested_action: Match on non-comment lines in a later change.
  confidence: high
- schema: orqlet.finding/v1
