findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[major] url_problems accepts an address whose last host label is a bare 0x, for example https://127.1.0x/;
    a URL parser reads it as an IPv4 number and the host as the loopback range.'
  suggested_action: Match 0x followed by zero or more hex digits and add the vectors.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] host_of returns the raw host text of a refused address, which can include user information.'
  suggested_action: Return an empty string unless the host passes the host rules.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: copy_path builds a repository path from an unchecked id; its safety rests on a docstring precondition.
  suggested_action: Raise a fixed-text error for an id that fails resource_id_problems.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The credential scan is a shape heuristic with known false negatives (short passwords, unlabelled cloud
    secrets).
  suggested_action: State the limit in the README.
  confidence: high
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The closed lists (wildcard DNS, redirectors, internal labels) and the hidden-code-point table are incomplete
