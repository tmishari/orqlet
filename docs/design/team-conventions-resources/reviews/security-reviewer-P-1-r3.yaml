findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The private-key rule needs ''PRIVATE KEY-----'' on the header line, so a PGP armor header (''-----BEGIN
    PGP PRIVATE KEY BLOCK-----'') passes.'
  suggested_action: Match PRIVATE KEY after -----BEGIN with an optional BLOCK and add a PGP vector.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] An AWS key id followed by a full stop, or joined to a word by ''-'' or ''_'', is not flagged because
    the run must be exactly 20 characters; provider prefixes are tested only at the start of a run.'
  suggested_action: Test the shapes at boundaries and add full-stop, hyphen and underscore vectors.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: Cookie and Set-Cookie values, short passwords and passwords that start with a symbol are outside the scan.
  suggested_action: State the limit in the README; optionally add a Cookie header rule.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The public-entry rule for internal-looking hosts and the tool and version character sets are not acceptance
    criteria of P-2.
  suggested_action: P-2 enforces them; the P-2 tests cite ADR-002 decision 1.
  confidence: medium
- schema: orqlet.finding/v1
