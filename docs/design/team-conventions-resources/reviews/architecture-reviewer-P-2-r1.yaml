findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: correctness
  evidence: []
  claim: '[minor] StoredCopy.retrieved_at is checked only with datetime.fromisoformat, which takes any single character
    between date and time, so a hidden separator is stored.'
  suggested_action: Pin the shape with an ASCII pattern before fromisoformat and add vectors.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: standards
  evidence: []
  claim: '[minor] The contract adds a rule no ADR names: retrieved_at must fall in the years 2000 to 2200, and no
    test pins the bounds.'
  suggested_action: Document it in the completion note as a design amendment.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: docs
  evidence: []
  claim: '[minor] The knowledge record has no entry for EC-59 and EC-60 and says already-documented for rules the
    ADRs do not state.'
  suggested_action: List the rules pending amendment in the completion note.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: failure-handling
  evidence: []
  claim: '[minor] parse_resources joins every validation error into one message with no cap, so a registry of thousands
    of bad entries gives a very long finding.'
  suggested_action: Cap the number of problems in a later change.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: compatibility
  evidence: []
  claim: A profile rewritten by this Orqlet gains five unknown facts, and a closed contract in an older Orqlet then
    refuses it; ADR-003 decision 1 accepts this.
  suggested_action: State it in the completion note and the P-8 README.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: non-blocking
  category: architecture
  evidence: []
  claim: '[minor] The order of ids has no named collation; sorted() is ASCII code-point order and P-3 and P-6 must
    reproduce it.'
  suggested_action: Name the order in P-3 and use it in resources_with.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: docs
  evidence: []
  claim: The committed JSON Schema carries patterns for tool, version and hash but no limits on lengths or counts,
    so it is weaker than the contract.
  suggested_action: State that the contract is authoritative.
  confidence: high
- schema: orqlet.finding/v1
  id: F-8
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: load_resources puts the caller's path string in Finding.path without printable; the path is a command-line
    argument.
  suggested_action: Print it through printable in P-3.
  confidence: low
- schema: orqlet.finding/v1
  id: F-9
  kind: observation
  severity: non-blocking
  category: standards
  evidence: []
  claim: '[minor] Strict-loader refusals (anchor, alias, tag, duplicate key, invalid UTF-8) are reported as ORQ-E501
    while the plan describes ORQ-E500 as cannot be read safely.'
  suggested_action: The P-3 tests accept ORQ-E501 for them; state it in the completion note.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-10
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: No test builds the largest valid registry and checks that it is below the cap.
  suggested_action: Add one in P-4 with the writer test.
  confidence: low
- schema: orqlet.finding/v1
  id: F-11
  kind: observation
  severity: non-blocking
  category: standards
  evidence: []
  claim: '[minor] All checks pass on Python 3.12 is only partly shown: the full suite ran on 3.14.9 and the new
    tests on 3.12.11.'
  suggested_action: The CI matrix gives the rest.
  confidence: high
