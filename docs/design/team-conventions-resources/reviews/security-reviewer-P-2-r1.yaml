findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] retrieved_at accepts any single Unicode character as the date and time separator, so one hidden
    character (U+202E, a tag character, a zero-width one) can be stored in a registry value that passes the contract.'
  suggested_action: Pin the shape with an ASCII pattern and add vectors with U+202E, U+E0041 and a space.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] Only the address gets a credential scan; id, title, note, tool, version and globs get shape rules
    only, and a note such as a pasted token has no character that text_problems refuses.'
  suggested_action: Scan the other fields too or state in the README that review is the only control for them.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: '[minor] The redaction of an unknown key in _problem is not pinned by a test that uses a token-shaped key.'
  suggested_action: Add parse_resources tests with a token-shaped unknown key and route validate resources only
    through load_resources in P-3.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: failure-handling
  evidence: []
  claim: load_resources catches only FileSystemError; an OSError that is not wrapped by the local adapter ends as
    an internal error with no stable code.
  suggested_action: Catch OSError next to FileSystemError, or wrap it in the adapter.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The file is read whole before the 256 KiB test; ADR-002 decision 10 accepts this.
  suggested_action: None in P-2.
  confidence: high
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The internal-host rule examines only the last label against a closed list; review of the registry is the
    control for other names.
  suggested_action: State it in the P-8 README.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The five new profile facts have no length or text limits in the contract; the limits are applied at answer
    time, render time and check time.
  suggested_action: Test a hand-edited profile with hidden code points in P-6 and P-7.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-8
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: In the InvalidPath branch the raw path argument becomes Finding.path.
  suggested_action: Print it through printable in P-3.
  confidence: low
- schema: orqlet.finding/v1
  id: F-9
  kind: observation
  severity: info
  category: failure-handling
  evidence: []
  claim: For a missing file the loader returns the empty registry from its constant; if the constant ever stopped
    validating the result would be no registry and no finding.
  suggested_action: Return the findings of that call when the result is none.
  confidence: low
- schema: orqlet.finding/v1
