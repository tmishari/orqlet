findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] printable does not neutralise CI workflow-command markers: an uncovered name such as a double
    colon followed by warning is printed with only blanks in front, and a title can hold the legacy ## bracket form.'
  suggested_action: Give each uncovered line a fixed prefix, consider escaping both markers in printable, and apply
    the same in conventions check in P-7.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The terminal gate covers only attach; update of the address or access of a login entry needs only
    --yes, and a terminal check cannot show that a person answered.'
  suggested_action: Extend the gate to update or state in the README that it is a guard and not a boundary; review
    is the control.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: failure-handling
  evidence: []
  claim: '[minor] In attach the registry is read before the login question and the plan takes its before-hash after
    it, so an edit of the registry during the question is overwritten.'
  suggested_action: Compare the registry hash again after the gate and before apply.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: architecture
  evidence: []
  claim: '[minor] The copy checks of attach duplicate those of validate resources.'
  suggested_action: Keep one shared function and constant.
  confidence: high
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: non-blocking
  category: standards
  evidence: []
  claim: '[minor] ORQ-I504 is not allocated by the plan and ORQ-E509 is used at WARNING severity for a skipped link.'
  suggested_action: Allocate both in the amendment.
  confidence: high
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: '[minor] The cap of 100 link prompts has no test.'
  suggested_action: Add a test of an endless non-empty address and say in the completion note that the init kill
    points are sampled.
  confidence: high
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: attach_copy reads the whole copy before its 64 KiB check; links are refused by the port.
  suggested_action: Accept or add a size-capped read to the port.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-8
  kind: observation
  severity: info
  category: correctness
  evidence: []
  claim: resources_edit formats pydantic errors itself and does not mask the key of an extra_forbidden error; every
    key comes from the spec and the model, so it is safe today.
  suggested_action: Reuse the one formatter later.
  confidence: high
- schema: orqlet.finding/v1
  id: F-9
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: The full suite ran on 3.14.9 only; the seven new test files also ran on 3.12.11.
  suggested_action: The CI matrix gives the rest.
  confidence: high
