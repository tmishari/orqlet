  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: Three of the ten new vectors (zero-width character in the time, Arabic-Indic digits, trailing newline)
    might be refused by fromisoformat alone and would not catch a removal of the pattern; they assert only that
    a ValidationError is raised.
  suggested_action: Assert the fixed message and add a Unicode minus and a +24:00 offset.
  confidence: medium
