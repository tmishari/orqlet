findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[major] text_problems accepts ''@'', which Claude Code reads as a file import in a memory file; AGENTS.md
    is imported by CLAUDE.md, so a note or answer such as ''see @~/.ssh/key'' could pull a local file into the context.
    Not observed in a client.'
  suggested_action: Refuse '@' in text_problems and add hostile vectors; extend check V-3.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The hidden-code-point table stops at U+180E; U+180F is a default-ignorable variation selector
    and is not in it.'
  suggested_action: Extend the table (U+180F, U+FFF0 to U+FFF8) and update the tests.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The open-redirect rule refuses a decoded query value only for ''//'' or a scheme; ''/\host'' and
    ''\\host'' (as %5C) pass.'
  suggested_action: Also refuse a decoded value that holds a backslash; add vectors.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The URL allow-list admits ''$'', ''\'''', ''!'', ''*'' and '';'' in a path, so an address put
    unquoted in a shell command could chain commands; ADR-001 routes lookups through client web tools.'
  suggested_action: Refuse those characters in a path and a path parameter; the baseline says an address is never
    put into a shell command.
  confidence: low
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] The opaque-token heuristic covers path segments of letters, digits and ''_'' only; a webhook-style
    secret under 32 characters or with a hyphen, or a '';jsessionid='' path parameter, passes.'
  suggested_action: Refuse ';' in a path; accept the rest as a stated limit.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: '[minor] glob_problems refuses a glob only when every character is ''*'', ''?'' or ''/''; ''*.*'' and ''**/*.*''
    pass and match nearly every file, and '','' is accepted.'
  suggested_action: Refuse ',' and a glob whose segments are only '*', '?' and '.'.
  confidence: low
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The token prefixes omit model-vendor keys ('sk-', 'sk-ant-'), 'npm_', 'rk_live_' and 'pk_test_'; _TOKEN_BODY_CHARS
    is unused.
  suggested_action: Add the prefixes and remove the constant.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-8
  kind: observation
  severity: non-blocking
  category: failure-handling
  evidence: []
  claim: '[minor] is_stale raises OverflowError near datetime.max and TypeError for a naive datetime; doctor would
    crash on a hostile registry unless the contract bounds retrieved_at.'
  suggested_action: Bound retrieved_at in the P-2 contract and catch the overflow.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-9
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: copy_path builds a path from an unchecked id and host_of returns raw host text for a refused address; both
    are safe only if callers validate first.
  suggested_action: Make the functions refuse bad input themselves.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-10
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: The public-entry rule for internal-looking hosts has no function in P-1 and appears in the P-2 plan only
    in an explanatory text.
  suggested_action: Add an acceptance criterion to P-2 that the contract refuses a public entry with such a host.
  confidence: high
