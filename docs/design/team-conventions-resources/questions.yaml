- id: Q-15
  key: 0c9592328468a4b94402b5e833fbaf05833273657da6271ab1d7b11fe2d68366
  subject: How a linked page behind a SAML login is read
  raised_by: researcher
  phase: research
  category: access
  text: 'The answer to Q-13 is ''yes'' and the answer to Q-12 says that a page may sit behind a SAML login, so that
    it is good to open it in a browser or use a browser plugin so that the developer can sign in and the client
    can read. Which way is meant for a page that needs a login: the developer signs in in a browser and the client
    reads the page through a browser plugin or a browser tool, the user''s own MCP sign-in of the integrations design,
    a copy that a person stores in the repository, or more than one of these?'
  why: The fetch tools of the clients cannot sign in, and the answer names a browser route without saying which
    client tool reads the page afterwards.
  options:
  - a browser or browser plugin where the developer signs in
  - the user's own MCP sign-in
  - a copy stored in the repository
  - more than one of these
  evidence_refs:
  - docs/design/team-conventions-resources/as-is.md#U-61
  - docs/design/team-conventions-resources/as-is.md#U-64
  - docs/design/team-conventions-resources/as-is.md#U-70
  - docs/design/team-conventions-resources/as-is.md#A-160
  - docs/design/team-conventions-resources/as-is.md#A-161
  - docs/design/team-conventions-resources/as-is.md#A-162
  blocks:
  - design
  status: answered
  answer:
    value: 'Delegated by the user to industry practice ("just look for best practicies of industry in web"). The practice
      found in the committed web evidence: a client that needs a page behind a login uses the signed-in session of
      the person who works. Claude Code with Chrome shares the browser''s login state and pauses at a login page or
      CAPTCHA for the person to handle (evidence/web/claude-code-chrome.md). Playwright MCP offers a persistent profile,
      an isolated profile that can load a storage-state file, and an extension that attaches to the person''s own
      tabs (evidence/web/playwright-mcp.md). For an MCP server, the draft authorization specification requires that
      a token is issued for that server as its audience, forbids a client to send other tokens to it, and forbids
      a server to pass on any other token (evidence/web/mcp-authorization.md). The evidence found covers Claude Code
      and Playwright MCP; it does not cover a browser route in Cursor or Codex, and it does not say how a stored copy
      of a login-protected page is kept current. The design proposes the way for each client from this evidence, and
      the person approves it in the design review.'
    answerer: user
    time: '2026-10-26T18:46:26+02:00'
    scope: task
  
- id: Q-16
  key: 8eeff79da000d4bb9990292d173be354b14c11402b71e2d8cff8d710a90ab618
  subject: Where the conventions are checked
  raised_by: researcher
  phase: research
  category: policy
  text: 'The answer to Q-11 is ''checked''. Where is a convention checked: in a pull request check on the code host
    (CI), in a local commit-message or pre-push hook, or in both, and which conventions are checked this way (branch
    name, commit message, pull request shape, merge strategy, required checks, release and hotfix flow)?'
  why: Local Git hooks and `ci check` are listed as not built, so the place of the check decides what must be built.
  options:
  - CI only
  - a local hook only
  - both
  evidence_refs:
  - docs/design/team-conventions-resources/as-is.md#U-1
  - docs/design/team-conventions-resources/as-is.md#U-3
  - docs/design/team-conventions-resources/as-is.md#U-5
