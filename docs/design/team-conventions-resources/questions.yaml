  - docs/design/team-conventions-resources/as-is.md#U-17
  - docs/design/team-conventions-resources/as-is.md#U-47
  - docs/design/team-conventions-resources/as-is.md#U-65
  - docs/design/team-conventions-resources/as-is.md#U-66
  - docs/design/team-conventions-resources/as-is.md#U-67
  - docs/design/team-conventions-resources/as-is.md#A-151
  - docs/design/team-conventions-resources/as-is.md#A-152
  - docs/design/team-conventions-resources/as-is.md#A-153
  - docs/design/team-conventions-resources/as-is.md#A-154
  - docs/design/team-conventions-resources/as-is.md#A-155
  - docs/design/team-conventions-resources/as-is.md#A-156
  - docs/design/team-conventions-resources/as-is.md#A-157
  - docs/design/team-conventions-resources/as-is.md#A-158
  - docs/design/team-conventions-resources/as-is.md#A-159
  blocks:
  - design
  status: answered
  answer:
    value: 'Delegated by the user to industry practice ("just look for best practicies of industry in web"). The practice
      found in the committed web evidence: the check that decides is enforced on the server side. Pro Git says client-side
      hooks are not copied on clone, that `git commit --no-verify` bypasses the pre-commit hook, and that a policy
      is better enforced on the server (evidence/web/git-hooks.md). The commitlint guide lints the commits of a pull
      request on the CI server, after a local setup (evidence/web/commitlint-ci.md). GitHub branch protection can
      require status checks, reviews, code owner approval, linear history and signed commits, and by default does
      not bind admins (evidence/web/github-protected-branches.md). DORA advises protecting branches so that pull requests
      merge only when all tests have passed, and warns against an overly heavy review process (evidence/web/dora-trunk-based.md).
      A local commit-msg or pre-commit hook is described as a check before a commit that a person can bypass. The
      evidence found does not cover how a tool checks a branch name or the shape of a pull request description, so
      those two stay open for the design to decide.'
    answerer: user
    time: '2026-10-26T18:46:26+02:00'
    scope: task
