- id: Q-3
  key: bd4405b9fb4fb774b9243e81c38ae66ca591507bbffac78294554167573260bf
  subject: Team conventions that Orqlet must ask about
  raised_by: researcher
  phase: research
  category: requirement
  text: Which team conventions must Orqlet ask about and write into the project?
  why: These are the facts that the generated project files would carry.
  options:
  - branch model and gitflow
  - branch naming and commit message convention
  - what a pull request looks like
  - merge strategy and the checks required before merge
  - release and hotfix flow
  blocks:
  - research
  status: answered
  answer:
    value: 'All five: branch model and gitflow; branch naming and commit message convention; what a pull request
      looks like (size, template, title, description, reviewers); merge strategy and the checks required before
      merge; release and hotfix flow'
    answerer: user
    time: '2026-10-26T17:50:00+02:00'
    scope: task
- id: Q-4
  key: baf95a1dea4ad289a4848e7d3476cdbeb006942d46c3e74c0c1b852f0f7ab81b
  subject: Kinds of resource that a user can link
  raised_by: researcher
  phase: research
  category: requirement
  text: What kinds of resources does the user want to link?
  why: The kinds decide how a link is fetched, described and shown to an agent.
  options:
  - API guidelines
  - documentation of a tool or library
  - internal pages behind a login
  - any link with a note about when it applies
  blocks:
  - research
  status: answered
  answer:
    value: 'All four: API guidelines; documentation of a tool or library the team uses; internal pages behind a
      login (Confluence, wiki, design docs); any link with a short note from the user about when it applies'
    answerer: user
    time: '2026-10-26T17:50:00+02:00'
    scope: task
- id: Q-5
  key: cf3420feefd6c8d835ba28e8da1e2378e7daa0437b3f97032039f8b6ba1720a9
  subject: How a linked resource reaches the agents
  raised_by: researcher
  phase: research
  category: requirement
  text: How should a linked resource reach the agents?
  why: This decides which generated files carry it.
  options:
  - a rule that loads only for matching files
  - a skill per tool
  - a catalogue of links that agents can open
  - a stored copy or summary of the page in the repository
  blocks:
  - research
  status: answered
  answer:
    value: 'All four: a rule that loads only when a developer works on matching files; a skill per tool; a catalogue
      of links that agents can open when needed; a stored copy or summary of the page in the repository'
    answerer: user
    time: '2026-10-26T17:50:00+02:00'
    scope: task
