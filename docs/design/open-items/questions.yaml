  raised_by: researcher
  phase: research
  category: access
  text: Which GitHub plan is the account on, is the repository meant to stay private, and may the plan
    or the visibility change? GitHub answered the branch-protection and ruleset requests with HTTP 403
    'Upgrade to GitHub Pro or make this repository public to enable this feature'.
  why: Branch protection, required reviews and rulesets are what the proposal relies on for merge evidence;
    the capture states no plan.
