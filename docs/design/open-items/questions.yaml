  subject: Who counts as an authorised approver and whether a second reviewer exists
  raised_by: researcher
  phase: research
  category: policy
  text: Who counts as an authorised approver for designs and plans (the proposal's Q-03), how many approvers
    are required, and is a second person with write access available to review? The repository has one
    collaborator, who is also its administrator.
  why: The proposal defines approval as a merged pull request with an approving review from a code owner
    who is not the author; the repository lists one collaborator, no CODEOWNERS file and no pull request.
  options:
  - a second reviewer exists or can be added
  - a single maintainer approves
  - something else
