- id: Q-1
  key: 72ad9472f7cee7f2367f66e8385537f9dd7aaf26e3715ae358ecf8613f6d8692
  subject: Which unfinished items the research covers
  raised_by: researcher
  phase: research
  category: requirement
  text: 'The request was "find a solution for all uncompleted tasks". Which of the unfinished items should
    this research cover: the red CI jobs, approval and merge evidence with branch protection and plan
    re-basing, the open review and test items of harness2-fit, the open items of the architecture proposal,
    or the go-migration-feasibility task?'
  why: Research records facts for the chosen items only; the others stay unexamined and are not claimed
    to be complete or incomplete.
  options:
  - red CI jobs
  - approval and merge evidence, branch protection, v0.4 and v0.5 plan re-basing
  - harness2-fit open review and test items
  - open items of the architecture proposal
  - go-migration-feasibility
  blocks:
  - research
  status: answered
  answer:
    value: approval and merge evidence, branch protection, v0.4 and v0.5 plan re-basing (the person chose
      this one item; the red CI jobs and the others are not covered)
    answerer: user
    time: '2026-10-25T17:35:00+02:00'
    scope: task
