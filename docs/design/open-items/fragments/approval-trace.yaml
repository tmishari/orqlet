- id: A-10
  kind: flow
  statement: Without a task, gate_status returns only data.bound; the verdict is PASS when no error and
    no skip was recorded, and NOT_RUN when the repository has no commit (skip at line 107).
  evidence:
  - path: src/orqlet/application/usecases/gate_status.py
    lines: 96-112
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
    sha256: aae5ff968dd3d90a145a7c69c9a6a21ae4895226e61a5a633499b543c4ae5424
- id: A-11
  kind: flow
  statement: With a task, gate_status always ends by adding info ORQ-I393 ('approval of the design and
    of the plan is evidence on the protected baseline; an offline run has none, so it is not checked')
    and skip('approval needs host evidence, which an offline run does not have'), so a PASS verdict is
    not reachable with a task.
  evidence:
  - path: src/orqlet/application/usecases/gate_status.py
    lines: 113-123
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
