- id: A-9
  kind: flow
  statement: .orqlet/workflow.lock is written as FileClass.PROTECTED, while .orqlet/project-profile.yaml,
    .orqlet/versions.yaml and .orqlet/role-bindings.yaml are written as OwnerMode.SEEDED with file_class
    None.
  evidence:
  - path: src/orqlet/application/usecases/render_all.py
    lines: 254-273
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
