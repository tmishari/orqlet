  statement: '`--phase` is read only after the `if task is None: return` at lines 111-112, so a phase
    given without a task is ignored.'
  evidence:
  - path: src/orqlet/application/usecases/gate_status.py
    lines: 111-116
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
