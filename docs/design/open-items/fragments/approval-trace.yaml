- id: A-17
  kind: flow
  statement: With --phase, _check_expected locates a tree (the --head value, else the staged tree when
    there are staged changes, else HEAD) and a merge base, reads plan.yaml and design/manifest.yaml from
    that tree, evaluates the expected changes, and reports DEVIATION as error ORQ-E450 and ADDITIONAL
    as error ORQ-E451 with the suffix 'A renewed design approval is needed.'; other outcomes are info
    ORQ-I451, notes are ORQ-I450, an unknown phase is ORQ-E453, and a failure to locate a tree is a skip.
  evidence:
  - path: src/orqlet/application/usecases/gate_status.py
    lines: 232-280
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
