    sha256: 0a0644d788df5573aad244dd3ff9feec7ded842eaf9b2ed53089ea755e708168
- id: A-6
  kind: structure
  statement: The five file constants gate status uses are PROFILE_PATH .orqlet/project-profile.yaml, LOCK_PATH
    .orqlet/generated.lock.yaml, STANDARDS_LOCK_PATH .orqlet/standards.lock.yaml and WORKFLOW_LOCK_PATH
    .orqlet/workflow.lock (VERSIONS_PATH and BINDINGS_PATH are defined beside them and gate status does
    not import them).
  evidence:
  - path: src/orqlet/application/usecases/render_all.py
    lines: 55-60
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
    sha256: 3eb448ebfca77262ae107b1be92bd7671f4aef999632ac38f376fc4f79dedaf7
- id: A-7
  kind: structure
  statement: BoundValues has six fields (base_revision, standards_lock_hash, applicable_rules_hash, profile_version,
    workflow_version, protected_set_digest) and as_data() returns them under the key `bound`.
  evidence:
  - path: src/orqlet/application/usecases/gate_status.py
    lines: 48-66
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
