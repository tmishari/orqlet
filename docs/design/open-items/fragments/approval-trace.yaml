facts:
- id: A-1
  kind: interface
  statement: '`orqlet gate status [TASK] [--phase] [--base] [--head] [--root] [--json]` is one Typer command;
    it calls gate_status(build_validate_services(root), task, phase=, base=, head=), wraps the result
    in output_of, and its docstring says ''Read-only and offline. Approval needs host evidence, so a task
    is always NOT_RUN here.'''
  evidence:
  - path: src/orqlet/interface/cli/commands/gate.py
    lines: 16-42
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
    sha256: 423aacbebecb475c51b30bc205dae5f3fb72d10b21d5f8e767f222d1e8f6d9e4
- id: A-2
  kind: structure
  statement: The CLI registers the groups and commands init, upgrade, rollback, sync, doctor, explain,
    release, profile, standards, validate, gate, evidence, knowledge and review; no `approve`, `ci`, `hook`
    or guard command or group is registered.
  evidence:
  - path: src/orqlet/interface/cli/app.py
    lines: 34-47
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
    sha256: 822b147c030944d99e6f7c6059f01a5830430dfc601693cecc3875c0e76ae131
- id: A-3
  kind: dependency
  statement: build_validate_services wires LocalFileSystem, GitVcs over SubprocessRunner, StrictYamlLoader
    and PackagedWorkflow; no code-host or network client is part of the services gate status receives.
  evidence:
  - path: src/orqlet/interface/cli/wiring.py
    lines: 89-97
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
    sha256: 58dfbf955e946c28c9aeb7978ff430344e1005faeb3c36473d1efd61a01ea503
