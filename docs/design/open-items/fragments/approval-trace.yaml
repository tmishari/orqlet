  statement: '_check_task reads docs/design/<task>/as-is.md (front matter), docs/design/<task>/design/manifest.yaml
    and docs/design/<task>/plan.yaml from the working tree with read_artifact; an absent file is info
    ORQ-I394 and {found: false}; present files are parsed against their contract only, and none of the
    validate_* checks (for example the header-task checks E331, E350, E370) run.'
  evidence:
  - path: src/orqlet/application/usecases/gate_status.py
    lines: 145-166
    revision: e2d6a5c8d25deb2d822d79f8ea7f8512240c62ac
