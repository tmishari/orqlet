    text: "Does the protected branch of this repository require at least one approving review and a code-owner review, and does the rule apply to the catalog paths? Is stale-approval dismissal enabled, is approval of the most recent reviewable push required, and can administrators bypass the rules? Which branch's CODEOWNERS file does the host apply to a pull request that edits it? The repository holds no file that says so, and the design relies on these settings for the human review that stands in for an AI reviewer when none qualifies (class I3)."
