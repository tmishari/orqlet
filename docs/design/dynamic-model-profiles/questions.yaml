  - id: Q-36
    key: 03ae6dccd2bfb39f03fcbf76e93777aa0fb4e1bb994cd5664ebbdb22738ef023
    subject: "A CI check that blocks a merge when a gated review is NOT_RUN"
    raised_by: architect
    phase: design
    category: policy
    text: "Today a review below its minimum independence reports NOT_RUN (exit status 5) and the CI workflow runs no orqlet validate, gate or review command, so nothing turns a NOT_RUN code, architecture or security review into a blocked merge, and nothing runs orqlet validate model-policy on the repository's own policy (the exclusion check, the approval-field check and the drift check). Does the person want a required CI check for either, in this change or later, or are the procedural rules plus the host's required reviews enough?"
    why: "The design says the gate reports NOT_RUN and does not claim it blocks; a blocking check would be a CI change (D3) and is a decision for the person."
    options:
      - "procedural rule plus the host's required reviews only"
      - "add a required CI check in this change"
      - "add it later, as its own task"
    evidence_refs:
      - ".github/workflows/ci.yml"
      - "docs/design/dynamic-model-profiles/as-is.md#A-44"
    status: open
  - id: Q-37
    key: 2fafce05a2c26b0671f9e3c64653fb7cc121cfb6c587663cafa4647c98470afc
    subject: "Whether an independent session of the same client satisfies the code review gate"
    raised_by: architect
    phase: design
    category: policy
    text: "Q-21 says 'independent session or human (I3) when no qualifying reviewer exists'. The design reads 'independent session' as a session in another client, because a new session of the same client is derived as I1 and the gate needs I2. Does the person mean that a fresh independent session of the same client may satisfy the gate when no I2 reviewer exists?"
    why: "The design narrowed Q-21 here without asking; the answer decides whether the fallback for a NOT_RUN code review is another client or a human only, or also a fresh session of the same client."
    options:
      - "no: another client or a human code-owner review only (the design's reading)"
      - "yes: a fresh independent session of the same client also satisfies the gate"
    evidence_refs:
      - "docs/design/dynamic-model-profiles/design/adr-006-code-review-gate-and-new-roles.md"
    blocks:
      - plan
    status: answered
    answer:
      value: "No. The fallback for a NOT_RUN code review is another client or a human code-owner review, not a fresh session of the same client."
      answerer: user
      time: "2026-11-05T10:50:00+02:00"
