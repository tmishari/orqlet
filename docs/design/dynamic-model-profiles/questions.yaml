  - id: Q-32
    key: 5e4d878b0404df538a1648aee970d5142e6443cfd4287e8ddee1d4db8fd69e46
    subject: "Second code owner for the model catalog paths"
    raised_by: architect
    phase: design
    category: policy
    text: "Q-23 requires approval by any developer except the author, at least one approval and a code-owner review on the catalog paths. .github/CODEOWNERS lists only @tmishari for .orqlet/** (which already covers .orqlet/model-policy.yaml) and for the other owned paths, and has no entry for any other path: not for src/orqlet/workflow/seeds/**, for .github/CODEOWNERS itself, for anything else under src/orqlet/** (the workflow package, the validators, the renderers, the matching and independence rules) or for tests/** (the guard tests), so the human code-owner review that the design names as the fallback covers no source-code change today. Who besides @tmishari is a code owner of these paths, so that a change authored by @tmishari can be approved? Owners need write access to the repository, and the last matching pattern of the file decides the owner."
    why: "With a single code owner, a change authored by that owner has no eligible code-owner approver, and the design relies on the host to enforce the approval rule (ADR-004)."
    evidence_refs:
      - ".github/CODEOWNERS"
      - "docs/design/dynamic-model-profiles/evidence/web/github-required-reviews-and-codeowners.md"
    blocks:
      - plan
    status: answered
    answer:
      value: "No second owner. Only @tmishari is a code owner of these paths (src/orqlet/workflow/seeds/**, .github/CODEOWNERS, src/orqlet/** and tests/**, besides .orqlet/**, which is already owned). The person chose this option after the request named no handle; Q-23's approval rule then cannot be met for a change that @tmishari authors, and the person accepts that."
      answerer: user
      time: "2026-11-05T10:57:00+02:00"
      scope: task
