capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-security-reviewer); its prompt held the packet path and nothing else, in a new context. The model
  that ran it is not observed. This is round 4 of the phase; the reviewer was given no earlier round.
- The reviewer wrote that its session had no shell and that it could compute no quote digest. Its log shows 3 Shell calls, all read-only listings of the
  packet (ls, find, wc). It ran no orqlet, test, hash or evidence command. The Coder did not test whether such a command would have worked in its session,
  so it is not known whether the reviewer could have computed digests. Every test count and check result in the test record is therefore a claim of the
  Coder that the reviewer did not repeat. The Coder computed the digests below for committed lines at revision 8a68afc5e740f47b1d6f7273a370ed6d336d547e
  after reading each range against the claim it supports.
- 'Packet checked by the Coder: dynamic-model-profiles-P-12-87465a94 (1007 files, staged tree ab27215991c4a90165f10f9bdaa14a03556ff772, base 000c3cbf0fbd662a318937c5010179f05b9766f8)
  holds no file under a reviews folder and no P-12 review record, and the two P-12 records in it carry no earlier conclusion. The Coder''s scan did not
  cover the docstrings of the tests, and the packet does carry mentions of earlier rounds there: tests/unit/test_codeowners.py names finding F-5 of the
  round-3 record of the architecture reviewer, and 40 lines of tests/unit/test_readme_model_policy.py match ''rework round'', ''round N'', ''reviews/''
  or ''open pull request''. The reviewers could read these, so their independence from rounds 1 to 3 is weaker than the packet rule intends (see the finding
  on it).'
- 'The proposal is over the packet limit (ORQ-I440) and the reviewers read it through the hunks of diff.patch only. `orqlet review prepare` printed ORQ-I441:
  the code-reviewer binding is not printed.'
- The test record the reviewer read says that the pytest run is a claim (evidence_kind claimed), has verdict NOT_RUN because the gate-status command exits
  5 offline, and that the CI matrix did not run; the reviewer re-ran no check.
- Read-only is declared by the agent definition, not enforced by Orqlet.
- '`applicability.examined` lists the files that the reviewer opened with Read, taken from its tool-call log. Its Grep and Glob calls searched more of the
  packet and are not listed.'
- The reviewer returned all five findings as observations and said it used that kind because it could compute no quote digest; the Coder attached digested
  quotes of committed lines to F-2 and F-3, after reading them, and kept the kind as returned. Severities are as the reviewer wrote them.
- 'Coder''s note on F-2: true for the docstrings (test_codeowners.py lines 5-8 and 16, test_readme_model_policy.py line 58), and for the approved plan (plan.yaml
  line 1521, which stays as approved). Not corrected in this phase.'
- 'Coder''s note on F-3: the same as the note on F-3 of the architecture record: the person chose the five entries in the session of 2026-11-19; the repository
  holds no record, and I wrote none.'
- 'Coder''s note on F-4: checked: README lines 492 and 493 say ''defence in depth behind a block that the company sets in the client''; no company is named.
  Whether the sentence stays is the owner''s decision, and I did not change it.'
- The reviewer wrote the result of its two partial checks as 'partial'; the self-check format allows pass, fail and not-run, so they are recorded as not-run
  with 'partial' at the start of the reason.
- 'Coder''s note on the reviewer''s absence record: it searched the diff, the README, the two new tests, .github, .gitignore and .gitattributes for secrets,
  tokens, URLs, e-mails, key shapes, account ids and internal hosts and found none in the added text; the Coder did not repeat that search in this round.'
