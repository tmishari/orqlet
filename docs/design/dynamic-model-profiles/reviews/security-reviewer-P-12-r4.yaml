findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  claim: The nine new CODEOWNERS entries enforce nothing today. The answer to Q-34 says main has no branch protection and no ruleset, `tmishari` is the
    only collaborator, and the human code-owner review "is therefore enforced by nothing". The answer to Q-32 says there is no second owner, so a change
    that @tmishari authors has no other code owner who can approve it. "EC-7 implemented as designed" therefore means the file text is present, not that
    a control exists. The README does not claim host enforcement, and a test guards that (test_readme_model_policy.py, `test_the_section_does_not_say_that_the_host_enforces_the_gate`).
  suggested_action: No change to this phase. Say in the phase report that the entries are advisory until the host enforces reviews (AC-1 already asks for
    this). Any ruleset is a host decision for the owner.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: docs
  evidence:
  - kind: quote
    path: tests/unit/test_codeowners.py
    lines: 5-8
    revision: 8a68afc5e740f47b1d6f7273a370ed6d336d547e
    quote_sha256: 42c792b10493597f179048f628c5c16b9428bda10dd15de4618a5a9745d3ed91
  - kind: quote
    path: tests/unit/test_readme_model_policy.py
    lines: '58'
    revision: 8a68afc5e740f47b1d6f7273a370ed6d336d547e
    quote_sha256: 91a066a9e94841c26ec2f5a96ec8f7e8d57e2cbc7b67ba21ffef18780b2574dc
  claim: Three places still describe Q-34 as open ("Q-34 asks what the host enforces", "Q-34 is open", "Q-34 leave open"). The ledger in the same tree marks
    Q-34 answered on 2026-11-05 11:36, with no enforcement. The plan text predates that answer. A reader of the test docstrings could think enforcement
    is undecided when it is known to be absent. The same file, test_readme_model_policy.py:1508, already cites the answer correctly.
  suggested_action: Correct the three docstring sentences to say Q-34 is answered and nothing is enforced. Leave plan.yaml as the approved text and say
    in the phase report that the ledger has moved on.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: standards
  evidence:
  - kind: quote
    path: docs/design/dynamic-model-profiles/plan.yaml
    lines: 1514-1520
    revision: 8a68afc5e740f47b1d6f7273a370ed6d336d547e
    quote_sha256: eee434c37bd1def831f8c5abd80f916fc71713dda9a16c8dfc739b6fa73059bd
  - kind: quote
    path: .github/CODEOWNERS
    lines: 11-19
    revision: 8a68afc5e740f47b1d6f7273a370ed6d336d547e
    quote_sha256: 8472d47bd7ad055b6334c85c82179cbbe727ba8b22b1f9e2aa422b425c0ce514
  claim: Five of the nine entries (`pyproject.toml`, `uv.lock`, `tools/**`, `docs/design/**`, `.github/pull_request_template.md`) are outside plan AC-1,
    which lists four. The packet cites the person's approval only as given "in conversation" and holds no record of it. The change only adds ownership and
    loosens nothing. The unknown is where that approval is written down.
  suggested_action: Record the approval in the ledger or the phase report so that the plan, the tests and the file agree.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: security
  claim: The README is now the public front page for a statement that the exclusion of Fable is "defence in depth behind a block that the company sets in
    the client". ADR-005 and the ledger already hold the same fact ("fable is bloked by company"), and I did not check whether they are on main. I cannot
    tell whether the person wants an employer's model block named in the README. No company is named.
  suggested_action: Ask the owner whether the sentence stays. If not, say "a block that an organisation may set in the client", which still fits the test
    phrases that pin the paragraph.
  confidence: low
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: security
  claim: '`README.md`, `.gitignore` and `.gitattributes` have no owner entry. I read the last two. `.gitattributes` has no `-diff`, filter or `export-ignore`
    that could hide a change from a reviewer packet. `.gitignore` holds only build and cache patterns. Q-32 and EC-7 name no such paths, so this is not
    a gap against the design.'
  suggested_action: None required. Consider these paths if the owner widens the list later.
  confidence: medium
