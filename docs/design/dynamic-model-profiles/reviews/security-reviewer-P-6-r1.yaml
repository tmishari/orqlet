capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer's session had no shell, so it ran no check and computed no quote digest; every finding is an observation and
  none rests on a quote. It did not save a record file; the person running the review saved this one from its answer.
- 'Read-only is declared by the agent definition (readonly: true), not enforced by Orqlet.'
- The model that ran the reviewer is not observed.
- The packet held the earlier review records under snapshot/docs/design/dynamic-model-profiles/reviews/ (22 files) and in
  diff.patch, which ADR-007 decision 8 says a packet must not carry. The reviewer says it read the hunk of
  security-reviewer-P-5-r1.yaml; it says it found F-1 (cost) from the code before it read that record, that F-3, F-4 and the
  `inherit` note were raised there first, and that it re-checked each against the code and the plan in this packet. Its
  findings F-1, F-3 and F-4 are influenced by that record.
- 'Not examined by the reviewer: P-1 to P-4 code in depth (it read the policy contract, model_policy_source, model_selection in
  full, model_identity in part, model_resolution lines 180-545, emit.py, local_fs.py and yaml_loader.py; it did not read
  model_policy_scan.py or src/orqlet/workflow/**), the claimed test results (10732 passed), the cost claim of F-1 (from
  reading, not measured), and whether Cursor or Codex honour `model` in these files (ADR-003 states it as unknown).'
