capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-arch-reviewer) in a clean context; its prompt held the packet path and nothing else. The
  model that ran it is not observed.
- >-
  The reviewer's session had no shell: it ran no check and computed no quote digest. The coder cited, with `orqlet evidence cite` at the commit
  3dd84c80c676f2e28e23647b79396fe1771fee7f, each quote of a file that is committed, and compared the lines with the reviewer's text; every cited
  line matched. Three ranges differ from the reviewer's: the manifest range 40-44 is 41-44 (the key and its three globs, as in the P-8 record),
  the plan file list 1194-1226 is 1195-1225 (the list itself) and the ORQ-E400 range 89-91 is 89-93 (it then holds the code). A quote of a file
  that is only staged (the P-9 code, the tests and the records) cannot be digested, because the command reads committed files; its location is
  written into the claim, and a finding that has no other evidence is an observation.
- >-
  The packet held earlier review records (snapshot/docs/design/dynamic-model-profiles/reviews/) and its diff runs from the merge base
  3dd84c80c676f2e28e23647b79396fe1771fee7f. ADR-007 decision 8 says a packet must not carry earlier conclusions. The reviewer says it found F-1
  first in the test records of P-2 to P-9, then read lines 1-150 of architecture-reviewer-P-8-r1.yaml, whose F-1 raises the same point, so F-1 is
  not independent of the earlier rounds.
- 'Read-only is declared by the agent definition, not enforced by Orqlet.'
- The reviewer says it could not observe its own client or model, so it claims no independence beyond a clean context and a packet-only prompt.
- >-
  Coder's note, not part of the reviewer's text: the ORQ-E451 of F-1 is the open check of P-2 to P-8, now also on the two domain files that this
  phase changes. No finding other than F-1 blocks, so no rework round was run. F-2, F-4 and F-5 concern files outside the phase's list, so they
  wait for the person's decision (a plan amendment); F-3, F-6, F-7 and F-8 are noted for the person and for P-10.
