findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  claim: 'review prepare can withhold a changed file from both reviewers while the review binding still covers it. _packet_files (review_prepare.py
    about 131-169) drops any path matching docs/design/*/reviews/*, and any path named by reviews[].note in the base manifest, from the snapshot,
    the context copies and diff.patch. It adds no omitted line and no MANIFEST entry. The code_tests binding takes only valid evidence records
    out of its own digest (evidence_file_ok, binding_inputs.py about 192-211: schema-valid, identity-matching, not deleted). So these changes
    are in the digest a review record states but are never shown to the reviewer: a non-record file under a reviews folder; a malformed or forged
    record; the deletion of a record; any file an approved base manifest names as a note (DesignReview.note is any RepoPath, design_set.py about
    126-128). ADR-007 decision 8 and AC-3 set this, and the knowledge record says so ("no NOT_RUN for an invalid record"). The Coder also flags
    the note part as the open F-1 of both round-2 reviews. The invalid-record part is not named there as a residual.'
  suggested_action: Ask the person to accept the residual explicitly. Optionally have review prepare report to its caller, not in the packet,
    how many paths were withheld that are not valid review records. Optionally have validate design warn when a note lies outside docs/design/<task>/reviews/.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: failure-handling
  claim: A base manifest that is missing or unreadable silently means "no notes". approved = read_contract_at(..., Collector()) (review_prepare.py
    about line 136) discards the findings, and the unit test test_without_a_manifest_to_read_at_the_base_... asserts no error. This fails toward
    showing more, not toward hiding changes, so earlier note files then enter the packet (BC-21). Nothing tells the person that it happened.
  suggested_action: Return an info finding to the caller (not into the packet) when the base manifest could not be read.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: finding
  severity: non-blocking
  category: correctness
  evidence:
  - kind: absence
    searched:
    - src/**/*.py
    method: 'git grep -n -i for a git version check (''git version'', ''--version'', ''rev-parse --git'', ''git_version'', a minimum-version name)
      at the base commit: the only match is orqlet''s own --version option (src/orqlet/interface/cli/app.py:66). No check of diff.patch against
      diff_tree was searched for by the Coder; the reviewer reports none in the staged snapshot.'
    revision: bb5ec564483aca02f4fc5dfc45035ca427cbec0a
  claim: diff.patch rests on git reading an exclude-only pathspec as "everything else" (vcs_git.py diff_patch about 165-190). The only observed
    versions are 2.56.0 and 2.56.1 on macOS, and AC-5 (the CI matrix) is NOT_RUN in the test record. The supported git versions are an open question
    (U-1/Q-1; the older docs state 2.56.0 is the only verified version). No runtime check compares the patch with diff_tree minus the exclusions.
    If a git read the pathspec differently, the packet would carry an empty or narrowed diff with no error. A reviewer handed an empty diff could
    then answer "no security-relevant change". Git's behaviour on other versions is an unknown to the reviewer.
  suggested_action: After diff_patch, require the number of "diff --git " sections to equal the number of paths from diff_tree that is_excluded
    keeps, and raise VcsError otherwise. Before merge, read the AC-5 result of the CI matrix.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: standards
  claim: 'This review was not fully context-clean. The packet holds no review record: the snapshot has no reviews/ path and MANIFEST.json has
    none. But context/test-record.yaml, context/knowledge-impact.yaml and the test docstrings in diff.patch name earlier rounds ("F-1 of the architecture
    review r1", "F-1 of the security review r2", "F-1 of both round-2 reviews") with the gist of each finding. The sentinel scan cannot catch
    a paraphrase.'
  suggested_action: Keep rework history out of the tester and knowledge records and out of test docstrings (a PR description is the place). Note
    this limit in the review record's capability_limits.
  confidence: high
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: architecture
  claim: One rule has two matchers. is_excluded (Python fnmatchcase) filters the snapshot, the context copies and the fake. Git's pathspec matcher
    filters diff.patch. The port docstring calls both "as fnmatch does". The shipped pattern is a constant with no "[", backslash or "^", so there
    is no mismatch today. The contract tests cover *, ? and [a-c] only. A future pattern could make the snapshot and the diff disagree.
  suggested_action: Document the supported glob subset on the port, or let the F-3 count check catch a disagreement.
  confidence: low
