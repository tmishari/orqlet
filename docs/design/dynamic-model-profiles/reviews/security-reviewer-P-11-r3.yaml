    was not examined.
  - How consumers outside the packet treat a symlink or a gitlink under a reviews folder was not examined; the new code hides it without an omitted
    line.
  - Host-side controls (required reviews, CODEOWNERS) are not readable from the packet.
  - An oversized note list was reasoned to fail closed (ProcessError, then VcsError) and not tested.
  - The tree id of MANIFEST.json was not read in full; the revision of the evidence is the merge base.
