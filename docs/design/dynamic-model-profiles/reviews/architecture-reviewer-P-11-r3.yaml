findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: architecture
  claim: 'P-11 adds a directory rule: REVIEW_RECORDS = "docs/design/*/reviews/*" (review_prepare.py about line 66) hides every path under any
    reviews folder from the snapshot, the context copies and the diff. The accepted harness2-fit ADR-002 (docs/design/harness2-fit/design/adr-002-packet-member-assertion.md,
    decisions 2-3, the consequence "any other file under reviews/ stays an ordinary input", and the rejected alternative "Refuse any member under
    a reviews/ directory") and the docstring of domain/evidence_artifacts.py ("No directory is excluded") say the opposite. ADR-007 decision 8
    never cites or supersedes that ADR. In code, change_set and evidence_file_ok (binding_inputs.py about 192-260) treat a changed file under
    reviews/ that is not a valid record (invalid, deleted, or any other file) as an ordinary input of code_tests. A review record therefore binds
    a digest over content the reviewer cannot see. There are now two notions of "a review path": the glob and parse_evidence_path, where ADR-002
    decision 4 wanted one place.'
  suggested_action: The person decides. Either record in ADR-007 (or an amending ADR) that decision 8 supersedes ADR-002 decisions 2-3 and says
    on purpose that deleted and invalid records are hidden, or narrow the rule.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: compatibility
  claim: 'The code departs from the approved text of AC-1 and AC-3 in three ways, all disclosed in context/test-record.yaml line 19 and context/knowledge-impact.yaml
    line 28. (a) The notes come from the manifest at the merge base (review_prepare.py about 134-137), not "the task''s design manifest". (b)
    A note that names the manifest, the plan or a standards file is ignored (carried, about line 137). (c) The adapter does not pass a directory-named
    note as :(exclude,literal) (vcs_git.py _not_directories). The test record still marks AC-1 and AC-3 result: pass, and plan.yaml is not amended
    (it is not in the diff). The reviewer thinks the changes are sound; (a) answers the hide-a-changed-file problem. But the ACs as approved are
    not met literally.'
  suggested_action: The person accepts the three readings in writing, or the plan is amended, before merge.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: architecture
  claim: The protected set of _left_out (plan, manifest, standards) is ad hoc. The packet contract also promises the AS-IS, the tester record,
    the knowledge-impact record and the design artifacts. A note in the approved manifest that names one of those silently drops that copy. A
    unit test asserts exactly this for as-is.md (test_a_note_path_that_is_also_a_context_source_leaves_that_copy_out). A reviewer would find the
    tester record missing with no trace.
  suggested_action: Decide whether the carve-out should be "every packet context input and design artifact" instead of three named groups.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: docs
  claim: 'ADR-007 decision 8 says the manifest copy "holds no conclusion". The manifest in this packet does: context/design-manifest.yaml lines
    195 and 197 give round counts and "NOT PASS" for the design reviews. context/test-record.yaml line 19 and context/knowledge-impact.yaml line
    28 say "Rework 1, after F-1 of the architecture review r1" and "F-1 of both round-2 reviews". tests/P-10.yaml and knowledge/P-10.yaml in the
    snapshot carry similar text. So this packet told the reviewer that earlier rounds existed and gave their gist. The AC-4 sentinel sits only
    in reviews/ records and notes, so it cannot see this channel.'
  suggested_action: Decide whether round history belongs in a file under reviews/ and not in the records, or accept the residual and say so in
    ADR-007.
  confidence: high
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: non-blocking
  category: correctness
  claim: '(a) The port says a path equal to an exclude_paths entry has no section (ports/vcs.py about 152-157). The real adapter keeps the section
    when that path is a directory at the other end (_not_directories, vcs_git.py about 263-277). That section can be a whole deleted note. The
    fake drops it. The integration test for this (test_an_entry_that_is_a_file_at_one_end..., about lines 436-456) asserts only the inner file,
    not the docs/x section. The scenario needs a note path that changes type, so the reviewer rates it low. (b) The port says patterns match "as
    fnmatch does". Git''s non-glob pathspec differs on backslash escapes, on [^...], and on a wildcard-free pattern that names a directory. The
    reviewer found no test with such a pattern (absence: the pattern arguments of both new test modules were read). Production passes only the
    constant of F-1, so it was not measured.'
  suggested_action: Assert the docs/x section in that test, and narrow the port wording for patterns or add a case.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: non-blocking
  category: failure-handling
  claim: _packet_files reads the base manifest with a throwaway Collector() (review_prepare.py about line 136). A manifest that is missing or
    unreadable at the base gives no notes and no finding, and the test asserts only "no error". The packet then holds notes that the approved
    design meant to hide, with nothing to say so. This contradicts the baseline "handle failures explicitly".
  suggested_action: Emit one info finding (it reveals nothing about the rounds) when the base manifest is absent or unreadable.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: non-blocking
  category: docs
  claim: The knowledge-impact record says "no knowledge document is made wrong", yet its own absence record says the proposal rule at lines 1352-1360
    now differs from the built command. The reviewer could not check those lines because docs/design/orqlet-architecture-proposal.md is not in
    the packet snapshot (omitted over the packet limits). The record's search of docs/ outside the task lists no harness2-fit document. harness2-fit
    ADR-002 (context, decisions 2-3, consequences) and docs/design/harness2-fit/design/considerations.md line 22 describe what review prepare
    exports, and this phase changes it. README.md:354 and orqlet-review/skill.md:26 are correctly named as incomplete.
  suggested_action: Classify the proposal paragraph and the two harness2-fit documents explicitly, with an owner, and handle them by a supersession
    note, not silent drift.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-8
  kind: observation
  severity: info
  category: architecture
  claim: '(The reviewer gave this item no id; the Coder numbered it.) There are now three is_excluded functions in the code base: domain/evidence_artifacts.py,
    domain/model_identity.py and ports/vcs.py. Their meanings differ (ORQLET-STYLE-001, SHOULD).'
  suggested_action: Consider distinct names.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-9
  kind: observation
  severity: info
  category: docs
  claim: (The reviewer gave this item no id; the Coder numbered it.) The first sentence of the review_prepare.py module docstring still says "the
    exact staged snapshot", which is no longer exact after the exclusion.
  suggested_action: Say in that sentence that the exclusion applies.
  confidence: medium
