capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-arch-reviewer); its prompt held the packet path and nothing else. The model that ran it
  is not observed.
- 'The reviewer''s session had no shell: it ran no command and computed no quote digest, so every test count, the ten mutants and the other checks
  of the test record are claims of the Coder that it did not repeat.'
- 'The packet held no file under a reviews folder, although the index held the four records of rounds 1 and 2: diff.patch has nine file headers
  and none is under a reviews folder. The Coder scanned the packet (1004 files) by path and by the claim text of 142 records, the four staged
  ones included: no file and no hit. The packet still told of earlier rounds in prose, and both reviewers say so: the test and knowledge records
  of this phase name earlier review findings (the Coder''s words on rework rounds), the manifest copy and the AS-IS file name two record paths,
  19 earlier test or knowledge records say similar things, and test names and docstrings in diff.patch mention them. ADR-007 decision 8 does not
  reach those, and the sentinel scan cannot catch a paraphrase. The review was therefore not fully context-clean.'
- Read-only is declared by the agent definition, not enforced by Orqlet.
- The reviewer's findings carry no digest and are observations; none blocks. The reviewer's evidence names staged lines that are in no commit,
  so there is no digest to compute.
- 'Coder''s note, not part of the reviewer''s text: no code or test changed after this packet. F-1 and F-2 are for the person (F-2 repeats the
  deviations listed in the test and knowledge records). F-3, F-5, F-6, F-8 and F-9 are open. F-4 is true: the test and knowledge records of this
  phase and of P-10 hold rework history in prose, which was not changed here. F-7: the three descriptions (proposal 1352-1360, README 354, the
  review skill 26) are listed in the knowledge record; the two harness2-fit documents named in F-7 are not, and no phase owns them. F-8 and F-9
  were listed by the reviewer without ids; the Coder gave them the numbers.'
