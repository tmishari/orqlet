- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: correctness
  rule_ref: ADR-005 decision 1 ("deliberately broader and fail-safe"); plan P-3 AC-2, AC-3
  evidence:
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/adr-005-fable-exclusion-by-model-identity.md, lines: "15", revision: 3db213fd9ffa5be05ac098bae4d51217068170e0, quote_sha256: a2a799a070206f933df4c3da3d49e42a530a049430d8a6bf059fc7c2eeda56b6}
  - {kind: quote, path: docs/design/dynamic-model-profiles/plan.yaml, lines: 349-366, revision: 3db213fd9ffa5be05ac098bae4d51217068170e0, quote_sha256: 2a05376b768372d921784ea403152ca6848705f74cc033b1c26c917a41f431a0}
  - {kind: quote, path: src/orqlet/application/contracts/model_policy.py, lines: 34-36, revision: 040a8a882ac283f3fb9a80af1ccb1fce9dba3cb9, quote_sha256: 80a87621ca795d4b61dab68930b3757ca780b0c655b11496cd10a78bb3475bd4}
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/adr-005-fable-exclusion-by-model-identity.md, lines: "26", revision: 3db213fd9ffa5be05ac098bae4d51217068170e0, quote_sha256: add55b7882f833d4dc1161462aa2db07a7fd1e849f8d95783d79b0c08d4acc75}
  claim: 'With the revert, a team id pattern can be narrower than identity, so two strings that AC-2 calls the same
    model can get different exclusion answers. `_rule_matches` matches a pattern, only folded (`_glob`), against the
    raw folded string and `normalise(model)` (model_identity.py:204-206 and 215-222, staged), and `normalise` always
    removes a table prefix (67-77). So a pattern that starts with `openai/` or `xai/` matches only through the raw
    form with the separators as written, and a pattern with `.` or `_` cannot match the normalised form; IdPattern
    allows all three (model_policy.py:34-36). Traced by reading: `openai/*-mini` excludes `openai/gpt-6-mini` but not
    `gpt-6-mini` or `OpenAI/GPT 6 Mini`; `gpt-6.1-*` excludes `gpt-6.1-sol` but not `GPT 6.1 Sol`; `claude_fable_*`
    does not exclude `claude-fable-5`. AC-2 says a provider prefix is never a difference (plan.yaml:349-366); ADR-005
    calls the exclusion the broader test, run on display text (adr-005 line 15), and names "a vendor the company rules
    out" as a team use (line 26). Round 3 locks the miss in (test_model_identity.py:1103-1113 and 1135-1136, staged).
    The shipped Fable rule is not affected, because its family tag catches every variant; the literal AC-3 text is
    met; nothing calls the module yet.'
  suggested_action: The person kept this reading "until the design decides it". Before P-4 or P-7 calls
    `is_excluded`, record that decision in ADR-005 or the ledger (see F-3). The design can keep the narrow reading,
    with author guidance to write patterns with `-` and without a prefix, or choose a rule that keeps the vendor
    constraint without collapsing to `*`; if the fail-safe reading wins, the assertions at 1103-1113 and 1135 change.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: finding
  severity: non-blocking
  category: architecture
  rule_ref: 'AGENTS.md baseline: do not guess; an unknown stays unknown until a person answers'
  evidence:
  - kind: absence
    searched: [docs/design/dynamic-model-profiles/questions.yaml]
    method: 'grep for P-3, model_identity, id pattern, pattern, separator-normalised, resolves_to and "normalises to
      nothing": the only hit for "pattern" is the CODEOWNERS text of Q-32; questions.yaml and the design folder are
      not in diff.patch, so the staged tree equals the merge base'
    revision: 3db213fd9ffa5be05ac098bae4d51217068170e0
  claim: 'This is the third round with no ledger entry for the readings settled in this phase, now including an
    explicit deferral: the test docstring (1104-1106) and the knowledge record (knowledge/P-3.yaml:28) say the
    id-pattern reading is kept "for the design to decide", but neither the ledger nor ADR-005 says so, so nothing
    makes the design decide it. Still open from rounds 1 and 2: the hyphen as the separator of normalised forms; an
    ambiguous string is unknown; the logical id is not a name; an alias or tag that normalises to nothing matches
    nothing, so an excluded[] entry made only of such values excludes nothing and passes the P-1 contract; a
    resolves_to that collides across entries makes a string unknown and name_conflicts does not report it; the YAML
    words are refused in any letter case. The tests still cite "the brief, item n", which is not a repository file.'
  suggested_action: Add ledger questions, or an ADR-005 amendment, for the id-pattern reading, the six readings and
    the two open questions above (empty matchers, resolves_to collisions); the person answers them before P-4; then
    point the test docstrings at those entries.
  confidence: high
