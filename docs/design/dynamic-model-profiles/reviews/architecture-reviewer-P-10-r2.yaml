findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: tests
  claim: Nothing in the suite pins which tree supplies model_families. ADR-007 decision 1 says read from the base tree, and validate_records.py
    332 does that. In every test that sets families, base and staged bindings are the same bytes (LEGACY, SPLIT, SHARED), and the module header
    says no test depends on which tree is used. Reading from the staged tree again would pass all 95 tests. That would let a change add its own
    model_families and give itself an I2, which is the property this phase exists to protect.
  suggested_action: 'Add two cases: families only in the staged bindings give no family difference, and families only in the base bindings still
    apply.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: compatibility
  claim: Carried from round 1 (F-2); the rework did not touch it. Approval is approved_at_base or _approves(staged) (validate_records.py 330-331).
    A binding that the staged tree removes or narrows still approves the record, with no warning. A missing staged role-bindings.yaml used to
    give ORQ-E415 (FAIL); now only a not in the tree skip is recorded, so the result is NOT_RUN. ADR-007 decision 1 is silent on this, and no
    test covers it. The coder named it as reading (7).
  suggested_action: Record the decision in the ledger or ADR-007 (a revocation takes effect from the next change, or it warns), and add a test
    for a binding removed in the staged tree.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: correctness
  claim: 'The notes identity-unknown (ORQ-W460) and same-model-different-client (ORQ-W461) are built for every record (review_identity.py 221-226
    builds findings before derived; _note_findings has no condition on the class). ADR-007 decision 5 and BC-17 define them as qualifiers of an
    I2. The message says the class rests on a different client, which is untrue when the class is I0 (an excluded model, an unapproved binding,
    a missing or stale context). Example: a codex code-reviewer record with no context and unknown models is I0 and still prints ORQ-W460. No
    test combines two clients with an I0 class.'
  suggested_action: Emit the two notes only when the derived class is I2, or state in the AC that they are class-independent. Add a test.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: architecture
  claim: 'The lock lists the policy as seeded rule now exists twice: _lock_lists_policy_as_seeded in model_policy_source.py 132-151 for the working
    tree and _lock_seeds_policy in review_identity.py 140-158 for git trees. _LOCK_PATH is also written again. The module comment and the knowledge
    record both admit this. model_policy_source.py is outside P-10''s file list, and no later phase lists src/, so the copy will stay unless the
    plan is amended.'
  suggested_action: Accept it as disclosed, or amend the plan to share one rule over lock bytes. Two copies of a fail-closed rule can drift.
  confidence: high
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: architecture
  rule_ref: ORQLET-STYLE-001
  claim: 'Carried from round 1 (F-3). The closed warnings come from two modules: five from review_identity.py and binding-added-in-this-change
    from _independence (validate_records.py 319-377). That function reads two binding files, decides approval, runs the assessment, emits ORQ-E415
    or ORQ-W463, adds the freshness reason and raises ORQ-E412. The guideline is SHOULD, so this is optional.'
  suggested_action: None needed for this phase; reported to the person.
  confidence: low
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: docs
  claim: 'The approved manifest says in EC-5 (design/manifest.yaml 84): model_families is read only when no model policy exists. ADR-007 decision
    1, BC-44 and P-10 AC-1 say it also applies to a string the policy cannot match. The code follows the second reading, which is more specific
    and agrees with the accepted design-review answer F-6. The first sentence is stale. EC-5 is not one of P-10''s expected changes.'
  suggested_action: The person confirms which text governs; correct the EC-5 sentence when the design is next amended.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: tests
  claim: Smaller gaps. (a) ORQ-W464 is tested for the agent side only, although the code also warns for the coder side. (b) No test shows that
    an excluded record gets no freshness NOT_RUN line (validate_records.py 363-368). (c) The unmatched (N characters) format is not pinned, which
    the header says on purpose.
  suggested_action: None needed for this phase; reported to the person.
  confidence: medium
