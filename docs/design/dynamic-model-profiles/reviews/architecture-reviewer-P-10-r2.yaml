capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-arch-reviewer); its prompt held the packet path and nothing else. The model that ran it
  is not observed.
- 'The reviewer''s session had no usable shell (Ask mode): it ran no check and computed no quote digest, so every item it returned is an observation,
  and the lines they name are staged and cannot be digested by `orqlet evidence cite`, which reads committed files.'
- The packet held the round-1 review records and the older ones under snapshot/docs/design/dynamic-model-profiles/reviews/. ADR-007 decision 8
  says a packet must not carry earlier conclusions.
- Read-only is declared by the agent definition, not enforced by Orqlet.
- The reviewer discloses that it opened architecture-reviewer-P-10-r1.yaml and architecture-reviewer-P-9-r1.yaml only after forming its own reading,
  to check that the round-1 blocker was closed and to see the record format; its F-2 and F-5 overlap the round-1 F-2 and F-3, so they are not
  independent of round 1. It did not open the security reviews.
- 'Coder''s note, not part of the reviewer''s text: the round-1 blocker (the lock leg of ADR-005 decision 2 and BC-39) was fixed in rework round
  1, and this round finds no blocking item. The verdict is PASS but this record is NOT_RUN on independence (I1, where a D3 change requires I2).
  The reviewer''s category design-consistency of F-6 is not one that the contract allows, so the coder wrote docs. The reviewer''s F-1 is the
  same gap that the security review reports as its F-1; it was not fixed, because it does not block.'
