self_check:
  schema: orqlet.self-check/v1
  checked_against:
    role: security-reviewer
    phase: implement
    acceptance_criteria:
    - AC-1
    - AC-2
    - AC-3
    - AC-4
    - AC-5
    - AC-6
    - AC-7
  checks:
  - what: Secrets in code, tests, fixtures and knowledge text
    how: Regex search of diff.patch for AWS, GitHub, OpenAI, Slack, Google, JWT and PEM shapes and for /Users/ and /home/. The only hit is the
      P-7 review text that names its own search strings. The credential fixture is built by concatenation (test_models_resolve_cli.py:130). knowledge/P-8.yaml
      and knowledge-impact.yaml hold design references and no private data.
    result: pass
  - what: Dependency, workflow and config changes
    how: 'Listed every diff --git header: none for pyproject.toml, uv.lock, .github or AGENTS.md. pyproject pins typer 0.27.3 and pydantic 2.14.1.'
    result: pass
  - what: Process, network and git access of the new use case
    how: 'Read the imports of models_resolve.py: only dataclasses, typing and orqlet ports and modules. _PolicyView.vcs raises on use. build_models_services
      builds no Git adapter, runner or clock. The guard test and the no-write test are in the tests.'
    result: pass
  - what: Injection and input validation of the options
    how: '_check_usage validates the options with strict, ASCII-only types before any file is read: Slug for role, skill and task, ModelRef for
      the coder model, RecordedModel for the override, and closed sets for client and profile. All printed strings are those types, Literals or
      fixed text, so output holds no control characters. Pydantic''s built-in pattern errors are caught with `from None`, and BadParameter carries
      fixed text. The BREACHES tests cover about 40 breaches, text and JSON, for non-repetition.'
    result: pass
  - what: Path and file-system handling
    how: The only paths are the constants .orqlet/model-policy.yaml and .orqlet/generated.lock.yaml. LocalFileSystem refuses a link on any path
      component and opens with O_NOFOLLOW. A link or other non-file at the policy path gives ORQ-E540 and exit 3.
    result: pass
  - what: Data exposure and logging
    how: 'Findings are built from the field path and the rule type, never from a value or a key of the file. _problem_findings caps the listed
      paths at 20. An override is never printed; every override-level rejection reads override-invalid. Unexpected errors print only the exception
      type (runner.py) and pretty exceptions are off (app.py). Marker tests check stdout and stderr, text and JSON. The reviewer read the coder''s
      edit of the override leak assertion: it removes only the permitted catalog id, and the rest of the override is still checked.'
    result: pass
  - what: Unsafe parsing
    how: The strict YAML loader allows no anchors, aliases, merge keys, duplicate keys or custom tags, and limits depth and nodes. The 256 KiB
      cap, the credential scan and the contract run before any value is used. _without_options is linear, and patterns are limited to ASCII with
      only * and ? as wildcards.
    result: pass
  - what: Fail-closed behaviour of the resolver
    how: With --different-family-from naming an unknown or proposed model, or with no policy, the result is none-qualifies (exit 1). Override,
      floor and diversity checks apply to the override too.
    result: pass
  - what: Tests and checks pass
    how: Not run; the reviewer had no shell. The test record has evidence_kind claimed.
    result: not-run
  unverified:
  - That the results in context/test-record.yaml are true.
  - That a trailing newline in an option value (for example --task 'x\n') is refused. The tests cover an embedded newline only. The reviewer relies
    on pydantic-core's regex engine (pydantic 2.14.1), where $ does not match before a trailing newline, and did not confirm it.
  - Which hunks of diff.patch are staged and which are committed.
  - P-1 to P-7 code in the same diff. The reviewer read it only where P-8 depends on it. Earlier security rounds exist for it and were not repeated.
  - MANIFEST.json (over the read limit; the diff headers and the snapshot were used instead).
  - The behaviour of the GitRunner (not used by this command).
  questions:
  - 'Q1: Should a missing policy with an invalid or absent lock be shown differently from ''no policy was ever present'' (F-1)?'
  - 'Q2: Has a 256 KiB worst-case policy been timed for `policy_problems` and `resolve` (F-3)?'
  - 'Q3: How will ORQ-E451 for the three domain security files be settled before merge (F-4)?'
