findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: info
  category: failure-handling
  evidence:
  - kind: quote
    path: src/orqlet/application/usecases/model_policy_source.py
    lines: 99-110
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    quote_sha256: 4d53dcbabe4f56f0346fddadccf273f71da825dfc870ba8435cd1a04bc6ca5f7
  - kind: quote
    path: src/orqlet/application/usecases/model_policy_source.py
    lines: 132-151
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    quote_sha256: 80dd4bfc2fcf0e39bcf0472caebca7cf66ba159cad9eea419203cdec935fdfb3
  claim: 'A policy that is missing is ''deleted'' only when a valid lock lists it with owner `seeded`. A lock that is missing, unreadable, invalid
    or a link, or a lock that lacks the row, gives PolicyAbsent. `models resolve` then prints ''no model policy; the client chooses'' with exit
    0, and every exclusion and pin is dropped. Deleting the policy and the lock row together therefore reads the same as a project that never
    had a policy. This is a deliberate, tested decision (the docstring says so; test_a_lock_that_cannot_prove_a_deletion_leaves_the_policy_absent),
    and the design says deletion is detected ''from the lock''s seeded row'' (component.md:39). The design does not say a broken lock reads as
    absent. Impact is bounded because the command is advisory (''the client keeps the choice''). Enforcement is `validate review` against the
    base and staged trees (adr-005:20). Locations that rest on files which are not committed, so no digest could be made: src/orqlet/application/usecases/models_resolve.py:142-147
    (staged).'
  suggested_action: Say in component.md or ADR-005 that `models resolve` with policy 'absent' is not evidence that no exclusion exists. Keep the
    review skill (a later phase) from reading it that way.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  evidence:
  - kind: quote
    path: src/orqlet/adapters/fs/local_fs.py
    lines: '106'
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    quote_sha256: a5d0063acbf095bc33e4a0fb7bbe4afa68e01126d989bcc0868d6f9ecc4631d2
  - kind: quote
    path: src/orqlet/application/usecases/model_policy_source.py
    lines: '108'
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    quote_sha256: d717b552e58bc1c7fda5ca0f1bd015de529f3afb5c57514541fffd4d6fcf7f69
  - kind: quote
    path: src/orqlet/application/usecases/model_policy_source.py
    lines: '146'
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    quote_sha256: b37730477ac39713d81dfe006302e4aefce6694c44c8d3277f08d59637a2bf02
  - kind: quote
    path: src/orqlet/application/usecases/model_policy_source.py
    lines: '156'
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    quote_sha256: f1853fc5b71dc54e4e1d660592f95a6708c50d9aaad33321224951a452d55f9b
  claim: The policy and, when the policy is missing, the lock are read whole before any size check. `LocalFileSystem.read_bytes` returns `handle.read()`,
    and the 256 KiB check in `_parse` runs afterwards. The strict loader's 1 MiB limit also runs after the read. `models resolve` is a new entry
    point for this reader, and the review skill is expected to call it on a branch it did not write. A very large regular file at `.orqlet/model-policy.yaml`
    costs memory. Only regular files reach the read (links and other kinds are refused), and the effect is bounded by what Git hosts accept. The
    docstring names this as a limit of the `FileSystem` port. It is the same class as F-4 of the P-7 security review.
  suggested_action: Add a size query to the `FileSystem` port in a later phase. Until then keep the limit stated.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence:
  - kind: quote
    path: src/orqlet/application/usecases/model_selection.py
    lines: 505-516
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    quote_sha256: f079bb4ccc6ee4942461e1794aa81bde58f59812ddc4f093a2cc844836370c8a
  - kind: quote
    path: src/orqlet/domain/model_resolution.py
    lines: 199-206
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    quote_sha256: c35ec763137ed278ba5269d6b8c5cd74f1055519b97317273854d8d70b1059b9
  - kind: quote
    path: src/orqlet/domain/model_identity.py
    lines: 214-221
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    quote_sha256: f02325d70160aed18f764483eba4fec954bc83b88d3a667e54dc4075252025a2
  claim: Exclusion matching is super-linear in the size of a file that the repository controls. `policy_problems` and `resolve` call `is_model_excluded`
    for each model over every string of the model (id, family, each route's name, `resolves_to` and up to 8 `also_known_as`) and over every exclusion
    rule. `_rule_matches` recomputes the normalised aliases and tags of the rule on each call (model_identity.py:214-221). The only bound is the
    256 KiB size cap, with no cap on entries. By reading the code, a policy packed with exclusions and models can take a long time. I did not
    measure it, so this is an observation, not a finding. Other commands share this cost (`upgrade`, `validate model-policy`, `explain`). P-8
    adds a command that an agent may run automatically on a pulled branch.
  suggested_action: Measure a 256 KiB worst-case policy. If it is slow, compute the normalised forms once for each rule or cap the entries per
    list. Otherwise record the limit.
  confidence: low
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: standards
  evidence: []
  claim: 'The phase gate stays open with ORQ-E451. The files src/orqlet/domain/model_identity.py (P-3), model_policy_scan.py (P-2) and model_resolution.py
    (P-4) match the design''s security glob `src/orqlet/domain/**` and have no automatic security expected-change entry. EC-7 is the only security
