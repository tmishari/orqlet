capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-security-reviewer) in a clean context; its prompt held the packet path and nothing else.
  The model that ran it is not observed.
- 'The reviewer''s session had no shell: it ran no check and computed no quote digest. The coder cited, with `orqlet evidence cite` at the commit
  456cc1a206c053ed0d98362a059e68d06115a429, each quote of a file that is committed, and compared the lines with the reviewer''s text; every cited
  line matched. A quote of a file that is only staged (the P-8 code, the tests and the records) cannot be digested, because the command reads
  committed files; its location is written into the claim, and a finding that has no other evidence is an observation.'
- The packet held earlier review records (snapshot/docs/design/dynamic-model-profiles/reviews/) and its diff runs from the merge base 3db213fd9ffa5be05ac098bae4d51217068170e0,
  so it holds P-1 to P-7 as well. ADR-007 decision 8 says a packet must not carry earlier conclusions.
- 'Read-only is declared by the agent definition (readonly: true), not enforced by Orqlet.'
- The reviewer does not say whether it opened earlier review records; it names the P-7 review text only as the one hit of its credential search,
  which names its own search strings.
- The reviewer's categories denial-of-service (F-2, F-3) and process (F-4) are not in the closed list of the format. The coder recorded F-2 and
  F-3 under security and F-4 under standards.
- The reviewer's text says it read P-1 to P-7 code only where P-8 depends on it, and that it does not know which hunks of diff.patch are staged
  and which are committed. The coder digested the quotes of F-1 to F-3 that are in committed files; the one location in a staged file (F-1, models_resolve.py)
  is written into the claim.
- 'Coder''s note, not part of the reviewer''s text. The reviewer left one item unverified: whether a trailing newline in an option value is refused.
  The coder ran the types that the command uses (Slug, ModelRef and RecordedModel from the contracts, strict validation) on ''x\n'', ''x\r'',
  ''x\n\n'' and ''x\u2028'': each of the three types refused all four values. `orqlet models resolve --client codex --role orqlet-tester --task
  $''x\n''` exits 2 with the fixed sentence for --task.'
- 'Coder''s note, not part of the reviewer''s text. For F-3 the coder timed the whole process (`uv run orqlet models resolve --client claude-code
  --role orqlet-tester --json`, five runs each) on a throwaway policy of 262064 bytes with 794 exclusions: median 1.59 s without an override and
  1.62 s with one, against 0.73 s and 0.71 s for a policy with one exclusion. The runs exit 0. The scratch files are outside the repository.'
