findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: info
  category: security
  rule_ref: ORQLET-SEC-002
  evidence: []
  claim: documented.evidence, evaluated.evidence and list_price.source are RepoPath (model_policy.py:76,82,94).
    `_repository_path` re-raises the text of InvalidPath, which quotes the refused path (common.py:51-56;
    domain/paths.py:34-48). load_contract prints error['msg'] (loading.py:22-27), so a refused path in
    a policy file is echoed in the raised error. C-1 says a validator message must never repeat a value.
    The module docstring (model_policy.py:8) leaves the masking to the loader. test_model_policy_contract.py:468-477
    checks that these paths are refused, not that the text omits them. The AC-4 no-echo test covers only
    ModelRef, RecordedModel, PolicyText and IdPattern. Nothing reads the contract yet, so there is no
    exposure in P-1.
  suggested_action: In P-2, build findings from the field path (loc) and never from msg. Put a marker
    string in each of the three RepoPath fields in the AC-5 marker test, so the refused-path echo is covered
    by a test.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  rule_ref: ORQLET-SEC-003
  evidence: []
  claim: 'The new plan rule (plan.py:89-102) makes code-reviewer required if and only if header.workflow_version
    is 0.5.0 or higher, and forbids it below that. The version is a free string in the plan header (artifact_header.py:49),
    written by the plan''s author. A plan written under 0.5.0 that is re-labelled 0.4.0 with three roles
    loads. Two things limit this: gate_status.py:176-184 and :192-201 compare the header version with
    the installed lock and give ORQ-W390 plus a skip, which is a warning and not an error; and the plan''s
    pull request is reviewed, but who owns CODEOWNERS is still open (Q-32, Q-34). This is the accepted
    trade-off of EC-4, not a defect in P-1.'
  suggested_action: In P-10 and the gate, keep a plan with a stale workflow_version at NOT_RUN. Never
    read it as "no code review needed". Add a test for that.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: correctness
  rule_ref: ORQLET-SEC-002
  evidence: []
  claim: 'The plan rule parses the header version with domain Version.parse. Its pattern uses `\d` (versions.py:11),
    which in Python also matches non-ASCII digits after the first digit of a part, and int() converts
    them, so a version with a non-ASCII digit parses as a larger number. model_policy.py deliberately
    avoids this for reviewed_for_release (ReleaseVersion, ASCII classes, with a comment). The NOT_A_VERSION
    list in test_plan_review_evidence_by_version.py:45-61 has no such case. The reviewer found no bypass
    of the review requirement: ORQ-W390 compares the exact string with the installed version, and writing
    "0.4.0" already gives the same result.'
  suggested_action: 'Follow up outside P-1 (domain/versions.py is not in this phase''s file list): use
    re.ASCII or [0-9] in Version, or add a test that fixes the accepted behaviour.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: standards
  rule_ref: ORQLET-DET-002
  evidence: []
  claim: 'Five files change under workflow 0.4.0: four schema files plus MANIFEST.json, with the v1 schema
    deleted. The workflow_digest is the digest of the manifest (workflow_manifest.py:47-49, adapters/workflow_package.py:34-40),
    so 0.4.0 gets a new digest with no version bump (AC-8 defers the bump to P-13). A project whose lock
    holds the old 0.4.0 digest gets ORQ-E161 (diagnose.py:347-355). That includes this repository until
    P-14. releases.json lists only 0.1.0, so check_release_history cannot flag it. The reviewer cannot
    tell from the packet whether 0.4.0 was ever published.'
  suggested_action: State in the plan or the pull request that no release branch is cut from main between
    the P-1 merge and the P-13 version bump.
  confidence: medium
