capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-security-reviewer); its prompt held the packet path and nothing else. The model that ran it is not
  observed.
- 'The reviewer''s session had no shell: it ran no command and computed no quote digest, so every test count and check of the test record is a claim of
  the Coder that it did not repeat. The Coder computed the digests of the committed lines with orqlet evidence cite at 1fc985140dc0022f58bea803b4949932d01ecf43;
  lines of staged files cannot be digested and rest on the reviewer''s reading.'
- 'Packet checks by the Coder: the packet (1008 files, staged tree 0ed91eb717c4f0af902b334f499c7137dececaa4) holds no file under a reviews folder. A scan
  of it for the claim text of 184 claims in the 34 earlier review records of this task found no hit. It still holds lines that mention earlier reviews or
  rounds, in earlier test and knowledge records (P-3, P-10, P-11), in as-is.md, in ADR-002 and ADR-006, in questions.yaml, in the plan and in the design
  manifest. The proposal (1,065,661 bytes in the staged tree; the base file, 1,062,453 bytes, was already over the limit of 1,048,576) is in neither the
  snapshot nor the context copies (ORQ-I440); diff.patch holds 9 hunks of it (55,918 characters), so the reviewer could read what changed in it and never
  the whole file.'
- Read-only is declared by the agent definition, not enforced by Orqlet.
- The security reviewer returned F-1 to F-4 as findings with absence records over packet files (context/test-record.yaml, diff.patch, the staged README
  and CODEOWNERS). Those files are in no commit and an absence record names a commit, so the Coder records F-1 to F-4 as observations; the severity and
  the claim text are the reviewer's and unchanged.
- 'The review_input block of this record was rebuilt by the Coder, not read from the output of orqlet review prepare, because the printed block of the security
  reviewer was cut off in the Coder''s terminal: it takes the printed components of the architecture reviewer for this packet, which equal the security
  reviewer''s in every component but reviewer_definition (checked on a later run of review prepare, where evidence_inputs and the other components are equal
  across the two roles), and the reviewer_definition of the security reviewer for cursor. The same method reproduces the printed digest of the architecture
  reviewer exactly.'
- 'Coder''s note, not part of the reviewer''s text: no finding blocks. F-6 is disproved by the ledger: Q-21 is answered in docs/design/dynamic-model-profiles/questions.yaml
  (every phase, independence I2). F-3 and F-4 were checked against the code (independence.py module docstring; validate_model_policy.py, _removed_exclusions
  and _absent) and are right: the README rows and the gate paragraph were corrected in rework round 1 of the phase. F-1 is ORQ-E451, accepted by the person.
