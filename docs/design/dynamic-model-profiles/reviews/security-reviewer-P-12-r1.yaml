findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  claim: 'The CODEOWNERS change is a security-path change that the gate marks as not covered. The test record has `gate-status-phase` exit 5 (ORQ-E451:
    `.github/CODEOWNERS` changed, a renewed design approval is needed). The cause is EC-7, whose verification is `manual`, and the record sets AC-6 to `fail`.
    The person accepted this, so I do not override it, but the phase is not clean on AC-6. Separately, the four entries add no enforced control. Every new
    line names the same single owner as the author (Q-32). The test docstrings record that `main` has no branch protection and that a code-owner review
    is "enforced by nothing" (Q-34). A reader should not count these lines as an approval control.'
  suggested_action: Amend EC-7 so that its verification is `tests/unit/test_codeowners.py` (a test, not `manual`), and renew the design approval, or record
    that the phase merges with ORQ-E451 accepted. Do not describe the four entries as an enforced control anywhere.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  claim: 'After this change these paths still have no code owner: `tools/**` (`tools/build_manifest.py` rebuilds and checks `MANIFEST.json`, the integrity
    record of the protected workflow), `pyproject.toml` and `uv.lock` (the dependency set, and rule ORQLET-NOMODEL-001 forbids a model SDK dependency),
    and `docs/design/**` (the approved designs, plans and review records that act as approval evidence). Q-32 only asked about `src/orqlet/domain/**` and
    `tests/**`, so the gap is outside the question, not an error in the answer. It is also a gap that a hostile or careless change could use only if the
    host enforced owners, which Q-34 says it does not.'
  suggested_action: Ask the person whether `tools/**`, `pyproject.toml`, `uv.lock` and `docs/design/**` should have an owner too. It is a one-file change
    to CODEOWNERS.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: docs
  claim: README lines 491-519 ("The code review gate") say `validate review` "derives the independence class from the recorded values". They never say that
    those values are self-attested and that no command checks them. The values are the client, `model_observed`, `identity_source` (`client-reported` or
    `person-observed`) and `context.fresh`. Whoever writes the record file chooses them. The domain docstring is explicit ("an unkeyed record can be written
    by anyone", `src/orqlet/domain/independence.py`, top of the file) and the `Context` contract calls it "the reviewer's attestation". The README already
    says this for `callable` and `evaluated` (line 439), so the gate section reads as stronger than it is.
  suggested_action: 'Add one sentence to the gate section: the recorded identity and the fresh-context statement are attested by the record''s author, Orqlet
    checks their form and consistency only, and I3 comes only from the host.'
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: docs
  rule_ref: ORQLET-SEC-002
  claim: 'The README rows for the exclusion-removal controls say less than the code does. (a) ORQ-E544 "only a reviewed change removes an exclusion": `validate_model_policy.py`
    lines 370-371 say "The comparison is by `id`: an entry that kept its id and lost an alias, a pattern or a tag is not found". So narrowing the Fable
    entry while keeping its id raises no E544. The check is also skipped (a skip, not a pass) for a custom PATH or when no base is located. (b) ORQ-E547
    reads "the lock records it as seeded". That holds for `upgrade` and `models resolve`, which have no VCS access. `validate model-policy` also raises
    E547 when the base tree holds the file (lines 253-262). Until the seed ships, a team''s own policy has no seeded row. There, `models resolve` answers
    "no policy, the client chooses" with exit 0 after a deletion. `validate review` still uses the union of both trees'' exclusions, so that path is covered.
    Nothing in CI runs any of these commands.'
  suggested_action: State these three limits in the README rows or in "Excluded models". The design brief (EC-8) says `models resolve` detects a deletion
    from the lock or the base tree, but the built command reads no tree. Tell the person, who decides whether that is a plan reading or a gap for P-13 or
    P-14.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: security
  claim: 'Outside the diff and not tested by me: `is_exclusion` in `src/orqlet/domain/model_identity.py` folds with NFKC and casefold and strips only `-
    _ . ` as separators. By reading, a zero-width character inside a name (for example U+200B in "fa\u200bble") is not removed, so the family tag `fable`
    would not match it. The practical risk looks low because a client would not resolve such a name to the real model. The README describes this matching
    in detail, so a reader may trust it more than a test supports.'
  suggested_action: Consider a test, or a README sentence, on characters that NFKC leaves in place.
  confidence: low
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: docs
  claim: The proposal's Q-07 row and section 10.3 say the person "approved the gate (Q-19, Q-21; ADR-006)" and cite ledger question Q-9. The ledger is not
    in the packet. The AS-IS file shows Q-19 ("I approve code review gate.") and Q-9 answered, and Q-21 (scope and class of the gate) still open at research
    time. I could not confirm the later answer to Q-21. The test-record notes that approval is the merge of a pull request and that `orqlet gate status`
    gives NOT_RUN for approval, so "approved" is the person's statement, not host evidence.
  suggested_action: The person should confirm that the Q-21 answer exists in the ledger.
  confidence: low
