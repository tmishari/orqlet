capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-security-reviewer); its prompt held the packet path and nothing else. The model that ran
  it is not observed.
- 'The reviewer''s session had no usable shell (Ask mode): it ran no check and computed no quote digest, so every item it returned is an observation,
  and the lines they name are staged and cannot be digested by `orqlet evidence cite`, which reads committed files.'
- The packet held the round-1 review records and the older ones under snapshot/docs/design/dynamic-model-profiles/reviews/. ADR-007 decision 8
  says a packet must not carry earlier conclusions.
- Read-only is declared by the agent definition, not enforced by Orqlet.
- The reviewer discloses that it did not read the earlier review records, that one search result showed a single line of an earlier security record
  (diff line 379), and that it did not use it.
- 'Coder''s note, not part of the reviewer''s text: no finding blocks. The reviewer gave its evidence as plain sentences and not as evidence entries,
  so the coder folded each sentence into the claim of the finding and left the evidence list empty, and changed nothing else of the sense. The
  verdict is PASS but this record is NOT_RUN on independence (I1, where a D3 change requires I2). The reviewer''s F-1 is the same gap that the
  architecture review reports as its F-1; it was not fixed, because it does not block.'
