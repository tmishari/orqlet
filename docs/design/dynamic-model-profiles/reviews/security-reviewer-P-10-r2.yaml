findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: tests
  rule_ref: ORQLET-TEST-001
  claim: 'The code follows ADR-007 decision 1: model_families comes from the base tree (validate_records.py 332, base.model_families if base else
    ()), so a change cannot give itself a family difference, and with it class I2, by editing its own role-bindings file. No test pins this: every
    test that uses LEGACY, SPLIT or SHARED sets base_bindings equal to staged_bindings, and the module docstring says that no test depends on
    which tree gives model_families. If someone reads the staged tree instead, every test still passes and the self-vouching path reopens.'
  suggested_action: Add one test where the staged role-bindings file adds a model_families that splits two strings, the base has none, and the
    same client is used. Expect I1, with no family taken from the staged tree.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  rule_ref: ADR-007 decision 1; BC-44
  claim: '(a) A binding that exists only in the staged tree counts as approved (validate_records.py 330-331), so a change can approve its own
    reviewer up to I2 with only the warning ORQ-W463 (lines 351-362). The old code read the staged tree alone and gave no warning, so this is
    not a regression. (b) A binding that the staged tree removes or narrows stays approved for that change, so a revocation takes effect from
    the next change. That fits using the base tree as the anchor, but the Coder chose it (reading 7 of the knowledge record) and no test pins
    it: a search of the test file for removes, removed, dropped and stays approved found nothing.'
  suggested_action: No code change needed for this phase. Pin (b) with a test, or state it in the phase notes. Make sure the host evidence in
    S11 treats ORQ-W463 as something to show a person.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  rule_ref: AC-3; BC-9; ADR-005 decision 2
  claim: The exclusion list stops only a recorded model string that matches it (_named_models and assess_identity test exclusions only for strings
    the record names). A record that names no model, or names an unmatchable string, is never excluded. If the client differs, it still reaches
    I2 with only the warning identity-unknown (the tests test_a_record_that_names_no_model_is_unaffected_by_the_exclusion_check and test_an_unknown_identity_on_two_clients_warns_identity_unknown).
    This follows AC-3 and ADR-007, and the record is attested and not verified. So the exclusion is not a control against a coder who leaves the
    model out.
  suggested_action: No change in this phase. Keep ORQ-W460 and independence_notes visible to the person, and say so in the later skill text (P-13).
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  rule_ref: BC-44; ADR-005 decision 2; F-18
  claim: With a valid staged policy and an absent or unloadable base policy, exclusions come only from the staged tree and the only signal is
    ORQ-W462 (read_policy_view and _policy_findings); a staged policy that is deleted or corrupt gives no finding for a record that names no model.
    validate model-policy reports a deletion against the base tree and removed exclusions (ORQ-E544, matched by exclusion id) in validate_model_policy.py
    241-261 and 381-398. A search of .github/workflows/ci.yml, the only workflow in the packet, for model-policy, validate review, gate status
    and ci check found nothing. These edges are accepted by the design, but the same change could still shrink the exclusion list over two changes
    if the policy-lifecycle checks do not run. validate review does not stop that, and it relies on validate model-policy. The reviewer cannot
    see from the packet which host check runs validate model-policy.
  suggested_action: Confirm which required check runs orqlet validate model-policy on pull requests. No code change in P-10.
  confidence: low
