- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: blocking
  category: architecture
  evidence:
  - kind: quote
    path: docs/design/dynamic-model-profiles/plan.yaml
    lines: 1559-1560
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: fb788571ce2d4f5fccf57742506dc021bb67c0dc1818aff19f94ea1c372b085b
  - kind: quote
    path: docs/design/dynamic-model-profiles/design/manifest.yaml
    lines: 94-101
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: 5f9ce69406f5c3c812a6db2212b9e4073afd0318bdf2d4b70dc1816e09f5e8bc
  - kind: quote
    path: src/orqlet/domain/expected_change.py
    lines: 98-119
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: 8b6630dc9999dbb2560db3152e3961a5ddc76ee469e3850ac692527d46293074
  - kind: quote
    path: src/orqlet/domain/expected_change.py
    lines: 218-232
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: fe159d2fe225806548f26f0d04c077e936b837d6530c3f1489ab238154bc453c
  claim: 'AC-6 requires `gate status --phase P-12 --head staged` to report no ORQ-E451. The tester''s record shows exit 5 with ORQ-E451 for the changed
    security path `.github/CODEOWNERS`, with "a renewed design approval is needed". The cause is in the design: EC-7 has `surface: security` and `verification:
    manual`. In expected_change.py a `manual` entry is handled before the security branch, so `covered_security` is never set and the changed path is reported
    as additional. EC-7 would also fail with a real extractor. `_compare_security` reads the entry''s `value` as a comma- or newline-separated list of paths,
    and EC-7''s value is prose. The plan approved an acceptance criterion that no implementation of this phase can meet. The only record of the person''s
    acceptance is a sentence inside the tester''s record, not an approved design or plan amendment.'
  suggested_action: 'Ask the person for a renewed approval: amend EC-7 so that its value lists the security paths (`.github/CODEOWNERS`) and its verification
    is not `manual`, or amend AC-6 and the plan. Then rerun `gate status` and replace the "recorded as not met" note with the result.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: docs
  evidence:
  - kind: quote
    path: README.md
    lines: '21'
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: a38a3228b7e9b7df764e93b43b4c2b328f66f8a1128eb4611c93730b091f9b63
  claim: The proposal edit makes section 10.3 contradict itself. The rewritten paragraph still says seven roles need a subagent definition "(six shipped
    with the protected workflow, one optional)". The same paragraph now says `orqlet-code-reviewer` ships with workflow 0.5.0 "(not built yet)". The README
    says five specialist agents ship. The knowledge record puts this line (proposal line 2100) under "left open" and lists other proposal lines that still
    call the Code Reviewer a provided capability or not a required gate (at least 25 lines, per its own list), none of them changed. Line 2100 sits inside
    section 10.3, which AC-5 names and the tests read. The baseline asks for documentation that a change makes wrong to be updated in the same change. The
    record's outcome is `no-impact` with zero entries, while the same record lists these contradictions.
  suggested_action: Fix the sentence at line 2100 in this phase, since it lies inside a section the phase edits. For the other listed lines, ask the person
    to assign them to a phase or an approved amendment, so they are not left to "the person decides" with no owner.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: docs
  evidence:
  - kind: quote
    path: src/orqlet/domain/independence.py
    lines: 84-92
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: dc2c8e932a3d86c281ed6175acc912c7f07598f7d9aa606857bf806974f1a694
  claim: 'The README says "A new session of the same client does not satisfy the gate: it is I1". Its own sentence a few lines earlier says I2 also comes
    from "a different model family that both sides were observed to run". `derive_independence` gives I2 for a different observed family on the same client.
    So a new session on the same client does satisfy the gate when both identities are observed and the families differ. The unqualified sentence is pinned
    verbatim by the test (`GATE_PHRASES`), so the imprecision is now enforced.'
  suggested_action: Qualify the sentence ("with the same observed model family") in the README and in proposal 17.12.5, which repeats it, and change the
    pinned phrase to match.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: docs
  evidence:
  - kind: quote
    path: src/orqlet/domain/model_resolution.py
    lines: 533-538
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: 75b62b01a01bd7e73231a4585b1eb9c0da6a621f869c97c1aa4bffcd9fda6060
  claim: '"A reviewer may also not be of a lower profile than the coder" is broader than `_floor_of`. The floor applies when `--coder-profile` is passed
    (any target). By default it applies only to `orqlet-code-reviewer`, and only when a coder model is known. I did not read ADR-006, so the intended scope
    is unknown to me.'
  suggested_action: Say in the README which targets the floor applies to by default, or check the ADR for the intended scope.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: tests
  claim: Two tests turn a one-time criterion into a permanent freeze. One pins the first ten lines of CODEOWNERS as literals. The other pins exactly `["@tmishari"]`
    for the four new patterns. AC-1 only needs "at least one `@` owner", and the exact-owner test blocks the second owner that Q-32 and Q-34 leave open.
    Separately, `test_readme_model_policy.py` has 142 functions, many of which test its own parsers and reference texts. This is proportionate to AC-3 and
    AC-5 ("a test pins the sentences") but costly to maintain.
  suggested_action: Keep the at-least-one-owner test and drop or relax the frozen-history tests, or accept the cost knowingly.
  confidence: medium
