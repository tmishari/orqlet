    test docstrings.
  - The proposal is above MAX_FILE_BYTES and was read through the diff hunks only.
  - The pytest result is a claim of the tester's record; the CI matrix did not run; lint-imports is not among the checks of P-12.
  - Whether earlier phases that touched src/orqlet/domain/** hit the same ORQ-E451 (the P-11 record is not in the packet); a later phase that touches .orqlet/**
