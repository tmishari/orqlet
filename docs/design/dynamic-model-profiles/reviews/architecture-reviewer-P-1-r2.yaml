findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: compatibility
  evidence: []
  claim: 'The sentence "No use case reads these contracts yet, so no behaviour changes for any project"
    (plan.yaml:19-22, repeated in the no_impact reason of the knowledge record) is false for review-result,
    implementation-plan and role-bindings; only model-policy is unread. Use cases read them: validate_records.py:168,260,307,389;
    gate_status.py:164,251; review_prepare.py:74; knowledge_impact.py:92; binding_inputs.py:197-204,219.
    P-1 narrows what those three accept: agent.client and coder_binding.client become a closed set, model_requested
    and model_observed become RecordedModel (review_result.py:57-59,67-69), and header.workflow_version
    must parse as major.minor.patch (plan.py:89-102). In binding_inputs.evidence_file_ok a record that
    fails to load returns False, so it is no longer excluded from the code binding and the code_tests
    digest changes. Design EC-3 calls the closed client set "the one narrowing", but the code makes three.
    In this repository the effect is nil: 112 records exist, and the reviewer''s scan found every `client:`
    value inside the set and no non-null model string. For downstream projects it is unknown.'
  suggested_action: Correct the sentence in the knowledge-impact record, and in the plan objective if
    the plan is amended. Name the three narrowings and say they were checked against this repository only.
    Ask the person whether downstream records with another client or model text must stay loadable.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: 'The test record marks AC-9 `check_ref: gate-status-phase, result: pass`. Its `commands` list
    holds seven entries (ruff-check to manifest-check) and none for gate-status-phase (context/test-record.yaml:11-31;
    plan.yaml:101-109 lists the check). `_check_coverage` compares coverage with the plan''s criteria
    only (validate_records.py:420-438), so the validator does not catch this gap. AC-9 has no recorded
    evidence. The baseline says a check that did not run is reported as not run, never as passed.'
  suggested_action: Add the gate-status-phase command with its exit code and output, or record AC-9 as
    not-run. Expected offline outcomes are ORQ-I393 alone, or an ORQ-W390 that this task's own commits
    caused.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  rule_ref: ORQLET-SEC-002
  evidence: []
  claim: RecordedModel (`^[A-Za-z0-9 ._:/@+\-\[\]=,]+$`, min_length 1; common.py:41-43) accepts a value
    that is only spaces. Existing code reads `model_observed or model_requested` (validate_records.py:320,324),
    so a blank observed value is truthy and hides the requested one. This is not a regression, because
    any string was accepted before. P-9 and P-10 add the matching and independence rules and must normalise
    or refuse such a value.
  suggested_action: Require a non-space character in the pattern (the Rust regex engine of pydantic has
    no look-ahead), or state that the later matcher normalises first.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: correctness
  rule_ref: ORQLET-STYLE-001
  evidence: []
  claim: '`Version.parse` uses `\d`, which also matches non-ASCII digits (versions.py:8). model_policy.py
    says so and defines a stricter ASCII `ReleaseVersion`. plan.py:92-96 sends `header.workflow_version`
    through the lax parser, so a header with a non-ASCII digit reads as a valid version. This is harmless
    today, because the error direction demands four roles, but the contracts now hold two definitions
    of major.minor.patch with different strictness. Separately, `ClientId` is another spelling of the
    three clients next to role_bindings.py:21, profile.py:136 and integrations.py:97, and `Client = str`
    at common.py:27 is unused.'
  suggested_action: In a later change (domain is outside P-1's file list), add `re.ASCII` to `_VERSION`
    and reuse `ClientId` in the other contracts. Ask the person if this is wanted now.
  confidence: high
