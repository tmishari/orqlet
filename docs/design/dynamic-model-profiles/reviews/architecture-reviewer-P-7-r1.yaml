  the packet path and a note on the shape of the answer, because the typed subagent orqlet-arch-reviewer could not be started. The model that ran it is
  not observed.
- 'The reviewer''s session had no shell: it ran no check and computed no quote digest. The coder cited, with `orqlet evidence cite` at the commit c309395332346c4233a8fa58c55a3d00bf0cadb4,
  each quote of a file that is committed and not staged, and compared the reviewer''s text with the lines. A quote of a file that is only staged (the P-7
  code, the tests and the two records) cannot be digested, because the command reads committed files; its location is written into the claim, and a finding
  that has no other evidence is recorded as an observation.'
