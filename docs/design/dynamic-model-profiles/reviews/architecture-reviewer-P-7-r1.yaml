self_check:
  schema: orqlet.self-check/v1
  checked_against:
    role: architecture-reviewer
    phase: implement
    acceptance_criteria:
    - AC-1
    - AC-2
    - AC-3
    - AC-4
    - AC-5
    - AC-6
    - AC-7
  checks:
  - what: The change implements P-7 and stays inside its file list
    how: Compared the six listed operations with diff.patch and with a parse of the plan's file lists for P-1 to P-7. All six files are present. One extra
      file, tests/integration/test_validate_integrations_cli.py, is edited (F-2). The other files outside the lists are the records, the review notes and
      three P-5/P-6 test edits that the earlier review rounds covered.
    result: fail
  - what: Layering and purity (ORQLET-ARCH-001, ORQLET-ARCH-002, ORQLET-SEC-001)
    how: Read the imports and the calls of validate_model_policy.py, wiring.py and validate.py. The module takes ports only (FileSystem, Vcs, DocumentLoader,
      WorkflowSource, Clock), imports only `re` and `tomllib` from the standard library besides them, and starts no process. import-linter was not run.
    result: pass
  - what: Code against AC-1 to AC-6, with the design brief rows BC-9, 13, 30, 32, 33, 39 and F-14 to F-16
    how: Read the use case end to end against the plan text, the component rows and ADR-003, 004 and 005, and read model_selection.py and model_policy_source.py,
      which it calls. The exit statuses, the states absent, deleted and invalid, ORQ-E543 to E548 and W540 to W544, the clock read, the 256 KiB limits and
      the description of values as catalog id, inherit or unmatched with a length all match. The gaps are F-3 to F-5 and F-11.
    result: pass
  - what: AC-7 gate check
    how: Read the plan, the test record, the design manifest, the skill line and gate_status.py
    result: fail
  - what: Failure handling
    how: 'Read the except clauses: file reads, TOML and front matter parsing, lock and profile reads, base reading, directory listing. All fail closed to
      a finding or a skip except F-4 (VcsError from locate) and F-5 (the lock).'
    result: fail
  - what: Tests are meaningful and cover the criteria
    how: Listed all test names and read the W542 boundary tests, the NFKC and ModelRef tests, the lock tests, the marker-leak tests and the integration
      base tests. They run on fakes and a real Git repository, probe boundaries (day 30 and day 31, 256 KiB and one byte more) and cover every acceptance
      criterion, with the gaps in F-3 to F-5. I did not read every body.
    result: pass
  - what: Knowledge diff and knowledge-impact record are accurate
    how: 'Confirmed that .orqlet/knowledge.yaml has `sources: []`, that README.md and AGENTS.md do not name model-policy, that the cited README lines 361-362
      are right, that the cited design rows exist, and that the artifact hashes match the design manifest. The record omits README line 722 (F-6) and its
      readings are not asked of the person (F-7).'
    result: fail
  - what: Standards that apply (SEC-001, SEC-002, SEC-003, TEST-001, ARCH-001, ARCH-002, STYLE-001)
    how: Read context/standards/rules.yaml against the code. No process is started, files are read through the port, YAML is parsed with the strict loader,
      no secret is in the code, and the unit tests use fakes with sockets blocked. STYLE-001 is a SHOULD and the functions are short.
    result: pass
  - what: Ruff, ruff format, mypy, import-linter, pytest and the gate
    how: Not run by me. I used only read-only tools. The record's results are claimed (F-8).
    result: not-run
  - what: Quote digests (`orqlet evidence cite`)
    how: I could not run the tool, so the quotes carry paths and lines but no digest.
