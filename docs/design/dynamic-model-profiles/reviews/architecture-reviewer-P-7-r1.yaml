- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'ORQ-E544 compares the base and staged `excluded` entries by `id` only. An exclusion that keeps its id but loses an alias, a pattern or a tag is
    not found. The resolver, ORQ-E543 and ORQ-E548 then run against the narrowed staged exclusions. So one edit can narrow the Fable entry, pin or write
    the model, and pass every check of this command. The code and the tests both say this is accepted as "a stated uncertainty", and no question to the
    person is recorded. AC-2''s wording ("an `excluded` entry that the base tree holds and the file lacks") is met literally. ADR-005 decision 2 and BC-9
    state the intent that one change cannot remove an exclusion and pass its own edit. Locations that rest on files which are not committed, so no digest
    could be made: src/orqlet/application/usecases/validate_model_policy.py:370-371 (staged); src/orqlet/application/usecases/validate_model_policy.py:387-391
    (staged); tests/unit/application/test_validate_model_policy.py:28-29 (staged).'
  suggested_action: Ask the person whether a narrowed entry (the same id with fewer aliases, patterns or tags than at the base) must also be ORQ-E544, and
    if so compare the match lists of each base entry with the staged entry of the same id, with a test.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: finding
  severity: non-blocking
  category: failure-handling
  evidence:
  - kind: quote
    path: src/orqlet/adapters/git/vcs_git.py
    lines: 60-61
    revision: c309395332346c4233a8fa58c55a3d00bf0cadb4
    quote_sha256: fa1cecb1f7be2d3ada989d711ce8f8acb45ed4b587bc6753c1a8b2e96573b0c2
  - kind: quote
    path: src/orqlet/adapters/git/git_runner.py
    lines: '77'
    revision: c309395332346c4233a8fa58c55a3d00bf0cadb4
    quote_sha256: af76d46379a3dfabf4e023411e37309bc51789a87f7893e26bd5003617b6ad4f
  - kind: quote
    path: src/orqlet/interface/cli/runner.py
    lines: 32-33
    revision: c309395332346c4233a8fa58c55a3d00bf0cadb4
    quote_sha256: 578492c757ceeaa0927202f6c57107e431756cd832f250be2a16d0f7c23e2ce7
  claim: '`locate()` is called in `_absent` and in `_removed_exclusions` with no handling of `VcsError`. In a root that is not a Git repository, `head_commit()`
    runs `git rev-parse` and accepts only exit codes 0 and 1. A return code of 128 raises `VcsError`, which the runner turns into exit 3 (REFUSED). So a
    never-present policy in such a root does not give NOT_RUN with exit 5, as AC-1 says, and a loaded policy loses all its other findings. This is inferred
    from reading the adapter, the runner and `_absent`. I did not run it. Both test files list "what a root that is no Git repository does" as deliberately
    not pinned. `validate review` shares `locate()`, so this may be accepted project behaviour. Locations that rest on files which are not committed, so
    no digest could be made: src/orqlet/application/usecases/validate_model_policy.py:257 (staged); tests/unit/application/test_validate_model_policy.py:33
    (staged).'
  suggested_action: Catch `VcsError` around the two `locate()` calls and turn it into a skip reason, so the verdict is NOT_RUN or FAIL (exit 5) and the
    other findings stay, or ask the person to confirm that exit 3 is wanted for a root that is not a Git repository.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: non-blocking
  category: failure-handling
  evidence: []
  claim: 'When the lock is missing, unreadable or invalid, `_generated_paths` returns an empty set with no not-run reason. Every file then counts as team-authored,
    so ORQ-W543 (the drift check of AC-4) cannot fire, and the result can still be PASS. The test for this case asserts only `result.findings == ()` and
    not the verdict. The baseline says a check that did not run is reported as not run, and a corrupt lock is the situation in which the drift check cannot
    know what is generated. Locations that rest on files which are not committed, so no digest could be made: src/orqlet/application/usecases/validate_model_policy.py:531-532
    (staged); src/orqlet/application/usecases/validate_model_policy.py:539-540 (staged); tests/unit/application/test_validate_model_policy.py:2521 (staged).'
  suggested_action: Add a not-run reason such as 'the lock could not be read, so generated files were not compared' when `_generated_paths` falls back,
    and have the test assert the verdict.
  confidence: medium
