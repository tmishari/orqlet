findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: standards
  claim: 'To keep three skill bodies within 900 words, the Coder rewrote existing sentences in the design,
    onboard and implement skills beyond the one continuation line that AC-6 names. Some cuts remove instructions:
    design step 5 no longer asks an ADR to name its trade-offs; onboard step 5 drops the data-flow parenthetical;
    implement step 4 drops the duty to report an evidence folder the plan omits; implement step 7 drops
    the list of outcomes. The plan names a design revision for a skill that does not fit and names no
    trimming. The knowledge record discloses the cuts. No test pins the dropped wording.'
  suggested_action: 'The person decides: accept the trimming through a plan amendment, or restore the
    cut instructions and take a design revision for the word budget.'
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: docs
  claim: After P-13 the package has seven roles, but README line 595 still says 'the five roles'; the
    Coder's knowledge record also names proposal line 3028 ('All five roles are required in every phase').
    AC-19 forbids changing sentences outside AC-15 to AC-17, so leaving them is correct. The reviewer
    could not read proposal line 3028 (the proposal is not in the snapshot).
  suggested_action: Raise a plan amendment question for these two sentences; do not change them in P-13.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: docs
  claim: The example in plan-format.md still shows review_evidence with three entries, which a plan whose
    header names workflow 0.5.0 or higher would be refused on. AC-9 names only the rule line, and the
    rule line is correct.
  suggested_action: None in P-13; the person may want a note for the example.
  confidence: medium
- schema: orqlet.finding/v1
