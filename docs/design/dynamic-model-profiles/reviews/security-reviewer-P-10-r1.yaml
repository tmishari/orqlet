findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  claim: 'A policy file that the lock lists as seeded and that is missing from both trees is treated as never present. The result is only the
    information ORQ-I460 and the legacy rules of model_families, with an empty exclusion list. ADR-005 decision 2 says a file that has a seeded
    row in the lock is treated as unloadable and that only a project where the file was never present gets the legacy rules. review_identity.py
    126-133 (_refusal) refuses only a staged tree that is invalid, or absent while the base has a file; never_present and ORQ-I460 (Severity.INFO)
    then apply. The case is reachable: an earlier change deletes the file and is merged, because upgrade never recreates a deleted seeded file.
    After that, base and staged are both absent, the Fable exclusion is gone with only an INFO line, and the verdict stays PASS or NOT_RUN. The
    coder named this as reading (9) and as a question for the person. No test covers it: the test file has no case with a lock row.'
  suggested_action: The person decides. Either give ORQ-E461 for a record that names a model when the lock lists the policy as seeded (the working-tree
    reader already has the lock check, but it is private to model_policy_source.py), or record in ADR-005 that `validate review` accepts this
    gap and `validate model-policy` is the detector.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: failure-handling
  claim: A failure to read the base tree cannot be told apart from a base policy that is bad. read_model_policy_at returns the same PolicyInvalid
    ORQ-E540 for a git read error as for a file that fails to load. read_policy_view then drops the base policy for exclusions, so they come from
    the staged tree alone, and the only signal is the ORQ-W462 warning. For bad file content this is what plan AC-2 specifies. For an infrastructure
    failure at the merge base it lets a change that removes an exclusion pass its own record. The base ref is a validated full commit id, so an
    attacker cannot cause this directly; it is an environment or repository state.
  suggested_action: Keep the AC-2 behaviour for a base file that is present but invalid. Treat a VcsError on the base read as could not run (Collector.skip,
    giving NOT_RUN) instead of base has none. That needs the reader to tell the two apart.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  rule_ref: ORQLET-SEC-002
  claim: 'ORQ-E415 (validate_records.py 344-350, a line this diff edits) prints record.agent.binding_ref unchanged in its message. The contract
    (review_result.py 55) gives it only min_length=1: no pattern and no maximum length. A repository file can therefore put control characters,
    ANSI sequences or very long text into a terminal or CI log. Other validators of this repository escape such text to ASCII (validate_model_policy.py
    217, validate_integrations.py 107). AC-6 says no finding holds a text of a record, but its marker test marks only the four model fields, a
    capability limit and policy values, not binding_ref. The text is not new in this diff; the exposure is existing.'
  suggested_action: Constrain binding_ref with a pattern and length in the contract (the schema export check ORQLET-DET-003 then applies), or
    print it escaped. Alternatively narrow AC-6 to model strings and say so.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  claim: Bindings count when approved in either tree (validate_records.py 330-331). A binding that only the staged tree has gives ORQ-W463, a
    warning only. Before this phase the staged tree alone decided, so a change could already approve its own reviewer, and now it is at least
    visible. A binding that the change removes while the base has it stays approved, with no warning at all, so a revocation made in the change
    does not apply to that change's own records. Both are design choices (AC-2, reading 7). The protection against self-approval outside this
    code, review of the bindings file, could not be verified.
  suggested_action: The person confirms that the removal case is intended. Consider whether a binding removed in the staged tree should also produce
    a warning.
  confidence: medium
