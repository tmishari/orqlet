independence: I1
capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer's session had no shell, so it ran no command and computed no quote digest. The quote digests of F-1 and
  F-2 were added by the person running the review with `orqlet evidence cite` at revision
  cda60cc122635c85cdb56e22cd55ecb3df2773f0, on committed files (the plan and the design manifest) that the staged tree
  does not change. The phase's modules, tests and records are staged and not committed, so they cannot be cited by
  revision; their lines stay in the claim text, and F-3 to F-8, which rest on them alone, are absence records or
  observations. The absence records name the base revision or the head the reviewer read.
- 'Read-only is declared by the agent definition (readonly: true), not enforced by Orqlet.'
- The model that ran the reviewer is not observed.
- The packet held the earlier review records under snapshot/docs/design/**/reviews/, which ADR-007 decision 8 says a
  packet must not carry. The reviewer says it opened architecture-reviewer-P-4-r1.yaml while it looked for the finding
  format, and that its F-1 and F-4 overlap that record; it says it re-derived both from the gate source, the plan, the
  manifest and the resolver code.
- 'Not examined by the reviewer: the earlier review records beyond that one, the code of P-1 to P-4 beyond what P-5
  relies on, behaviour on the other Python versions of the CI matrix (ORQLET-QA-001), whether Cursor honours a model in
  a .claude/skills file, and docs/design/orqlet-architecture-proposal.md, which the packet left out (ORQ-I440). The
  reviewer could not tell from the packet whether the design and plan are approved: its copies show status draft.'
