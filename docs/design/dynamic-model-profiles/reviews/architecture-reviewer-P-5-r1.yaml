  - {kind: quote, path: docs/design/dynamic-model-profiles/design/manifest.yaml, lines: 41-44, revision: cda60cc122635c85cdb56e22cd55ecb3df2773f0, quote_sha256: 876977b020a69e931a0e5d2560b2a75e95363d2486c7b167b6a4e29a984e107c}
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/manifest.yaml, lines: 94-101, revision: cda60cc122635c85cdb56e22cd55ecb3df2773f0, quote_sha256: 5f9ce69406f5c3c812a6db2212b9e4073afd0318bdf2d4b70dc1816e09f5e8bc}
  - {kind: absence, searched: [docs/design/dynamic-model-profiles/design/manifest.yaml], method: 'read context/design-manifest.yaml (sha256 bf6f5a34...): security_globs holds src/orqlet/domain/**; searched expected_changes for surface security; one hit, EC-7, verification manual, about CODEOWNERS; no entry covers a domain path', revision: 3db213fd9ffa5be05ac098bae4d51217068170e0}
  claim: >-
    AC-10 of P-5 fails and the test record's verdict is FAIL. The gate (context/test-record.yaml, gate-status-phase,
    exit 5) reports ORQ-E451 "(no entry) security: additional" on model_identity.py (P-3), model_policy_scan.py (P-2)
    and model_resolution.py (P-4). P-5 changes none of them. The gate compares the merge base with the head, so every
    later phase carries the same error until the branch merges. gate_status.py:267-269 appends "A renewed design
    approval is needed". The implement skill says ORQ-E451 stops the work. The record says the person chose to
    continue, but that choice is held only as text in the test record, not as an amendment or a waiver.
  suggested_action: >-
    Amend the design and plan: add a security expected change for src/orqlet/domain/** with a verification the gate can
    count, or narrow the glob, then renew the design approval. Otherwise the person records an explicit waiver that
    the reviewers can read. Do this once, before P-6.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: architecture
  evidence:
  - {kind: quote, path: docs/design/dynamic-model-profiles/plan.yaml, lines: 647-682, revision: cda60cc122635c85cdb56e22cd55ecb3df2773f0, quote_sha256: eca348c7335592e73b5a1b5b74fa4aba71944033314794aa3b3d7b50faa589e0}
  - {kind: absence, searched: [docs/design/dynamic-model-profiles/plan.yaml], method: 'read the 12 file_operations of P-5 (context/plan.yaml 645-685) and compared them with the paths changed in diff.patch (12665-12728): test_render_integrations.py, test_resources_composition.py and test_resources_view.py change and are not listed', revision: 3db213fd9ffa5be05ac098bae4d51217068170e0}
  claim: >-
    The change leaves the phase's file list: three earlier tests that pin exact signatures were edited. The test
    record discloses this and says the person agreed, but the plan was not amended. AC-10 also says no file outside the
    phase's operations changes. The edits are minimal and forced by the plan's own signature changes. The record says
    "six lines"; the diff shows 8 added and 2 removed lines. Only P-9 lists test_render_integrations.py (for REVIEW_AGENTS).
  suggested_action: >-
    Record the three files in the plan, as part of the amendment of F-1. Check whether P-6 to P-13 change a pinned
    signature again (ports names, compose, build_render_request) and list those tests in them.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: finding
  severity: non-blocking
  category: tests
  evidence:
  - {kind: absence, searched: ["tests/**"], method: 'searched the staged snapshot for `selection=` and `compose(`: three calls pass a selection to build_render_request (test_skills.py:545, test_model_settings_render.py:269, test_model_settings_request.py:301); the only test about compose''s selection checks that its default is None (test_model_settings_request.py:413)', revision: cda60cc122635c85cdb56e22cd55ecb3df2773f0}
  claim: >-
    compose(selection=...) hands the selection to build_render_request (render_all.py:133), and no test checks that
    pass-through by behaviour. Deleting that line would leave the phase's tests green. The plan lists render_all.py
    in this phase. The coder's 12 mutation notes are not in the repository, so I cannot tell whether this mutant was tried.
  suggested_action: >-
    Add one test that calls compose with a manual selection and checks a pinned role file in the Desired set. If P-6
    covers it through upgrade, say so in the P-5 record.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: architecture
  evidence: []
  claim: >-
    P-5 is the first render-time caller of resolve (model_selection.py, _settings_of builds ResolveRequest with no
    coder_model). model_resolution.py:537-538 applies the engineering floor for the code reviewer only when a coder
    model is given. When the role ships, a manual pin of orqlet-code-reviewer to a lower profile will render with no
    outside-profile rejection. ADR-006 decision 7 says review quality is never lowered silently. This may be intended,
    because run-time checks catch independence, but the design does not say so. This overlaps F-2 of the P-4
    architecture review; the reviewer re-derived it from the code and the ADR.
  suggested_action: >-
    Ask the person whether the floor must also hold at render time, and settle it in the same design amendment
    before the code-reviewer role is rendered.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: >-
    The Cursor "plain id" rule exists twice: the regex of cursor_plain_id (model_identity.py:34-37, 135-137) and the
    allow-list _PLAIN_SAFE of emit.py:28. Today the first is a subset of the second, so the writer's output is bare.
    Four example names exercise every special character. No test derives one rule from the other. If the allow-list is
    narrowed later, Cursor values would be written quoted, which is the case ADR-003 decision 3 avoids.
  suggested_action: >-
    Optionally add a test that every string cursor_plain_id accepts passes the emit allow-list.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: docs
  evidence: []
  claim: >-
    The knowledge record's absence search covers "docs/ outside docs/design". That leaves out
    docs/design/orqlet-architecture-proposal.md, which is in the design scope and which roles.py cites ("proposal 10.1
    and 17.12.5") for the statement that a role file never names a model. P-12 plans to update that document. The
    packet does not hold it, so I cannot tell whether it holds a statement that P-5 makes false.
  suggested_action: >-
    Say in the record that the proposal is searched or deferred to P-12.
  confidence: low
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: >-
    Evidence quality of the test record. (a) The gate-status-phase digest is identical to P-4's (a38a798d...), and I
    cannot tell whether the output carries the phase name or whether the digest was reused. (b) The mutation notes are
    under /tmp. (c) The evidence kind is claimed throughout.
  suggested_action: >-
    Re-run the gate with --phase P-5 and record its own digest. Keep the mutation results in the repository, or drop the claim.
  confidence: low
- schema: orqlet.finding/v1
  id: F-8
  kind: observation
  severity: info
  category: compatibility
  evidence: []
  claim: >-
    ClientRole and ClientSkill are frozen dataclasses. They gained a dict-typed field (model_settings), so hash() of
