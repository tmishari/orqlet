capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-security-reviewer); its prompt held the packet path and nothing else, in a new context that did not
  hold rounds 1 and 2. The model that ran it is not observed. This is round 3, the last round that the review skill allows.
- 'The reviewer''s session had no shell: it ran no command and computed no quote digest, so every test count and check of the test record is a claim of
  the Coder that it did not repeat. The Coder computed the digests of the committed lines with orqlet evidence cite at 1fc985140dc0022f58bea803b4949932d01ecf43,
  and where the reviewer named a range the Coder cited the nearest committed range that holds it. Lines of staged files and of packet copies cannot be digested
  and rest on the reviewer''s reading, and a quote of a staged line is left out of the evidence of the findings below, so a finding that rests only on staged
  text is recorded as an observation.'
- 'Packet checks by the Coder: the packet dynamic-model-profiles-P-12-ee12f2d3 (1007 files, staged tree 18dcd84b247e9626262864d99287b8317f7e9d71) holds
  no file under a reviews folder and no name of a P-12 review record, except the sample path docs/design/demo/reviews/<role>-P-12-r10.yaml inside the existing
  test test_evidence_artifacts.py, which this phase does not change. A scan of it for the claim text of 207 claims in the 38 earlier review records of this
  task, rounds 1 and 2 of P-12 included, found no hit. It still holds lines that mention earlier reviews or rounds, in earlier test and knowledge records,
  in as-is.md, in ADR-002 and ADR-006, in questions.yaml, in the plan and in the design manifest. The proposal (1,065,778 bytes in the staged tree; the
  base file, 1,062,453 bytes, was already over the limit of 1,048,576) is in neither the snapshot nor the context copies (ORQ-I440); diff.patch holds 9
  hunks of it, so the reviewer could read what changed in it and never the whole file. ORQ-I441 (no binding printed for code-reviewer) was also printed.'
- The test record the reviewer read says that the pytest run is a claim (evidence_kind claimed) and that the CI matrix did not run; the reviewer re-ran
  no check.
- Read-only is declared by the agent definition, not enforced by Orqlet.
- 'Coder''s note, not part of the reviewer''s text: F-1 is the ORQ-E451 matter, the same as in rounds 1 and 2. It is true and I cannot disprove it. I do
  not waive it. No file of the P-12 list can fix it: the cause is EC-7 with verification manual in the approved design, and the plan''s AC-6 asks for a
  result that this design cannot give. The person was shown ORQ-E451 in this session, before the work went on, and chose to continue with it accepted (answer
  continue_accept); that answer is not an approved design or plan amendment, as the reviewer says. The reviewer''s remark that changing verification alone
  is not enough agrees with the code: _compare_security splits the declared value on commas and new lines and reads the parts as paths, and the value of
  EC-7 is a sentence, so an extractor would report ORQ-E450. An amendment has to list .github/CODEOWNERS as the value. This is round 3 of 3, so the work
  stops here with one consolidated report to the person.'
- The reviewer returned F-1 with an absence record over three packet files (context/plan.yaml, context/design-manifest.yaml, context/test-record.yaml).
  Those paths are packet copies; the Coder replaced that evidence by quotes of the committed lines that the claim names, and kept the claim and the suggested
  action as returned.
- The reviewer returned F-2, F-3 and F-4 as observations with no evidence; they are kept as returned.
