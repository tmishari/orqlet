  claim: '`.github/CODEOWNERS` is in the design''s `security_globs`, and EC-7 has `verification: manual` (design-manifest.yaml, about lines 94-101). In
    `expected_change.py`, a manual entry never sets `covered_security` (line 102, then the `elif entry.surface == "security"` branch at line 112). `_additional`
    then reports the touched security path as ADDITIONAL (line 253), which is ORQ-E451. `orqlet gate status ... --phase P-12 --head staged` therefore exits
    5 (FAIL), as the test record states. The implement skill says ORQ-E451 "stops the work" (src/orqlet/workflow/skills/orqlet-implement/skill.md:28). The
    test record, whose evidence_kind is `claimed`, says the person accepted this and that AC-6 is not met. The acceptance sits in a record that the Tester
    wrote, not in a renewed design approval. The design approval is the one control that was meant to cover a change to the ownership file.'
  suggested_action: 'Do not merge P-12 as a passing phase until the person''s decision is recorded in a form the project accepts: an amendment to the design
    manifest with a renewed approval, or an accepted exception recorded in the repository. The packet shows no mechanism for the second form, so ask which
    one the project uses. Changing `verification` alone is probably not enough. `_compare_security` (expected_change.py:218-232) splits the declared value
    on commas and newlines and reads the parts as paths. EC-7''s value is a prose sentence, so an extractor would report ORQ-E450 (a deviation). An amendment
    would have to list the paths.'
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  claim: The four new lines (CODEOWNERS 11-14) give `src/orqlet/**`, the seed path, `.github/CODEOWNERS` and `tests/**` an owner. The owner is the same
    person as the author. Q-32 records this, and Q-34 records that `main` has no branch protection, no ruleset, no required review, and a public repository
    with one collaborator. The entries therefore enforce nothing today, and the human code-owner fallback for a NOT_RUN review cannot be met here. The README
    and proposal text do not claim enforcement. The test rejects the phrases "enforced by the host" and "branch protection blocks/requires", and the README
    says Orqlet "runs no check at merge time". That part is accurate. The additions do not remove or reorder any owner, and every owner is `@tmishari`,
    so the last-match-wins rule cannot widen or weaken access. AC-1 also asks the phase report to state the single-owner limit. The packet holds no phase
    report, so I did not check that clause.
  suggested_action: None for the code. Make sure the phase report says plainly that the entries are advisory until the host enforces them (Q-34).
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: tests
  claim: '`tests/unit/test_codeowners.py` pins the policy, not just the format. `test_the_new_pattern_has_exactly_the_owner_that_q_32_names` (lines 240-247)
    requires exactly `[''@tmishari'']`. `test_the_ten_entries_that_the_file_had_...` (lines 250-255) hard-codes the original ten entries by position. Adding
    a second code owner, which is the improvement Q-32 asked about, will fail these tests until a later change edits them. A removal or reorder of an owner
    line also fails them, which is a useful tripwire. The cost is that a security improvement must edit a test file.'
  suggested_action: Accept this, or relax the test to "at least one owner that starts with @" when a second owner is added.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  claim: Dependency and build inputs (`pyproject.toml`, `uv.lock`) and `tools/**` have no owner entry. `tools/build_manifest.py` produces the workflow manifest.
    This was already true and is outside Q-32's four groups, so P-12 is not at fault. It matters for the "dependency changes" part of this review, because
    a change to these files would need no code owner.
  suggested_action: Decide in a later change whether these paths belong in CODEOWNERS.
  confidence: medium
