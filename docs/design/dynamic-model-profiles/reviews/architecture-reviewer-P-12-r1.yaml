    quote_sha256: 5f9ce69406f5c3c812a6db2212b9e4073afd0318bdf2d4b70dc1816e09f5e8bc
  - kind: quote
    path: src/orqlet/domain/expected_change.py
    lines: 100-113
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: b7e201510161c42ae0680664bb70163f4c79bdda78b8c4e96b39ed9ca8b3e894
  - kind: quote
    path: src/orqlet/domain/expected_change.py
    lines: 253-261
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: ba3d625f73c3a15cea4935d0a63d1b3c5f5a35e927e5507e83c8a2cff11dfb45
  claim: 'AC-6 is not met: `gate status --phase P-12` ends ORQ-E451 on `.github/CODEOWNERS`. EC-7 is the only security entry and has `verification: manual`.
    `compare()` turns every manual entry into Outcome.MANUAL and never sets `covered_security`, so any change on a security glob is reported as additional.
    P-12 touches the very path EC-7 describes, so the design cannot cover its own deliverable. The same ORQ-E451 was carried through P-2 to P-9 (tests/P-2.yaml
    to P-9.yaml). The person''s decision to continue is recorded only in the test record, which is `evidence_kind: claimed`. The ledger has no entry for
    it, and the gate asks for a renewed design approval. Nothing in P-12''s file list can fix it, so I do not block on it. The tester''s FAIL verdict stands.'
  suggested_action: Amend EC-7 to a verification the gate can cover and renew the design approval, or have the person record the standing acceptance of
    ORQ-E451 as a ledger entry or plan amendment.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: finding
  severity: non-blocking
  category: docs
  evidence:
  - kind: absence
    searched:
    - src/orqlet/workflow/roles/*
    method: 'listed the snapshot: five roles (inventory, tracer, tester, arch-reviewer, security-reviewer); no code-reviewer and no knowledge writer'
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
  claim: 'BC-26 (component.md:127) says the README and the proposal "no longer say the code reviewer is optional or that pins are unbuilt". The proposal
    keeps contradictory text. I verified one case from the diff: the rewritten 10.3 paragraph (diff.patch line 374) still says "seven need a subagent definition
    per client (six shipped with the protected workflow, one optional)" and "in addition to the four required roles", directly before text that calls the
    Code Reviewer a required gate that ships with 0.5.0. Only five role files ship. The knowledge record lists 13 more lines that still call the reviewer
    a provided capability or "not a required gate" (34, including line 5), 7 lines with the v0.5 policy spelling (35) and the role counts (36). I could
    not check those: the proposal is above MAX_FILE_BYTES and is not in the packet. The record says no phase carries them. The person''s scope limit to
    AC-1..AC-5 explains this, but BC-26 and the baseline rule "update the documentation that your change makes wrong" stay unmet document-wide.'
  suggested_action: Have the person assign the residual lines to a phase or an amendment. Fix at least the 10.3 counts now, since 10.3 is in AC-5's scope.
  confidence: medium
- schema: orqlet.finding/v1
