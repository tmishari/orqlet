findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: blocking
  category: docs
  evidence:
  - kind: quote
    path: src/orqlet/domain/independence.py
    lines: 95-119
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
    quote_sha256: 493e9e643b51d1106f555e9be558d7ccabb7db8ea22cc74497e7598b321ffa60
  claim: README.md lines 518-519 say ORQ-W460 and ORQ-W461 "are printed for every record whose client differs from the coder's client". `independence_notes`
    returns nothing when the clients are equal. When they differ it returns identity-unknown (W460) if either identity is unknown, and same-model-different-client
    (W461) only if both sides ran the same observed model. A record on a different client whose two observed identities are known and different gets neither.
    The README's own table (lines 550-551) states the narrower rule, so the section contradicts itself. The warning is the visible signal that separates
    an I2 resting on an unknown identity from one resting on two known, different identities, and "every record" hides that. The phase objective is to make
    the documents true. The test pins the false sentence (`AWKWARD_POINTS`, lines 108-111) and its docstring repeats the same reading, so the test cannot
    catch it.
  suggested_action: 'Reword the sentence: W460 is printed when the client differs and an identity is unknown, W461 when both sides ran the same observed
    model, both whatever the class, so beside an I0 they qualify nothing. Change `AWKWARD_POINTS`, `REFERENCE_SECTION` and `BREAKS` in the test to the new
    words.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: architecture
  evidence:
