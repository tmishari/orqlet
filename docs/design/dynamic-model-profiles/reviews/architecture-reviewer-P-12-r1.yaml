    or the proposal. The README and proposal become wrong at P-13, and README lines 21 and 139 ("five specialist agents", "73 files"), which the knowledge
    record says P-13 changes, are also on no file list.'
  suggested_action: 'Amend the plan before P-13 starts: add README.md and the proposal as P-13 file operations with acceptance criteria that flip these
