  confidence: high
- schema: orqlet.finding/v1
  id: F-5
  kind: finding
  severity: non-blocking
  category: docs
  evidence:
  - kind: absence
    searched:
    - src/orqlet/**/*.py
    method: searched for `fallback=` and `.fallback`; the only reader is model_resolution.py:430 and no code builds ResolveRequest.fallback. ModelsQuery
      (models_resolve.py:102-111) has no fallback field and `models resolve` has no such option
    revision: 1fc985140dc0022f58bea803b4949932d01ecf43
  claim: 'The README lists `explicit-fallback` among the sources of a `models resolve` answer and says an agent "may name" a fallback. That repeats ADR-001
    and BC-27, but the built command cannot produce it: a named model goes through `--override` and is reported as `task-override`. The gap is in an earlier
