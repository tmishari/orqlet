  suggested_action: Say in the README that `explicit-fallback` is a value a review record may carry and that `models resolve` does not print it yet, or
    track the BC-27 gap with the phase that owns it.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: tests
  claim: tests/unit/test_codeowners.py:241-247 asserts each new pattern has exactly `["@tmishari"]`, and :250-254 pins the first ten entries in order. Adding
    the second owner that Q-32 and Q-23 name as the remedy for the unmet approval rule would fail the test. AC-1 only requires at least one `@` owner. Separately,
    test_readme_model_policy.py (1,425 lines) carries a custom Markdown reader with its own tests and checks that phrases are present. It ties no README
    claim (exit statuses, example output, codes' meanings) to the code, which is how F-1 passed.
  suggested_action: Consider asserting "contains @tmishari" for the owner test. Optionally add one test that runs `models resolve` against the README example.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: security
  claim: CODEOWNERS now owns `src/orqlet/**`, `tests/**`, the seed path and itself, with a single owner and no branch protection (Q-34 answer). The README
    does not claim enforcement, and a test guards that. `pyproject.toml` (import-linter contracts behind ORQLET-ARCH-001..003, strict mypy), `uv.lock`,
    `tools/**` (build_manifest and schema export behind DET-002/003) and `docs/**` have no entry. This is within Q-32's answer and not a defect of this
    change.
  suggested_action: Ask the person whether those paths belong in a later ownership change.
  confidence: low
