    - No secret, token, URL, e-mail (except example.com placeholders), key shape, home path or internal host in the added lines; the new tests only read
      files by paths built from `__file__` and parse YAML through StrictYamlLoader and load_contract.
    - README statements on a self-approved reviewer binding (ORQ-W463), I2 on a different client (ORQ-W460, ORQ-W461), unseeded exclusions (ORQ-I460), the
      review gate rules, the plan rule on `code-reviewer` in `review_evidence` from workflow 0.5.0, the 256 KiB policy limit, the approval reference forms
      and the packet omission of review records match the source, and the README says where they are weak.
