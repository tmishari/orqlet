findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence:
  - kind: quote
    path: .github/CODEOWNERS
    lines: 11-19
    revision: 5062194db0e5feae52e6559bc691a85a26166acb
    quote_sha256: 8472d47bd7ad055b6334c85c82179cbbe727ba8b22b1f9e2aa422b425c0ce514
  claim: 'The nine CODEOWNERS entries (snapshot/.github/CODEOWNERS:11-19, all owned by @tmishari) enforce nothing in this repository. Q-34''s answer (docs/design/dynamic-model-profiles/questions.yaml:610-614)
    says main has no branch protection or ruleset, the repository is public, and tmishari is the only collaborator. Q-32''s answer (:571-575) says no second
    owner exists. The human code-owner review that the README offers as the fallback for a NOT_RUN code review (diff.patch:197-205) cannot come from anyone
    but the author for this repository''s own changes. The README and the tests do not claim enforcement: the tests pin the absence of "enforced by the
    host" and "branch protection blocks/requires" in the new README section. The risk is that the test record''s "EC-7 security: implemented as designed"
    (gate-status-phase summary) is read as protection. It only shows that the file content matches the design.'
  suggested_action: Say in the pull-request description that the entries are advisory until the host enforces code-owner review (Q-34). Do not cite EC-7
    "implemented as designed" as a control.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  claim: 'Some surfaces stay unowned. Under .github/ only workflows/**, CODEOWNERS and pull_request_template.md are owned, and the snapshot holds no other
    file there today. A later .github/actions/** (a local composite action run by a workflow) or .github/dependabot.yml would be unowned. README.md carries
    the install and CI snippets that users copy (snapshot/README.md:80, 87, 1008-1013) and has no owner. .gitignore and .gitattributes have none either.
    The ordering of the patterns is sound: the file has no catch-all line, and every owner is the same today, so a later pattern cannot weaken an earlier
    one.'
  suggested_action: Decide whether .github/** (with the workflows line kept), README.md and .gitattributes should be owned. No change is needed for this
    phase.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  claim: 'The repository is public (Q-34), and the README now names Fable four times as an excluded model and refers to "a block that the company sets in
    the client" (diff.patch:180-186). The same fact is already in the proposal (the removed example line `models: [fable]`) and in the ledger, so this adds
    no new exposure. No credential, host, e-mail or path was added: the only e-mail addresses in added lines are example.com placeholders in test data.'
  suggested_action: Confirm that the person accepts naming the excluded model in the public README.
  confidence: low
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  claim: 'Out of this diff and not run: the exclusion match that the README describes (src/orqlet/domain/model_identity.py:141, 33, 209-222) folds with
    NFKC and casefold, and joins the family-tag form by removing only the characters "-", "_", "." and space. A zero-width character such as U+200B is neither
    folded nor removed, so a tag such as `fable` would not match `fa<U+200B>ble`. I did not check whether a client resolves such a string to the excluded
    model. The README does not claim more than "once separators are removed" and calls the exclusion defence in depth behind the client''s own block.'
  suggested_action: 'Owner of the matching rule: decide whether to strip format characters (Unicode category Cf) before matching, and add a test either
    way.'
  confidence: low
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: docs
  claim: 'The test record cites a tree id with 39 hex characters for the 273-test rerun (tests/P-12.yaml, pytest summary: 3f4b178f0a2a42ba9079a0b46a40a319285a327).
    That is not a valid object id. The record is claimed evidence (evidence_kind: claimed, verdict NOT_RUN), but a reader cannot match it to a tree. I also
    could not read the staged tree id from MANIFEST.json, which is a single 131 KB line, so I took no revision from it.'
  suggested_action: Correct the tree id in the test record.
  confidence: high
