    result: pass
  - what: Secrets and unsafe I/O in added lines
    how: rg over diff.patch (see the absence record)
    result: pass
  - what: The body of test_readme_model_policy.py read in full
    how: partial read plus pattern searches
    result: not-run
  - what: orqlet validate, evidence cite and the tests run by the reviewer
    how: no shell in this session
    result: not-run
  - what: Host enforcement of code-owner review
    how: taken from Q-34, not observed
