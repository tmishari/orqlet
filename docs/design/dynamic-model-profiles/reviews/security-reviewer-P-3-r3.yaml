findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'Continues F-1 of security-reviewer-P-3-r1, now as a decision the person made. `_glob`
    (model_identity.py:204-206, staged) only folds an id pattern and makes `[` literal, and `_rule_matches` (215-222)
    matches it against the raw folded string and the normalised string, so a pattern written with `.` or `_` matches
    only that exact spelling: for `id_patterns: ["gpt-6.1-*"]`, `GPT 6.1 Sol`, `gpt_6_1_sol` and `gpt-6-1-sol` are not
    excluded. That fails open. `test_an_id_pattern_is_not_separator_normalised` (test_model_identity.py:1103-1113)
    pins it and cites the person''s decision to keep the reading "until the design decides it", and the knowledge
    record says the same, but ADR-005 decision 1 (adr-005 line 15) still calls the exclusion "deliberately broader
    and fail-safe" and does not record the narrower reading. Round 3 removed the fail-closed widening of round 2:
    test_model_identity.py:1116-1136 pins that `xai/*`, `.*`, `-*` and `*.` no longer exclude every model, and
    REGEX_PATTERNS (1002-1008) now holds `claude-fable-.*`. The shipped Fable entry is not affected, because its
    family tag and aliases catch the variants.'
  suggested_action: 'Before the phase is called done, record the narrow pattern reading in the design (ADR-005, or an
    open question there), so it does not live only in a test docstring. Give policy authors the consequence in the
    later phase that documents the policy: write id patterns with `-`, and add an alias or a family tag to catch
    other spellings.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: Continues F-3 of round 1 and F-2 of round 2, unchanged. tests/P-3.yaml:20 (staged) records gate-status-phase
    as FAIL with ORQ-E451 on src/orqlet/domain/model_identity.py and on model_policy_scan.py of P-2, which both match
    the security glob `src/orqlet/domain/**` (design-manifest.yaml:41-44). EC-7 (94-101) is the only security expected
    change and is checked by hand, so no automated check covers these paths and AC-6 is not met. The person chose to
    continue with the check open. This review covers the content of the paths, not the missing design entry.
  suggested_action: Amend the design and the plan so that a security expected change covers domain/model_identity.py
    and domain/model_policy_scan.py before the phase is called done.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: 'New this round, estimated by reading, not run. The cost of two functions grows faster than the policy file
    when the policy is hostile. (a) `name_conflicts` (model_identity.py:121-132) returns every index pair: when k
    entries claim one normalised name it builds k(k-1)/2 tuples. The smallest valid ModelEntry (model_policy.py:97-124)
    is about 190 bytes in YAML flow style, so the 256 KiB cap of the loader (model_policy_source.py:46 and 156-157)
    allows roughly 1,000 to 1,500 entries that claim one name, about 0.5 to 1 million pairs; a validator that reports
    one finding per pair would print that many lines. (b) `_match_index` (194-201) normalises every route string of
    the catalog on every call through `_names`, so N lookups cost N times the catalog size. Both are bounded by the
    size cap, nothing calls these functions in P-3, and ADR-005 says CI runs none of the orqlet checks
    (adr-005 line 28), so the slowdown would hit a person or agent running `validate` locally on a hostile branch.'
  suggested_action: Ask the person whether AC-4's "every pair" may become "every contested name, with its claimants".
    Otherwise the phase that reports conflicts groups the pairs by name or caps them, a caller that looks up many
    strings builds the name index once, and a test uses a policy at the size cap.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: Continues F-4 of rounds 1 and 2, unchanged. `_folded` (140-141) applies NFKC and case folding, `_SEPARATORS`
    (33) holds only `-`, `_`, `.` and the space, and `str.strip()` in `normalise` (75) trims whitespace only at the
    ends, so a zero-width character, a soft hyphen, a tab, a Unicode dash or a look-alike letter of another script
    inside `fable` defeats the family tag, the alias and the pattern. The test file lists these cases as deliberately
    not pinned (test_model_identity.py:35 and 39-40). The contract types are ASCII-only (common.py:36-43), but ADR-005
    decision 1 runs the exclusion on the raw string of a value that failed its type, before refusing it.
  suggested_action: In the later phases, refuse a string that fails its type whatever the exclusion test returns, and
    keep one test for it.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: Continues F-2 of round 1 and F-3 of round 2, unchanged. `name_conflicts` reads only route `name` and
    `also_known_as` through `_claimed` (178-182), while `_match_index` also matches `resolves_to` through `_names`
    (185-191), so a `resolves_to` that collides across entries makes the string unknown and nothing reports why.
    ADR-007 decision 5 (adr-007 line 20) grants I2 only for a different client or a different known family, so this
    ambiguity cannot raise the independence class; it only turns `same-model-different-client` into the less precise
    `identity-unknown`.
  suggested_action: Keep the round-1 question open for the person. In later phases, report an ambiguous match as
    ambiguous rather than as plain `unmatched`.
  confidence: medium
