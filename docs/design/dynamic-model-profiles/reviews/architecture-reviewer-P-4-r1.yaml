capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer's session had no shell, so it ran no command and computed no quote digest. The quote digests were
  added by the person running the review with `orqlet evidence cite` at revision
  dcaa6deff4c68c26d3223ad1e919777f350d06db, on committed files whose staged content is the same. The phase's
  modules, tests and records are staged and not committed, so they cannot be cited by revision; their lines stay in the
  claim text, and F-4 and F-5, which rest on them alone, are observations. The absence records of F-3 searched the
  staged snapshot, and name the base revision.
- 'Read-only is declared by the agent definition (readonly: true), not enforced by Orqlet.'
- The model that ran the reviewer is not observed.
- The packet held the earlier review records under snapshot/docs/design/**/reviews/ and in diff.patch, which ADR-007
  decision 8 says a packet must not carry. The reviewer says it did not open them.
- 'Not examined by the reviewer: the earlier review records, the code of P-1 to P-3 beyond what P-4 relies on, behaviour
  on the other Python versions of the CI matrix (ORQLET-QA-001), and docs/design/orqlet-architecture-proposal.md, which the
  packet left out (ORQ-I440). The reviewer could not tell from the packet whether the design and plan are approved: its
  copies of the design manifest and the plan show status draft.'
