  - {kind: quote, path: docs/design/dynamic-model-profiles/design/manifest.yaml, lines: 94-101, revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: 5f9ce69406f5c3c812a6db2212b9e4073afd0318bdf2d4b70dc1816e09f5e8bc}
  - {kind: absence, searched: [docs/design/dynamic-model-profiles/design/manifest.yaml], method: 'searched expected_changes for surface security; one hit, EC-7 (line 95), whose verification is manual (line 101) and which covers CODEOWNERS only', revision: dcaa6deff4c68c26d3223ad1e919777f350d06db}
  claim: 'AC-8 of P-4 is recorded as failing. Its text requires `orqlet gate status dynamic-model-profiles --phase P-4
    --head staged` to report no ORQ-E451 (plan.yaml:499-503). The test record (staged, line 20, not citable by revision)
    shows exit 5 with ORQ-E451 on src/orqlet/domain/model_resolution.py of this phase, and its verdict is FAIL. The
    file matches the design''s security glob src/orqlet/domain/** (manifest.yaml:41-44), and no security entry that the gate
    can count covers it: EC-7 is verification manual. Because the plan repeats the same gate line for P-1 to P-14, every
    later phase that touches src/orqlet/domain/** fails it too. The code is not at fault; the design and the plan are.'
  suggested_action: 'Amend the design and plan: add a security expected change for src/orqlet/domain/** with a verification
    the gate can count, or narrow the glob; then re-run the gate. Otherwise the person records an explicit waiver that the
    reviewers can read.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: architecture
  evidence:
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/component.md, lines: "139", revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: 40af8f78366124cd3e272e6631b436e067858c7391ed786e85cbe12e1032832d}
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/adr-002-model-policy-v2-contract-and-home.md, lines: "23", revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: 73d64840c525ec2dcf3cb7ba4e2bae6ec7b270023677087f3d8a397099fa1fd6}
  claim: 'The engineering floor applies to the code reviewer only when a coder model is given
    (model_resolution.py:537-538, staged: `reviews = request.target_kind == "role" and request.target == CODE_REVIEWER_ROLE`
    and `return DEFAULT_CODER_PROFILE if reviews and request.coder_model is not None else None`). This follows the
    wording of AC-5 ("With a coder model given"). BC-38, ADR-002 and ADR-006 decision 7 state the default for the code
    reviewer without that condition. With no coder model, which is how the render path will call `resolve`, a team assignment
    of orqlet-code-reviewer to economy meets no floor and gets no outside-profile entry. That is the silent lowering of
    the I2 floor that R-7 forbids. The tester''s file and the knowledge record both name the reading as open.'
  suggested_action: Ask the person which reading is intended, and settle it in the design amendment before P-5 renders from `resolve`.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: finding
  severity: non-blocking
  category: correctness
  evidence:
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/adr-005-fable-exclusion-by-model-identity.md, lines: "15", revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: a2a799a070206f933df4c3da3d49e42a530a049430d8a6bf059fc7c2eeda56b6}
  - {kind: absence, searched: [tests/unit/domain/test_model_resolution.py, src/orqlet/application/usecases/model_selection.py], method: 'read the test file and searched family= and family in both staged files; no test uses families that differ only in case or separators, and policy_problems has no family-spelling check', revision: dcaa6deff4c68c26d3223ad1e919777f350d06db}
  claim: 'Family is compared by raw string equality (model_resolution.py:514, staged: `if model.family == self._coder.family:`).
    ADR-005 decision 1 says the one matching rule is used for every comparison of a model string, including a family. Two
    catalog entries with `anthropic` and `Anthropic` would count as different families, so a same-family reviewer could pass
    the diversity rule through a spelling difference. The knowledge record discloses the direct comparison but not this
    consequence.'
  suggested_action: Either compare normalised family strings and have `policy_problems` flag two families that differ only in spelling, or record the raw-equality reading in the design amendment.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: architecture
  evidence: []
  claim: 'A task-scoped profile assignment (`--task T`) loses to an unscoped model pin, because the pinned level is level 2
    and the profile level is level 3 (model_resolution.py:321-333, 335-353 and 370-381, staged). The design does not say
    whether task scope should reorder these levels. No test combines the two, and this reading is not in the knowledge
    record''s list.'
  suggested_action: Ask the person whether task scope can outrank a model pin. Add a test for either answer.
  confidence: low
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: docs
  evidence: []
  claim: 'The knowledge record is no-impact and already-documented, and its refs resolve. But it lists eight behaviours that exist
    only in docstrings, such as invalid-level fallthrough to none-qualifies and outside-profile reused for an unlisted named
    fallback. It also omits the task and client specificity order of assignments and the readings of F-2, F-3 and F-4.'
  suggested_action: Put these readings in the design amendment that F-1 needs anyway, so the record stays accurate.
  confidence: medium
