  claim: 'The change edits `.github/CODEOWNERS`, a security path, but the design lists it as EC-7 with `surface: security` and `verification: manual`. The
    tool skips the security extractor for a manual entry, so it reports ORQ-E451 (gate FAIL, AC-6 not met). The format reference says `security` has an
    extractor, so `manual` looks like a design-authoring error. Nothing the tool runs confirms that the CODEOWNERS change that landed is the one the design
    approved. I checked by hand that it matches EC-7 and Q-32: it only adds the four owned paths, and the only security-glob path touched is `.github/CODEOWNERS`.
    The person''s decision to continue is stated only in the test record (evidence_kind: claimed). I found no person-authored record of it in the packet.'
  suggested_action: The person decides one of two things. Either record the acceptance of ORQ-E451 in an artifact the person authors, or amend EC-7 (surface
    security, extractor-checked, value listing `.github/CODEOWNERS`) and renew the design approval. I did not examine whether such an amendment is allowed.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  claim: 'Several control files still have no code owner: - `pyproject.toml` holds the import-linter contracts (lines 82-120), `--disable-socket` for tests
    (line 71) and the TID251 banned-API list (lines 49-60). Together these enforce ORQLET-ARCH-001, ORQLET-ARCH-002 and ORQLET-TEST-001. - `uv.lock` is
    the dependency pin file. - `tools/**` includes `tools/build_manifest.py`, which builds the workflow package manifest. - `.github/pull_request_template.md`
    has no owner either. Q-32 and AC-1 name only four groups, so this is outside what was asked and not a defect of the diff.'
  suggested_action: Ask the person whether these paths should have an owner. This would be a CODEOWNERS change in a later phase or amendment.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  claim: 'The new CODEOWNERS entries are not enforced by the host. The answer to Q-34 (questions.yaml 597-614, read from the host on 2026-11-05) says `main`
    has no branch protection and no ruleset. The repository is public, and tmishari is its only collaborator. Q-32 (557-575) records the person''s acceptance
    that a change authored by the only owner has no other code-owner approver. The new README and proposal text do not claim enforcement: the README says
    Orqlet runs no check at merge time, and `tests/unit/test_readme_model_policy.py` forbids "enforced by the host" and similar phrases. The Q-34 answer
    is 14 days old and I cannot check the host''s current settings.'
  suggested_action: None in this phase.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: tests
  claim: 'CODEOWNERS uses last-match-wins. The staged order is correct: `src/orqlet/**` is line 11 and `src/orqlet/workflow/seeds/**` is line 12. `tests/unit/test_codeowners.py`
    (lines 257-269) only checks that the new entries come after the original ten. It does not check the order among the new entries. Nothing changes today
    because every owner is `@tmishari`. If the seeds line later gets a different owner or the lines are reordered, the broader line could silently take
    over.'
  suggested_action: None in this phase.
  confidence: medium
