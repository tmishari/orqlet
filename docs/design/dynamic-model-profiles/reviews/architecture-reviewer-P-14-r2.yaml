    claim: "(a) The check_refs of AC-3, AC-4 and AC-7 do not match a command id in the test record: AC-3 names orqlet-models-resolve and the record splits it into -with-family and -without-family; AC-4 names review:upgrade-outputs and AC-7 review:conftest, which have no command. The validator checks only the AC ids, so the links dangle without an error. (b) AC-4 is pass on reads that the record says are not command runs with a digest (ls, rg); the reviewer confirmed in the snapshot that the 18 role and rule files exist, that each has a lock row with owner orqlet, and that .orqlet/model-policy.yaml has owner seeded, so the claim is likely true, but the record does not carry that evidence. (c) AC-9 asks for --head staged, and the record says the gate ran before the records were staged, so the staged change that will be committed was not gated. The four record files also lie outside the plan's file list; whether docs/design/** records are exempt is unknown to the reviewer."
    suggested_action: "Align the check_refs with the command ids, or put the AC-4 read in as a recorded command. Run gate status --phase P-14 --head staged again after staging the records. Ask the person whether docs/design/** records are outside the file list."
