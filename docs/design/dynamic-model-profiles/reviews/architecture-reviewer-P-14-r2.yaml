    claim: "The design's effective change class is D3, and D3 requires independence I2 of a review. Both round 1 review records are I1: same client (cursor), model not observed. ORQLET-MODEL-002, a MUST rule, says that a class below the role's minimum is NOT_RUN, never a pass. The round 1 security record had verdict PASS at I1, which contradicts that rule, and under `validate review` its gate is skipped as below the minimum, so it gives no review evidence for a D3 task. The seeded bindings of both reviewers have independence_capability I1, so a run in the same client cannot reach I2."
    suggested_action: "Record the security verdict as NOT_RUN with the reason that I1 is below the D3 minimum I2. To obtain I2, run the review in a different client, or from a model whose family is observed to differ from the Coder's."
