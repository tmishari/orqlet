capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-security-reviewer); its prompt held the packet path and nothing else. The model that ran it
  is not observed.
- >-
  The reviewer's session had no usable shell (it says the shell was refused in Ask mode): it ran no check and computed no quote digest. The coder
  cited, with `orqlet evidence cite` at the commit 3dd84c80c676f2e28e23647b79396fe1771fee7f, the two quotes that this record carries, both of
  committed lines of validate_records.py that the reviewer's F-1 names (316-326 and 360-366). The reviewer gave no evidence entry, so all five items
  are observations as it returned them. The coder added these two entries to F-1 and otherwise only removed markdown backticks, wrote the dollar
  sign of F-4 in words, moved the reviewer's notes into the fields of the format and changed the first person to the third in the list of
  unverified items. A file that is only staged (the P-9 code, the tests and the records) cannot be digested, because the command reads committed files.
- >-
  The reviewer discloses that its context was not packet-only: it opened one earlier review record (security-reviewer-P-8-r1.yaml) only to copy the
  finding format, and it read the ADRs, the plan, the design manifest and unchanged source files of the snapshot.
- >-
  The packet held earlier review records (snapshot/docs/design/dynamic-model-profiles/reviews/) and its diff runs from the merge base
  3dd84c80c676f2e28e23647b79396fe1771fee7f. ADR-007 decision 8 says a packet must not carry earlier conclusions; the reviewer's F-5 says the same.
- 'Read-only is declared by the agent definition, not enforced by Orqlet.'
- >-
  The reviewer says it could not observe its own client or model, so it claims no independence beyond a clean context.
- >-
  Coder's note, not part of the reviewer's text. For F-4 the coder called parse_evidence_path on an assumed path ending in a newline: it returns a
  record path for code-reviewer-P-1-r1.yaml followed by a newline, and also for security-reviewer-P-1-r1.yaml followed by a newline. The base pattern
  of the two older roles ends in the same dollar sign, so the behaviour is not new. Whether the newline can reach it in the real flow (git diff-tree -z
  and the blob reader, as the reviewer says) was not run by the coder.
- >-
  Coder's note, not part of the reviewer's text: no finding blocks, so no rework round was run. The verdict is PASS but this record is NOT_RUN on
  independence (I1, where a D3 change requires I2). F-1 and F-2 name work for P-10; F-3 repeats the open ORQ-E451 of the gate.
