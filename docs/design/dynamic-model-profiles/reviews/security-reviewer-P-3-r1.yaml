findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: security
  evidence:
  - {kind: quote, path: src/orqlet/application/contracts/model_policy.py, lines: 34-36, revision: 040a8a882ac283f3fb9a80af1ccb1fce9dba3cb9, quote_sha256: 80a87621ca795d4b61dab68930b3757ca780b0c655b11496cd10a78bb3475bd4}
  claim: 'An id pattern is only case-folded (`_glob`, model_identity.py:204-206, staged), never
    separator-normalised, and it is matched against the raw folded string and the normalised string
    (model_identity.py:215-222, staged). A pattern written with `-` reaches every spelling through the
    normalised form. A pattern with `.` or `_` matches only strings that use exactly those separators, and
    `IdPattern` allows both (model_policy.py:34-36). For a team exclusion `id_patterns: ["gpt-6.1-*"]`,
    `gpt-6.1-sol` is excluded, but `GPT 6.1 Sol` (display text, which RecordedModel allows), `gpt_6_1_sol`
    and `gpt-6-1-sol` are not. That fails open, against ADR-005''s "deliberately broader and fail-safe".
    `test_an_id_pattern_is_not_separator_normalised` (test_model_identity.py:1102-1109, staged) keeps this
    behaviour, citing "the brief, item 6 (b)". The brief is not in the packet, and neither AC-3 nor ADR-005
    says the pattern should not be normalised. The shipped Fable entry is not affected, because its family
    tag and aliases catch every variant; project-added exclusions that rely on patterns are.'
  suggested_action: 'Ask the person whether patterns should also be matched in separator-normalised form: fold,
    turn each run of `-_. ` into `-` while keeping `*` and `?`, and match that against the normalised string.
    Add it as a third test rather than replacing the current two, then change the pinning test to say the
    variants are excluded. If the person keeps the narrow reading, record it in ADR-005 and in the guidance
    for policy authors ("write id patterns with `-`").'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: '`name_conflicts` only looks at route `name` and `also_known_as`, while `_match_index` matches on
    `resolves_to` as well (model_identity.py:121-132 and 185-201, staged). So a `resolves_to` that equals
    another entry''s name, or two shared `resolves_to` values, makes that string ambiguous and therefore
    unknown, and no error reports it; with skip_proposed false, even a proposed entry can do this. The effect
    is conservative, because an unknown family never counts as a difference, but it can turn ADR-007''s
    `same-model-different-client` warning into `identity-unknown` without saying why. This matches AC-4,
    which leaves `resolves_to` out, and the tester lists it as open (test file, lines 30-33).'
  suggested_action: Ask the person whether a cross-entry `resolves_to` collision should be a conflict. If not,
    have the validators of later phases report an ambiguous match as such, rather than as plain `unmatched`.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: The gate reports ORQ-E451 (tests/P-3.yaml:20, staged). `model_identity.py` matches the design's security
    glob `src/orqlet/domain/**`, and the only security expected change, EC-7, is checked by hand, so no automated
    check covers the path. AC-6 is therefore failed. The person chose to continue with the check open. This
    review covers the content of the path, not the missing entry in the design.
  suggested_action: Amend the design and plan so that a security expected change covers `domain/model_identity.py`
    and `domain/model_policy_scan.py`, before the phase is called done.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: NFKC and case folding do not remove zero-width or other invisible characters, do not treat Unicode
    dashes as separators, and do not map look-alike letters from other scripts, so `fa\u200bble` does not match
    the tag `fable`. This is limited because ModelRef, RecordedModel, IdPattern and PolicyText accept ASCII only.
    ADR-005, however, runs the exclusion on a string that failed its type before refusing it.
  suggested_action: In the later phases, refuse a string that fails its type whatever the exclusion test returns,
    and keep one test for that.
  confidence: medium
