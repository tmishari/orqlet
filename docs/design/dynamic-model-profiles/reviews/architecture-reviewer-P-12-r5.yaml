self_check:
  schema: orqlet.self-check/v1
  checked_against:
    role: architecture-reviewer
    phase: implement
    confirmed_requirements:
    - 'The diff touches only the files named in plan P-12 (plan.yaml 1570-1584): .github/CODEOWNERS, README.md, the proposal, the two test files and the
      two records. No code under src/ changed.'
    - There are no imports of application or adapter code. The new tests read files and import only ExitCode and the domain, in line with ORQLET-ARCH-001..003.
      No secrets or network access appear.
    - The README matches the source on the exit codes of both commands, the `models resolve` output block, the precedence order and the Fable exclusion
      by identity, the five-states table, the independence rules, the binding rules and the ORQ-E54x, ORQ-W54x and ORQ-I540 codes in the codes table.
    - AC-1 to AC-5 each have a test that reads the documents or CODEOWNERS and fails when the criterion is broken; the CODEOWNERS parser rejects malformed
      lines, duplicate patterns and owners that do not start with `@`.
  checks:
  - what: Diff stays inside the P-12 file list
    how: diff.patch sections vs context/plan.yaml 1570-1584
    result: pass
  - what: README claims against the source
    how: exit_codes.py, models.py, validate.py, models_resolve.py, model_resolution.py, independence.py, render_all.py, finding codes
    result: pass
  - what: Findings F-4 and F-5 in the README
    how: model_selection.py 296-306; models_resolve.py 74; README 417 and 552
    result: pass
  - what: Each AC has a test that can fail
    how: test_codeowners.py, test_readme_model_policy.py
    result: pass
  - what: 'CODEOWNERS: kept lines, extra entries, order'
    how: snapshot/.github/CODEOWNERS, 19 lines
    result: pass
  - what: Knowledge-impact record
    how: context/knowledge-impact.yaml
    result: fail
  - what: Test suite and lint on the staged tree
    how: ''
    result: not-run
  - what: Hashes of the packet files (MANIFEST.json) and quote hashes
    how: ''
    result: not-run
  failures:
  - 'F-6: the knowledge-impact record does not support its own category.'
  unverified:
  - 'Test results: the reviewer ran nothing. The test record says 12719 passed on macOS, claimed only, and its own verdict is NOT_RUN because `gate status`
    exited 5 offline.'
  - The proposal file is not in the packet. The reviewer saw only the diff hunks of P-1..P-29 and did not check the unchanged text around them.
  - ADR-001..ADR-006, BC-26, the ledger (Q-9, Q-19, Q-21, Q-32, Q-34) and the phase report are not in the packet. The reviewer could not check what the
    README, proposal and tests say about them, including the AC-1 report sentence on the one owner.
  - The CI matrix (other operating systems and Python versions) was not run.
  - 'quote_sha256 values and MANIFEST hashes: not computed by the reviewer.'
