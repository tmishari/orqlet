capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-arch-reviewer); its prompt held the packet path and nothing else, in a new context. The model that
  ran it is not observed. This is round 5 of the phase; the reviewer was given no earlier round.
- The reviewer wrote that its session had no shell and that it could compute no quote digest. Its log shows 1 Shell call, read-only listings of the packet
  (ls). It ran no orqlet, test, hash or evidence command. The Coder did not test whether such a command would have worked in its session, so it is not known
  whether the reviewer could have computed digests. Every test count and check result in the test record is therefore a claim of the Coder that the reviewer
  did not repeat. The Coder computed the digests below for committed lines at revision 5062194db0e5feae52e6559bc691a85a26166acb after reading each range
  against the claim it supports.
- 'Packet checked by the Coder: dynamic-model-profiles-P-12-95d0c516 (1007 files, staged tree e01d3d96b6a13f40c79d17eb6c0d504ca0f9708b, base 000c3cbf0fbd662a318937c5010179f05b9766f8).
  It holds no file of a review record. Before the reviewers ran, the Coder scanned the whole packet, including the docstrings and comments of the two test
  files, for the words round, rework, finding numbers, review-record paths and open pull request, and found no earlier-round information about P-12. The
  design manifest and the as-is notes in the packet, and the proposal''s own text, hold design-phase review history and the words round and rework; every
  packet carries them.'
- 'The proposal is over the packet limit (ORQ-I440) and the reviewers read it through the hunks of diff.patch only. `orqlet review prepare` printed ORQ-I441:
  the code-reviewer binding is not printed.'
- The test record the reviewer read says that the pytest run is a claim (evidence_kind claimed), has verdict NOT_RUN because the gate-status command exits
  5 offline, and that the CI matrix did not run; the reviewer re-ran no check.
- Read-only is declared by the agent definition, not enforced by Orqlet.
- '`applicability.examined` lists the files that the reviewer opened with Read, taken from its tool-call log. Its Grep and Glob calls searched more of the
  packet and are not listed.'
- 'The test record was corrected after the reviewers read it, in answer to security finding F-5 of this round: a tree id that the Coder had typed with 39
  characters now reads 3f4b178f43a2a42ba9079a0b46a40a319285a327 (git cat-file prints `tree` for it). The review input of both reviewers covers the evidence
  inputs, which include the test record, so the digest recorded here is the one of the packet that the reviewers read and it differs from the digest of
  the committed tree; `orqlet validate review` may report the record stale for that reason.'
- The reviewer's own model is not observed. The record leaves model_observed empty.
- 'The reviewer wrote ''Recommended verdict: PASS'' and said that the parent should record the verdict after weighing the limits; the Coder records PASS
  because the reviewer found no blocking finding. Its self-check marks the check on the knowledge-impact record as fail (finding F-6, non-blocking).'
- 'Coder''s note on F-1: true; it is the same gap as the plan gap that the earlier review of this phase named. I read README lines 21, 381, 517 and 518
  and they are true today; they become false when P-13 ships. A plan amendment is needed before P-13; this phase does not change the plan and none is written
  yet.'
- 'Coder''s note on F-2: true as far as I can tell. I searched docs/, AGENTS.md and .orqlet for ''interface decision''; it occurs only in review records
  of other phases, so the interface decision (R1..R17, P1..P7) and the criteria A, B and C that the test docstrings cite are not stored in the repository.
  The module docstring of tests/unit/test_readme_model_policy.py says that the plan author gave the interface decision to the Tester of P-12; where else
  it is kept, I do not know. The five CODEOWNERS entries and the edit criteria are written down only in the pull request body, as the person chose.'
- 'Coder''s note on F-3: true for the sizes: tests/unit/test_readme_model_policy.py has 2680 lines, tests/unit/test_readme_integrations.py 625 and tests/unit/test_readme_ci_snippet.py
  499. Not changed in this phase.'
- 'Coder''s note on F-4: true. The README row says ''a name with options for Cursor''; `_refusal` in model_selection.py refuses every Cursor name that `cursor_plain_id`
  does not accept (`[A-Za-z][A-Za-z0-9._/+-]*`). Not fixed in this phase.'
- 'Coder''s note on F-5: true as far as the code shows: model_resolution.py 291-293 returns Resolution(''client-chooses'', ''automatic'') and models_resolve.py
  74 holds NO_ASSIGNMENT_HINT. I did not run `models resolve` to confirm the exit status 0 for that case. Not fixed in this phase.'
- 'Coder''s note on F-6: true. The method text of the knowledge record ends ''Not searched: protected_set_digest, pin fields, sync'', and AC-3 of P-12 is
  about a pin, protected_set_digest and ORQ-W390. No knowledge source is configured (ORQ-I400) and the plan''s knowledge_scope is empty, so there is no
  knowledge document to search; the record says so, but it does not say that the search of those words in the proposal was left out for that reason. Not
  changed.'
- 'Coder''s note on F-7: README line 294 is new in this phase; lines 106, 107, 109 and 325 are longer than 300 characters on main (000c3cb) too. Not changed.'
- 'The reviewer wrote the category of F-1 to F-7 as docs, architecture, tests, correctness, docs, docs and standards; they are in the list of the format.
  It named a question: where the interface decision and the criteria A, B and C are stored (see the note on F-2).'
