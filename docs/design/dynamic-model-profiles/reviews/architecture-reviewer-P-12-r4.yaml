capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-arch-reviewer); its prompt held the packet path and nothing else, in a new context. The model that
  ran it is not observed. This is round 4 of the phase; the reviewer was given no earlier round.
- The reviewer wrote that its session had no shell and that it could compute no quote digest. Its log shows 2 Shell calls, all read-only listings of the
  packet (ls, find, wc). It ran no orqlet, test, hash or evidence command. The Coder did not test whether such a command would have worked in its session,
  so it is not known whether the reviewer could have computed digests. Every test count and check result in the test record is therefore a claim of the
  Coder that the reviewer did not repeat. The Coder computed the digests below for committed lines at revision 8a68afc5e740f47b1d6f7273a370ed6d336d547e
  after reading each range against the claim it supports.
- 'Packet checked by the Coder: dynamic-model-profiles-P-12-87465a94 (1007 files, staged tree ab27215991c4a90165f10f9bdaa14a03556ff772, base 000c3cbf0fbd662a318937c5010179f05b9766f8)
  holds no file under a reviews folder and no P-12 review record, and the two P-12 records in it carry no earlier conclusion. The Coder''s scan did not
  cover the docstrings of the tests, and the packet does carry mentions of earlier rounds there: tests/unit/test_codeowners.py names finding F-5 of the
  round-3 record of the architecture reviewer, and 40 lines of tests/unit/test_readme_model_policy.py match ''rework round'', ''round N'', ''reviews/''
  or ''open pull request''. The reviewers could read these, so their independence from rounds 1 to 3 is weaker than the packet rule intends (see the finding
  on it).'
- 'The proposal is over the packet limit (ORQ-I440) and the reviewers read it through the hunks of diff.patch only. `orqlet review prepare` printed ORQ-I441:
  the code-reviewer binding is not printed.'
- The test record the reviewer read says that the pytest run is a claim (evidence_kind claimed), has verdict NOT_RUN because the gate-status command exits
  5 offline, and that the CI matrix did not run; the reviewer re-ran no check.
- Read-only is declared by the agent definition, not enforced by Orqlet.
- '`applicability.examined` lists the files that the reviewer opened with Read, taken from its tool-call log. Its Grep and Glob calls searched more of the
  packet and are not listed.'
- 'Coder''s note, not part of the reviewer''s text: F-1 is true. I read it against model_resolution.py. `_judge_text` receives `within` only for a named
  fallback; an override (level 1) passes none; `_pinned_level` (level 2) names one model and no profile; the only profile check is the floor of `_meets_floor`,
  which applies for `--coder-profile` and, by default, to the role orqlet-code-reviewer when `--different-family-from` names the coder''s model. The README
  sentence ''and the model sits in the profile that the work needs'' has been in the README since the first P-12 commit (4c9d208), and no record of rounds
  1 to 3 names it. This record is round 4. The implement skill allows three rework rounds and all three are used (after r1, after r2, after r3), so I have
  not changed the README in answer to F-1, I do not waive it, and the person decides what happens next.'
- 'Coder''s note on F-2: true. I read plan.yaml: P-12 is the only phase whose file operations list README.md, the proposal and tests/unit/test_readme_model_policy.py;
  P-13 and P-14 list none of them. The statements at README lines 21, 49, 139 and 519 are true today (five role files exist; a dry run of `orqlet init`
  listed 73 files; no orqlet-code-reviewer role exists) and become false when P-13 ships. A plan amendment is needed before P-13; this phase does not change
  the plan. Coder''s note, not part of the reviewer''s text: the reviewer wrote the severity of this finding as ''major'' or ''minor'' with blocking false;
  the record format has blocking, non-blocking and info, so it is recorded as non-blocking. The reviewer named four observations O-1 to O-4 and gave them
  no severity; the record format needs ids of the form F-n and a severity, so they are F-4 to F-7 here with severity info. The reviewer also wrote categories
  that the format does not list (docs-correctness, plan-sequencing, scope, independence); they are recorded as docs, standards, standards and standards.'
- 'Coder''s note on F-3: true. The five entries are in no plan criterion, ADR or ledger question. The person chose them in the session of 2026-11-19 (the
  answer ''owners'' to the question on the scope of the fixes); the repository holds no record of that answer, as the reviewer says, and the pull request
  body states it. I wrote no ledger entry; whether to add one or to amend the plan is the person''s decision.'
- 'Coder''s note on F-5: true. Lines 12-16 of tests/unit/test_codeowners.py name the round-3 record and its finding F-5, and 40 lines of the README test
  match the words above. My scan of the packet before the reviewers ran covered the review folders and the two P-12 records, not the test docstrings, so
  I did not catch it. The reviewers could read parts of what rounds 1 to 3 had found. The person decides whether round 4 stands with that limit.'
- 'Coder''s note on F-6: true for the docstrings (test_codeowners.py line 7 ''Q-34 asks what the host enforces''; test_readme_model_policy.py line 58 ''Q-34
  is open''); the ledger holds the answer of 2026-11-05, ''enforced by nothing''. Q-38 is open on the ledger since pull request 24. I did not check the
  README use of ''family'' against it.'
