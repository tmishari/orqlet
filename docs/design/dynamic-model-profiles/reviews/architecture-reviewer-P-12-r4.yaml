self_check:
  schema: orqlet.self-check/v1
  checked_against:
    role: architecture-reviewer
    phase: implement
    confirmed_requirements:
    - The diff touches only .github/CODEOWNERS, README.md, the proposal, the two P-12 records and the two test files; no file of src/, tools/ or the workflow
      package, no pyproject.toml and no uv.lock.
    - The README exit statuses, the mode table, the pin and Fable statements and the finding-code table match models.py, validate.py, models_resolve.py,
      validate_model_policy.py, review_identity.py, upgrade.py and model_policy_source.py, except for F-1.
    - src/ holds no built-in exclusion list, so the README is right that the entry for Fable arrives with the seed.
    - In CODEOWNERS the seeds entry sits after src/orqlet/**, so last match wins and the seeds get the intended owner.
    - The CODEOWNERS file, the exit and code tables, the Q-07 row, the independence and role statements and the file list match the plan and the code (the
      reviewer's summary line).
  checks:
  - what: packet read (diff, plan, records, design, snapshot)
    how: Read, Grep and Glob over the packet
    result: pass
  - what: file list respected (AC-6)
    how: diff file headers against the P-12 file operations of the plan
    result: pass
  - what: README claims against code
    how: read the resolver, commands and use cases named above
    result: fail
  - what: plan consistency across phases
    how: grep of plan.yaml for README, the proposal and the test file
    result: fail
  - what: tests run
    how: 'none: the review is read-only and has no shell'
    result: not-run
  - what: quote digests and the review_input digest
    how: 'none: no shell'
    result: not-run
  failures:
  - 'F-1: the README sentence on profile membership at every level is wrong.'
  - 'F-2: no later phase lists README.md, the proposal or the pinning test.'
  unverified:
  - The reviewer ran no command; the test record's pytest, ruff, mypy and gate-status results are claims, and the CI matrix did not run.
  - The reviewer read the proposal only as diff hunks, because the file is over the packet limit.
  - The reviewer did not read lines 3395 to 3871 of diff.patch (later proposal tests and the remaining guards).
  - The reviewer read no earlier review record, no web source and no security aspect.
  - The reviewer could not confirm its own observed model identity; the record leaves model_observed empty.
