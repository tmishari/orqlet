    method: Grep over the packet snapshot, for 'capabilit' in src/orqlet/**/*.py and for 'profile' and 'outside-profile' in src/orqlet/domain/model_resolution.py.
      The only hits are a free-text `capability` field in the policy contract (model_policy.py:156) and unrelated records. No code checks a model against
      'the profile that the work needs'.
    revision: ab27215991c4a90165f10f9bdaa14a03556ff772
  claim: The README says all listed constraints hold "at every level", including that "the model sits in the profile that the work needs". `models resolve`
    does not check that. At level 1 (override) and level 2 (a role assignment that names one model) no profile membership is checked. At level 3 the candidates
    come from the profile's own list, so the check is empty. The only profile check is the floor. It applies when `--coder-profile` is given, or by default
    to the role `orqlet-code-reviewer` when a coder model is named. The existing test "another role has no floor unless it is asked for" (tests/unit/domain/test_model_resolution.py,
    about 1544-1555) confirms this. The next README sentence describes the floor correctly, so the paragraph contradicts itself. The ADR wording ("the profile's
    required capability", adr-001 decision 5) has no code counterpart either.
  suggested_action: Reword the sentence so it lists only the constraints that `resolve` checks at every level (not excluded, approved, a route with a known
    identifier, access not blocked). Describe the profile floor only where the next sentence already does. If a test is added for the new wording, check
    it against `_judge_id`, `_judge_text` and `_meets_floor`. No existing test pins this sentence.
  confidence: high
