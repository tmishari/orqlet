capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-security-reviewer); its prompt held the packet path and nothing else. The model that ran
  it is not observed.
- 'The reviewer''s session had no shell: it ran no command and computed no quote digest, so every test count, the ten mutants and the other checks
  of the test record are claims of the Coder that it did not repeat.'
- 'The packet held no file under a reviews folder. The Coder scanned it (1004 files) by path and by the claim text of 138 earlier records: no
  file and no hit. It still held statements about earlier reviews in prose: 19 earlier test or knowledge records and statements A-64 and A-65
  of the AS-IS file, which name two record paths. ADR-007 decision 8 does not reach those.'
- Read-only is declared by the agent definition, not enforced by Orqlet.
- The reviewer's quote digests were left as not computed. The coder computed them with orqlet evidence cite at the commit bb5ec564483aca02f4fc5dfc45035ca427cbec0a
  for the three committed files that F-1 names (design_set.py 126-128, validate_design.py 228-236, binding_inputs.py 297). The lines of review_prepare.py
  and vcs_git.py that the findings name are staged and not committed, so they are not digested and rest on the reviewer's reading. F-2 to F-4
  carry no evidence and are observations.
- 'Coder''s note, not part of the reviewer''s text: the reviewer found nothing that blocks. Its F-1 is the same trust boundary as F-1 of the architecture
  review (the manifest under review chooses the notes). Rework round 1 closes only the part that hides the manifest, the plan and the standards.
  Which of the options (a), (b) and (c) applies is a design decision for the person and is not changed in this phase. This record is stale after
  the rework change; round 2 follows on a new packet.'
