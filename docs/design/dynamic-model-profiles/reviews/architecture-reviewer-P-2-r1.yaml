  claim: 'AC-7 of P-2 is not met. context/test-record.yaml records the gate-status-phase check with exit
    code 5 and ORQ-E451 on src/orqlet/domain/model_policy_scan.py (quoted from the staged record, which
    cannot be cited by revision). The plan creates that file in P-2 (plan.yaml:286) and AC-7 requires
    no ORQ-E450, ORQ-E451 or ORQ-E453 (plan.yaml:271-276). The file is under the design''s security
    glob src/orqlet/domain/** (manifest.yaml:41-44). The only security entry, EC-7, is verification
    manual (manifest.yaml:94-101), so the gate never counts a security path as covered. The code follows
    the plan''s file list, so the gap is in the approved design and plan. P-3, P-4 and P-9 also create
    files under src/orqlet/domain/** (plan.yaml:397, :515, :1197-1200) and will fail the same gate.'
  suggested_action: A person decides an amendment of the design manifest and the plan (a security expected
    change that covers the domain files, or a narrower security glob), then approves it. Until then AC-7
    stays failed and the phase cannot be reported complete.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: failure-handling
  evidence: []
  claim: '`read_model_policy_at` (model_policy_source.py:113-129) returns `PolicyAbsent` for three different
    causes: no such path, no such revision, and a tree entry that is not a blob (a directory or a submodule);
    adapters/git/objects.py:20-23 and :53-56 return None for all three, and the port says so (ports/vcs.py:90-95).
    A test pins a missing revision as absent (test_model_policy_source.py:1107-1115). The working-tree
    reader returns invalid for a directory. ADR-007 decision 1 treats an absent base as a first introduction
    (a warning, not an error), so a base that the caller cannot read, such as one missing from a shallow
    clone, would weaken the exclusion union in P-10. P-2''s own criteria are met, because AC-2 speaks
    of the same bytes. The knowledge record names only the link limit, so it under-reports. The reviewer
    searched context/plan.yaml for has_revision, tree_at, gitlink and shallow, and the P-10 criteria
    (plan.yaml:1273-1288) do not mention checking the base.'
  suggested_action: Add to P-10 (AC-2) that the base is checked with `Vcs.has_revision`, and the entry
    kind with the `tree_at` modes, before an absent state is trusted. Name both limits in the docstring
    and in the P-2 knowledge record.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: failure-handling
  evidence: []
  claim: '`_parse` emits one ORQ-E541 finding per validation error with no cap. The count is bounded
    only by the 256 KiB file limit and the loader''s 50,000-node limit, so a crafted file could give
    a very long list. The reviewer did not run it. The integrations reader has the same shape.'
  suggested_action: The person decides whether a cap with a "N more" line is wanted.
  confidence: low
