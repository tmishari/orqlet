findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: blocking
  category: architecture
  rule_ref: ADR-007 decision 8
  evidence:
  - kind: quote
    path: docs/design/dynamic-model-profiles/design/adr-007-independence-model-identity-and-fresh-context.md
    lines: '23'
    revision: bb5ec564483aca02f4fc5dfc45035ca427cbec0a
    quote_sha256: 31d5552a8fc14f72a429dab76f119f901881c0d607ddd4cc0279b67e381bf9ec
  claim: A staged manifest whose reviews[].note names its own path passes validate design (the note exists). review prepare then drops snapshot/<task>/design/manifest.yaml,
    context/design-manifest.yaml and the manifest's diff section, and omitted stays empty, so nothing in the packet shows the filtering. It can
    name any path the same way (plan.yaml, a standards file, a changed source file), and the reviewer cannot tell. That breaks the property ADR-007
    decision 8 states ("The design-manifest copy lists note paths") and the module docstring's "exact staged snapshot". The code follows the text
    of AC-3, but AC-3 and the ADR conflict in this case and no test covers it.
  suggested_action: Always keep context/design-manifest.yaml (and the plan and standards copies) whatever a note names, and add a test with a
    manifest that names itself. If the person wants to keep the plan's wording, amend AC-3 and ADR-007 decision 8 explicitly.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  claim: Even with F-1 fixed, a note can name any existing file that the change modifies, and that file leaves the snapshot and the diff. The
    packet's omitted and MANIFEST.json cannot show it, by design, so only a reviewer who cross-checks the manifest copy against the diff would
    notice. The coder flagged this in knowledge/P-11.yaml. It is a trust boundary (the manifest under review decides what the reviewer sees),
    so I leave it to the security reviewer and the person.
  suggested_action: 'Options: take the note list from the base manifest, refuse a note that is not under a reviews folder and is changed by the
    diff, or accept the risk in writing.'
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: docs
  claim: 'knowledge/P-11.yaml says "the manifest copy shows it" and "the manifest copy still lists the note paths". That is false for the self-naming
    manifest of F-1. It also says "no knowledge document exists that the change could make wrong" while the same record lists README.md:354, skill.md:26
    and the proposal paragraph as incomplete or contradicted. The record asks the person which phase carries the proposal text. I could not check
    that paragraph: the proposal file is not in the packet (it is probably over the 1 MiB limit).'
  suggested_action: Correct both sentences once F-1 is settled, and have the person decide the owner of the proposal paragraph.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: correctness
  claim: 'AC-1 says each note is passed as :(exclude,literal)<path>. The adapter passes it only when it is no directory in either tree (vcs_git.py:263-277).
    That deviation is recorded in tests/P-11.yaml and knowledge/P-11.yaml, but plan.yaml was not amended. It also makes the fake and Git disagree:
    if a note file is replaced by a directory of the same name, the fake drops the note''s section and Git keeps it, so the deleted note''s body
    reaches diff.patch. The contract tests do not run this case; only the integration test checks the "hides nothing" half.'
  suggested_action: Have the person accept or amend AC-1, and add this case to the shared contract scenarios.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: non-blocking
  category: architecture
  claim: 'The port says a pattern matches "as fnmatch does", but the git adapter hands the pattern to Git''s own pathspec matcher. From my knowledge
    of Git (not measured here), the two differ on [^x], a backslash and [[:class:]]. The one live pattern (docs/design/*/reviews/*) has none of
    these, so there is no defect today, and the real-git tests cover only that pattern. The repository also now has a second glob dialect: domain/globs.glob_match
    keeps * inside a segment and has **, and ADR-007 and BC-21 write the rule as docs/design/**/reviews/**.'
  suggested_action: Narrow the port contract (document or refuse [ and a backslash in a pattern) or add contract cases for them.
  confidence: low
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: failure-handling
  claim: 'The coder measured only git 2.56.1 on macOS. I found no minimum Git version in README, pyproject, ci.yml or AGENTS.md. A Git that does
    not support an exclude-only pathspec could return an empty patch with exit 0, which would look like "no change" to a reviewer. I did not verify
    this, so it is a question: what is the oldest Git the project supports, and should an empty patch for a non-empty diff_tree be an error?'
  suggested_action: Answer the question; consider that guard.
  confidence: low
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: standards
  rule_ref: ORQLET-STYLE-001
  claim: ports.vcs.is_excluded shares its name with domain.evidence_artifacts.is_excluded, which is also about review-record paths, and with domain.model_identity.is_excluded.
    Separately, the manifest copy of this very task states earlier design-review outcomes in self_check.failures ("every review round ended NOT
    PASS..."). ADR-007 decision 8 says that copy holds no conclusion, and the sentinel scan would not catch a paraphrase.
  suggested_action: Rename the port function (for example is_left_out) and decide whether the design-manifest text is acceptable.
  confidence: medium
