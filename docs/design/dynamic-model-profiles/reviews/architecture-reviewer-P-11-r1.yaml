  be digested and rest on the reviewer''s reading; the two absence entries of F-1 are left out for the same reason, because an absence record
  names a commit and these files are in none. F-2 to F-7 carry no digest and are observations.'
- 'Coder''s note, not part of the reviewer''s text: the reviewer''s F-1 blocks. Rework round 1 fixes it inside review_prepare.py: a note that
