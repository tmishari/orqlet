- 'The reviewer''s session had no shell: it ran no command and computed no quote digest, so every test count, the ten mutants and the other checks
  of the test record are claims of the Coder that it did not repeat.'
- 'The packet held no file under a reviews folder. The Coder scanned it (1004 files) by path and by the claim text of 138 earlier records: no
  file and no hit. It still held statements about earlier reviews in prose: 19 earlier test or knowledge records and statements A-64 and A-65
  of the AS-IS file, which name two record paths. ADR-007 decision 8 does not reach those.'
- Read-only is declared by the agent definition, not enforced by Orqlet.
- 'The coder cited, with orqlet evidence cite at the commit bb5ec564483aca02f4fc5dfc45035ca427cbec0a, the one committed line that F-1 rests on:
