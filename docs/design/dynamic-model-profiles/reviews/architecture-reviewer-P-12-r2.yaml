capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-arch-reviewer); its prompt held the packet path and nothing else, in a new context that did not hold
  round 1. The model that ran it is not observed.
- 'The reviewer''s session had no shell: it ran no command and computed no quote digest, so every test count and check of the test record is a claim of
  the Coder that it did not repeat. The Coder computed the digests of the committed lines with orqlet evidence cite at 1fc985140dc0022f58bea803b4949932d01ecf43;
  lines of staged files and of packet copies cannot be digested and rest on the reviewer''s reading, and a quote of a staged line is left out of the evidence
  of the findings below.'
- 'Packet checks by the Coder: the packet dynamic-model-profiles-P-12-d2528c3d (1008 files, staged tree f3fd85f5aa0dde565cafd6564b10572aeb5526be) holds
  no file under a reviews folder and no name of a P-12 review record. A scan of it for the claim text of 197 claims in the 36 earlier review records of
  this task, round 1 of P-12 included, found no hit. It still holds lines that mention earlier reviews or rounds, in earlier test and knowledge records
  (P-3, P-10, P-11), in as-is.md, in ADR-002 and ADR-006, in questions.yaml, in the plan and in the design manifest. The proposal (1,065,661 bytes in the
  staged tree; the base file, 1,062,453 bytes, was already over the limit of 1,048,576) is in neither the snapshot nor the context copies (ORQ-I440); diff.patch
  holds 9 hunks of it, so the reviewer could read what changed in it and never the whole file.'
- Read-only is declared by the agent definition, not enforced by Orqlet.
- 'Coder''s note, not part of the reviewer''s text: F-1 is the ORQ-E451 matter. It is true, I cannot disprove it, and I do not waive it. No file of the
  P-12 list can fix it, because the cause is EC-7 with verification manual in the approved design, and the design-format reference says that a security
  surface has an extractor, so the entry looks like an authoring error of the design. The person was shown it and decided in this session to continue with
  it accepted and to list the design or plan fix as a follow-up; the reviewer asks for that acceptance in an approved artifact. F-2 and F-5 were checked
  against the code (render_all.py REVIEW_AGENTS, a real init output, upgrade.py _proposes_code_reviewer; review_identity.py _NOTE_TEXT) and are right: README.md
  and the proposal section 10.3 are corrected in rework round 2, tests first by the typed tester. F-3 and F-4 are outside the text of AC-1 to AC-5 or a
  plan matter and are left to the person. A round 3 follows on a new packet; this record is stale after that change.'
