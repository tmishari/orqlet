findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: tests
  evidence: []
  claim: 'context/test-record.yaml:31 records AC-9 as `check_ref: gate-status-phase, result: pass`. The
    record''s `commands` (lines 15-21) are ruff-check, ruff-format, mypy, import-linter, pytest, schema-check
    and manifest-check; no command row for gate-status-phase exists. The plan lists it in the phase `checks`
    (context/plan.yaml:112) and as the check of AC-9 (:103). `validate test` checks only the exit codes
    of the listed commands and that each AC has a result (validate_records.py `_check_commands`, `_check_coverage`);
    it does not match `check_ref` to a command that ran. The baseline says a check that did not run is
    reported as not run, never as passed. The reviewer would not merge until this is fixed.'
  suggested_action: Add a gate-status-phase command row with its exit code and output digest, or set AC-9
    to `not-run`. The plan allows NOT_RUN when ORQ-I393 is the only cause offline.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'The new contract adds three `RepoPath` fields: `documented.evidence`, `evaluated.evidence` and
    `list_price.source`. `_repository_path` (common.py:51-56) re-raises `str(InvalidPath)`, and those
    messages repeat the raw value (`{raw!r}`, domain/paths.py:32-47 and :62). `load_contract` puts each
    error `msg` into the DocumentError text (loading.py:22-27), so a bad evidence path raises text that
    repeats the file''s value. The AC-4 tests cover only ModelRef, RecordedModel, PolicyText and IdPattern
    (test_model_policy_contract.py:1241-1335); `test_an_evidence_or_source_path_must_stay_inside_the_repository`
    (:466-477) asserts refusal only. The module comment is accurate for model names. ADR-002 and P-2 AC-5
    ask that no loader finding echo a value or a key of the file. An `extra_forbidden` error also carries
    the unknown key in `loc`.'
  suggested_action: 'Carry this into P-2: build loader findings from the contract field names and the
    error `type`, never from `msg` or from a `loc` part that comes from the file. Add a refused `evidence`
    path and an unknown key to the marker test of P-2 AC-5.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: compatibility
  evidence: []
  claim: EC-3 says the closed client set is "the one narrowing of an accepted value", and EC-4 says every
    approved plan stays valid. The diff narrows two more values. (a) `model_requested` and `model_observed`
    go from any string to `RecordedModel` (review_result.py:59-60 and :67-68), which refuses the empty
    string, `( )` and more than 128 characters. (b) A plan's `header.workflow_version` goes from any non-empty
    string to `major.minor.patch` (plan.py:90-95). AC-7 checks only this repository. The reviewer pattern-searched
    the 112 records and found every client inside the set and every model null; the five plans carry 0.3.1
    to 0.4.0. Another project may hold a record or plan outside the new limits. ADR-002 chose the record
    alphabet deliberately, so the gap is the missing statement of the narrowing.
  suggested_action: List both narrowings in EC-3 and EC-4 and in the release text, or state that no writer
    of these values exists (A-51). Decide on purpose whether `( )` belongs in RecordedModel.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: tests
  rule_ref: ORQLET-TEST-001
  evidence: []
  claim: '`test_the_plan_of_this_task_still_loads` (test_plan_review_evidence_by_version.py:234-246) asserts
    `workflow_version == "0.4.0"` and three roles of the live plan of this task, and the test in test_existing_records_and_plans_stay_valid.py
    asserts that this plan is among those found. A plan amendment, a re-bind to 0.5.0 or a folder move
    would fail these for a reason unrelated to the contract. AC-6 asks for the check, so the test follows
    the criterion.'
  suggested_action: Pin the version and role assertions on a frozen plan, such as the 0.3.x plans of other
    tasks or a fixture copy.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: architecture
  evidence: []
  claim: '`CODE_REVIEWER_FROM = Version(0, 5, 0)` (plan.py:24) holds a release decision in code. The plan
    marks 0.5.0 as a reading the person confirms (plan.yaml near line 2394). P-13 AC-1 checks that `identity.json`
    says 0.5.0, but no test ties the constant to the package version. If the release number changes, the
    rule silently starts at another version.'
  suggested_action: In P-13, add a test that the shipped `workflow_version` is at or above CODE_REVIEWER_FROM.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: correctness
  evidence: []
  claim: 'The comment on `ReleaseVersion` says the pattern is "as the domain `Version` reads it: ... ASCII
    digits only". The domain regex (versions.py:11, `\d` on a str pattern) also accepts non-ASCII digits
    after the first character, so a version with an Arabic-Indic zero in a later position parses as a
    larger number. `plan.py` reads `header.workflow_version` with `Version.parse`, so the two readers
    differ. This is harmless today; the reviewer did not run it.'
  suggested_action: Correct the comment, or restrict the domain regex to ASCII in a later change.
  confidence: high
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: docs
  evidence: []
  claim: The design contradicts itself on `model_families`, and the plan lists EC-5 as implemented here.
    EC-5 (context/design-manifest.yaml:84) says it "is read only when no model policy exists". ADR-007
    Decision 1 and the compatibility note (:137) say it still applies to strings the policy cannot match.
    P-1 reads neither, so nothing is wrong in this diff yet.
  suggested_action: Align EC-5 with ADR-007 before the phase that implements the reading.
  confidence: high
