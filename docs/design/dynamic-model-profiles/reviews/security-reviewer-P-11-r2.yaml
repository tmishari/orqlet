capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-security-reviewer); its prompt held the packet path and nothing else. The model that ran
  it is not observed.
- 'The reviewer''s session had no shell: it ran no command and computed no quote digest, so every test count, the ten mutants and the other checks
  of the test record are claims of the Coder that it did not repeat.'
- 'The packet held no file under a reviews folder, although the index held the two records of round 1. The Coder scanned the packet (1004 files)
  by path and by the claim text of 140 records, the two staged ones included: no file and no hit. It still held statements about earlier reviews
  in prose: 19 earlier test or knowledge records and statements A-64 and A-65 of the AS-IS file, which name two record paths. ADR-007 decision
  8 does not reach those.'
- Read-only is declared by the agent definition, not enforced by Orqlet.
- The reviewer's quote digests were left as not computed. The Coder computed them with orqlet evidence cite at the commit bb5ec564483aca02f4fc5dfc45035ca427cbec0a
  for the committed lines that F-1 and F-2 rest on (design_set.py 126-128, validate_design.py 234-236, binding_inputs.py 242-262, evidence_artifacts.py
  3-6) and left out the quotes of staged lines (review_prepare.py and the tests), which no commit holds. The absence entries were checked by the
  Coder with git grep at the base; the reviewer's own list of files for F-2 differed and is noted there.
- 'Coder''s note, not part of the reviewer''s text: F-1 blocks. It is the same trust boundary as F-1 of the round-1 security review and F-1 of
  the round-2 architecture review. Rework round 2 reads the notes from the design manifest at the merge base, the approved one, so a staged edit
  of the manifest cannot change what is hidden. ADR-007 decision 8 and AC-3 say ''the design manifest'' and name no tree; this is the Coder''s
  reading and the person can overrule it. The reviewer''s other options stay open for the person: only notes under docs/design/<task>/reviews/,
  or the risk accepted in writing. F-2 is not changed: AC-3 and ADR-007 decision 8 name the pattern for everything under a reviews folder. This
  record is stale after the rework; round 3 follows on a new packet.'
