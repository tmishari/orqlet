capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer's session was in Ask mode and had no shell, so it ran no command, computed no quote digest and could not run
  `orqlet standards for` (it read context/standards/rules.yaml). It did not save a record file; the person running the review
  saved this one from its answer. The reviewer's evidence entries named packet paths (context/..., snapshot/...) with
  the digest value not-computed. The person running the review replaced the entries of F-1 by quotes of committed files, with
  digests from `orqlet evidence cite` at revision 5f4ed4d8b8edcec58875e21b59e1a5e17f329caa (the plan, the design manifest and
  the implement skill), and gave F-2 an absence record. The phase's modules, tests and records are staged and not committed,
  so they cannot be cited by revision; their lines stay in the claim text. The claims are the reviewer's, with the packet
  paths changed to repository paths. The categories of F-3, F-4 and F-6 (the reviewer wrote requirements and behaviour, which
  the format does not allow) were set to correctness, and the result of the knowledge check (the reviewer wrote partial) was
  set to fail, because the format allows only pass, fail and not-run.
- 'Read-only is declared by the agent definition (readonly: true), not enforced by Orqlet.'
- The model that ran the reviewer is not observed.
- The packet held the earlier review records under snapshot/docs/design/**/reviews/, which ADR-007 decision 8 says a packet
  must not carry. The reviewer says it opened architecture-reviewer-P-5-r1.yaml to learn the format and read its findings, and
  tests/P-2 to P-5.yaml for the digest comparison; it says F-1 and F-2 overlap the P-5 review and that it re-derived both
  from the P-6 test record, the plan, the skill text and the diff.
- 'Not examined by the reviewer: the full suite and import-linter (not run), whether the design and plan are approved (its
  copies show status draft), the CI matrix Pythons other than the one used (ORQLET-QA-001), P-1 to P-5 code beyond what P-6
  relies on, golden files, docs/design/orqlet-architecture-proposal.md (not in the packet), security aspects, and
  tests/unit/application/test_upgrade_model_policy.py lines 1-690 and 1030-1330.'
