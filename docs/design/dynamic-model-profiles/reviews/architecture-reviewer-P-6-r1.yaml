  unverified:
  - That the full suite passes (10732 passed is claimed) and that import-linter reports no broken contract.
  - Whether the design and plan are approved; the packet copies show status draft.
  - Python versions of the CI matrix other than the one used (ORQLET-QA-001).
  - P-1 to P-5 code beyond what P-6 relies on, golden files, and docs/design/orqlet-architecture-proposal.md (not in the packet).
  - Security aspects, which belong to the security reviewer. Not every test body was read; tests/unit/application/test_upgrade_model_policy.py lines 1-690 and 1030-1330 were not.
  questions:
  - 'F-1: do you want a design and plan amendment, or a recorded waiver, for the ORQ-E451 on src/orqlet/domain/**?'
  - 'F-3: confirm the two readings of AC-2 (a single-model fallback assignment gets no ORQ-W540; an unused profile is judged for every enabled client).'
  - 'F-4: should ORQ-W547 also fire on release upgrades without a policy, and should its wording say so?'
