findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: blocking
  category: architecture
  evidence:
  - {kind: quote, path: docs/design/dynamic-model-profiles/plan.yaml, lines: 788-791, revision: 5f4ed4d8b8edcec58875e21b59e1a5e17f329caa, quote_sha256: bc52a5ef144a331105db3718f0fd64fb88e9b3d13df8284a2dff5edc28da4811}
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/manifest.yaml, lines: 40-44, revision: 5f4ed4d8b8edcec58875e21b59e1a5e17f329caa, quote_sha256: d23805dd65b8caffcb88634e1b54038b53ef5245d2edb10737c86240397036d8}
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/manifest.yaml, lines: 94-101, revision: 5f4ed4d8b8edcec58875e21b59e1a5e17f329caa, quote_sha256: 5f9ce69406f5c3c812a6db2212b9e4073afd0318bdf2d4b70dc1816e09f5e8bc}
  - {kind: quote, path: src/orqlet/workflow/skills/orqlet-implement/skill.md, lines: '28', revision: 5f4ed4d8b8edcec58875e21b59e1a5e17f329caa, quote_sha256: abe08b555946f39423f9e0d0b1870a31c99bd9eca170aef8868a0aad1b64ead0}
  - {kind: absence, searched: [docs/design/dynamic-model-profiles/design/manifest.yaml], method: 'read expected_changes EC-1 to EC-9 of context/design-manifest.yaml; the only entry with surface security is EC-7 (lines 94-101, verification manual, CODEOWNERS); no entry covers src/orqlet/domain/**', revision: 3db213fd9ffa5be05ac098bae4d51217068170e0}
  claim: >-
    AC-9 of P-6 fails and the test record's verdict is FAIL. The gate (gate-status-phase, exit 5) reports ORQ-E451 on
    model_identity.py (P-3), model_policy_scan.py (P-2) and model_resolution.py (P-4), which match the design's security glob
    src/orqlet/domain/**. P-6 changes none of them, so the cause is inherited from the branch. The implement skill says
    ORQ-E451 stops the work. The same failure is recorded in tests/P-2 to P-6.yaml, and each time the only decision on record
    is "the person chose to continue". The plan digest (64828bab...) is the one the P-5 review read, and the design manifest
    has no domain entry, so nothing was amended or waived in a form a reviewer can read.
  suggested_action: >-
    The person decides once: amend the design and plan (a security expected change for src/orqlet/domain/** that the gate can
    count, or a narrower glob, then a renewed design approval), or record an explicit waiver for the rest of the branch.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: architecture
  evidence:
  - {kind: absence, searched: [docs/design/dynamic-model-profiles/plan.yaml], method: 'read the file operations of P-6 (context/plan.yaml 797-836) and compared them with the paths changed in diff.patch: test_model_settings_request.py, test_render_integrations.py and test_resources_composition.py change and are not listed', revision: 3db213fd9ffa5be05ac098bae4d51217068170e0}
  claim: >-
    Three earlier tests were edited outside the phase's file list: test_model_settings_request.py, test_render_integrations.py
    and test_resources_composition.py. The test record discloses this and says the person agreed, but the plan was not amended.
    AC-9 also says that no file outside the phase's operations changes, yet the record attributes its fail only to the gate.
    The edits are minimal and forced by the plan's own change of compose (`selection` to `policy`) and of ModelSelection.
    The reviewer could see the first two in the diff; the third sits in a file that the diff shows as new, so it relied on
    the record for it.
  suggested_action: >-
    List these tests in the plan when F-1 is amended. Check that P-7 to P-13 do not pin these signatures again.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: correctness
  evidence: []
  claim: >-
    The coder's readings of AC-2 are held only in docstrings and the phase report (knowledge-impact.yaml), and no answer from
    the person is recorded. (a) An assignment that names one model in mode automatic-with-fallbacks never gets ORQ-W540
    (model_selection.py:357-365). AC-2 says "an automatic-with-fallbacks one with no eligible fallback", which can also be read
    to cover it. A test pins the narrow reading. (b) A profile that no assignment uses is judged for every enabled client
    (model_selection.py:326-354). Once a seeded policy ships profiles in mode manual with candidates for only some clients,
    every upgrade would warn about profiles nothing uses. The reviewer cannot tell whether that is wanted.
  suggested_action: >-
    Ask the person to confirm (a) and (b), or fix them in the plan text.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: correctness
  evidence: []
  claim: >-
    ORQ-W547 fires on every plan that changes an agent file that a review record names, with or without a policy
    (pin_staleness.py:48; `_pin_notes` in upgrade.py:263 does not look at the policy). That matches AC-4, and the plan's later
    README paragraph (P-12 AC-3) says release upgrades do the same. The message wording says "A model pin changes protected
    files", which reads as if only a pin causes it. The only test without a policy covers a release that changes no agent
    file, so the case of a release that changes role text and has no policy is not tested.
  suggested_action: >-
    Optionally word the message for any agent-file change, and add that one test.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: docs
  evidence:
  - {kind: quote, path: README.md, lines: 771-772, revision: 5f4ed4d8b8edcec58875e21b59e1a5e17f329caa, quote_sha256: 5496b0427d570204a5b1e60b24b81911f5d331837880e4cea6d062be313c6da0}
  claim: >-
    The knowledge record says README.md stays true. Its search used new terms (model-policy, ORQ-E540 and so on) and so does not
    test statements that this phase makes incomplete. README.md:771-772 lists three causes of a non-zero `orqlet upgrade
    --check`. A policy edit that is not yet rendered, and a refused policy (exit 3), are now two more. P-12 AC-3 and AC-4 name
    an upgrade paragraph and a codes table but not this line. The statement is incomplete rather than false.
  suggested_action: >-
    Add this line to the README work of P-12, or say in the record that it is deferred.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: info
  category: correctness
  evidence: []
  claim: >-
    `upgrade --resume` with a policy that has become invalid or deleted is refused (upgrade.py:145-153) before the interrupted
    change can be finished. `rollback` is the way out. This is consistent with AC-1, but neither the plan nor a test says it,
    and the fault test resumes only with a valid policy.
  suggested_action: >-
    Say so in the design notes or add one test.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-7
  kind: observation
  severity: info
  category: tests
  evidence: []
  claim: >-
    Evidence quality. (a) Every command in the test record has evidence_kind "claimed". (b) The gate-status digest a38a798d...
    is identical in tests/P-4.yaml, P-5.yaml and P-6.yaml. The reviewer cannot tell whether the gate output carries the phase
    name or whether the digest was reused. (c) Many tests cite "the interface item N" of a tester brief that is not in the
    packet; the reviewer checked those tests only against the plan and the ADRs. (d) model_selection.py now holds mapping,
    problem checks, selection, the ORQ-W540 analysis and the refusal outcome (ORQLET-STYLE-001 is SHOULD, so this is not a
    defect).
  suggested_action: >-
    Re-run the gate with --phase P-6 and keep its own digest.
  confidence: low
