- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: blocking
  category: correctness
  rule_ref: plan P-3 AC-3; ADR-005 decision 1
  evidence:
  - {kind: quote, path: src/orqlet/application/contracts/model_policy.py, lines: 34-36, revision: 040a8a882ac283f3fb9a80af1ccb1fce9dba3cb9, quote_sha256: 80a87621ca795d4b61dab68930b3757ca780b0c655b11496cd10a78bb3475bd4}
  - {kind: quote, path: tests/fixtures/contracts/valid/orqlet.model-policy.v2.yaml, lines: 70-72, revision: 040a8a882ac283f3fb9a80af1ccb1fce9dba3cb9, quote_sha256: 56f964cd06612f2aaf253d9175034fb920f75c760722abca12bba09e2264301c}
  - {kind: quote, path: docs/design/dynamic-model-profiles/plan.yaml, lines: 357-366, revision: 3db213fd9ffa5be05ac098bae4d51217068170e0, quote_sha256: fdc2431ce7d10d7abf0a4467a8055112373359231087fb31d8009d4468006f2c}
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/adr-005-fable-exclusion-by-model-identity.md, lines: "26", revision: 3db213fd9ffa5be05ac098bae4d51217068170e0, quote_sha256: add55b7882f833d4dc1161462aa2db07a7fd1e849f8d95783d79b0c08d4acc75}
  claim: 'The normalised-pattern path of the round-2 rework can widen a pattern to match every model.
    `_patterns` normalises each id pattern with `_canonical`, which also removes a provider prefix of the
    table and strips separators at both ends (model_identity.py:148-152 and 216-223, staged). When only
    wildcards remain, `fnmatchcase(normalised, "*")` is true for every string (model_identity.py:238,
    staged): `xai/*`, `anthropic/*`, `openai/*`, `google/*`, `.*`, `-*` and `*.` all become `*`, so
    `is_excluded("claude-opus-5-5", [ExclusionRule(id_patterns=("xai/*",))])` returns True. More generally
    the prefix is often a pattern''s only vendor constraint: `openai/*-mini` becomes `*-mini` and excludes
    every vendor''s `-mini` model. The contract accepts these patterns (model_policy.py:34-36); the committed
    v2 fixture already uses a vendor-prefixed pattern, `vendor/blocked-?` (fixture lines 70-72); ADR-005 names
    "a vendor the company rules out" as a use of team exclusions (adr-005 line 26). AC-3 asks for matching
    "by fnmatch pattern" (plan.yaml:357-366), and fnmatch of `xai/*` does not match `claude-opus-5-5`. One
    such entry would make the resolver reject every candidate and `validate model-policy` report ORQ-E543
    on every model. It fails closed, so it is not a security weakening, but the answer is wrong. No test
    covers a pattern whose normalised form is only wildcards (test_model_identity.py:1102-1128, staged).
    Traced by reading, not executed.'
  suggested_action: 'Ask the person to refine the F-1 decision, then change `_patterns` and add tests for
    `xai/*`, `anthropic/*`, `openai/*-mini`, `.*` and `*.`. (a) The minimum: drop a normalised pattern that
    holds nothing but `*` and `?` when the written pattern held a literal character. (b) Also keep the vendor
    constraint: do not remove a provider prefix from a pattern, and match a prefixed pattern against a form
    of the model that keeps its prefix, with separators normalised; this gives up matching `openai/gpt-6.1-*`
    against an unprefixed `GPT 6.1 Sol`, which a current test asserts.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: blocking
  category: architecture
  rule_ref: plan P-3 AC-6
  evidence:
  - {kind: quote, path: docs/design/dynamic-model-profiles/plan.yaml, lines: 381-387, revision: 3db213fd9ffa5be05ac098bae4d51217068170e0, quote_sha256: dfafcfb9ffb7d381f17cc944c6bed12d34fcbddd92401dad8b2432fb07016bca}
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/manifest.yaml, lines: 41-44, revision: 3db213fd9ffa5be05ac098bae4d51217068170e0, quote_sha256: 876977b020a69e931a0e5d2560b2a75e95363d2486c7b167b6a4e29a984e107c}
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/manifest.yaml, lines: 94-101, revision: 3db213fd9ffa5be05ac098bae4d51217068170e0, quote_sha256: 5f9ce69406f5c3c812a6db2212b9e4073afd0318bdf2d4b70dc1816e09f5e8bc}
  claim: 'AC-6 is still not met. The test record (tests/P-3.yaml:20, staged) shows the phase gate exiting 5
    with ORQ-E451 on domain/model_identity.py and domain/model_policy_scan.py, and its verdict is FAIL. The
    design lists `src/orqlet/domain/**` as a security glob (manifest.yaml:41-44), and its only security expected
    change is EC-7, verified by hand (manifest.yaml:94-101), so no domain file can count as covered, whatever
    the code does. Neither the plan nor the design has changed since round 1. The record also still maps AC-6
    to gate-status-phase, while the plan names import-linter (round-1 F-5).'
  suggested_action: The person amends the design, either a security expected change that covers the two domain
    modules with a verification the gate can count, or a narrower security glob; then re-approves the plan, and
    the gate is re-run for P-2 and P-3. P-4 and the later phases that touch domain files have the same gate clause.
  confidence: high
