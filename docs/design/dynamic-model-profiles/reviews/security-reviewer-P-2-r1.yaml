findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  rule_ref: ORQLET-SEC-002
  evidence: []
  claim: 'The two entry points classify the same path differently. The working-tree reader refuses a
    directory, link or other non-file as ORQ-E540 (model_policy_source.py:99-111). The tree reader
    (model_policy_source.py:114-129) calls vcs.read_at, which returns None for any entry that is not
    a file (adapters/git/objects.py:21-22, 56: `body if parts[1] == "blob" else None`). A directory or
    a gitlink at .orqlet/model-policy.yaml in a tree therefore reads as PolicyAbsent, which looks the
    same as "no policy". A symlink entry is a blob, so its target text is parsed as a policy. The docstring
    and the knowledge record mention only the link case. The new tests use FakeVcs, which can only return
    bytes or None, so neither non-blob case is tested. This was read from the code and not run against
    real git.'
  suggested_action: Before a later phase uses read_model_policy_at for the deletion or exclusion rules,
    make the tree reader fail closed. Check the entry mode (tree_at gives 100644/100755, 120000, 160000)
    and return ORQ-E540 for a link, a gitlink or a directory. Add a test. Until then, those phases must
    not read PolicyAbsent from a tree as "no policy".
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: failure-handling
  rule_ref: ORQLET-SEC-002
  evidence: []
  claim: A deleted policy is only recognised when a valid lock lists the path with owner seeded (model_policy_source.py:132-151).
    A missing, unreadable or invalid lock, or a lock without that row, returns False, so the state is
    PolicyAbsent (fail-open). The lock is itself a repository file that the same person can edit. The
    code documents this and the plan accepts it (AC-1). The protection against deleting the policy and
    the lock row together rests on later phases that compare against the base tree, and nothing in P-2
    enforces or tests that.
  suggested_action: Make it a stated constraint of the later phases (validate model-policy, models resolve,
    upgrade, validate review) that "absent now, loaded at base" counts as a deletion. Give each its own
    test.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  rule_ref: ORQLET-SEC-002
  evidence: []
  claim: 'The 256 KiB limit does not bound memory. The working-tree path reads the whole file first (adapters/fs/local_fs.py:103-104,
    `handle.read()`), and the tree path reads the whole blob through cat-file --batch into memory (objects.py:30-33).
    The size check runs only afterwards (model_policy_source.py:155-157). The lock is also read in full
    (model_policy_source.py:143). The port has no bounded read, and the other readers behave the same
    way, so this is not new in P-2. The comment that "the file is untrusted" is not matched by a bound
    on the read.'
  suggested_action: Accept it as a known limit of the FileSystem and Vcs ports and say so, or add a bounded
    read to the ports in a later change.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: failure-handling
  rule_ref: ORQLET-SEC-002
  evidence: []
  claim: The number of contract findings is not capped. _parse returns one finding per pydantic error
    (model_policy_source.py:166-173). The strict loader allows 50,000 nodes (yaml_loader.py:106), and
    the file may be up to 256 KiB. By the reviewer's estimate a file of tens of thousands of `- {}` entries
    under `models` yields several hundred thousand findings, because each entry lacks six required fields.
    That is memory and output flooding in a CLI or in CI. It was not measured.
  suggested_action: Cap the findings returned (for example the first N, plus one fixed "more findings
    omitted" finding) and test the cap with a worst-case file.
  confidence: low
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: security
  rule_ref: ORQLET-SEC-003
  evidence: []
  claim: 'The credential scan reads raw text and not parsed values (model_policy_source.py:175-176),
    and covers only the shapes in model_policy_scan.py:30-37 (sk-, xai-, AIza) plus the older rules.
    A double-quoted YAML scalar written with escapes or a backslash line continuation parses to a key-shaped
    string that the raw scan does not see. A key of any other vendor shape passes ModelRef (128 characters)
    or PolicyText (400 characters). The same limit exists in the integrations scan. The scan stops an
    accidental paste. It does not stop a person who hides a key.'
  suggested_action: State this limit in the ADR or the phase report. Optionally scan the parsed string
    values as well. Confirm that the catalog will not contain identifiers such as `xai-` plus 20 or more
    id characters, which would be a false positive and make the file invalid with no override.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-6
  kind: observation
  severity: non-blocking
  category: standards
  evidence: []
  claim: 'The phase gate fails. context/test-record.yaml, in the gate-status-phase row (exit 5) and AC-7
    (fail), reports ORQ-E451 (no entry, "security: additional") for src/orqlet/domain/model_policy_scan.py.
    That file matches the design''s security glob src/orqlet/domain/** (design-manifest.yaml, extractor_config.security_globs).
    EC-7 is the only security entry and is manual, so the gate never counts a security path as covered.
    The record states that a design and plan amendment is needed and that the person chose to continue.
    The credential scan, which is a security control, therefore ships with its security coverage open.'
  suggested_action: Amend the design and plan with an expected change for the credential scan, or record
    the person's approval of the exception in the pull request, before merge. Keep AC-7 as fail until
    the gate passes.
  confidence: high
self_check:
  schema: orqlet.self-check/v1
  checked_against:
    role: security-reviewer
    phase: implement
  checks:
  - what: No secret, key or certificate committed in the diff
    how: Text search of diff.patch for sk-, xai-, AIza, AKIA, ghp_, eyJ, PEM private-key and certificate
      markers, .pem/.crt/x509. The only hits were rule names and short non-key words. Tests assemble every
      key shape from fragments at run time.
    result: pass
  - what: No MD5, SHA-1, random, hashlib or process, network, eval, pickle or yaml.load in the new code
      or tests
    how: Text search of model_policy_source.py, model_policy_scan.py and both new test files, and of the
      added lines of the diff
    result: pass
  - what: No dependency change
    how: pyproject.toml and uv.lock do not appear in the file list of diff.patch
    result: pass
  - what: A finding never carries a value or key of the file
    how: Read _parse and _contract_message (built from loc and type only, unknown key replaced by "unknown-key");
      loader and VCS error messages are dropped. The AC-5 tests put markers in refused and valid model,
      text and repository-path fields, which covers the P-1 r2 F-1 request.
    result: pass
  - what: Input handling follows the strict loader
    how: Read yaml_loader.py (no anchors or aliases, no merge keys, duplicate keys refused, depth 32,
      50,000 nodes, UTF-8 only) and the order in _parse (size, loader, v1 check, contract, scan)
    result: pass
  - what: The new regexes cannot backtrack
    how: A fixed prefix, an exact count of ASCII key characters, a one-character lookbehind, and a 4096-character
      window per line (model_policy_scan.py:30-52)
    result: pass
  - what: Tests and checks of the phase (pytest, ruff, mypy, import-linter, gate)
    how: ''
    result: not-run
  unverified:
  - The reviewer ran nothing, so it did not run the tests, the linters or the gate, did not recompute
    quote digests or the packet hashes, and did not run real git for F-1. The results in test-record.yaml
    are the tester's claims. Its pytest status was read from a piped summary line, not from an exit status.
  - The anchoring of the new string types of P-1 (`$` is end-of-text only) was relied on from the P-1
    r1 review and not re-verified.
  - The P-1 contract files were read only where P-2 depends on them.
  - The agent that ran this review, its client and its model are not observed by the reviewer.
  questions:
  - 'F-1: should the tree reader refuse a link, gitlink or directory in P-2, or is it left to the phase
    that reads it?'
  - 'F-6: will the person amend the design and plan, or record the gate exception in the pull request?'
