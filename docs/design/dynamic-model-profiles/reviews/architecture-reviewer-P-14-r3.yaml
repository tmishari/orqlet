capability_limits:
- 'The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2. The change class is D3, which requires I2, so the verdict of this record
  is NOT_RUN: ORQLET-MODEL-002 says that a class below the role''s minimum is NOT_RUN, never a pass. The reviewer''s own conclusion is in the first line of the claims
  below.'
- The reviewer's own conclusion was PASS with no blocking finding; it examined the diff (two records, no file operation), the P-14 section of the plan, the design
  manifest, both records, and the policy, lock, proposals, role bindings, CODEOWNERS and Claude Code agent files of the snapshot.
- The reviewer was started as a typed subagent in a new session; its prompt held the packet path and nothing else. That the context is fresh is the claim of the Coder
  from how the subagent was started, which Orqlet does not check. The model that ran it is not observed, so model_observed stays empty and the identity is unknown.
- 'The reviewer''s session was read-only and had no shell: it ran no orqlet, test or hash command, computed no quote digest and wrote no review-result file. The Coder
  wrote this record from its returned text, so every finding is an observation without quote evidence. The packet was prepared with `uv run orqlet review prepare`,
  the command line built from this working tree; the packets of rounds 1 and 2 were prepared by the older orqlet 0.3.0 on the path, and those two rounds are superseded.'
- Read-only is declared by the agent definition, not enforced by Orqlet.
