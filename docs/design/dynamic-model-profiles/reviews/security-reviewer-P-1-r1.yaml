findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  rule_ref: ORQLET-SEC-002
  evidence: []
  claim: 'The "never echoed" guarantee (BC-32) holds for the three new string types (ModelRef, RecordedModel,
    PolicyText) through load_contract. The same contract also has three RepoPath fields (model_policy.py:73,79,91).
    Their refusal text quotes the offending path (domain/paths.py:32-47,62; common.py `_repository_path`
    re-raises `str(error)`), and load_contract passes that text on (loading.py:22-27). The docstring wording
    (model_policy.py:7) is broader than what the code and the AC-4 tests cover; the path fields are tested
    for refusal only (test_model_policy_contract.py:468-478). Related: Contract does not set hide_input_in_errors
    (common.py:74) although sibling contracts do (resources.py:49, integrations.py:28), and `from exc`
    at loading.py:27 keeps the ValidationError, with its input, as __cause__. The reviewer did not examine
    whether any top-level handler prints tracebacks.'
  suggested_action: Limit the docstring claim to the model strings, or mask the three path fields. Make
    every later caller of ModelPolicy use load_contract, never a bare ValidationError.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: correctness
  evidence: []
  claim: The comment at model_policy.py:36 says the domain Version reads ASCII digits only. In Python,
    `\d` on a str pattern also matches non-ASCII decimal digits (domain/versions.py:11), so the claim
    is probably wrong; the reviewer read it from the source and did not run it. `header.workflow_version`
    has no pattern (artifact_header.py:49), so a spelling with an Arabic-Indic zero in a later position
    would parse as a larger number in the new plan check (plan.py:92). The leading digit of each part
    must still be ASCII, so the reviewer found no way to make a version read lower than it looks. The
    gate compares the string (gate_status.py:196) and would report ORQ-W390, so no bypass was found. The
    risk is a non-canonical spelling that one comparison accepts and another refuses.
  suggested_action: Correct the comment. Consider requiring an ASCII-only workflow_version before the
    plan-level parse, in a later change, since domain/versions.py is outside this phase's file list.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: Whether a plan needs the code reviewer depends on header.workflow_version, which the plan's author
    writes (plan.py:24,90-101). A plan that declares an older version keeps the three-role set. The gate
    treats a version mismatch as a warning (ORQ-W390), not an error (gate_status.py:182-183). This is
    the accepted design of EC-4, and P-1 changes contracts only. The reviewer found no other check of
    the declared version in the plan (the plan's later phases). The person who approves the plan is the
    control.
  suggested_action: Confirm that the approval of each plan, or a later phase, checks the declared workflow_version
    against the installed one. Otherwise record it as an accepted residual risk.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: tests
  rule_ref: ORQLET-TEST-001
  evidence: []
  claim: 'AC-9 is the "no dependency change, no file outside the file list" check. context/test-record.yaml:31
    reports it as pass, but the record holds no command row for gate-status-phase (lines 13-21 list seven
    ids; evidence_kind is claimed). By the baseline, a check that did not run is reported as not run.
    The reviewer checked the substance from diff.patch: pyproject.toml and uv.lock are not in the diff,
    and the 18 non-record paths match the plan''s 18 file operations. The diff also adds two phase records,
    tests/P-1.yaml and knowledge/P-1.yaml.'
  suggested_action: Add the missing command row, or mark AC-9 not run for that check.
  confidence: high
