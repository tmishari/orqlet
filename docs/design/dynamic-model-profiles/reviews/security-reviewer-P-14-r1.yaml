capability_limits:
  - "The packet of this round was prepared by the orqlet 0.3.0 on the path, not by the command line built from this working tree, so the review_input block and the packet differ from what `uv run orqlet review prepare` prints. Round 3 supersedes this round on a packet from the working tree."
  - "The reviewer found no blocking finding and returned a pass in its own words. The verdict of this record is NOT_RUN because the change class is D3, which requires independence I2, and this review is I1; ORQLET-MODEL-002 says that a class below the role's minimum is NOT_RUN, never a pass. The Coder corrected the verdict from PASS to NOT_RUN after the architecture reviewer raised this in round 2."
  - "The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2."
  - "The reviewer was started as a typed subagent in a new context; its prompt held the packet path and nothing else. The model that ran it is not observed, so model_observed stays empty."
  - "The reviewer's session was read-only (Ask mode) and had no shell: it ran no orqlet, test or hash command and computed no quote digest, and it did not write a review-result file; the Coder wrote this record from its returned text. Every test count and check result in the test record is a claim of the Coder that the reviewer did not repeat, so its findings are observations with no quote evidence."
  - "The packet has no .git directory, so the reviewer could not confirm that the 37 files of the upgrade were already in the base; the diff is consistent with that."
  - "Read-only is declared by the agent definition, not enforced by Orqlet."
