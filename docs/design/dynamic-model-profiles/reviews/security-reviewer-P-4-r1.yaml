capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer's session had no shell, so it ran no command and computed no quote digest; every behaviour it states comes
  from reading the code. The quote digests were added by the person running the review with `orqlet evidence cite` at
  revision dcaa6deff4c68c26d3223ad1e919777f350d06db, on committed files whose staged content is the same. The phase's
  modules, tests and records are staged and not committed, so they cannot be cited by revision; their lines stay in the
  claim text, and F-3 to F-5, which rest on them alone, are observations. The absence record of F-1 searched the staged
  snapshot, and names the base revision.
- 'Read-only is declared by the agent definition (readonly: true), not enforced by Orqlet.'
- The model that ran the reviewer is not observed.
- The packet held the earlier review records, 22 of them under snapshot/docs/design/**/reviews/ and the P-1 to P-3
  records in diff.patch, which ADR-007 decision 8 says a packet must not carry. The reviewer says it never opened one.
- 'Not examined by the reviewer: the code of P-1 to P-3 in depth (it read model_identity.py, model_policy_scan.py and the
  contract only for what P-4 relies on), the P-2 reader beyond the size cap, src/orqlet/workflow/** and the schema changes,
  input limits on override and fallback strings (nothing calls `resolve` yet), the tester''s claimed command results, and the
  earlier review records.'
