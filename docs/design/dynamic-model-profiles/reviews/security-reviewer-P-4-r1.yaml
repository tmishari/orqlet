- schema: orqlet.finding/v1
  id: F-1
  kind: finding
  severity: non-blocking
  category: security
  evidence:
  - {kind: quote, path: src/orqlet/application/contracts/common.py, lines: 36-38, revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: 84db59aa2aa471dbea7b10fc1b075b30154032c9fef1e8f55f689adbb33762c8}
  - {kind: quote, path: docs/design/dynamic-model-profiles/design/adr-005-fable-exclusion-by-model-identity.md, lines: "15", revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: a2a799a070206f933df4c3da3d49e42a530a049430d8a6bf059fc7c2eeda56b6}
  - {kind: absence, searched: [tests/unit/domain/test_model_resolution.py, tests/unit/application/test_model_selection.py, tests/unit/domain/test_model_identity.py, src/orqlet/application/usecases/model_selection.py], method: 'searched for a family compared after normalisation, a family spelling variant in a fixture, and a policy check on family spelling; found none', revision: dcaa6deff4c68c26d3223ad1e919777f350d06db}
  claim: 'Reviewer diversity compares two families with `model.family == self._coder.family` (model_resolution.py:510-516,
    staged), an exact string comparison. `family` is a ModelRef, which allows upper and lower case and the characters
    `. _ : / @ + -` (common.py:36-38), and `policy_problems` does not flag two entries whose families differ only in spelling,
    for example `Anthropic` and `anthropic`. A same-vendor candidate can then count as a different family. This is the safe
    direction for exclusion but the unsafe direction for independence. ADR-005 decision 1 says the one matching rule is used
    for "an identity, a family, the same-model test", and the P-4 reading "compared by catalog id and family, not through the
    name rule" appears only in the module docstring and the knowledge record.'
  suggested_action: 'Compare the normalised forms of the two families, or add an ORQ-E545 problem in `policy_problems` for two
    entries whose families normalise equal but are written differently. Add a fixture for the spelling variant. Ask the
    design owner which of the two the design means.'
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: finding
  severity: non-blocking
  category: failure-handling
  rule_ref: ORQLET-SEC-002
  evidence:
  - {kind: quote, path: src/orqlet/domain/model_identity.py, lines: 121-133, revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: caf78d8ff1b20df304e24f19d3e531824d399c1e221723fc9df5ec61ff7f1e0c}
  - {kind: quote, path: src/orqlet/domain/model_identity.py, lines: 215-221, revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: c8dfabe62d3117fa05fb76b9383894daae481b814e87675c60900099d5dd3cd1}
  - {kind: quote, path: src/orqlet/application/contracts/model_policy.py, lines: 194-195, revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: c789b908069617e95d44f0805957ba1d67af4dacdae212247c4642814ed3488d}
  - {kind: quote, path: src/orqlet/application/usecases/model_policy_source.py, lines: "46", revision: dcaa6deff4c68c26d3223ad1e919777f350d06db, quote_sha256: 353b837ed6e06d72179317b8abe8f9a1b52d90e518d464fe458c174534265a5e}
  claim: '`_name_problems` (model_selection.py:220-224, staged) yields one PolicyProblem for each conflicting pair that
    `name_conflicts` returns. When N entries claim one name, that is N(N-1)/2 problems, and the same `models[k]` path
    repeats. `models` and `excluded` have no length cap in the contract (model_policy.py:194-195). The only bound is the
    256 KiB file size (model_policy_source.py:46). `is_excluded` also recomputes the normalised aliases and the tags for
    every rule on every call (model_identity.py:215-221), and `policy_problems` calls it for every model, route and name
    string. The policy file is untrusted repository input (ORQLET-SEC-002), so a crafted file within the size cap could cost
    much time or memory when `validate model-policy` runs on a pull request. The reviewer did not measure this; it is from
    reading the code. P-4 adds no bounded-time test, unlike the scan module, which has one.'
  suggested_action: 'Report each later entry once (a set of indexes). Normalise the exclusion rules once per policy instead of
    once per call, or cap the list lengths in the contract. Add a bounded-time test on a worst-case 256 KiB policy.'
  confidence: low
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: 'The packet carries earlier reviewers'' conclusions (22 earlier review records under snapshot/docs/design/**/reviews/, and
    the P-1 to P-3 review records in diff.patch), which is what ADR-007 decision 8 says a packet must not do. The reviewer did
    not open any of those files, so no conclusion in this record depends on them. The packet builder that made this packet
    predates the exclusion.'
  suggested_action: Rebuild the packet without them if a clean review is needed.
  confidence: high
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: 'The tester''s record shows gate-status-phase failing with ORQ-E451 (no security entry) on src/orqlet/domain/**,
    which now includes model_resolution.py (test record, staged, line 20). EC-7 is the only security entry and is
    verification manual, so the gate never counts a security path as covered. The record says the person chose to continue
    with this check open. This review does not close that gate.'
  suggested_action: Amend the design and plan before the pull request, as the test record already says.
  confidence: high
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: correctness
  evidence: []
  claim: 'Two things the later phases must account for. (a) The resolver keeps the first entry for a duplicate id
    (model_resolution.py:262-264, staged), while `policy_problems` treats an id as excluded when any entry with it is
    excluded (model_selection.py:154-166, staged). Every Choice.name comes from the entry that the resolver itself checked,
    so the reviewer found no way for an excluded route name to be emitted; the resolver is still safe only for policies that
    passed `policy_problems`. (b) A candidate id that is absent from the catalog is rejected as not-approved
    (model_resolution.py:446-452, staged), even if it matches an exclusion. It is refused either way, and `policy_problems`
    reports ORQ-E543 and ORQ-E545 for the reference.'
  suggested_action: 'In P-5 and later, make `upgrade`, `validate model-policy` and `models resolve` refuse any policy that has a
    `policy_problems` entry before they call `resolve`.'
  confidence: medium
