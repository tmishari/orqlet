findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: architecture
  claim: 'The staged design manifest decides which changed files the reviewer cannot see, and the carve-out is partial. review_prepare.py:124-125
    takes every reviews[].note minus (plan, manifest, standards files). design_set.py:126-128 types a note as any RepoPath. So a note naming a
    changed src or tests file, or the phase''s own tests/<phase>.yaml, knowledge/<phase>.yaml or as-is.md, drops it from snapshot/, diff.patch
    and the context copies, with no entry in omitted or MANIFEST.json. test_review_prepare.py:657 asserts this for as-is.md. The review_input
    digest is computed from the change set, not from the packet, so a record can bind files the reviewer never saw. The carve-out''s own reason
    (review_prepare.py:116-122: the reviewer must read the change against these files) also applies to the test record and the knowledge-impact
    record, which the reviewer is told to check. It also stops a reviewer verifying that the change stays inside its file list.'
  suggested_action: 'Person decides before the packet is relied on as a gate. Options: honour a note only if it is under docs/design/<task>/ (the
    reviews pattern already covers the usual case); or read the notes from the base manifest instead of the staged one; or add the test record,
    knowledge record and AS-IS file to the carried set. The coder already put this to the person (knowledge-impact.yaml, last sentence of the
    reason). I found no answer in the packet.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: docs
  claim: The code differs from the approved text, and the records do not say so consistently. AC-3, BC-45 and ADR-007 decision 8 say every path
    a note names is left out. The code ignores notes naming the manifest, plan or standards (review_prepare.py:124-133). AC-1 says each path is
    passed as :(exclude,literal)<path>. The adapter drops any path that is a directory in either tree (vcs_git.py:264-278). The test record admits
    both differences in the pytest summary, yet acceptance_coverage marks AC-1 and AC-3 "pass". The knowledge-impact record says "no-impact /
    already-documented", but ADR-007 decision 8 and BC-45 do not contain these rules. They exist only in the module docstring and the records.
    The approved design is protected and not edited here.
  suggested_action: Have the person accept the two readings explicitly (an AC and BC amendment, or a recorded deviation), and correct the "already-documented"
    category for readings 2, 3, 5 and 6 of the knowledge record.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: correctness
  claim: For a note path that is a directory in one tree and a file in the other, the fake and the real adapter disagree, and diff.patch can show
    what the snapshot hides. _not_directories removes the entry from the command, so git keeps the file's section. is_excluded still excludes
    that path in the snapshot, in the context copies and in the fake. If a note held a conclusion, its deletion or addition section stays in diff.patch
    while snapshot/ omits it. Only the real-git case at test_review_packet_real_git.py:410 covers this. It asserts only that the files below the
    directory stay, not the file's own section, and it is not in the shared contract scenario that AC-2 requires. Exotic, but it is the leak AC-4
    exists to prevent.
  suggested_action: Pin the file-to-directory and directory-to-file cases in the shared contract scenario, assert the section of the file itself,
    and either accept the leak knowingly or make review_prepare skip a note that _not_directories would drop.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: non-blocking
  category: compatibility
  claim: The port promises "matches as fnmatch does" (ports/vcs.py:59-65, docstring in diff_patch), but the real adapter delegates to git's wildmatch.
    By my reading (not run here), they differ for "[^x]" (git negates, Python does not) and for a backslash (escape in git, literal in Python).
    The contract tests cover only *, ? and [a-c]. No current caller is affected, because review prepare passes one constant pattern.
  suggested_action: Narrow the port contract and make check_exclusions refuse a backslash and "[^", or add contract cases for them.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-5
  kind: observation
  severity: info
  category: docs
  claim: Two accuracy points in the claimed records. The import-linter summary says the port module "imports only the standard library and domain.paths",
    but ports/vcs.py also imports orqlet.domain.errors (lines 12-13; the OrqletError import was already there). The knowledge record reports that
    the proposal text at docs/design/orqlet-architecture-proposal.md lines 1352-1360 is now stale. That file is not in the packet snapshot, so
    I could not check the claim. The README line 354 and review skill line 26 I did read are incomplete but not false.
  suggested_action: Correct the import-linter wording. Name the owning phase for the proposal paragraph (the open question in the knowledge record).
  confidence: high
