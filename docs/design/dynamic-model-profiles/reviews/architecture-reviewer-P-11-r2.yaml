capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-arch-reviewer); its prompt held the packet path and nothing else. The model that ran it
  is not observed.
- 'The reviewer''s session had no shell: it ran no command and computed no quote digest, so every test count, the ten mutants and the other checks
  of the test record are claims of the Coder that it did not repeat.'
- 'The packet held no file under a reviews folder, although the index held the two records of round 1. The Coder scanned the packet (1004 files)
  by path and by the claim text of 140 records, the two staged ones included: no file and no hit. It still held statements about earlier reviews
  in prose: 19 earlier test or knowledge records and statements A-64 and A-65 of the AS-IS file, which name two record paths. ADR-007 decision
  8 does not reach those.'
- Read-only is declared by the agent definition, not enforced by Orqlet.
- The reviewer's findings carry no digest and are observations; none blocks. The reviewer's evidence names staged lines that are in no commit,
  so there is no digest to compute.
- 'Coder''s note, not part of the reviewer''s text: no blocking finding. F-1 is the decision that the security review r2 raises as blocking (its
  F-1). Rework round 2 changes the source of the notes to the design manifest at the merge base, with 4 new unit cases and 1 new real-git case
  written before the change (red: 8 failed, 149 passed on the three files; after: 157 passed). This record is stale after that change, and round
  3 follows on a new packet. F-2 is for the person (readings that are in no approved text); F-3 and F-4 are open; the import-linter wording of
  F-5 is corrected in the test record.'
