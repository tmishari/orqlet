findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: 'The round-2 normalisation of id patterns can collapse a valid pattern into the bare wildcard `*`,
    which excludes every model. `_patterns` (model_identity.py:216-223, staged) applies `_canonical` (148-152),
    which removes a provider prefix and trims separators at both ends. IdPattern allows `.`, `-`, `_`, `/` and
    `*` (model_policy.py:34-36). Traced by reading, not run: `xai/*` and `anthropic/*` lose their prefix and
    become `*`; `.*`, `-*`, `_*` and `*.` lose their separators and become `*`; `fnmatchcase(<any normalised
    string>, "*")` is true, so `claude-opus-5-5` is excluded. A second effect: `claude-fable-.*` becomes
    `claude-fable-*` and now excludes `claude-fable-5`, the case AC-3 forbids ("a pattern with
    regular-expression syntax matches only itself"); REGEX_PATTERNS (test_model_identity.py:1002-1007) holds no
    `.*` pattern, so the suite does not catch it. This fails closed. A reviewed policy edit can already exclude
    nearly everything (a one-letter family tag), so an attacker gains nothing new; the risk is that an honest
    author who writes `xai/*` meaning "this vendor only" blocks every model.'
  suggested_action: 'Ask the person. One option: in `_patterns`, drop a normalised pattern that holds nothing
    but `*` and `?`, the same way an empty one is dropped; the raw-form match still catches `xai/grok-...`. Add
    `.*`, `-*`, `xai/*`, `anthropic/*` and `claude-fable-.*` as cases that must not exclude `claude-opus-5-5` or
    `claude-fable-5`. If the person accepts the wider reading as fail-safe, record it in ADR-005 and in the
    guidance for policy authors, and change the wording of AC-3.'
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  evidence: []
  claim: Continues F-3 of round 1. tests/P-3.yaml:20 (staged) still records gate-status-phase FAIL with ORQ-E451
    on model_identity.py, so AC-6 fails. The design manifest still lists `src/orqlet/domain/**` as a security
    glob (design-manifest.yaml:41-44), and EC-7 (94-100) is still the only security expected change; it is
    checked by hand, so no automated check covers this path. The person chose to continue with the check open.
  suggested_action: Amend the design and the plan so that a security expected change covers domain/model_identity.py
    and domain/model_policy_scan.py before the phase is called done.
  confidence: high
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: Continues F-2 of round 1, unchanged. `name_conflicts` (121-132) reads only route `name` and `also_known_as`
    through `_claimed`, while `_match_index` (201-208) also matches `resolves_to` through `_names`. A `resolves_to`
    that collides across entries therefore makes the string unknown, and no error reports it. The effect is
    conservative, but it hides why an identity is unknown.
  suggested_action: Keep the round-1 question open for the person. In later phases, report an ambiguous match
    as ambiguous rather than as plain `unmatched`.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: security
  evidence: []
  claim: Continues F-4 of round 1, unchanged. `_folded` (140-141) uses NFKC and case folding, and the separator set
    `[-_. ]` (33) leaves out tab, Unicode dashes and zero-width characters, so `fa\u200bble` or `fa\tble` does not
    match the tag `fable`. The contract types allow ASCII only, but ADR-005 runs the exclusion on a raw string that
    has failed its type.
  suggested_action: In the later phases, refuse a string that fails its type whatever the exclusion returns, and
    keep one test for that.
  confidence: medium
