  - kind: quote
    path: docs/design/dynamic-model-profiles/design/adr-005-fable-exclusion-by-model-identity.md
    lines: '20'
    revision: 1c83b5693052cfa6da31eea551acd0e51027a210
    quote_sha256: 528c2f2d79517be88545161ac5bbd40df8f348fd93b25a01f436f86ab6c4c8c4
  - kind: quote
    path: src/orqlet/application/usecases/model_policy_source.py
    lines: 117-121
    revision: 1c83b5693052cfa6da31eea551acd0e51027a210
    quote_sha256: 9ea090299aaa65d79ac7c285d3b21c5ea47747d65bd0db7d7b106f181c613220
  claim: BC-39 and F-16 say a policy that is recorded as seeded in the lock makes `validate review` error on every record that names a model,
    and ADR-005 decision 2 says such a file is treated as unloadable. review_identity.py judges two trees only. A policy missing from both trees
    is PolicyAbsent in both, so never_present is true. The result is the information ORQ-I460 and the legacy rules, with no error. A policy deleted
    in an earlier merged change, with its seeded row still in the lock, makes the Fable exclusion stop applying to later changes, and nothing
    fails. `validate model-policy` does have the lock leg (validate_model_policy.py _deleted), so the two commands now disagree on what a deleted
    policy is. The Coder's reading (9) in the knowledge record names this and leaves it as a question for the person; no test covers it.
  suggested_action: 'A person decides, then one of two changes. Either add the lock leg to `validate review`: read .orqlet/generated.lock.yaml
    and treat a seeded policy row with no policy file in either tree as refused (ORQ-E461), with a test. The reader''s docstring says a tree has
    no lock, so this probably needs model_policy_source.py added to the phase''s file list. Or amend BC-39, F-16 and ADR-005 to say `validate
    review` judges two trees only; the second option leaves a fail-open hole in the Fable path.'
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: compatibility
  claim: 'Approval is approved_at_base or _approves(staged, record) (validate_records.py 326-332 and 351). A binding that the staged tree removes
    or narrows still approves the record, with no warning. If the staged file is missing, the old FAIL (ORQ-E415) becomes NOT_RUN, because read_contract_at
    only skips and the base approves. Before this change the staged tree decided. ADR-007 decision 1 is silent on this case. The Coder disclosed
    it as reading (7), and it is untested: the binding tests cover a binding in the staged tree only and a binding in neither tree.'
  suggested_action: Record the decision in the design or ledger. Add a test for a binding removed in the staged tree, and either a closed warning
    or an explicit statement that a revocation takes effect from the next change.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: architecture
  rule_ref: ORQLET-STYLE-001
  claim: The closed-warning set is split. Five names are produced in review_identity.py. binding-added-in-this-change is produced in validate_records._independence,
    which appends to names and re-sorts with ordered(). That function now reads two binding files, decides approval, runs the identity assessment,
    emits ORQ-E415 or W463, adds the freshness reason and raises ORQ-E412, so it has more than one reason to change. The data field independence_notes
    now holds six names, while the domain's INDEPENDENCE_NOTES holds two.
  suggested_action: 'Optional: move the binding-approval reading into review_identity.py so the whole closed set comes from one module. Otherwise
    leave as is and keep ADR-007''s list as the single reference.'
  confidence: low
- schema: orqlet.finding/v1
  id: F-4
  kind: observation
  severity: info
  category: failure-handling
  claim: read_model_policy_at maps a VcsError to PolicyInvalid (model_policy_source.py 122-127). For the base tree this is read as an unloadable
    base, so exclusions come only from the staged policy and the result is ORQ-W462. ADR-007 says an unloadable base is judged on the staged tree,
    so this is within the design. A failed read of the base is a repository fault, not a policy state, and it removes the base's exclusions silently
    except for that warning.
  suggested_action: Consider treating a base read failure as NOT_RUN in a later phase. No change is needed for P-10.
  confidence: low
