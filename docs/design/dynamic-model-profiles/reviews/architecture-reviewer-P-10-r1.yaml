capability_limits:
- The reviewer ran in the same client as the Coder (cursor), so independence is I1, not I2.
- The reviewer was started as a typed subagent (orqlet-arch-reviewer); its prompt held the packet path and nothing else. The model that ran it
  is not observed.
- 'The reviewer''s session had no usable shell (Ask mode): it ran no check and computed no quote digest. The coder cited, with `orqlet evidence
  cite` at the commit 1c83b5693052cfa6da31eea551acd0e51027a210, the four quotes of committed lines that F-1 carries: component.md 140 (BC-39)
  and 94 (F-16), ADR-005 line 20 (decision 2) and model_policy_source.py 117-121. The reviewer gave no digest, so its F-2 to F-4 are observations.
  The lines of review_identity.py and validate_records.py that the findings name are staged and not committed, so they cannot be digested and
  rest on the reviewer''s reading; the reviewer''s absence entry of F-1 is left out for the same reason, because an absence record names a commit
  and these files are in none.'
- The packet held earlier review records (snapshot/docs/design/dynamic-model-profiles/reviews/). ADR-007 decision 8 says a packet must not carry
  earlier conclusions. The reviewer says it did not open them.
- Read-only is declared by the agent definition, not enforced by Orqlet.
- 'Coder''s note, not part of the reviewer''s text: the reviewer''s F-1 blocks. It is the lock leg of the deletion rule of ADR-005 decision 2,
  which the coder had named as reading (9) of the knowledge record and left as a question. Rework round 1 fixes it inside review_identity.py,
  with tests, and a round 2 follows on a new packet; this record is stale after that change. F-2 to F-4 do not block and are reported to the person.'
