- id: P-9
  objective: >-
    Teach the code that knows the two reviewer roles about the third, before the review skill changes: the record-path pattern, the two
    hard-coded reviewer maps (with a test that they agree), the seeded binding, the minimum independence by role, and the derivation of
    independence from freshness and observed identity. The derivation stays a pure function of recorded values.
  depends_on:
  - P-8
  implements: [EC-3, EC-5, EC-8]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The record-path pattern of `domain/evidence_artifacts.py` admits `code-reviewer`, so `docs/design/<task>/reviews/code-reviewer-P-<n>-r<k>.yaml`
      is recognised as a review record, is left out of `code_tests` and `knowledge` like the records of the other two roles, and does not
      raise ORQ-E400; a path with any other role name stays an ordinary input with ORQ-E400, and a path of the right shape whose content
      names another role is not excluded.
    source: BC-36; ADR-006 decision 6
    check_ref: pytest
  - id: AC-2
    text: >-
      `REVIEW_AGENTS` and `DEFAULT_REVIEWERS` each hold the three reviewers (`architecture-reviewer` and `orqlet-arch-reviewer`,
      `security-reviewer` and `orqlet-security-reviewer`, `code-reviewer` and `orqlet-code-reviewer`), and a unit test asserts that the two
      maps hold the same roles and the same agent names. The seeded `role-bindings.yaml` of `init` holds a third binding for
      `orqlet-code-reviewer` for `claude-code`, `codex` and `cursor`, with the same capability block as the other two and
      `independence_capability: I2`.
    source: BC-41; EC-5; ADR-006 decision 6
    check_ref: pytest
  - id: AC-3
    text: >-
      `derive_independence` gives I0 for an unapproved binding, for a context recorded as not fresh, and, for a role that requires
      freshness (the code reviewer), for a context that is not recorded as fresh. Otherwise it gives I2 for a different client or for two
      different families that are both known from observed identities, and I1 for the rest. One client with two observed different families
      is I2; the same client with the same observed family is I1; a requested-only model, or `identity_source` unknown, is an unknown
      identity and never shows a family difference. A missing `identity_source` means unknown.
    source: BC-16; BC-17; BC-19; R-7; R-8; ADR-007 decisions 2, 4 and 5
    check_ref: pytest
  - id: AC-4
    text: >-
      `independence_notes` returns, in a fixed order and from the closed set, `identity-unknown` when a different client rests on an
      unknown identity on either side, and `same-model-different-client` when two observed identities are the same model on different
      clients. Recording an identity is never worse than omitting it: for every combination, the class with an observed identity is at
      least the class without it.
    source: BC-17; ADR-007 decision 5
    check_ref: pytest
  - id: AC-5
    text: >-
      `minimum_independence(change_class, role)` is I2 at every class for `code-reviewer` and unchanged for the other roles (I2 at D3,
      I1 below); `satisfies` takes the role; a call that gives no role behaves as before. A table-driven test over every combination of
      approval, equal or different client and unknown, equal or different family gives, for the architecture and security roles with no
      freshness recorded, the same class as the function of the base revision.
    source: BC-20; BC-15; R-10; ADR-006 decision 4; C-7
    check_ref: pytest
  - id: AC-6
    text: >-
      `orqlet review prepare` prints the `review_input` block of each of the three reviewers whose agent file is in the tree, and
      ORQ-I441 for one that is not; the guard on the source text of `REVIEW_AGENTS` in `test_render_integrations.py` follows the new
      definition. No file outside this phase's operations changes, and `orqlet gate status dynamic-model-profiles --phase P-9 --head
      staged` reports no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: BC-15; BC-41; plan rule on phase file lists
    check_ref: gate-status-phase
