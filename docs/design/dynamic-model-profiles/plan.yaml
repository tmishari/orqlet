- id: P-3
  objective: >-
    Write the one matching rule of ADR-005 as pure domain functions: the normalisation, the identity and family tests, the broader and
    fail-safe exclusion test, and the check for two entries that claim the same name. Every later phase that compares two model strings
    (the resolver, the validators, the review records) calls these functions and nothing else.
  depends_on:
