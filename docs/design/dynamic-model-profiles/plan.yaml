  implements: [EC-1]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `normalise` applies NFKC, case folding and trimming, treats `-`, `_`, `.` and the space as one separator, removes a provider prefix
      of the closed table (`anthropic/`, `openai/`, `google/`, `xai/`) and removes any bracketed option list. The table is a data table of
      the domain module. A suffix such as `-xhigh` is not stripped.
    source: ADR-005 decision 1; BC-18
    check_ref: pytest
  - id: AC-2
    text: >-
      Two strings are the same identity when their normalised forms are equal or one is the `resolves_to` or an `also_known_as` of a route
      of the other; effort, speed, context size, a bracketed option list and a provider prefix are never a difference. A string that
      matches no catalog entry is unknown: it is neither equal to nor different from anything, including another unknown string with the
      same text.
    source: BC-18; BC-19; R-7; ADR-007 decision 3
    check_ref: pytest
  - id: AC-3
    text: >-
      The exclusion test runs on the raw NFKC and case-folded string, brackets included, and on the normalised form. It matches by exact
      alias after normalisation, by `fnmatch` pattern (a pattern with regular-expression syntax matches only itself), and by a family tag
      that occurs in the string once separators are removed. The nine variants of BC-9 for Fable (`FABLE`, ` Fable-5.1 `,
      `anthropic/claude-fable-5-1`, `Claude Fable 5.1`, `claude_fable_5_1`, `claude-fable-5-1[effort=high]`, `Fable5`, `fable-5.1-xhigh`,
      `x[model=fable]`) and the four of `best` (`BEST`, ` best `, `best[1m]`, `anthropic/best`) all match; a full-width spelling matches;
      `claude-opus-5-5`, `gpt-6.1-sol`, `sonnet` and `bestow` do not.
    source: BC-9; ADR-005 decision 1; R-12
    check_ref: pytest
  - id: AC-4
    text: >-
      `family_of` returns the family of the catalog entry that a string matches, and can be told to use only entries whose approval
      state is not `proposed`, so that seed text no team approved never creates a family difference. `name_conflicts` returns every pair
      of entries that claim the same normalised route `name` or `also_known_as`. Both take plain values, not contract objects.
    source: BC-10; BC-9; ADR-007 decision 1; ADR-005 decision 1
    check_ref: pytest
  - id: AC-5
    text: >-
      `cursor_plain_id` is true only for a name that starts with a letter, holds only letters, digits and `. _ / + -`, and is not one of
      the YAML words `true`, `false`, `null`, `yes`, `no`, `on`, `off`, `y`, `n`; it is the one test that decides whether a Cursor `model`
      value may be written unquoted. The functions read no clock, locale or environment, and give the same result on every call.
    source: BC-34; ADR-003 decision 3; BC-23
    check_ref: pytest
  - id: AC-6
    text: >-
      The module imports nothing outside the standard library and the domain, `uv run lint-imports` passes, and no file outside this
      phase's operations changes; `orqlet gate status dynamic-model-profiles --phase P-3 --head staged` reports no ORQ-E450, ORQ-E451 or
      ORQ-E453.
    source: ORQLET-ARCH-002; plan rule on phase file lists
    check_ref: import-linter
