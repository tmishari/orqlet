- id: P-14
  objective: >-
    Regenerate this repository's installed files with `orqlet upgrade`, after the package, the tests, the documents and the rules are
    final. The person runs it with the command line built from this working tree, not with the older `orqlet` on the path, whose package
    still holds workflow 0.4.0. The list below is the planning list from the file-level facts of the code; the dry-run at this phase
    decides, and a different list needs a plan amendment.
  depends_on:
  - P-13
  implements: [EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `uv run orqlet upgrade --dry-run` previews exactly the files of this phase (workflow 0.4.0 to 0.5.0); the person reads the preview
      and approves it; `uv run orqlet upgrade --yes` writes the files, journalled, and none is written by hand. A path outside the list
      stops the phase for a plan amendment.
    source: AGENTS.md "Generated files"; ADR-003 consequences; EC-9
    check_ref: orqlet-upgrade-dry-run
  - id: AC-2
    text: >-
      After the upgrade, `uv run orqlet upgrade --check` reports nothing to upgrade, and `uv run orqlet doctor` reports no ORQ-E150 or
      ORQ-W152 for any installed file.
    source: BC-14; A-21
    check_ref: orqlet-upgrade-check
  - id: AC-3
    text: >-
      `.orqlet/model-policy.yaml` is created from the seed with the owner `seeded` in the lock; `uv run orqlet validate model-policy`
      passes on it; `uv run orqlet models resolve --client claude-code --role orqlet-code-reviewer --different-family-from
      claude-opus-5-5` exits 1, because no entry is approved, and without the flag it exits 0 with "the client chooses". No pin appears
      in any agent file.
    source: BC-11; BC-38; C-4; R-9
    check_ref: orqlet-models-resolve
  - id: AC-4
    text: >-
      The new role files exist for the three clients with their lock rows (owner `orqlet`, class `protected`); the rule files of the two
      new rules exist for Claude Code and Cursor; `.orqlet/versions.yaml` and `.orqlet/role-bindings.yaml` are unchanged, and the two
      proposal files `.orqlet/proposals/.orqlet__versions.yaml.diff` and `.orqlet/proposals/.orqlet__role-bindings.yaml.diff` hold the
      pending changes. No proposal is applied.
    source: BC-14; BC-37; BC-12; A-21
    check_ref: review:upgrade-outputs
  - id: AC-5
    text: >-
      The phase report says that applying the role-bindings proposal is a reviewed edit by the team, that it changes which reviewers are
      approved and so reviewer independence, and that until it is applied a `code-reviewer` record is ORQ-E415.
    source: BC-37; F-13; ADR-006 consequences
    check_ref: review:role-bindings-note
  - id: AC-6
    text: >-
      `uv run orqlet gate status dynamic-model-profiles` reports this task's artifacts as stale on `workflow_version`,
      `protected_set_digest` and `applicable_rules_hash` (ORQ-W390); the phase report records it, no artifact is edited to hide it, and
      the person decides what follows.
    source: ADR-003 consequences; C-8
    check_ref: orqlet-gate-status
  - id: AC-7
    text: The refusal of `--update-golden` in CI (tests/conftest.py:34-39) is unchanged.
    source: ORQLET-DET-001
    check_ref: review:conftest
  - id: AC-8
    text: >-
      Every job of the CI workflow passes on the implementation pull request at a head that holds this phase: ruff check, ruff format
      --check, mypy, lint-imports, the schema and manifest checks, pytest on Ubuntu, macOS and Windows with Python 3.12 to 3.15, and the
      build job that builds the wheel twice and compares the digests.
    source: BC-25; ORQLET-QA-001
    check_ref: ci
  - id: AC-9
    text: >-
      No file outside this phase's operations changes, and `orqlet gate status dynamic-model-profiles --phase P-14 --head staged` reports
      no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: plan rule on phase file lists
    check_ref: gate-status-phase
  checks:
  - orqlet-upgrade-dry-run
  - orqlet-upgrade-check
  - orqlet-models-resolve
  - orqlet-gate-status
  - gate-status-phase
  - pytest
  - ci
