- id: P-7
  objective: >-
    Add the read-only command `orqlet validate model-policy` with every check of the design brief: the contract, the references, the
    exclusion (also against the base tree), the approval fields, the credential scan, the staleness warnings, the deletion rule and
    the drift check of the model values in the agent and skill files. The command reads files and git trees and starts no process of
    its own.
  depends_on:
  - P-6
  implements: [EC-6, EC-8]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `orqlet validate model-policy [PATH]` (default `.orqlet/model-policy.yaml`) exits 0 on PASS and 5 on FAIL and on NOT_RUN, as every
      `validate` command does. A policy that was never present (no file, no seeded row in the lock, not in the base tree) is NOT_RUN
      with the reason "no model policy, nothing was checked". A policy that is missing from the working tree but present at the base
      tree, or recorded as seeded in the lock, is FAIL with ORQ-E547. `--json` prints the common result envelope.
    source: BC-33; BC-39; F-15; F-16
    check_ref: pytest
  - id: AC-2
    text: >-
      FAIL findings: ORQ-E540, ORQ-E541 and ORQ-E542 from the loader; ORQ-E543 for every model, route, candidate, fallback or assignment
      that matches an exclusion in any state; ORQ-E544 for an `excluded` entry that the base tree holds and the file lacks (the base is the
      optional `--base` and otherwise the merge base that `validate review` uses); ORQ-E545 for the reference and name problems of
      `policy_problems`, where the known role and skill names are those of the packaged workflow; ORQ-E546 for an `approved` entry
      without `approved_by` or without an `approval_ref` of the allowed forms (`pr:<number>`, `commit:<full hex id>` or `adr:<repository
      path>`).
    source: BC-9; BC-13; BC-32; R-11; ADR-004 decision 1; ADR-005 decision 2
    check_ref: pytest
  - id: AC-3
    text: >-
      Warnings, which do not change PASS: ORQ-W540 (`missing-candidate`) for a `manual` profile or assignment with no eligible candidate
      and for an `automatic-with-fallbacks` one with no eligible fallback; ORQ-W541 when `reviewed_for_release` is older than the workflow
      version that the installed package states (a `Version` comparison, no clock); ORQ-W542 when a route's `retires_on` is past or
      within 30 days of today, read through the Clock port, where selection itself never reads the date.
    source: BC-13; F-8; F-9; ADR-004 decision 5
    check_ref: pytest
  - id: AC-4
    text: >-
      The drift check reads the `model` value of every `.claude/agents/*.md`, `.cursor/agents/*.md`, `.codex/agents/*.toml`,
      `.claude/skills/*/SKILL.md` and `.agents/skills/*/SKILL.md` file, generated or team-authored. A value that matches an exclusion is
      ORQ-E548 in any file. A value that differs from the resolution is ORQ-W543 in a file that the lock records as generated, and
      nothing in a team-authored file. A value that fails `ModelRef` (a bracketed Cursor ID, non-ASCII text) is tested for the exclusion
      on its raw NFKC string first and then reported as `unmatched`, never skipped. A team-authored file that cannot be parsed or is
      above 256 KiB is ORQ-W544 and is not scanned further.
    source: BC-30; BC-9; R-12; ADR-003 decision 8; F-14
    check_ref: pytest
  - id: AC-5
    text: >-
      A finding prints the catalog id that a string matched, or `unmatched` with the string's length, never the string; for every finding
      of this command, a unique marker placed in each model field of the policy and of the agent files never appears in the text or the
      data of the result.
    source: BC-32; BC-19; ADR-002 decision 3
    check_ref: pytest
  - id: AC-6
    text: >-
      `IMPLEMENTED_COMMANDS` lists `validate model-policy`. The command is built from a services object that adds the Clock port to the
      ports of the other validators; the unit tests use the fake clock, the fake VCS and the memory file system and open no socket.
    source: BC-41; BC-23; ORQLET-TEST-001
    check_ref: pytest
  - id: AC-7
    text: >-
      `pyproject.toml` and `uv.lock` are unchanged, `uv run lint-imports` passes, no file outside this phase's operations changes, and
      `orqlet gate status dynamic-model-profiles --phase P-7 --head staged` reports no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: BC-25; plan rule on phase file lists
    check_ref: gate-status-phase
