phases:
- id: P-1
  objective: >-
    Replace the model-policy v1 contract by v2 and make the contract changes of EC-1 to EC-5, as contracts only: the constrained model
    strings, the `code-reviewer` role, the closed client set, the optional identity and freshness fields of a record, and the plan-level
    rule on `review_evidence` by workflow version. The JSON schemas are regenerated and the manifest follows them. No use case reads
    these contracts yet, so no behaviour changes for any project.
  depends_on: []
  implements: [EC-1, EC-2, EC-3, EC-4, EC-5]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `ModelPolicy` has the schema id `orqlet.model-policy/v2` and exactly the top-level keys `schema`, `policy_version` (an integer from 1),
      `reviewed_for_release` (a `major.minor.patch` string), `models`, `excluded`, `profiles` and `assignments`; an unknown key at any level
      is refused. A model has `id` and `family` (both `ModelRef`), `approval` (`state`: `proposed`, `approved`, `disabled` or `retired`;
      `approved_by` and `approval_ref`, each text or null), `documented` (`evidence`, a repository path, and `date`), `callable` (`not-run`
      or `verified`), `evaluated` (`state`: `none` or `evidenced`; `evidence`: a repository path, required when evidenced), `list_price`
      (null, or `input_per_million_usd` and `output_per_million_usd` as decimal strings such as `3` or `0.25`, and `source`, a repository
      path) and `routes`. A fixture that sets every field loads and round-trips.
    source: EC-1; ADR-002 decision 3; BC-11
    check_ref: pytest
  - id: AC-2
    text: >-
      A route has `client` (`claude-code`, `codex` or `cursor`), `kind` (`id` or `alias`), `name` (`ModelRef` or null), `resolves_to`
      (`ModelRef` or null), `also_known_as` (at most 8 `ModelRef`), `access` (`unknown`, `confirmed` or `blocked`) and `retires_on` (a date
      or null). A route of kind `alias` must carry `resolves_to` and a route of kind `id` must not. An exclusion has `id`, `reason` and
      `source` (policy text), and the lists `aliases` (`ModelRef`), `id_patterns` (fnmatch-style patterns of 1 to 128 characters from
      `A-Za-z0-9._:/@+*?-`, never regular expressions) and `family_tags` (`ModelRef`), at least one of them not empty.
    source: BC-28; BC-9; ADR-005 decision 1
    check_ref: pytest
  - id: AC-3
    text: >-
      A profile has `id` (`quality`, `engineering` or `economy`, each at most once), `capability` (policy text), `mode` (`automatic`,
      `manual` or `automatic-with-fallbacks`), `candidates` and `fallbacks` (each a list of `{client, models}` objects, one per client, with
      `models` an ordered list of catalog ids) and `escalation` (a profile id or null). An assignment has `target` (`{kind: role|skill,
      name: a slug}`), `task` (a slug or null), `client` (a client id or null), exactly one of `profile` (a profile id) and `model` (a catalog
      id), `mode` and `effort` (`low`, `medium`, `high`, `xhigh`, `max` or null). No map of the contract is keyed by free text.
    source: ADR-002 decision 3; ADR-001 decision 3; C-1
    check_ref: pytest
  - id: AC-4
    text: >-
      `ModelRef` is a constrained string over `A-Za-z0-9._:/@+-` of 1 to 128 characters. `RecordedModel` is a constrained string over
      letters, digits, the space and `. _ : / @ + - [ ] = ,` of 1 to 128 characters. `PolicyText` is printable ASCII of 1 to 400 characters.
      Each is refused when it breaks its pattern or its length and is never truncated; none has a custom validator message. For each of ten
      breaking strings (a line break, a quote, a backtick, `;`, `$`, a non-ASCII letter, a bracket in a `ModelRef`, 129 characters), the text
      that `load_contract` raises does not contain the string.
    source: BC-32; C-1; ORQLET-SEC-002; ORQLET-SEC-003
    check_ref: pytest
  - id: AC-5
    text: >-
      `ReviewResult.role` admits `code-reviewer`. `agent.client` and `coder_binding.client` are exactly `claude-code`, `codex` or `cursor`.
      `model_requested` and `model_observed` are `RecordedModel` or null. `agent` and `coder_binding` gain `identity_source`
      (`client-reported`, `person-observed` or `unknown`; absent means unknown). `agent` gains `context` (`fresh`: a boolean, `input`:
      `packet-only`) and `selection_source` (`task-override`, `role-assignment`, `profile-assignment`, `automatic` or `explicit-fallback`).
      All new fields are optional in the schema, so a record without them loads as before. `Binding.role` of `RoleBindings` admits
      `code-reviewer`.
    source: EC-3; EC-5; BC-16; BC-42; ADR-007 decisions 2 and 4
    check_ref: pytest
  - id: AC-6
    text: >-
      A phase accepts `review_evidence` that is exactly the three roles of today or those three plus `code-reviewer`, each once, and refuses
      every other set. A plan whose `header.workflow_version` is 0.5.0 or higher (compared as `Version` values) must hold the four roles in
      every phase; a plan below it must hold exactly the three. A version that is not `major.minor.patch` is refused. The plan of this task
      (workflow_version 0.4.0, three roles) still loads.
    source: EC-4; BC-15; ADR-006 decision 3
    check_ref: pytest
  - id: AC-7
    text: >-
      Every `docs/design/**/reviews/*.yaml` of the repository (112 files at the base revision) loads with the new `ReviewResult`, and the
      distinct client values among them lie inside the closed set; every `docs/design/*/plan.yaml` loads with the new `ImplementationPlan`.
      A file that fails is reported by its path, so the check of ADR-007 decision 2 and of C-7 is a test and not a promise.
    source: BC-20; BC-42; C-7; ADR-007 decision 2
    check_ref: pytest
  - id: AC-8
    text: >-
      `tools/export_schemas.py` has rewritten `orqlet.model-policy.v2.json`, `orqlet.review-result.v1.json`, `orqlet.role-bindings.v1.json`
      and `orqlet.implementation-plan.v1.json`; `orqlet.model-policy.v1.json` and its fixture are deleted and `CONTRACTS` holds no v1 key; no
      other schema file changes; `MANIFEST.json` is rebuilt to follow the schema files, with `workflow_version` still 0.4.0 because the
      bump belongs to the one rebuild of P-13.
    source: EC-2; C-2; ORQLET-DET-002; ORQLET-DET-003
    check_ref: schema-check
  - id: AC-9
    text: >-
      `pyproject.toml` and `uv.lock` are in no file operation of this phase, and the existing test that holds the runtime dependencies to an
      exact list with no model SDK passes. No file outside this phase's operations changes, and `orqlet gate status dynamic-model-profiles
      --phase P-1 --head staged` reports no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: BC-25; C-6; plan rule on phase file lists
    check_ref: gate-status-phase
