- id: P-6
  objective: >-
    Wire the policy into the three callers of `compose` and into the findings of `upgrade`: refuse on an invalid, deleted or v1
    policy before any write, report `missing-candidate` and the settings a client cannot honour, list the review records that a pin
    change makes stale, report a pending role binding, and make `explain` show the selection that `upgrade` would write.
  depends_on:
  - P-5
  implements: [EC-8, EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `upgrade` returns `refused` with exit status 3 and writes nothing, in a normal run and with `--dry-run` and `--check`, when the
      policy is invalid (ORQ-E540, ORQ-E541, ORQ-E542), deleted (the file is missing and the lock records it as seeded; ORQ-E547), a v1
      file, or fails `policy_problems` (ORQ-E543, ORQ-E545). Each refusal prints the code, the fixed text and a field path, and no value
      of the file. With no policy file ever present the upgrade plan equals the plan before this phase.
    source: BC-37; F-1; F-2; F-16; C-3
    check_ref: pytest
  - id: AC-2
    text: >-
      For each profile or assignment in mode `manual` with no eligible candidate, and for an `automatic-with-fallbacks` one with no
      eligible fallback, `upgrade` prints ORQ-W540 (`missing-candidate`) naming the target and the closed reason of each rejected
      candidate; nothing is pinned and the role keeps its automatic setting.
    source: BC-4; BC-37; R-6; F-3; ADR-003 decision 6
    check_ref: pytest
  - id: AC-3
    text: >-
      The findings ORQ-W545 (alias route rendered) and ORQ-W546 (a skill assignment for Codex or Cursor, a Cursor effort, a name that
      Cursor cannot take unquoted) appear in the preview of `upgrade` and in `explain`, and each prints only a fixed text and the target.
    source: BC-43; BC-7; F-4; F-17
    check_ref: pytest
  - id: AC-4
    text: >-
      When the plan changes the bytes of an agent file that an earlier review record names (`agent.binding_ref` and `agent.client`),
      `upgrade` prints ORQ-W547 with the path of each such record (at most 20, then the count). The text says that a pin changes protected
      files and `protected_set_digest`, that approvals of designs and plans in flight then show ORQ-W390 and that the person decides.
    source: BC-37; F-12; ADR-003 decision 7; C-8
    check_ref: pytest
  - id: AC-5
    text: >-
      When the plan holds a proposal for `.orqlet/role-bindings.yaml` that adds a binding for `orqlet-code-reviewer`, `upgrade` prints
      ORQ-I540 saying that a `code-reviewer` record is ORQ-E415 until a reviewed edit applies the proposal. Orqlet never applies it.
    source: BC-37; F-13; ADR-006 consequences
    check_ref: pytest
  - id: AC-6
    text: >-
      Reverting a policy edit and running `upgrade` again restores the generated files of the earlier state byte for byte, tested with
      three upgrades (no pin, a pin, the edit reverted).
    source: BC-29; R-4; ADR-003 consequences
    check_ref: pytest
  - id: AC-7
    text: >-
      `explain` reports, in its `declared` data and its text, one entry for each role and skill that has a setting or a finding: the
      target, the client, the source, and the setting or null. For a fixture policy the entries equal what `upgrade` writes into the
      files, compared by parsing the written files. With an invalid, deleted or v1 policy `explain` prints the finding, lists no entry,
      writes nothing and does not fail.
    source: BC-43; ADR-001 decision 7
    check_ref: pytest
  - id: AC-8
    text: >-
      Every pin and every proposal reaches disk through the journalled change plan: a test with the faulty file system of tests/fakes
      shows that an interrupted upgrade with a pin resumes to the same files. `init` calls `compose` with no policy and its output is
      unchanged for a project that has none.
    source: C-5; ORQLET-SAFE-001; EC-8
    check_ref: pytest
  - id: AC-9
    text: >-
      No file outside this phase's operations changes, and `orqlet gate status dynamic-model-profiles --phase P-6 --head staged` reports
      no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: plan rule on phase file lists
    check_ref: gate-status-phase
