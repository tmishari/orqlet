- id: P-8
  objective: >-
    Add the read-only command `orqlet models resolve`, which prints the selection for a role, a skill or a profile and the hint that the
    skills offer. It is built from a services object that holds no VCS, process or clock, so that it can start no process and read no
    date, and it detects a deleted policy from the lock's seeded row.
  depends_on:
  - P-7
  implements: [EC-6]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The command is `orqlet models resolve --client C (--role R | --skill S | --profile P) [--task T] [--override MODEL]
      [--different-family-from CATALOG_ID] [--coder-profile P] [--json]`. `--client` is one of the three clients. Exactly one of `--role`,
      `--skill` and `--profile` is given. `--override` is checked as a recorded model string and `--different-family-from` as a catalog
      id. A breach of any of these exits 2 with a usage message that does not repeat the offending value.
    source: BC-33; ADR-002 decision 3; ADR-007 decision 11
    check_ref: pytest
  - id: AC-2
    text: >-
      The `data` of the JSON result has exactly these keys: `client`, `target` (`kind`, `name`), `task`, `policy` (`present` or
      `absent`), `profile`, `mode`, `source`, `selection` (null, or `model`, `name`, `kind`, `effort`), `client_chooses` (a boolean),
      `candidates` (ordered; each `model`, `name`, `kind`, `effort`, `also_known_as`), `fallbacks` (the same shape), `escalation`,
      `list_prices` (each `model`, `input_per_million_usd`, `output_per_million_usd`), `rejected` (each `model` and `reason`, a reason of
      the closed set), `hint` and `result` (`selected`, `automatic` or `none-qualifies`). Keys are sorted, so the same input gives the
      same bytes.
    source: BC-35; BC-23; R-3; ADR-001 decision 8
    check_ref: pytest
  - id: AC-3
    text: >-
      The text output has one line each for `target`, `policy`, `profile`, `source`, `selected` (the name, its kind, its effort and the
      catalog id, or "the client chooses"), `candidates`, `fallbacks`, `escalation`, `rejected` and `hint`. Exit status 0 means a
      selection or an automatic result exists, also when no policy file was ever present ("no model policy; the client chooses"); 1 means
      that no candidate qualifies, also when `--different-family-from` leaves none that can be shown different, in every mode and with no
      policy; 3 means that a policy is present but invalid, deleted or a v1 file.
    source: BC-33; BC-38; BC-4; F-15
    check_ref: pytest
  - id: AC-4
    text: >-
      The `hint` is the fixed sentence "Suggested for this work: profile <id>; the client keeps the choice and nothing here changes the
      model." for a target that has a profile, "no assignment for this target; the client chooses" for a target that a present policy
      does not assign, and "no model policy; the client chooses" when there is no policy. An assignment that names a `task` appears only
      when `--task` names that task, and never in a generated file.
    source: BC-35; BC-43; ADR-001 decisions 7 and 8
    check_ref: pytest
  - id: AC-5
    text: >-
      The use case takes a services object with the project file system, the strict loader and the workflow package, and no VCS,
      process runner or clock; a test passes fakes that fail on any other access, and the command runs in a folder that is not a git
      repository with the same output. Two runs print the same bytes. A policy that is missing while the lock records it as seeded exits
      3 without any git call.
    source: BC-23; BC-39; R-13; F-9; ORQLET-NOMODEL-001
    check_ref: pytest
  - id: AC-6
    text: >-
      An excluded model is never a candidate, a selection or a fallback and appears only in `rejected` with the reason `excluded`; an
      override that matches an exclusion or fails a constraint is `override-invalid`; the output never prints the override string, only
      catalog ids that passed `ModelRef` and fixed words.
    source: BC-9; BC-6; BC-32
    check_ref: pytest
  - id: AC-7
    text: >-
      `orqlet models` is a registered command group with the one subcommand `resolve`, `IMPLEMENTED_COMMANDS` lists `models resolve`,
      `pyproject.toml` and `uv.lock` are unchanged, `uv run lint-imports` passes, no file outside this phase's operations changes, and
      `orqlet gate status dynamic-model-profiles --phase P-8 --head staged` reports no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: BC-41; BC-25; plan rule on phase file lists
    check_ref: gate-status-phase
