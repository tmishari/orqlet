- id: P-4
  objective: >-
    Write the resolution of ADR-001 and ADR-007 as a pure domain function (precedence, constraints, modes, reviewer diversity, the
    closed rejection reasons) and the application mapping from the v2 contract to its plain inputs, with the policy integrity checks
    that `upgrade` and `validate model-policy` both need. No file is rendered and no command exists yet.
  depends_on:
  - P-3
  implements: [EC-1]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `resolve` takes plain values and no clock. In mode `manual` one fixture per level shows that a valid higher level wins (an override,
      then the assignment of the role or skill for the client, then the assignment of the profile, then the automatic result), and that
      an invalid higher level is reported in `rejected` with its reason, after which the next level is used and the source says which.
      An invalid override is never replaced without that entry.
    source: BC-5; BC-6; R-5; R-6; ADR-001 decision 4
    check_ref: pytest
  - id: AC-2
    text: >-
      In `automatic` and `automatic-with-fallbacks` the result has no selected model, says that the client chooses, and has the source
      `automatic`; it lists the ordered eligible candidates and, for fallbacks, the ordered eligible fallbacks. A fallback named by the
      caller is the source `explicit-fallback`; a named override is `task-override`; the sources are the five of ADR-001 decision 6 and no
      other.
    source: BC-27; BC-2; ADR-001 decisions 3 and 6
    check_ref: pytest
  - id: AC-3
    text: >-
      The rejection reasons are a closed set: `excluded`, `not-approved`, `disabled-or-retired`, `no-route-for-client`,
      `route-name-unknown`, `access-blocked`, `same-family-as-coder`, `same-model-as-coder`, `outside-profile` and `override-invalid`.
      One fixture per reason yields exactly that reason. A `proposed`, `disabled` or `retired` model is never selected and never listed as
      a candidate; an `excluded` model is rejected whatever its state; a route whose `name` is null is `route-name-unknown`.
    source: BC-10; BC-4; ADR-001 decision 5; ADR-004 decision 3
    check_ref: pytest
  - id: AC-4
    text: >-
      In `manual` mode the first eligible candidate of the client's own ordered list is selected. When none is eligible nothing is
      selected, each candidate has its reason in `rejected`, and the result is `none-qualifies`. The same input gives the same output on
      every call and on every day.
    source: BC-4; ADR-001 decision 3; BC-23
    check_ref: pytest
  - id: AC-5
    text: >-
      With a coder model given as a catalog id, a candidate of the same model is `same-model-as-coder` and a candidate of the same family
      is `same-family-as-coder`; a candidate from a profile below the coder's profile (default `engineering` for the role
      `orqlet-code-reviewer`) is `outside-profile`; effort, speed and context size never make a candidate different. When no candidate can
      be shown different the result is `none-qualifies` in every mode and also when the policy has no entry for the client.
    source: BC-38; R-7; ADR-006 decision 7; ADR-007 decision 11
    check_ref: pytest
  - id: AC-6
    text: >-
      An assignment that names a `task` applies only when the caller passes that task; the mapping that later phases render from ignores
      every task-scoped assignment, so a task-scoped assignment can never reach a generated file.
    source: BC-43; ADR-001 decision 7
    check_ref: pytest
  - id: AC-7
    text: >-
      `policy_problems(policy, role_names, skill_names)` returns ORQ-E543 for every model, route, candidate, fallback or assignment that
      matches an exclusion in any approval state, and ORQ-E545 for a duplicate id, an unknown model, profile, role or skill name in a
      profile, fallback, escalation or assignment, and for two entries that claim the same normalised name or `also_known_as`. Each
      problem is a code and a field path and holds no model string.
    source: BC-9; BC-13; ADR-005 decision 1; ADR-002 decision 3; BC-32
    check_ref: pytest
  - id: AC-8
    text: >-
      The domain module imports nothing outside the standard library and the domain; the application module imports no file, process or
      network module; `uv run lint-imports` passes; no file outside this phase's operations changes; `orqlet gate status
      dynamic-model-profiles --phase P-4 --head staged` reports no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: C-1; ORQLET-ARCH-001; ORQLET-ARCH-002; plan rule on phase file lists
    check_ref: import-linter
