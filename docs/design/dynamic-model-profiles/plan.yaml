- id: P-11
  objective: >-
    Keep earlier review conclusions out of a review packet: the VCS port's `diff_patch` gains a path-exclusion parameter that the git
    adapter spells as pathspecs after `--`, and `review prepare` leaves `docs/design/*/reviews/*` and every path that the design manifest
    names as a review note out of the snapshot, the context copies and `diff.patch`. The phase establishes with a real git that an
    exclude pathspec works with `diff-tree`.
  depends_on:
  - P-10
  implements: [EC-8]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The port is `diff_patch(base, head, *, exclude_patterns=(), exclude_paths=())`. The git adapter passes each pattern as
      `:(exclude)<pattern>` and each path as `:(exclude,literal)<path>`, only after `--`, to the allow-listed `diff-tree`, whose option
      check is unchanged. The fake VCS applies the same rule: a pattern matches as `fnmatch` does, with `*` crossing `/`, and a path
      matches only itself.
    source: ADR-007 decision 8; BC-45
    check_ref: pytest
  - id: AC-2
    text: >-
      An integration test builds a repository with a real git, with changed files under `docs/design/<task>/reviews/` and elsewhere in
      two commits, and shows that the patch of the adapter with the exclusion holds no header for an excluded path and holds the other
      sections byte for byte as the unfiltered patch holds them. It also shows a literal path with glob characters is excluded only as
      that path. The same scenario runs against the fake and the real adapter in `test_vcs_revisions_contract.py`, so the two agree.
    source: BC-45; BC-21; ADR-007 decision 8; U-12
    check_ref: pytest
  - id: AC-3
    text: >-
      `review prepare` leaves out of `snapshot/`, of the context copies and of `diff.patch` every path that matches
      `docs/design/*/reviews/*` and every path that `reviews[].note` of the task's design manifest names. Excluded paths appear in neither
      the `omitted` list nor `MANIFEST.json`. Each round builds the whole packet again from the staged snapshot and its diff, so two
      runs on the same tree give the same `packet_digest`.
    source: BC-21; BC-45; R-8; ADR-007 decision 8
    check_ref: pytest
  - id: AC-4
    text: >-
      A sentinel string written into a review record and into a note path named by the manifest is found in no file of the packet. The
      scan covers every file of the packet and runs twice: once against the fake, and once against the real git adapter in the
      integration test.
    source: BC-21; BC-45; ADR-007 decision 8
    check_ref: pytest
  - id: AC-5
    text: >-
      The integration test runs on the CI matrix of Linux, macOS and Windows. If a platform's git does not honour the pathspec, the phase
      stops with a plan amendment, because the fallback of ADR-007 decision 8, a filter of the patch by its file headers, needs one more
      module that this plan does not list; the amendment is not written around the plan.
    source: ADR-007 decision 8; plan rule on amendments
    check_ref: review:ci-platforms
  - id: AC-6
