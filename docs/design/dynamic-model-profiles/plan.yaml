- id: P-10
  objective: >-
    Make `orqlet validate review` read the policy from the base tree and the staged tree and apply the identity, freshness, exclusion,
    deletion and unloadable-policy rules of ADR-005 and ADR-007, with the closed warnings printed in each finding and no recorded model
    string in any output. Records that exist today keep their verdict.
  depends_on:
  - P-9
  implements: [EC-3, EC-8]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `validate review` reads `.orqlet/model-policy.yaml` from the base tree and from the staged tree with `read_model_policy_at`.
      Exclusions are the union of both trees. A family is taken only from a catalog entry that is not `proposed` at the base tree.
      `model_families` of `role-bindings.yaml` still applies to a string that the policy cannot match, and to every string when the policy
      was never present; where the policy matches a string its family wins.
    source: BC-40; BC-31; BC-10; ADR-007 decision 1; ADR-005 decision 2
    check_ref: pytest
  - id: AC-2
    text: >-
      The tree matrix holds. Both trees valid is the normal case. A staged policy that is unloadable, or deleted while the base tree has
      one, gives ORQ-E461 for every record that names a model and never falls back to `model_families`. A base policy that is absent or
      unloadable while the staged one is valid is judged on the staged tree for exclusions, with no policy family, and gives the warning
      `policy-changed-in-this-change` (ORQ-W462). A policy that was never present in either tree gives the legacy rules and the
      information ORQ-I460 "no exclusion list was available". A binding that exists only in the staged tree is the warning
      `binding-added-in-this-change` (ORQ-W463) and not ORQ-E415; a binding in neither tree is ORQ-E415 as today.
    source: BC-44; BC-39; BC-31; ADR-007 decision 1; F-16; F-18
    check_ref: pytest
  - id: AC-3
    text: >-
      A record whose `model_requested` or `model_observed`, for the agent or the coder, matches an exclusion is ORQ-E460 and its class is
      I0, so it is never counted. A record that names no model is unaffected by the exclusion check.
    source: BC-9; BC-31; R-12; F-11; ADR-005 decision 2
    check_ref: pytest
  - id: AC-4
    text: >-
      Each of these warnings starts its message with its closed name and a colon, and the data of the result lists the names in
      `independence_notes`: `model-requested-differs-from-observed` (ORQ-W464, naming catalog ids or `unmatched`), `identity-unknown`
      (ORQ-W460), `same-model-different-client` (ORQ-W461), `policy-changed-in-this-change` (ORQ-W462), `binding-added-in-this-change`
      (ORQ-W463) and `codex-read-only-not-stated` (ORQ-W465). A `codex` record whose `capability_limits` lack the phrase "read-only is not
      enforced by this client" gets ORQ-W465; one that holds it gets none.
    source: BC-19; BC-22; BC-17; R-7; ADR-007 decisions 5 and 9
    check_ref: pytest
  - id: AC-5
    text: >-
      A record of role `code-reviewer` with no `context`, or with `context.fresh` false, derives I0 and the result is NOT_RUN with the
      reason, not an error; a record below I2 is NOT_RUN with the text "independence I1 is below I2, which the code reviewer requires at
      every change class"; a record of the other two roles with `context.fresh: false` is I0 and one with no `context` is as before.
    source: BC-16; BC-15; R-8; R-10; ADR-007 decision 4; ADR-006 decision 4
    check_ref: pytest
  - id: AC-6
    text: >-
      No finding and no data field of `validate review` contains a recorded model string, a key of the policy or a text of a record: only
      catalog ids, `unmatched` with a length, closed names and fixed text. A test places a unique marker in each model field of a record
      and of the policy and finds it nowhere in the result.
    source: BC-32; BC-19; ADR-002 decision 3
    check_ref: pytest
  - id: AC-7
    text: >-
      The records that exist today keep their verdict. The acceptance tests of `tests/e2e/test_s9_acceptance.py` and
      `tests/e2e/test_full_task.py` pass without an edit, and a new table test shows, for the three shapes among the 112 records
      (cursor with cursor and null models, codex with cursor and null models, and a D3 change below I2), the same verdict and the same
      errors as before, with only the warnings of AC-4 that apply to them.
    source: BC-20; C-7; A-65
    check_ref: pytest
  - id: AC-8
    text: >-
      `pyproject.toml` and `uv.lock` are unchanged, `uv run lint-imports` passes, no file outside this phase's operations changes, and
      `orqlet gate status dynamic-model-profiles --phase P-10 --head staged` reports no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: BC-25; plan rule on phase file lists
    check_ref: gate-status-phase
