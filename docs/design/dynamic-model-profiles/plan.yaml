- id: P-5
  objective: >-
    Carry the selection to the renderers: `ClientRole` and `ClientSkill` gain a per-client `model_settings` mapping in the ports module,
    the request builder fills it from the resolver, and the role and skill writers write a client's own entry through `front_matter` and
    `toml_table`. Only mode `manual` pins. With no policy, or in any other mode, every generated byte stays as it is today. The
    commands that call `compose` are wired in P-6.
  depends_on:
  - P-4
  implements: [EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      With no policy given to the request builder, the five existing role files of each of the three clients are byte-identical to the
      files that the base revision renders, and the existing golden files and golden tests pass without a single edit (the new golden
      files of AC-3 are the only golden changes of this phase).
    source: BC-1; C-3; A-28
    check_ref: pytest
  - id: AC-2
    text: >-
      In mode `automatic` and in mode `automatic-with-fallbacks`, with or without a policy, the model line of a Claude Code and a Cursor
      role file is `model: inherit` and a Codex role file has no model key, as today; the files of the two modes are identical.
    source: BC-2; BC-27; R-9; ADR-001 decision 3
    check_ref: pytest
  - id: AC-3
    text: >-
      In mode `manual`, with an approved candidate whose route has a name for the client, that client's role file carries that client's
      name in its own field: Claude Code `model:` and, when the assignment sets an effort, `effort:`; Codex `model` and
      `model_reasoning_effort`; Cursor `model:` only. With two or three clients enabled each file carries its own client's name. A pinned
      `orqlet-tester` is pinned by new golden files for each client (family `models-2026-11`).
    source: BC-3; R-3; R-4; ADR-003 decision 2
    check_ref: pytest
  - id: AC-4
    text: >-
      A Cursor value is written only when `cursor_plain_id` is true and never with a bracketed option. An effort assignment for Cursor and
      a name that is not plain-safe each give the finding ORQ-W546 with a fixed text and no model string, render nothing for that role,
      and leave `model: inherit`. No writer builds text by hand: every value passes through `front_matter` or `toml_table`.
    source: BC-34; ADR-003 decision 3; C-1
    check_ref: pytest
  - id: AC-5
    text: >-
      A skill assignment in mode `manual` writes `model:` (and `effort:` when set) into the front matter of the Claude Code skill file
      only; in any other mode it writes none; the `.agents/skills` file, which Cursor and Codex share, never changes; an assignment of a
      skill for Codex or Cursor gives ORQ-W546 and no change. This is the only way the main agent is pinned.
    source: BC-7; BC-8; ADR-003 decision 4
    check_ref: pytest
  - id: AC-6
    text: >-
      For a request with a full fixture policy and all three clients, the set of paths that the adapters write equals the set for no
      policy: no `settings.json`, `settings.local.json`, `config.toml` or model file is rendered for any client.
    source: BC-8; ADR-003 decision 5
    check_ref: pytest
  - id: AC-7
    text: >-
      A pin uses the route's exact `name`. An alias name is written only when the route is declared `kind: alias` with `resolves_to`,
      and the selection then returns the finding ORQ-W545 (an environment variable can remap an alias). A route of kind `id` never
      produces ORQ-W545.
    source: BC-28; BC-43; ADR-003 decision 2; F-17
    check_ref: pytest
  - id: AC-8
    text: >-
      For a policy that wrongly approves a route matching the Fable exclusion, the selection returns no setting for it, and for every
      combination of mode and client none of the rendered files contains `fable`, `best` or `claude-fable-` in any letter case.
    source: BC-9; R-12; ADR-005 decision 2
    check_ref: pytest
  - id: AC-9
    text: >-
      `ModelSetting` and the `model_settings` mapping (client id to setting) live in `application/ports/instruction_adapter.py`; each
      writer reads only its own client's entry; the three client adapter modules and `RenderRequest` are unchanged; `uv run lint-imports`
      passes; `test_role_files_never_name_a_vendor_model` now says that a role file names a model only when the policy assigned it and
      never an excluded one, and still passes for the packaged roles without a policy.
    source: C-11; ORQLET-ARCH-003; ADR-003 decisions 1 and 10
    check_ref: import-linter
  - id: AC-10
    text: >-
      No file outside this phase's operations changes, `pyproject.toml` and `uv.lock` are unchanged, and `orqlet gate status
      dynamic-model-profiles --phase P-5 --head staged` reports no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: BC-25; plan rule on phase file lists
    check_ref: gate-status-phase
