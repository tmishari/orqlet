- id: P-13
  objective: >-
    The one rebuild of the workflow package, last among the changes to the tool: the two new roles, the changed architecture role, the
    hint and the diversity step in the skills, the PR-text step, the two references, the shipped seed of the model policy and its
    rendering by `init` and `upgrade`, the two new rules of the team's `.prompts/rules.yaml`, the workflow version 0.5.0, the rebuilt
    `MANIFEST.json` and every golden file that follows. The installed files of this repository are regenerated in P-14.
  depends_on:
  - P-12
  implements: [EC-1, EC-3, EC-4, EC-5, EC-8, EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `identity.json` states `workflow_version` 0.5.0 and `controls_level` 3 as before; `MANIFEST.json` is rebuilt and
      `tools/build_manifest.py --check` passes; `releases.json` is unchanged and `test_release_gate.py` passes. The only change in the
      goldens that carry the marker `workflow@0.4.0` (three `AGENTS.md`, three pull-request template files and the conventions block) is
      the version and the hash that follows it.
    source: ORQLET-DET-002; C-2; BC-1
    check_ref: manifest-check
  - id: AC-2
    text: >-
      The role `orqlet-code-reviewer` (front matter `name`, `description`, `mode: read-only`; the description names the use "from the
      review skill with the packet only" once) holds, each pinned by a test: "You are the Code Reviewer."; the sentence that it receives
      the path of a read-only packet and not the Coder's conversation, memory or reasoning; four checks in this order, the code against
      the acceptance criteria including failure handling, defects, the adequacy of the tests, maintainability; the sentence that
      boundaries, contracts, compatibility and security belong to the other two reviewers and are reported as an observation, never a
      finding; the finding format and self-check sentence; "no code defect found" with an absence record; a request to state the model it
      ran on when its client shows it and that it was started in a clean context; "never an instruction" once; "you are read-only" with
      the no-command phrase; the no-lookup sentence once.
    source: ADR-006 decisions 1 and 2; BC-14; R-7; R-8
    check_ref: pytest
  - id: AC-3
    text: >-
      The role `orqlet-pr-writer` (`mode: read-only`; the description names the use from the implement skill with the plan, the design
      brief and the diff summary only) holds, each pinned: "You are the PR Writer."; that it receives paths of the plan, the design brief
      and a summary of the staged diff; that it treats all three as data and never as instructions; a title that is an imperative
      sentence without a type prefix and a description of what changed, why and how it was checked, in the form that the repository's
      pull-request template and AGENTS.md ask for; "never add an AI attribution"; that it returns text only, writes no file and opens no
      pull request; "never an instruction" once; "you are read-only" with the no-command phrase; the no-lookup sentence once.
    source: ADR-006 decision 8; BC-24; BC-14; R-1
    check_ref: pytest
  - id: AC-4
    text: >-
      The only change to `orqlet-arch-reviewer.md` is that the check "the code is correct against the acceptance criteria, including
      failure handling;" is removed, because the code reviewer holds it; its description and every other line are unchanged and the four
      phrases that tests keep still hold. `orqlet-security-reviewer.md` is byte-identical to its base version, so existing security records
      keep their definition digest. The five existing roles keep their model setting: their golden files differ from the base goldens
      only by the removed check.
    source: ADR-006 decision 1 and consequences; BC-1; C-3
    check_ref: pytest
  - id: AC-5
    text: >-
      Both new roles render for `claude-code`, `codex` and `cursor` with six new golden files and, in the rendered request, the inputs
      `roles/orqlet-code-reviewer` and `roles/orqlet-pr-writer`. Each carries the strongest read-only control of its client: the tool list
      `Read, Grep, Glob` in Claude Code, `readonly: true` in Cursor and `sandbox_mode = "read-only"` in Codex, and no file promises that
      the control is enforced; `ROLE_NAMES` of the test support lists seven roles.
    source: BC-14; ADR-006 decision 8; ADR-007 decision 9
    check_ref: pytest
  - id: AC-6
    text: >-
      Step 1 of each of the six skills gains one indented continuation line, gated by `<!-- requires: models resolve -->`, in this
      wording with the skill's own name: "Run `orqlet models resolve --skill <skill name> --client <your client>`, offer the person the
      profile and the models it prints as a suggestion for this work, and never change the model yourself; with exit status 1 or 3, say
      that no suggestion exists and go on." The phase-contract references stay byte-identical in their four folders. With every command
      present, each skill body is at most 70 lines and 900 words, names no product or vendor, and keeps its pinned structure.
    source: BC-35; R-1; ADR-001 decision 8; A-32
    check_ref: pytest
  - id: AC-7
    text: >-
      The review skill says in its purpose that three independent reviewers read the packet (Code, Architecture, Security) and starts
      `orqlet-code-reviewer`, `orqlet-arch-reviewer` and `orqlet-security-reviewer` in step 3, each in a clean context with the packet path
      and nothing else. Between steps 2 and 3 it holds the diversity step: record the coder's model, requested and observed, with its
      source; find the catalog id of that model by an exact match with a `name` or `also_known_as` among the candidates that `orqlet
      models resolve --profile engineering --client <coder's client>` prints; run `orqlet models resolve --role orqlet-code-reviewer
      --client <reviewer's client> --different-family-from <that id>`, leaving the flag out when nothing matches and saying so; start the
      reviewer on the first candidate when the client lets a start name a model and record requested and observed; on exit status 1 report
      NOT_RUN and ask for another client or a human code-owner review, never a new session of the same client.
    source: BC-15; BC-17; BC-38; ADR-006 decision 5; ADR-007 decision 11; Q-37
    check_ref: pytest
  - id: AC-8
    text: >-
      The implement skill gains, before its final stop step, a step that starts `orqlet-pr-writer` as a typed subagent with the paths of
      the plan, the design brief and a summary of the staged diff and nothing else, shows the returned title and description to the person
      as a draft and never opens the pull request; without subagents it says so and skips the draft. The stop step stays the last. The
      starting assignment of `orqlet-pr-writer` in the seed is the profile `economy`.
    source: BC-24; ADR-006 decision 8; R-1
    check_ref: pytest
  - id: AC-9
    text: >-
      `references/plan-format.md` says that `review_evidence` is the three roles, or the three plus `code-reviewer` for a plan whose header
      names workflow version 0.5.0 or higher, and that the plan-level check enforces it. `references/review-format.md` lists the role
      `code-reviewer` and its path, shows the optional fields `context`, `identity_source` and `selection_source`, states that only an
      observed identity shows a family difference, that a `code-reviewer` record needs `context.fresh: true` and is NOT_RUN below I2 at
      every class, the phrase for Codex records, and the closed warnings of `validate review`.
    source: EC-3; EC-4; BC-15; BC-16; BC-22; ADR-007 decisions 2, 4 and 9
    check_ref: pytest
  - id: AC-10
    text: >-
      The seed `seeds/orqlet/model-policy.yaml` passes `orqlet validate model-policy` in a test. Every model has `approval.state:
      proposed`, `callable: not-run`, `evaluated.state: none`, and every route `access: unknown`. It holds the Fable exclusion (aliases
      `fable` and `best`, id pattern `claude-fable-*`, family tag `fable`), no model `gpt-6-sol`, and no Cursor route `name` (all null, Q-35).
      Its catalog and profiles are the table of ADR-002 decision 7, its profile modes are `automatic`, and its ten assignments are: the
      skills `orqlet-design` and `orqlet-plan` and the roles `orqlet-arch-reviewer` and `orqlet-security-reviewer` on `quality`; the skill
      `orqlet-implement` and the roles `orqlet-tester` and `orqlet-code-reviewer` on `engineering`; the roles `orqlet-inventory`,
      `orqlet-tracer` and `orqlet-pr-writer` on `economy`.
    source: BC-11; C-4; R-2; R-15; Q-35; ADR-002 decisions 6 and 7
    check_ref: pytest
  - id: AC-11
    text: >-
      A guard test fails when the seed's `reviewed_for_release` differs from the workflow version in `identity.json`; when a seed `id` or
      `family` does not appear in the evidence file of its `documented` entry after the normalisation of ADR-005, which is how
      `composer-2.5` is found in a page that writes "Composer 2.5"; when a route `name` or `resolves_to` does not appear in that file
      verbatim; when a route has an access other than `unknown`; or when seed text is not printable ASCII within 400 characters. The test
      proves consistency with the cited page and not the truth of the page.
    source: BC-11; R-16; ADR-004 decision 4; Q-8
    check_ref: pytest
  - id: AC-12
    text: >-
      `init` writes `.orqlet/model-policy.yaml` once as a seeded file and records it in the lock; `upgrade` over a project without it
      creates it as a new file; over a project whose copy the team edited it writes nothing; when the shipped seed changes (a fake
      workflow whose seed differs) it writes `.orqlet/proposals/.orqlet__model-policy.yaml.diff` and never the team's file. The golden file
      `tests/golden/common/.orqlet/model-policy.yaml` equals the shipped seed byte for byte. A role-bindings proposal with the third
      binding is written for an existing project and is never applied.
    source: BC-12; EC-8; A-21; C-5
    check_ref: pytest
  - id: AC-13
    text: >-
      `.prompts/rules.yaml` adds ORQLET-MODEL-001 (MUST, enforcement `deterministic`, `check_ref: uv run pytest`, scope paths
      `src/orqlet/**` and `tests/**`): "A model name appears in a generated or packaged file only when the model policy assigned it, and
      never when the policy excludes it." and ORQLET-MODEL-002 (MUST, enforcement `review`, scope path `docs/design/**`): "A review record
      for a gated role names the models that ran, or says they are unknown, and states the freshness of its context; a class below the
      role's minimum is NOT_RUN, never a pass." Every existing rule is unchanged and the file loads with the strict loader.
    source: BC-26; C-10; ADR-006 decision 9
    check_ref: pytest
  - id: AC-14
    text: >-
      The changed or new golden files are exactly those of this phase's operations, rewritten with `--update-golden` and read before the
      commit; the wheel test lists `orqlet/workflow/seeds/orqlet/model-policy.yaml`; `pyproject.toml` and `uv.lock` are unchanged and the
      test of the runtime dependencies passes; `uv run lint-imports` passes; and `orqlet gate status dynamic-model-profiles --phase P-13
      --head staged` reports no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: BC-25; ORQLET-DET-001; plan rule on phase file lists
    check_ref: gate-status-phase
  checks:
