- id: P-2
  objective: >-
    Read the model policy through the FileSystem port and through a git tree with one strict parser: the size limit, the strict YAML
    rules, the contract, a credential scan that adds the vendor key shapes, and findings that never print a value of the file. The
    loader returns four states (absent, loaded, invalid, deleted) that every later phase reads. Nothing renders or validates yet.
  depends_on:
  - P-1
  implements: [EC-1]
  acceptance_criteria:
  - id: AC-1
    text: >-
      `load_model_policy` reads `.orqlet/model-policy.yaml` of the working tree through the `FileSystem` port and returns one of four
      states: absent (no file and no seeded row for it in `.orqlet/generated.lock.yaml`), loaded (the v2 contract), invalid (findings) and
      deleted (no file, and the lock records the path with owner `seeded`). A lock that cannot be read is not proof of a deletion, so the
      state is absent. A file that is a directory, a link or not a regular file is invalid.
    source: BC-39; ADR-005 decision 2; ADR-002 decision 1
    check_ref: pytest
  - id: AC-2
    text: >-
      `read_model_policy_at(services, tree)` reads the same path from a git tree through `vcs.read_at` and returns absent, loaded or
      invalid with the same parser, so the same bytes give the same state from both entry points. It never reads the working tree, and
      `load_model_policy` never calls the VCS port; the fakes record every call and the test asserts both.
    source: ADR-007 decision 10; BC-23; BC-44
    check_ref: pytest
  - id: AC-3
    text: >-
      A file above 256 KiB, a duplicate key, an anchor or alias, a document nested too deep and an invalid byte sequence each give the
      finding ORQ-E540. A file that breaks the contract gives ORQ-E541 with the field path and the rule only. A file whose `schema` is
      `orqlet.model-policy/v1` gives ORQ-E541 with the fixed text "a v1 file; migrate" and no other content of the file.
    source: BC-32; BC-37; ADR-002 consequences; ORQLET-SEC-002
    check_ref: pytest
  - id: AC-4
    text: >-
      The credential scan of `domain/model_policy_scan.py` reports every rule of `find_literal_credentials` plus the shapes `sk-`, `xai-`
      and `AIza` followed by key-length text, and each hit is the finding ORQ-E542 with the rule name and the line number only. The
      fixtures assemble each shape from fragments at run time, so no key-shaped literal is committed. `find_literal_credentials` itself
      is unchanged and the existing MCP credential tests pass without edit.
    source: BC-32; ADR-002 decision 3; ORQLET-SEC-003
    check_ref: pytest
  - id: AC-5
    text: >-
      For a policy that holds a unique marker string in each free-text field, in each model field and in a refused field, no finding of
      the loader contains a marker, a key of the file or a value of the file. A finding holds a code, a fixed text, a field path made of
      contract field names and a line number, nothing else.
    source: BC-32; C-1; ORQLET-SEC-002
    check_ref: pytest
  - id: AC-6
    text: >-
      The loader and the scan add no import of a file, process or network module to the application layer and no third-party import to
      the domain; `uv run lint-imports` passes; `pyproject.toml` and `uv.lock` are unchanged.
    source: BC-25; C-1; C-6
    check_ref: import-linter
  - id: AC-7
    text: >-
      No file outside this phase's operations changes, and `orqlet gate status dynamic-model-profiles --phase P-2 --head staged` reports
      no ORQ-E450, ORQ-E451 or ORQ-E453.
    source: plan rule on phase file lists
    check_ref: gate-status-phase
