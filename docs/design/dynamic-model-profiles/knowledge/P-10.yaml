no_impact:
  category: already-documented
  reason: "This phase makes orqlet validate review judge a record on two trees: review_identity.py reads the model policy of the base tree and of the staged tree; exclusions are the union; a family comes only from a catalog entry that is not proposed at the base tree; a refused staged policy is ORQ-E461 and never falls back to model_families; the closed warnings, the freshness reason and the code-reviewer gate text follow. Written in the approved design: BC-9, BC-10, BC-16, BC-17, BC-19, BC-22, BC-31, BC-32, BC-39, BC-40, BC-44, ADR-005 decision 2, ADR-006 decision 4, ADR-007 decisions 1, 4, 5 and 9. No knowledge document exists that the change could make wrong: the plan knowledge_scope is empty and no knowledge source is configured. Readings of the coder: (1) model_families is read from the base tree; a refused staged policy gives no family at all; (2) ORQ-E461 and ORQ-I460 only for a record that names a model; (3) ORQ-W462 whenever the staged policy loads and differs from the base policy, an absent base included (BC-40, F-18); (4) ORQ-W464 names a catalog id or unmatched (N characters) for each side; (5) ORQ-W465 by substring on capability_limits; (6) independence_notes lists every closed name that starts a finding message, all six, in the order of AC-4; (7) a binding approved in either tree counts, so one that the staged tree removes while the base has it stays approved, as AC-2 names ORQ-E415 for neither tree; (8) the freshness reason is a second not_run line; (9) a policy that neither tree has and that the lock of either tree lists as seeded is ORQ-E461 (ADR-005 decision 2, BC-39; rework round 1, after F-1 of the architecture review r1); a lock that is missing, unreadable or invalid says nothing; the check is written in review_identity.py and repeats the one of model_policy_source.py, which reads the working tree and is outside the file list. No edit outside the file list; the coder changed one line of the Tester's file and added 12 tests in rework round 1."
  absence_record:
    scopes_searched: [".orqlet/knowledge.yaml sources", "the plan's knowledge_scope", "README.md, AGENTS.md, .github, docs/ outside docs/design/dynamic-model-profiles, src and tests outside tests/golden, for independence_derived, independence_notes, the codes ORQ-E412, ORQ-E415, ORQ-E460, ORQ-E461, ORQ-W460 to ORQ-W465 and ORQ-I460, for model_families, and for every statement of how validate review derives a class"]
    views: [committed:HEAD]
    revision: 1c83b5693052cfa6da31eea551acd0e51027a210
    method: "orqlet knowledge impact on the staged tree found no candidate; no knowledge source is configured (ORQ-I400) and the plan's knowledge_scope is empty. rg found these places outside the file list. Still true: README.md 331 (same client is I1, a D3 change needs I2 and is NOT_RUN; it does not say that a policy also gives families, which P-12 names at plan.yaml 1574); tests/e2e/test_s9_acceptance.py 538 to 551 (ORQ-E415, independence_derived I0, ORQ-E412; passed unedited); upgrade.py 276 and test_upgrade_model_policy.py 1577 to 1597 (a code-reviewer record is ORQ-E415 until a reviewed edit applies the proposal; in the change that stages that edit it is ORQ-W463, a nuance for the person). Incomplete and owned by a later phase: orqlet-review/references/review-format.md 61 and orqlet-review/skill.md (a different client or model family is I2; P-13, plan.yaml 1794 and 1800); docs/design/orqlet-architecture-proposal.md 5057 (an unmapped model counts as the coder's family; true for model_families alone; P-12). Only the two files of this phase print the new codes. The generated copies under .claude, .cursor, .codex and tests/golden were not searched; they repeat the workflow package, which was."
