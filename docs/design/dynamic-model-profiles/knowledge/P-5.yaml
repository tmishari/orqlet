no_impact:
  category: already-documented
  reason: "This phase carries a model selection to the renderers: ModelSetting and a per-client model_settings mapping on ClientRole and ClientSkill, the writers of the three role files and of the Claude Code skill file, the request builder and compose taking an optional selection, and select_models, which turns a policy into those settings with the findings ORQ-W545 and ORQ-W546. No command passes a selection yet (P-6 wires them), so with no selection every generated byte is the one rendered before. The behaviour is already written in the approved design: decisions 1 to 6 and 10 of ADR-003 (per-client mapping, pin by exact name, plain-ID rule for Cursor, skills for Claude Code only, no settings file, missing candidate), decisions 2, 3 and 7 of ADR-001 (default, three modes of which only manual pins, task scope that never reaches a file) and decision 2 of ADR-005 (exclusion at the renderers), and component.md rows BC-1 to BC-9, BC-27, BC-28, BC-34 and BC-43 and the failure rows F-4 and F-17. No knowledge document exists that the change could make wrong: the plan knowledge_scope is empty, the project configures no knowledge source (ORQ-I400), and no file outside docs/design describes the model line of a role file. Readings of the coder held only in module docstrings and the phase report: select_models calls policy_problems before resolve and pins nothing for a policy with any problem; a skill pin gives ORQ-W546 for each enabled client other than Claude Code; a finding holds no model string; compose adds none of the findings, which P-6 reports. The readings of P-3 and P-4 stay as implemented. Three tests of earlier tasks that pin the signatures of compose and build_render_request were edited, six lines, with the person's agreement."
  absence_record:
    scopes_searched: [".orqlet/knowledge.yaml sources", "the plan's knowledge_scope", "README.md, AGENTS.md and docs/ outside docs/design for the model line of a role file or a pinned model"]
