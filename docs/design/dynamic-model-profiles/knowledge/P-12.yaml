    records and the file itself, not knowledge documents: no knowledge source is configured (ORQ-I400) and the plan''s knowledge_scope is empty, so no knowledge document
    exists that could say it. This is the reviewer''s call. The phase also changes no behaviour of the tool: it brings README.md and the proposal in line with the
    built model policy v2 and the code review gate (AC-1 to AC-5), corrects statements outside those criteria that the person asked to be corrected (about 30 lines
    of the proposal, three of the README) and adds two test files that pin the texts and the file. No file of src/, tools/ or the workflow package, no pyproject.toml
    and no uv.lock changes. What the phase leaves wrong or unchecked is listed in scopes_searched under ''left open''. The search was by words: statements in other
    words may exist.'
