no_impact:
  category: already-documented
  reason: "This phase adds the resolution of ADR-001 and ADR-007 as one pure domain module, resolve with the closed rejection reasons, and the application mapping from the v2 policy to its plain inputs with policy_problems; nothing calls either yet and no file is rendered. The behaviour is already written down in the approved design: decisions 3 to 7 of ADR-001 give the modes, the precedence, the constraints and the five sources; decision 1 of ADR-005 and decision 3 of ADR-004 give the exclusion in every state and the not-approved rule; decision 7 of ADR-006 and decisions 1, 3 and 11 of ADR-007 give the profile floor and the diversity rule; decision 3 of ADR-002 gives the paths without a model string; component.md names domain/model_resolution.py and model_selection as their homes. No knowledge document exists that the change could make wrong, because the plan's knowledge_scope is empty and the project configures no knowledge source. Readings of the coder that are written only in the module docstrings and the phase report, not in a document: a candidate is compared by catalog id and family, not through the name rule; an override or a named fallback is a string matched by name, so a logical id alone matches nothing; a level is valid when manual with an eligible choice, or in another mode unless the request is constrained; an invalid level passes to the next and, when none is valid, nothing qualifies; an unknown or proposed coder entry shows no candidate different; the floor applies to the code reviewer only when a coder model is given; the exclusion reads the family and every route string of a model; an unknown candidate id is not-approved. The five readings of P-3 stay as implemented: an id pattern matches only as written; a string that two entries name is unknown; an entry's logical id is not one of its names; an empty alias or tag matches nothing; a shared resolves_to is not reported as a conflict."
  absence_record:
    scopes_searched: [".orqlet/knowledge.yaml sources", "the plan's knowledge_scope", "files outside docs/design that name model selection or resolution"]
    views: [committed:HEAD]
    revision: dcaa6deff4c68c26d3223ad1e919777f350d06db
    method: "orqlet knowledge impact on the staged tree, which found no candidate; the project configures no knowledge sources (ORQ-I400) and the plan's knowledge_scope is empty, so no knowledge document exists that the phase could change. A search outside docs/design for model selection found only the P-1 contract, the P-2 reader and the P-3 identity rule, which nothing in this phase changes."
    index_state: not-used
    candidates_found: 0
