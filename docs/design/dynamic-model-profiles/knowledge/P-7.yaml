no_impact:
  category: already-documented
  reason: "This phase adds the read-only command validate model-policy (use case validate_model_policy, the services object with the Clock port, the wiring function and the registration in the validate group) and lists it in IMPLEMENTED_COMMANDS. The behaviour is already written in the approved design: BC-9, BC-13, BC-30, BC-32, BC-33 and BC-39 of component.md, the failure rows F-14, F-15 and F-16, ADR-002 decision 3, ADR-003 decision 8, ADR-004 decisions 1 and 5 and ADR-005 decision 2. No knowledge document exists that the change could make wrong: the plan knowledge_scope is empty, the project configures no knowledge source (ORQ-I400), and the sentence of README.md that lists the validate commands (README.md lines 361 and 362) becomes incomplete but is outside this phase's file list; plan phase P-12 writes the README table of the finding codes and the paragraph on the policy. Readings of the coder held only in module docstrings and the phase report: ORQ-E544 compares the excluded entries by id; the approval_ref forms are pr and a positive integer, commit and 40 or 64 lowercase hex digits, adr and a repository path; ORQ-W542 is inclusive at 30 days and reads the clock only when a route has a retirement date; the enabled clients come from the project profile and are all three when it cannot be read; ORQ-W544 covers generated files too; a model key that is present and empty is ORQ-W544; a skill folder that is a link is ORQ-W544; ORQ-W540 is the finding list of select_models, not a second logic; a custom PATH is read through the same reader and has no base and no deletion rule. Three tests of an earlier task (test_validate_integrations_cli.py) that pin the commands of the validate group and the public names of its module were edited with the person's agreement."
  absence_record:
    scopes_searched: [".orqlet/knowledge.yaml sources", "the plan's knowledge_scope", "README.md, AGENTS.md and docs/ outside docs/design for the model policy, its finding codes and the list of validate commands"]
