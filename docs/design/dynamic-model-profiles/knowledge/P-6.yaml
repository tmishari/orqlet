no_impact:
  category: already-documented
  reason: "This phase wires the model policy into upgrade, explain and init. compose takes the state of the policy file in place of a selection and returns the outcome; upgrade refuses before any plan for an invalid, deleted or v1 file and for a policy with problems (ORQ-E540 to E543, E545, E547), reports ORQ-W540, W545 and W546, lists the review records that a changed agent file makes stale (ORQ-W547, new module pin_staleness) and announces a pending code-reviewer binding (ORQ-I540); explain lists the entries that upgrade would write. The behaviour is already written in the approved design: ADR-003 decisions 6 and 7, ADR-001 decisions 2, 3 and 7, ADR-005 and ADR-006 consequences, component.md rows BC-4, BC-29, BC-37 and BC-43, and the failure rows F-1 to F-4, F-12, F-13, F-16 and F-17. No knowledge document exists that the change could make wrong: the plan knowledge_scope is empty, the project configures no knowledge source (ORQ-I400), and README.md and AGENTS.md describe upgrade and explain in general terms that stay true; the phase that documents the policy, its codes and ORQ-W547 in the README is a later phase of the plan. Readings of the coder held only in module docstrings and the phase report: a refusal lists the field paths of a policy problem, one finding for each code and at most 20 paths; an assignment is judged alone for ORQ-W540; an assignment that names one model in mode automatic-with-fallbacks has no fallback to judge; a profile is judged for every enabled client; a review record is found only at a path that matches the review pattern of evidence_artifacts. Three tests of earlier tasks that pin the signature of compose, the fields of ModelSelection and the public names of render_all were edited with the person's agreement."
  absence_record:
    scopes_searched: [".orqlet/knowledge.yaml sources", "the plan's knowledge_scope", "README.md, AGENTS.md and docs/ outside docs/design for the model policy, its finding codes and the output of upgrade and explain"]
    views: [committed:HEAD]
    revision: 5f4ed4d8b8edcec58875e21b59e1a5e17f329caa
    method: "orqlet knowledge impact on the staged tree, which found no candidate; the project configures no knowledge sources (ORQ-I400) and the plan's knowledge_scope is empty. A search of README.md, AGENTS.md and docs/ outside docs/design for model-policy, model policy, ORQ-E540 to ORQ-I540, missing-candidate and protected_set_digest found nothing; the mentions of orqlet upgrade and orqlet explain describe them in general and stay true."
    index_state: not-used
