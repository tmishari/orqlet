no_impact:
  category: already-documented
  reason: "This phase changes contracts only: the model-policy v2 contract and the optional review-record fields that decisions 2 and 3 of ADR-002, decision 3 of ADR-006 and decisions 2 and 4 of ADR-007 of the approved design already document, with the expected changes EC-1 to EC-5 of the design manifest. No use case reads the model-policy contract yet. The review-result, role-bindings and implementation-plan contracts are read by use cases and now accept fewer values: a closed client set, a recorded-model alphabet and a major.minor.patch workflow_version. AC-7 checked those narrowings only against the 112 review records and the plans of this repository, and the downstream effect is not known. A search of the repository outside docs/design and the phase's own files found no document that names model-policy."
