no_impact:
  category: already-documented
  reason: "This phase adds the read-only command models resolve (use case models_resolve over ModelsServices, which has no VCS, process runner or clock; the models group) and lists it in IMPLEMENTED_COMMANDS. The behaviour is already written in the approved design: BC-4, BC-6, BC-9, BC-23, BC-32, BC-33, BC-35, BC-38, BC-39, BC-43, ADR-001 decisions 4, 5, 7 and 8, ADR-002 decision 3 and ADR-007 decision 11. No knowledge document exists that the change could make wrong: the plan knowledge_scope is empty and no knowledge source is configured. Places that list or count commands become incomplete; each is outside this phase's file list and plan phase P-12 (plan.yaml lines 1508 to 1584) writes them: README.md lines 22, 30-40, 361-362, 709-728 and 735-757 (751 lists the kinds of validate); docs/design/orqlet-architecture-proposal.md lines 4550 (what is implemented at v0.5) and 4486 (a count of 1,504 tests), dated 2026-10-22. Readings of the coder, held in the docstrings and the report: (1) load_model_policy is reused through a private view whose vcs raises on use, because model_policy_source.py is not in the phase list; (2) usage checks run in the command before any file is read and never repeat the value; role and skill names are not checked against the workflow; (3) to_resolver_policy is used so that --task applies; a policy problem, an invalid, v1 or deleted file exits 3 without the word upgrade; (4) a missing policy that the lock does not show as deleted is empty: exit 0, or 1 with a coder constraint; (5) every override-level rejection is override-invalid, so excluded never appears in rejected; (6) the hint follows the resolution's profile, and a target pinned to one model gets the no-assignment sentence; (7) a refusal prints one stdout line, findings on stderr and an empty data; (8) the policy is checked against 256 KiB after it is read, the lock only when the policy is missing. Two assertions of test_validate_integrations_cli.py were edited under the pinned-signature rule."
  absence_record:
    scopes_searched: [".orqlet/knowledge.yaml sources", "the plan's knowledge_scope", "README.md, AGENTS.md, the workflow package under src/orqlet/workflow, .github and docs/ outside docs/design/dynamic-model-profiles for every list or count of the commands of the CLI or of a command group"]
    views: [committed:HEAD]
    revision: 456cc1a206c053ed0d98362a059e68d06115a429
    method: "orqlet knowledge impact on the staged tree, which found no candidate; the project configures no knowledge sources (ORQ-I400) and the plan's knowledge_scope is empty. A search with rg for the names of the commands (validate integrations, validate model-policy, models resolve, knowledge impact, review prepare, standards for, gate status) and for the words command group, subcommand, IMPLEMENTED_COMMANDS and a number followed by commands found the places named in the reason: README.md (it has no occurrence of the word models) and docs/design/orqlet-architecture-proposal.md. AGENTS.md names only standards for; the skills of the workflow package name single commands under requires markers; the generated copies of the skills repeat those texts."
    index_state: not-used
    candidates_found: 0
