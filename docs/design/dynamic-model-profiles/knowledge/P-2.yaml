no_impact:
  category: already-documented
  reason: "This phase adds the reader of the model policy file and the credential scan it uses: a pure domain function and an application use case that nothing calls yet. The two entry points are already written down in the approved design (component.md names load_model_policy and read_model_policy_at and says one parser serves both; decision 3 of ADR-002, decision 2 of ADR-005 and decision 10 of ADR-007 give the rules), with the expected change EC-1 in the manifest. The finding codes ORQ-E540 to ORQ-E542 are written in the approved plan, not in a design document. No knowledge document exists that the change could make wrong, because the plan's knowledge_scope is empty and the project configures no knowledge source. One limit of the new code is written only in the docstring of read_model_policy_at and in the phase report, not in a document: the Vcs port reads a blob and does not say whether the tree entry is a link, so a link whose target text is a valid policy reads as a file on the tree path while the working-tree path refuses a link."
  absence_record:
    scopes_searched: [".orqlet/knowledge.yaml sources", "the plan's knowledge_scope", "files outside docs/design that name model-policy"]
    views: [committed:HEAD]
    revision: 3db213fd9ffa5be05ac098bae4d51217068170e0
    method: "orqlet knowledge impact on the staged tree, which found no candidate; the project configures no knowledge sources (ORQ-I400) and the plan's knowledge_scope is empty, so no knowledge document exists that the phase could change."
    index_state: not-used
    candidates_found: 0
