no_impact:
  category: already-documented
  reason: "This phase adds the matching rule for model strings as one pure domain module that nothing calls yet: normalise, match_entry, same_identity, family_of, is_excluded, name_conflicts and cursor_plain_id. The rule is already written down in the approved design: decision 1 of ADR-005 gives the normalisation, the identity, the broader exclusion test and the duplicate-name error; decisions 1 and 3 of ADR-007 say that only entries that are not proposed give a family and that an unmatched string is unknown; decision 3 of ADR-003 and BC-34 say that a Cursor pin is written only as a plain ID; component.md names domain/model_identity.py as the home of the rule. No knowledge document exists that the change could make wrong, because the plan's knowledge_scope is empty and the project configures no knowledge source. Six readings of the coder are written only in the module's docstrings and the phase report, not in a document: the canonical separator of the normalised form is a hyphen; a string that two entries name is unknown; an entry's logical id is not one of its names; a bracket in an id pattern is literal and an id pattern matches only as written, not separator-normalised, which the person kept after the second review for the design to decide; an alias or a family tag that normalises to nothing matches nothing; the YAML words are refused in any letter case."
  absence_record:
    scopes_searched: [".orqlet/knowledge.yaml sources", "the plan's knowledge_scope", "files outside docs/design that name model identity"]
    views: [committed:HEAD]
    revision: 040a8a882ac283f3fb9a80af1ccb1fce9dba3cb9
    method: "orqlet knowledge impact on the staged tree, which found no candidate; the project configures no knowledge sources (ORQ-I400) and the plan's knowledge_scope is empty, so no knowledge document exists that the phase could change. A search outside docs/design for model identity found only the P-1 contract fields of review records and their tests."
    index_state: not-used
    candidates_found: 0
