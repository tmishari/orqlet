considerations:
  security:
    state: affected
    notes: "Catalog approval is an authorization decision (Q-23) that the host can enforce if configured (Q-34) and Orqlet does not; the policy and the review records are untrusted input read through the FileSystem port with strict YAML, bounded types, a credential scan and no recorded model string printed in a finding; the Fable exclusion is defence in depth, checked in three places (the resolver that the renderers obey, `validate model-policy` with its drift check and deletion rule, and `validate review` with the union of the base and staged policy), with one matching rule, and none of it runs in CI today; no secret, network path or new dependency is added; independence stays an attested statement, only an observed identity counts, and I3 comes only from the host."
  compatibility:
    state: affected
    notes: "With no policy file the model setting of every existing role file is unchanged, while the new roles and the changed role and skill text change the golden files on purpose; existing review records and approved plans stay valid because new rules apply by role and by workflow_version; contracts change additively except model-policy, whose v1 has no reader; existing projects receive the role-bindings change as a pending diff, and a project whose model_families is populated keeps it for strings the policy cannot match; a pin change alters protected_set_digest, so in-flight approvals show ORQ-W390 (ADR-003)."
  operations:
    state: affected
    notes: "Each Orqlet release rechecks the shipped catalog, enforced by a test that compares reviewed_for_release with the workflow version; the workflow package gains two roles, a seed and changed skill text, so MANIFEST.json is rebuilt and the version bumped; CODEOWNERS gains entries; CI adds no job."
