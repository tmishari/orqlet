expected_changes:
  - id: EC-1
    surface: persisted-schema
    action: add
    identity: "orqlet.model-policy/v2 at .orqlet/model-policy.yaml"
    expected_after:
      kind: declaration
      value: "A seeded, team-owned file of schema orqlet.model-policy/v2 holding policy_version, reviewed_for_release, models (id, family, approval, documented, callable, evaluated, routes with also_known_as), excluded, profiles (quality, engineering, economy) and assignments of roles and skills. An absent file means no policy and no change to the model setting of any existing role file."
    verification: manual
  - id: EC-2
    surface: persisted-schema
    action: remove
    identity: "orqlet.model-policy/v1"
    expected_after:
      kind: declaration
      value: "The v1 contract, its JSON schema file and its contract-test fixture are replaced by v2. No reader of v1 exists."
    verification: manual
  - id: EC-3
    surface: persisted-schema
    action: change
    identity: "orqlet.review-result/v1 and the review-record path pattern"
    expected_after:
      kind: declaration
      value: "role also admits code-reviewer, and the record-path pattern of domain/evidence_artifacts.py admits code-reviewer-P-<n>-r<k>.yaml; agent.client and coder_binding.client become the closed set of the three clients; agent and coder_binding gain an optional identity_source; agent gains an optional context (fresh, input) and an optional selection_source; context is required for a code-reviewer record. The schema id stays v1 and every existing record stays valid; the closed client set is the one narrowing of an accepted value, and every existing record is checked against it."
    verification: manual
  - id: EC-4
    surface: persisted-schema
    action: change
    identity: "orqlet.implementation-plan/v1 review_evidence"
    expected_after:
      kind: declaration
      value: "review_evidence also lists code-reviewer. Because the per-phase validator cannot see the plan header, a plan-level check requires code-reviewer in every phase when header.workflow_version is at or above the release that ships the role, and keeps today's exact set otherwise. The schema id stays v1 and every approved plan stays valid."
    verification: manual
  - id: EC-5
    surface: persisted-schema
    action: change
    identity: "orqlet.role-bindings/v1"
    expected_after:
      kind: declaration
      value: "Binding.role also admits code-reviewer; the seeded file gains a binding for orqlet-code-reviewer for claude-code, codex and cursor; model_families is read only when no model policy exists."
    verification: manual
  - id: EC-6
    surface: public-api
    action: add
    identity: "command line: orqlet validate model-policy and orqlet models resolve (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "validate model-policy [PATH] and models resolve --client C (--role R | --skill S | --profile P) [--task T] [--override MODEL] [--different-family-from MODEL] [--json], with the output and exit statuses of the design brief, section 3 (validate: 0 or 5; resolve: 0, 1, 2 or 3)."
    verification: manual
  - id: EC-7
    surface: security
    action: change
    identity: ".github/CODEOWNERS entries for the seed of the policy and CODEOWNERS itself (.orqlet/** already owns the policy path)"
    expected_after:
      kind: declaration
      value: "The seed path (src/orqlet/workflow/seeds/**) and .github/CODEOWNERS have code owners; Q-32 asks who the second owner is, so that the approval rule of Q-23 can be met, and whether src/orqlet/domain/** and tests/** are owned too."
    verification: manual
  - id: EC-8
    surface: public-api
    action: change
    identity: "command line: behaviour of orqlet init, upgrade, validate review and review prepare (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "init seeds the policy and the code-reviewer binding; upgrade renders manual pins, reports missing-candidate, unsupported skill or Cursor-effort assignments, stale reviews and a pending binding, and refuses on an invalid, deleted or v1 policy (a deleted seeded file is otherwise tolerated today); validate review reads the policy from the base and the staged tree and applies the identity, freshness, exclusion, deletion and unloadable-policy rules; models resolve and validate model-policy detect a deleted file from the lock's seeded row or the base tree; review prepare leaves docs/design/**/reviews/** out of the snapshot, the context copies and diff.patch and lists three reviewers."
    verification: manual
  - id: EC-9
    surface: persisted-schema
    action: add
    identity: "generated files: agent files of orqlet-code-reviewer and orqlet-pr-writer for the three clients, the model setting of pinned subagents, Claude Code skill front-matter, and their lock rows"
    expected_after:
      kind: declaration
      value: "Two roles render for claude-code, codex and cursor under .claude/agents, .codex/agents and .cursor/agents with lock rows (owner orqlet, class protected); a subagent pinned by manual mode carries its client's model field; an explicit Claude Code skill assignment adds model and effort front-matter; no settings, config.toml or model file is rendered."
    verification: manual
