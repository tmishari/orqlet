findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: tests
  claim: The rule that only the artifact named component.md is measured has no test; if the file-name check were removed or
    broadened, an ADR or another artifact over 1,200 words would warn and no test would fail.
  suggested_action: Optionally add a design with an over-long ADR and a short component.md that gives no ORQ-W368.
  confidence: high
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: correctness
  claim: The fence pattern accepts any line that starts with three backticks, but in CommonMark the info string of a backtick
    fence may not contain a backtick, so a line such as three backticks, a word, three backticks and more text is inline code
    and here opens a fence that hides the words after it; the count can be too low and a real over-long brief can pass without
    a warning.
  suggested_action: Refuse a backtick fence whose rest of line holds a backtick, and add a case to the fence test, or drop the
    CommonMark wording where the code does not meet it.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: standards
  claim: The helper that closes a fence takes both the matched run and the whole line and compares the stripped line with the
    run; passing the stripped line alone would remove a parameter.
  suggested_action: Optional.
  confidence: low
