findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  claim: 'The tamper check before each rerun cannot match what the plan records: ''orqlet evidence hash'' prints the content
    hash of the whole file, while the plan''s recorded hashes for CI and manifest lines are line-range hashes, so the two
    differ for any file cited by lines. The old ''git diff --quiet HEAD -- <cited files>'' check is gone, so there is no working
    detection of a cited CI file edited between runs (phase-contract.md line 37; evidence_cite.py 113-130; facts.py 28-32;
    plan.yaml 107-115).'
  suggested_action: 'Say which hash is compared: the line-range hash from ''orqlet evidence cite <path> <lines>'', or keep
    a diff-and-untracked check as the guard; pin it in AC-1.'
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  claim: Removing 'Before each, cite every source again and confirm git diff --quiet' leaves a window in which a cited CI
    file or Makefile changes after the first check; the text admits 'a file outside them can change unnoticed'. The design
    approved this trade in ADR-001; it is reported as residual risk.
  suggested_action: Accept it in the phase report as a residual risk, or restore a cheap diff-and-untracked check before each
    full run.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-3
  kind: observation
  severity: non-blocking
  category: security
  claim: 'Three smaller hardening phrases are gone: ''single-quote it'' for a composed revision, ''never from an earlier session''s
    memory'' in Handoff, and the per-reviewer hash at start and at save in the design skill. ''Values from artifacts'' still
    requires single-quoted arguments, ''--'' before paths and an allow-list, and the design hash is still compared before
    the skill stops.'
  suggested_action: None required; noted for the architecture reviewer.
  confidence: low
