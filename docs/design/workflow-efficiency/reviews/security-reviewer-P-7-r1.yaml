findings:
- schema: orqlet.finding/v1
  id: F-1
  kind: observation
  severity: non-blocking
  category: security
  claim: The tester starts in a clean context, compares `orqlet evidence hash` with a hash recorded 'by the Coder or by
    you' and cites a source only if the Coder has not; no implement step hands it the Coder's hashes, so it cannot tell
    what was cited and runs before any hash exists. The tester runs the project's test command, so this check is a security
    control (orqlet-tester.md line 15; orqlet-implement/skill.md line 32).
  suggested_action: Say that the tester cites itself whenever it cannot see a recorded hash, or have implement pass the
    recorded values as data.
  confidence: medium
- schema: orqlet.finding/v1
  id: F-2
  kind: observation
  severity: non-blocking
  category: security
  claim: The merged stale-input row says the standards hashes and profile_version 'need an AS-IS refresh or an impact review;
    a commit touching none stays valid'; the explicit 'stop' is gone and a protected-set digest change without a version
    change is not named; the tests pin only 'impact review', 'AS-IS refresh' and 'counts as not run' (phase-contract.md
    line 81; diff.patch 427-433).
  suggested_action: Restore 'stop for an impact review' for the two standards hashes and a digest change without a newer
    workflow_version as unknown that counts as not run.
  confidence: medium
- schema: orqlet.finding/v1
