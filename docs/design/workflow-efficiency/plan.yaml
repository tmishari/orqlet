- id: P-3
  objective: >-
    validate as-is accepts task-owned evidence cited at another commit, reads it at HEAD with a hash check and a scan, and still
    requires base_revision for every other entry.
  depends_on: [P-2]
  implements: [EC-5]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The task comes from the file's canonical path docs/design/<task>/as-is.md: a copy under docs/design/other/ whose header names
      <task> exempts nothing under docs/design/<task>/evidence/.
    source: BC-22
    check_ref: pytest
  - id: AC-2
    text: >-
      An entry under docs/design/<task>/evidence/ that cites a revision other than base_revision is read at HEAD; matching lines pass
      without ORQ-E332, and a missing file, missing lines or a changed hash give ORQ-E333, ORQ-E334 or ORQ-E335.
    source: BC-22
    check_ref: pytest
  - id: AC-3
    text: >-
      Regression: a task-owned entry that cites base_revision is read at base_revision and not scanned, as today.
    source: A-71
    check_ref: pytest
  - id: AC-4
    text: >-
      Entries under docs/design/<task>-x/evidence/, docs/design/<task>/Evidence/, docs/design/<task>/reviews/ or outside any task
      folder that cite another revision still give ORQ-E332.
    source: BC-22
    check_ref: pytest
  - id: AC-5
    text: >-
      A task-owned entry at another revision whose HEAD bytes hold a credential shape, a hidden character or more than 256 KiB gives
      ORQ-E338, which names the rule and the line, never the text, says to treat a shown credential as exposed and revoke or rotate
      it, and suggests no history rewrite; the evidence cite docstring no longer says the scan runs at cite time only.
    source: BC-22
    check_ref: pytest
  - id: AC-6
    text: >-
      Each AS-IS file under docs/design keeps its verdict and non-info finding codes from base_revision: dynamic-model-profiles,
      one-command-setup and workflow-efficiency PASS; harness2-fit, mcp-or-plugins, phase-skill-contracts and
      team-conventions-resources PASS with ORQ-W338; orqlet-implementation FAIL with ORQ-E324.
    source: BC-22
    check_ref: review:as-is-regression
  - id: AC-7
    text: The staged change touches only the files of this phase and stays inside EC-5.
    source: BC-22
    check_ref: gate-status-phase
