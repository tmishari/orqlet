reuse_decisions:
- candidate: output_of
  decision: use
  reason: The action line is an opt-in argument of the shared result builder, so validate and gate status gain it and other commands keep their text.
- candidate: Slug
  decision: use
  reason: gate status checks its task argument against the same contract that models resolve uses for --task.
- candidate: _web_evidence_refused
  decision: use
  reason: validate as-is runs the same size, credential and hidden-character scan instead of a second copy.
- candidate: services.vcs.read_at
  decision: use
  reason: validate as-is reads task-owned evidence at HEAD through the existing Git port.
- candidate: line_range_hash
  decision: use
  reason: Each cite pair and each task-owned entry is hashed with the existing line-range rule.
- candidate: tools/build_manifest.py
  decision: use
  reason: The manifest is rebuilt with the existing tool, never by hand.
- candidate: golden fixture
  decision: use
  reason: Golden files are rewritten with the existing --update-golden option and reviewed as diffs.
- candidate: orqlet upgrade
  decision: use
  reason: The installed copies are regenerated by upgrade, never edited by hand.
- candidate: persistent check cache
  decision: not-applicable
  reason: ADR-001 rejects it; reuse is a text rule guarded by file hashes.
