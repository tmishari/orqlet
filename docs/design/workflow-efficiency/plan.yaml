phases:
- id: P-1
  objective: >-
    gate status reports PASS and exits 0 when a task's inputs are current, refuses a malformed task name with exit 2, and the
    human text of every validator and of gate status ends with one action line rendered in the interface layer.
  depends_on: []
  implements: [EC-1, EC-3]
  acceptance_criteria:
  - id: AC-1
    text: >-
      Given a task whose artifacts are current and no --phase, gate status reports PASS, exits 0, has no not-run reason and keeps
      ORQ-I393 as an info finding saying that the input check, not this command, checks approval.
    source: BC-8
    check_ref: pytest
  - id: AC-2
    text: >-
      Regression: a stale artifact or a missing base revision still gives NOT_RUN, and a deviation with --phase FAIL, both exit 5.
    source: A-27
    check_ref: pytest
  - id: AC-3
    text: >-
      A task name such as `Bad_Name` or `../x` exits 2 before anything is read; a valid name with no artifact gives PASS, exit 0 and
      "No artifact of task <task> exists yet; check the task name unless you are starting research."
    source: BC-8
    check_ref: pytest
  - id: AC-4
    text: >-
      The human text of each validate command ends with exactly one action line: on FAIL "Action needed: fix the N error(s) above,
      then run the command again.", on NOT_RUN "Action needed: resolve the not-run reason(s) above and run the command again, or
      have the person confirm them.", on PASS "No action needed.", and a PASS with W warnings adds "Read the W warning(s) above.".
    source: BC-9
    check_ref: pytest
  - id: AC-5
    text: >-
      gate status ends with "No action needed from gate status; the input check still confirms approval." on PASS with a task, and
      with --phase and N open manual expected changes with "Action needed: N expected change(s) need a reviewer's comparison.".
    source: BC-9
    check_ref: pytest
  - id: AC-6
    text: >-
      evidence cite, evidence hash, knowledge impact, review prepare and conventions check print no action line, and the --json
      envelopes of validate and gate status keep their field names.
    source: BC-9
    check_ref: pytest
  - id: AC-7
    text: The comment of exit status 5 says that it covers a failed or a not-run check, not only doctor or sync (C-4).
    source: BC-24
    check_ref: review:stale-comments
  - id: AC-8
    text: The staged change touches only the files of this phase and stays inside EC-1 and EC-3.
    source: BC-8
    check_ref: gate-status-phase
  checks: [ruff-check, ruff-format, mypy, import-linter, pytest, gate-status-phase]
