- id: P-7
  objective: >-
    The baseline, the review and onboard skills, the tester role, the four formats and the standards command carry the reply
    format, the review limits, the focused-test guidance and the length targets, without growing the words a skill run loads.
  depends_on: [P-6]
  implements: [EC-6, EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The baseline gains a final-reply section: Completed (up to three bullets), Questions (omitted when none) and one copyable Next
      prompt holding only the task name, the next skill or action, fixed paths under docs/design/<task>/ and pending approvals,
      never source text or a project command; about 120 words outside the prompt.
    source: BC-20
    check_ref: pytest
  - id: AC-2
    text: >-
      No workflow file tells the agent to show rule or standard ids to people; the standards command records them in artifacts.
    source: BC-12
    check_ref: pytest
  - id: AC-3
    text: >-
      The review skill stops after three rounds with one consolidated report, resolves models at most twice, never for the skill
      when nested, records none requested when no candidate qualifies, and labels models suggested, observed or unknown.
    source: BC-7
    check_ref: pytest
  - id: AC-4
    text: >-
      The tester role carries the focused-test and smallest-change guidance and lists the citations it made with their evidence
      hash; the review and onboard model steps are one sentence; every skill keeps the source-as-evidence paragraph.
    source: BC-17
    check_ref: pytest
  - id: AC-5
    text: >-
      The formats state the 1,200-word brief and 400-word phase targets, ask for evidence ids instead of restated content and each
      list once, and the AS-IS format says that size_budget counts fact statements (C-22).
    source: BC-15
    check_ref: pytest
  - id: AC-6
    text: >-
      The words of each skill run (skill body, its references and the baseline, counted with str.split on the source files) are at
      most those at base_revision: research 4,120, design 4,126, plan 4,066, implement 3,517, review 2,261, onboard 1,700.
    source: BC-17
    check_ref: pytest
  - id: AC-7
    text: MANIFEST.json and the changed golden files are rebuilt and match.
    source: BC-24
    check_ref: build-manifest
  - id: AC-8
    text: The staged change touches only the files of this phase and stays inside EC-6 and EC-9.
    source: BC-24
    check_ref: gate-status-phase
  - id: AC-9
    text: >-
      The four phase-contract copies stay identical, keep every rule that P-6 AC-1 to AC-6 states and have at most 1,600 words,
      at least 400 fewer than the 2,000 of P-6; the 2,000-word cap of the existing contract test stays.
    source: BC-17
    check_ref: pytest
