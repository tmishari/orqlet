- id: P-6
  objective: >-
    The phase contract and the research, design, plan and implement skills hold the reuse rule, the input check by phase, the
    early base binding and the web-evidence format once, and lose the sentences the new CLI makes unnecessary.
  depends_on: [P-5]
  implements: [EC-6, EC-9]
  acceptance_criteria:
  - id: AC-1
    text: >-
      The four copies of the phase contract are identical and state the reuse rule: each check source is cited once per phase, a
      reused citation's sha256 is compared with the plan's, `orqlet evidence hash` confirms the cited files before a later run,
      HEAD is recorded with `git rev-parse HEAD`, git status is not used, and every rerun names its reason.
    source: BC-1
    check_ref: pytest
  - id: AC-2
    text: >-
      The contract says that a targeted check form runs while iterating and the full form once before review and once per rework
      round after all of its fixes.
    source: BC-5
    check_ref: pytest
  - id: AC-3
    text: >-
      Implement runs gate status --phase once per phase and reuses the validators' result when confirmed planned work is the only
      stale cause; plan runs gate status once; design hashes its files, manifest.yaml included, once before review, records them in
      each note and compares them before it stops.
    source: BC-2
    check_ref: pytest
  - id: AC-4
    text: >-
      The input check by phase approves the task-owned evidence files that the AS-IS facts cite, against the research merge for
      design and the design merge for plan and implement; later phases may add files under evidence/web/ but never change a cited
      one.
    source: BC-22
    check_ref: pytest
  - id: AC-5
    text: >-
      Each of the four skills binds base_revision with `gate status --json` before its first branch commit, and research cites facts
      outside its folder with --revision set to base_revision.
    source: BC-23
    check_ref: pytest
  - id: AC-6
    text: >-
      The web-evidence format is stated in the phase contract, so the design skill's step resolves in its own installed
      references; the ORQ-I393 NOT_RUN sentence and the sentence asking to cite every source again are gone.
    source: BC-16
    check_ref: pytest
  - id: AC-7
    text: >-
      The design and implement skills stop design and code reviews after three rounds with one consolidated report; the
      model-suggestion step is one sentence; the source-as-evidence paragraph stays in each skill.
    source: BC-6
    check_ref: pytest
  - id: AC-8
    text: >-
      The phase contract has at most 2,000 words and 150 lines, and each skill body at most 70 lines and 900 words; MANIFEST.json and
      the changed golden files are rebuilt and match.
    source: Q-22
    check_ref: pytest
  - id: AC-9
    text: The staged change touches only the files of this phase and stays inside EC-6 and EC-9.
    source: BC-24
    check_ref: gate-status-phase
