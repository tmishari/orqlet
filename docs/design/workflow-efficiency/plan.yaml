    source: BC-21
    check_ref: pytest
  - id: AC-2
    text: >-
      Regression: a single pair keeps today's top-level fields (path, lines, revision, sha256, snippet) and text, and also lists its
      entry in data.citations.
    source: A-26
    check_ref: pytest
  - id: AC-3
    text: An odd number of arguments, such as one or three, is a usage error with exit 2.
    source: BC-21
    check_ref: pytest
  - id: AC-4
    text: >-
      When one pair fails (a missing file or missing lines), the verdict is FAIL with exit 5, its finding names that pair, its entry
      carries no revision and no sha256, and the other pairs are still returned with their hashes.
    source: BC-21
    check_ref: pytest
