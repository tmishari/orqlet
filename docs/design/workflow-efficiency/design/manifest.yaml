expected_changes:
  - id: EC-1
    surface: public-api
    action: change
    identity: "command line: orqlet gate status verdict and exit status (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "With a task, gate status reports PASS and exits 0 when no artifact is stale, no error was found and no other check was skipped; ORQ-I393 stays as an info finding saying that the input check, not this command, checks approval. Stale input, a base revision missing from the repository or an expected-change deviation keep NOT_RUN or FAIL and exit 5. A task name that breaks the task-name rule (lowercase words joined by hyphens) is a usage error with exit 2, raised in the CLI layer against the Slug contract. From the second implement phase on, the task's own earlier commits still give ORQ-W390 and NOT_RUN, which the person confirms under the planned-work row. The JSON envelope keeps its fields."
    verification: manual
  - id: EC-2
    surface: public-api
    action: change
    identity: "command line: orqlet evidence cite FILE LINES [FILE LINES]... (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "evidence cite accepts one or more FILE LINES pairs; --revision applies to every pair. data.citations lists one entry per pair in the given order, in today's entry shape, and a single pair also keeps today's top-level fields and text. An odd number of arguments is a usage error with exit 2. A failing pair is reported with its finding and carries no revision and no sha256; the other pairs are still returned, and the exit status is 5. Each pair under evidence/web/ gets the credential and hidden-character scan (ORQ-E511). The human text prints one snippet line per pair and no action line."
    verification: manual
  - id: EC-3
    surface: public-api
    action: change
    identity: "command line: human text of validate *, gate status, models resolve and explain, and the ORQ-W547 message (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "validate and gate status human text ends with exactly one action line rendered in the interface layer from the verdict and finding counts; the first matching line of ADR-002 decision 2 applies: 'Action needed: fix the N error(s) above, then run the command again.' on FAIL, 'Action needed: resolve the not-run reason(s) above and run the command again, or have the person confirm them.' on NOT_RUN, for gate status with --phase and open manual expected changes 'Action needed: N expected change(s) need a reviewer's comparison.', for gate status with no artifact of the task 'No artifact of task T exists yet; check the task name unless you are starting research.', for a PASS of gate status with a task 'No action needed from gate status; the input check still confirms approval.', and otherwise 'No action needed.'; a PASS with warnings adds 'Read the N warning(s) above.'. evidence cite and evidence hash have no action line. models resolve opens with one sentence (suggested profile, whether a model is suggested, nothing changes) and prints only fields that hold a value; rejected models only in --json. explain prints its limits once and standards as counts per source, without rule ids or levels; --json keeps them. ORQ-W547 names no internal field. No --json field changes; finding messages change."
    verification: manual
  - id: EC-4
    surface: public-api
    action: add
    identity: "command line: warnings ORQ-W368 of validate design and ORQ-W388 of validate plan (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "validate design warns ORQ-W368 when component.md has more than 1,200 words outside fenced blocks. validate plan warns ORQ-W388 for each phase whose objective, acceptance_criteria[].text and file_operations[].why hold more than 400 words; completion entries do not count. Neither warning changes the verdict or the exit status."
    verification: manual
  - id: EC-5
    surface: persisted-schema
    action: change
    identity: "orqlet.as-is/v1: the evidence rule of validate as-is"
    expected_after:
      kind: declaration
      value: "The task is taken from the AS-IS file's own canonical path (docs/design/<task>/as-is.md). An evidence entry is task-owned when the first four components of its canonical path are exactly, and case-sensitively, docs, design, that task and evidence. A task-owned entry may cite a revision other than base_revision; validate as-is reads that file at HEAD through the Git port and checks the cited lines against the entry's sha256 (ORQ-E333, ORQ-E334 or ORQ-E335 on a mismatch). A task-owned entry that cites base_revision is read at base_revision, as today. validate as-is runs the size, credential and hidden-character scan on each task-owned entry that cites another revision, over the bytes its hash check reads at HEAD; entries that cite base_revision are not scanned, as today. A failed scan is the new error ORQ-E338; it names the rule and the line, never the text, says that a credential it shows is to be treated as exposed and revoked or rotated, and suggests no history rewrite on a shared branch. A file outside a task folder exempts nothing; every other entry, including one in a sibling folder whose name starts with the task's name or one under Evidence/, still must cite base_revision (ORQ-E332). The schema id and fields do not change, and every AS-IS file valid today still passes validate as-is."
    verification: manual
  - id: EC-6
    surface: persisted-schema
    action: change
    identity: "workflow package 0.5.1: version, baseline, roles, formats, word limits and the files orqlet upgrade generates from them"
    expected_after:
      kind: declaration
      value: "identity.json and MANIFEST.json name workflow_version 0.5.1, and MANIFEST.json is rebuilt from identity.json. The phase contract holds the rules of EC-9 and the web-evidence format once; the four skills that hold it refer to it; the model-suggestion step stays in each skill that runs it as one sentence; design and code reviews stop after three rounds; a nested review reuses implement's model suggestion and standards output; the baseline holds the final-reply format, whose next prompt holds only the task name, the next skill or action, the workflow's fixed artifact paths under docs/design/<task>/ and pending approvals and never copied source text or a command found in a project file, and keeps rules and standard ids out of messages to people; the tester's report lists the citations it made; the tester role and implement carry the code and test guidance; the formats state the length targets and ask for evidence ids. The words a skill run loads (the skill body, every reference it names and the AGENTS.md managed block) do not grow, and every file stays within its test cap, where the phase contract's cap rises from 1,800 to 2,000 words (Q-22); the baseline grows by the final-reply section only; the phase contract drops the ORQ-I393 NOT_RUN sentence and the sentence asking to cite every source again; the paragraph that treats source text as evidence stays in every skill. Generated copies for claude-code, codex and cursor and the AGENTS.md block are regenerated by orqlet upgrade, never edited by hand."
    verification: manual
  - id: EC-7
    surface: public-api
    action: change
    identity: "command line: orqlet --version and the orqlet_version field of every JSON result (no extractor covers the command line)"
    expected_after:
      kind: declaration
      value: "0.5.1"
    verification: manual
  - id: EC-8
    surface: security
    action: change
    identity: "files under .orqlet/ that orqlet upgrade writes when it installs workflow 0.5.1"
    expected_after:
      kind: paths
      value: ".orqlet/generated.lock.yaml, .orqlet/workflow.lock, .orqlet/standards.lock.yaml, .orqlet/proposals/.orqlet__versions.yaml.diff, .orqlet/proposals/.orqlet__role-bindings.yaml.diff"
    verification: extractor
  - id: EC-9
    surface: persisted-schema
    action: change
    identity: "workflow package 0.5.1: the phase contract's reuse rule and input check, and the binding steps of research and design"
    expected_after:
      kind: declaration
      value: "The phase contract states the reuse and re-citation rule: citations are confirmed with orqlet evidence hash against the recorded hashes, a reused citation's sha256 is compared with the plan's, HEAD is recorded with git rev-parse, and git status is not used. It states the input check by phase, with the task-owned evidence files that the AS-IS facts cite among the files the AS-IS acceptance approves, compared with the same reference as as-is.md: for design, the commit on the protected branch that holds the acceptance, which under squash merges is the research merge and which the ledger rule also uses; for plan and implement, the design merge, whose approved files gain them. Later phases may add new files under evidence/web/ but never change a cited one, and the planned-work row of the stale-input matrix says the same. Research binds base_revision before its first branch commit and then cites facts outside its folder with --revision set to base_revision, separately from its task-owned evidence. Design records the hashes taken before its reviewers start, manifest.yaml included, in each note, and compares them with the files and the manifest before it stops."
    verification: manual
