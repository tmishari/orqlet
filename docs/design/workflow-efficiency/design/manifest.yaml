considerations:
  security:
    state: affected
    notes: "validate as-is accepts more (EC-5): task-owned evidence is bound by its content hash instead of its revision; cited lines stay hash-checked, task-owned entries read at HEAD are scanned again by validate as-is with a message that treats a found credential as exposed, the cited evidence files are approved with as-is.md in every phase, and a refused cite pair carries no hash. gate status reports PASS where it reported NOT_RUN (EC-1); approval is still checked only by the input check from the merge commits the person names, and the info finding says so. Reuse of check results (ADR-001) is a text rule guarded by file hashes from orqlet evidence hash, a HEAD comparison, the plan's recorded citation hashes and the validators' hash checks, not by code. Design review integrity rests on the hashes each note records being compared with the files before the skill stops, because validate design checks only that notes exist. Git commands that an agent runs in the person's shell, such as the input check's git diff, run outside the hardened Git runner, and a working-tree comparison can start a clean filter that the repository's configuration names; this design adds no such command and drops git status from the reuse rule. The next prompt names only fixed artifact paths. The paragraph that treats source text as evidence stays in every skill. No new process started by Orqlet, network path, dependency, credential or trust boundary; .orqlet/** and .github/** are watched as security paths, and CI does not change."
  compatibility:
    state: affected
    notes: "gate status exits 0 instead of 5 when inputs are current; evidence cite keeps its single-pair form; JSON envelopes keep their fields; human text of five commands changes; existing AS-IS files stay valid; the version becomes 0.5.1 for the CLI and the workflow package; the workflow change alters protected_set_digest, so artifacts of the frozen tasks show their inputs changed when resumed, which their resumption reassesses anyway; golden files regenerate on purpose; the architecture proposal's description of the offline gate status result is updated."
  operations:
    state: affected
    notes: "Every phase that changes the workflow package rebuilds MANIFEST.json and its golden files; the version bump, orqlet upgrade of the installed copies and README come in the final implementation commit. CI is unchanged. ORQLET-QA-001 is not met while main is red: the person decided in Q-14 that this task's pull requests report the red lint, types and tests jobs as known failures from the two frozen test files, and the lint and types jobs run on Python 3.12 only (C-25), which this task leaves as it is. After the final upgrade, this task's own artifacts show ORQ-W390 under the upgrade row of the stale-input matrix."
