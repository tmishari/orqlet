schema: orqlet.workflow-rule/v1
name: workflow
description: Files that Orqlet generates are changed at their source; files that it seeded, such as .mcp.json, belong to the team.
paths:
  - ".orqlet/**"
  - ".claude/**"
  - ".cursor/**"
  - ".agents/**"
  - ".codex/**"
  - ".mcp.json"
  - "AGENTS.md"
