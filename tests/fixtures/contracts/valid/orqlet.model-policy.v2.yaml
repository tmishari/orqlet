# A valid orqlet.model-policy/v2 document that sets every field of the contract (AC-1 of phase P-1,
# task dynamic-model-profiles). All names, texts and paths are placeholders; no model or vendor of
# the real catalog appears here. Dates and prices are quoted so that every YAML loader hands the
# contract a string.
schema: orqlet.model-policy/v2
policy_version: 1
reviewed_for_release: "0.4.0"
models:
  - id: example-large
    family: example-family
    approval:
      state: approved
      approved_by: example-approver
      approval_ref: example-approval-ref-1
    documented:
      evidence: docs/example/evidence/example-large.md
      date: "2026-10-30"
    callable: verified
    evaluated:
      state: evidenced
      evidence: docs/example/evidence/example-large-evaluation.md
    list_price:
      input_per_million_usd: "3"
      output_per_million_usd: "15"
      source: docs/example/evidence/example-large-prices.md
    routes:
      - client: claude-code
        kind: id
        name: example-large-1
        resolves_to: null
        also_known_as:
          - example-large-1-high
        access: confirmed
        retires_on: "2027-06-30"
      - client: codex
        kind: alias
        name: example-large-latest
        resolves_to: example-large-1
        also_known_as: []
        access: blocked
        retires_on: null
  - id: example-small
    family: example-family
    approval:
      state: proposed
      approved_by: null
      approval_ref: null
    documented:
      evidence: docs/example/evidence/example-small.md
      date: "2026-10-30"
    callable: not-run
    evaluated:
      state: none
      evidence: null
    list_price: null
    routes:
      - client: cursor
        kind: id
        name: null
        resolves_to: null
        also_known_as: []
        access: unknown
        retires_on: null
excluded:
  - id: blocked-example
    reason: Example reason, kept as printable ASCII text.
    source: Example notice 1 of the team, printable ASCII only.
    aliases:
      - blocked-alias
    id_patterns:
      - "blocked-model-*"
      - "vendor/blocked-?"
    family_tags:
      - blocked-family
profiles:
  - id: quality
    capability: Example capability statement for the highest category.
    mode: manual
    candidates:
      - client: claude-code
        models: [example-large]
      - client: codex
        models: [example-large, example-small]
    fallbacks:
      - client: claude-code
        models: [example-small]
    escalation: null
  - id: engineering
    capability: Example capability statement for everyday engineering work.
    mode: automatic-with-fallbacks
    candidates:
      - client: cursor
        models: [example-small]
    fallbacks:
      - client: codex
        models: [example-small]
    escalation: quality
  - id: economy
    capability: Example capability statement for the lowest cost category.
    mode: automatic
    candidates:
      - client: claude-code
        models: [example-small]
    fallbacks:
      - client: cursor
        models: [example-small]
    escalation: engineering
assignments:
  - target:
      kind: role
      name: example-reviewer
    task: null
    client: null
    profile: quality
    model: null
    mode: automatic
    effort: null
  - target:
      kind: skill
      name: example-skill
    task: example-task
    client: claude-code
    profile: null
    model: example-large
    mode: manual
    effort: high
