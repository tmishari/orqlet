[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "orqlet"
dynamic = ["version"]
description = "Sets up and maintains the AI context of a repository for teams that use AI coding clients"
requires-python = ">=3.12"
dependencies = [
  "typer==0.27.3",
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "filelock==4.2.4",
  "platformdirs==4.13.5",
]

[project.scripts]
orqlet = "orqlet.interface.cli.app:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-socket==0.8.1",
  "hypothesis==6.170.5",
  "import-linter==2.15",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20260906",
]

[tool.hatch.version]
path = "src/orqlet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orqlet"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["tests/fixtures", "tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF", "TID", "C4", "ARG", "T20", "PIE", "RET"]

# TID251 is a second line of defence behind the import-linter contracts: the pure layers
# may not reach for I/O modules. Adapters, the interface, tests and tools may.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Run processes through the ProcessRunner port (adapters/process)."
"socket".msg = "Network access belongs in an adapter."
"sqlite3".msg = "SQLite is not used in M1 and M2."
"shutil".msg = "File operations go through the FileSystem port."
"tempfile".msg = "Temporary files belong in an adapter."

[tool.ruff.lint.per-file-ignores]
"src/orqlet/adapters/**" = ["TID251"]
"src/orqlet/interface/**" = ["TID251"]
"tests/**" = ["TID251", "ARG001", "ARG002"]
"tools/**" = ["TID251", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]
exclude = ["tests/fixtures/", "tests/golden/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket"
filterwarnings = ["error"]
markers = [
  "unit: pure logic with fakes, no real I/O",
  "contract: port suites and committed schema checks",
  "golden: generated files compared byte for byte",
  "integration: real git and real temporary directories",
  "fault: injected failures during apply",
  "e2e: whole-command acceptance runs",
]

[tool.importlinter]
root_package = "orqlet"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interface, adapters, application, domain"
type = "layers"
layers = [
  "orqlet.interface",
  "orqlet.adapters",
  "orqlet.application",
  "orqlet.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of I/O and frameworks"
type = "forbidden"
source_modules = ["orqlet.domain"]
forbidden_modules = [
  "subprocess", "socket", "sqlite3", "http", "urllib", "shutil", "tempfile",
  "os", "pathlib", "pydantic", "yaml", "typer", "filelock", "platformdirs",
]

[[tool.importlinter.contracts]]
name = "Application stays free of process, network and file modules"
type = "forbidden"
source_modules = ["orqlet.application"]
forbidden_modules = [
  "subprocess", "socket", "sqlite3", "http", "urllib", "shutil", "tempfile",
  "os", "pathlib", "yaml", "typer", "filelock", "platformdirs",
]

[[tool.importlinter.contracts]]
name = "The workflow package is read-only data used by adapters and the interface"
type = "forbidden"
source_modules = ["orqlet.domain", "orqlet.application"]
forbidden_modules = ["orqlet.workflow"]

[[tool.importlinter.contracts]]
name = "Client adapters do not know about one another"
type = "independence"
modules = [
  "orqlet.adapters.clients.claude_code",
  "orqlet.adapters.clients.codex",
  "orqlet.adapters.clients.cursor",
]
